<title>Activity & Logs - SIEC</title>
<!--
  ANTI-FLICKER SCRIPT — must be the first thing in <head>, before any
  stylesheet. It reads the saved collapse state synchronously and sets
  it on <html> so the sidebar is the correct width on the very first
  paint. Copy this exact block, unchanged, to the top of every admin page.
-->
<script>
  (function () {
    try {
      var collapsed = localStorage.getItem("sidebarCollapsed") === "true";
      document.documentElement.classList.add(collapsed ? "sidebar-collapsed" : "sidebar-expanded");
    } catch (e) {
      document.documentElement.classList.add("sidebar-expanded");
    }
  })();
</script>

<!-- Tailwind (utility classes for page content) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>

    theme: {

        },

    },
  };
</script>

<style>
