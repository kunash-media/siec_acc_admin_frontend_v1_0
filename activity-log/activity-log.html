function w3(x) { return (x >= 100 ? W_ONES[Math.floor(x / 100)] + ' Hundred' + (x % 100 ? ' ' : '') : '') + (x % 100 ? w2(x % 100) : ''); }
function numWords(n, ind) {
  if (n === 0) return 'Zero';
  var out = '', U = ind ? [[1e7, 'Crore'], [1e5, 'Lakh'], [1e3, 'Thousand']] : [[1e9, 'Billion'], [1e6, 'Million'], [1e3, 'Thousand']];
  U.forEach(function (u) { if (n >= u[0]) { out += numWords(Math.floor(n / u[0]), ind) + ' ' + u[1] + ' '; n = n % u[0]; } });
  if (n > 0) out += w3(n);
  return out.trim();
}
var CUR_NAMES = { INR: ['Indian Rupee', 'Paise'], USD: ['United States Dollar', 'Cents'], AED: ['UAE Dirham', 'Fils'], EUR: ['Euro', 'Cents'], OMR: ['Omani Rial', 'Baisa'] };
function amountInWords(total, cur) {
  var t = Math.round(Number(total || 0) * 100), major = Math.floor(t / 100), minor = t % 100, nm = CUR_NAMES[cur] || [cur, ''];
  return nm[0] + ' ' + numWords(major, cur === 'INR') + (minor ? ' and ' + numWords(minor, false) + ' ' + nm[1] : '') + ' Only';
}

async function apiFetch(path, options) {
  options = options || {};
  var res;
   try { res = await fetch(API_BASE + path, Object.assign({ credentials: 'include' }, options)); }
  catch (e) { throw new Error('Something went wrong! Check your connection.'); }
  var isJson = (res.headers.get('content-type') || '').indexOf('application/json') !== -1;
  if (!res.ok) {
    var message = 'Something went wrong (HTTP ' + res.status + ').';
    if (isJson) { try { var b = await res.json(); message = b.message || b.error || message; } catch (e) {} }

}
async function fetchLogoDataUrl(url) {
  try {
    var res = await fetch(url); if (!res.ok) return '';
    var obj = URL.createObjectURL(await res.blob());
    var img = await new Promise(function (ok, no) { var i = new Image(); i.onload = function () { ok(i); }; i.onerror = no; i.src = obj; });
    var w = Math.min(320, img.naturalWidth), h = Math.round(img.naturalHeight * w / img.naturalWidth);
    var cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(obj);
    return cv.toDataURL('image/png');
  } catch (e) { return ''; }
}

    var rows = allOrders.filter(function (so) {
      var mSearch = !q || so.number.toLowerCase().indexOf(q) !== -1 || so.clientName.toLowerCase().indexOf(q) !== -1 || so.id.toLowerCase().indexOf(q) !== -1;
      var mStatus = state.status === 'all' || ((state.status === 'partial' || state.status === 'fulfilled') ? so.fulfillmentStatus === state.status : so.status === state.status);
      var mCust = state.customer === 'all' || (cu && so.clientId === cu.strId);
      return mSearch && mStatus && mCust;
    });
    var tp = Math.max(1, Math.ceil(rows.length / state.size)); if (state.page > tp) state.page = tp;
    return { cards: rows.slice((state.page - 1) * state.size, state.page * state.size).map(orderCard), totalPages: tp, total: rows.length };
  }
  var S = SRC[key], p = new URLSearchParams();

}

// ---------- searchable picker (debounce + scroll pagination) ----------
function closePicker() { var b = document.getElementById('pickerBox'); if (b) b.remove(); document.removeEventListener('mousedown', pickerOutside); }
function pickerOutside(e) { var b = document.getElementById('pickerBox'); if (b && !b.contains(e.target)) closePicker(); }
function openPicker(anchor, cfg) {
  closePicker();
  var r = anchor.getBoundingClientRect(), box = document.createElement('div');
  box.id = 'pickerBox';
  box.style.cssText = 'position:fixed;z-index:300;background:#fff;border:1px solid #d1d5db;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);width:' + Math.max(r.width, 320) + 'px;left:' + r.left + 'px;top:' + (r.bottom + 4) + 'px;';
  box.innerHTML = '<input class="form-input" placeholder="Type 2+ letters to search…" style="margin:6px;width:calc(100% - 12px)"><div style="max-height:220px;overflow-y:auto"></div>';
  document.body.appendChild(box);
  var inp = box.firstChild, list = box.lastChild, page = 0, more = true, busy = false, q = '', tk = 0, t;
  async function loadP(reset) {
    if (reset) { tk++; page = 0; more = true; busy = false; list.innerHTML = ''; }
    if (busy || !more) return;
    busy = true; var my = tk;
    var ld = document.createElement('div'); ld.textContent = 'Loading…'; ld.style.cssText = 'padding:8px;font-size:11px;color:#9ca3af'; list.appendChild(ld);
    try {
      var res = await cfg.fetchPage(q, page);
      if (my !== tk) return;
      ld.remove(); more = !!res.hasNext; page = res.nextPage != null ? res.nextPage : page + 1;
      res.items.forEach(function (it) {
        var d = document.createElement('div');
        d.style.cssText = 'padding:7px 10px;font-size:11px;cursor:pointer;border-top:1px solid #f3f4f6';
        d.innerHTML = cfg.render(it);
        d.onmouseenter = function () { d.style.background = '#f8fafc'; }; d.onmouseleave = function () { d.style.background = ''; };
        d.onclick = function () { cfg.onPick(it); closePicker(); };
        list.appendChild(d);
      });
      if (!list.children.length) list.innerHTML = '<div style="padding:8px;font-size:11px;color:#9ca3af">No results</div>';
    } catch (e) { if (my === tk) { ld.remove(); more = false; showToast(e.message || 'Could not load', 'error'); } }
    finally { if (my === tk) busy = false; }
  }
  list.onscroll = function () { if (list.scrollTop + list.clientHeight >= list.scrollHeight - 24) loadP(false); };
  inp.oninput = function () { clearTimeout(t); t = setTimeout(function () { var v = inp.value.trim(); if (v.length === 1 || v === q) return; q = v; loadP(true); }, 400); };
  setTimeout(function () { document.addEventListener('mousedown', pickerOutside); }, 0);
  inp.focus(); loadP(true);
}
async function fetchProductPage(q, page) {

    fld('Tax Rate (%)', '<select class="form-input" id="f_tax" onchange="edRecalc()">' + [0, 5, 12, 18, 28].map(function (n) { return '<option ' + (e.tax == n ? 'selected' : '') + '>' + n + '</option>'; }).join('') + '</select>') +
    fld('Total Amount', '<input type="text" class="form-input" id="f_total" disabled style="font-weight:bold;color:#6da84c;">') +
    fld('Fulfillment Status', '<input type="text" class="form-input" value="' + escH(label(e.fulfillmentStatus)) + '" disabled>', 'Updated automatically from deliveries') + '</div>' +
    fld('Notes', '<textarea rows="2" class="form-input" id="f_notes" placeholder="Any additional notes">' + escH(e.notes || '') + '</textarea>'), 'Update Sales Order');
  calcSOTotal();
}
async function saveSo() {
  var id = ED.card.id, date = g('f_date'), clientId = SOM.client ? SOM.client.value : '', expectedDelivery = g('f_delivery');
  if (!date || !clientId || !expectedDelivery) { showToast('Please fill all required fields (Date, Client, Expected Delivery)', 'error'); return; }
  var items = [], seen = {}, dup = false, missing = false;
  document.querySelectorAll('#lineItemsBody .line-item-row').forEach(function (r) {
    var itemId = r.dataset.itemid || '', qty = Math.max(0, Math.floor(parseFloat(r.querySelector('.item-qty').value) || 0)), rate = Math.max(0, parseFloat(r.querySelector('.item-rate').value) || 0);
    if (qty > 0) { if (!itemId) { missing = true; return; } if (seen[itemId]) { dup = true; return; } seen[itemId] = true; items.push({ itemId: itemId, qty: qty, rate: rate }); }
  });
  if (missing) { showToast('Select a product for every line item', 'error'); return; }
  if (dup) { showToast('Each item can only appear once — merge duplicate line items', 'error'); return; }
  if (!items.length) { showToast('Please add at least one item to the sales order', 'error'); return; }
  if (expectedDelivery < date) { showToast('Expected delivery cannot be before the order date', 'error'); return; }
  var payload = { date: date, clientId: clientId, deliveryLocation: g('f_deliveryLocation') || '', expectedDelivery: expectedDelivery, paymentTerms: g('f_paymentTerms'), items: items,
    discount: Math.min(100, Math.max(0, parseFloat(g('f_discount')) || 0)), tax: parseFloat(g('f_tax')) || 0, notes: g('f_notes') || '',
    quotationReference: SOM.quotation ? SOM.quotation.value : null, piReference: SOM.pi ? SOM.pi.value : null, projectReference: SOM.project ? SOM.project.value : null };
  var reset = busyBtn('Saving…');
  try {
    await apiFetch('/api/sales-orders/update-sales-order/' + encodeURIComponent(id), { method: 'PUT', headers: JSON_H, body: JSON.stringify(payload) });
    showToast('Sales Order ' + ED.card.number + ' updated', 'success'); finishEdit();
  } catch (err) { showToast('Save failed: ' + err.message, 'error'); reset(); }
}

async function downloadCard(c) {
  if (c.key === 'orders') {
    // Sales Orders have no stored PDF, so it is generated here from the same preview
    try {
      await orgReady; showToast('Preparing PDF…', 'info');
      var f = await loadSoFull(c.id);
      await html2pdf().from('<div style="background:#fff;width:100%">' + buildSoHtml(f.so, f.ci, f.pl) + '</div>', 'string').set({
        margin: 8, filename: f.so.number + '.pdf', html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', scrollX: 0, scrollY: 0 },
        jsPDF: { unit: 'pt', format: 'a4', orientation: 'portrait' }
      }).save();
    } catch (e) { showToast(e.message || 'Could not generate the PDF', 'error'); }
    return;
  }
  if (!c.pdfUrl) { showToast('No PDF stored for ' + c.number + ' yet.', 'error'); return; }
  window.open(API_BASE + c.pdfUrl, '_blank');
}
function askDelete(i) {
  var c = cards[i]; if (!c || !c.canDelete) return;
  openModal(modalHeader('Delete ' + SINGLE[c.key], escH(c.number)) +
    '<div class="px-5 py-4 text-sm text-gray-600"><p>Are you sure you want to permanently delete <b class="text-gray-800">' + escH(c.number) + '</b>?</p>' +
    '<p class="text-gray-400 text-[11px] mt-1">This action cannot be undone.</p><p class="text-amber-600 text-[11px] mt-2">Total Value: ' + fm(c.total, c.currency) + '</p></div>' +
    modalFooter('', '<button onclick="closeModal()" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-600 border border-gray-200 hover:bg-white transition">Cancel</button>' +
      '<button onclick="confirmDelete(' + i + ')" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-white bg-red-600 hover:bg-red-700 transition shadow-sm">Delete</button>'), 'max-w-md');
}
async function confirmDelete(i) {
  var c = cards[i]; if (!c) return;
  try {
    var r = await apiFetch(SRC[c.key].del + encodeURIComponent(c.id), { method: 'DELETE' });
    if (r && r.approvalRequired) { closeModal(); showToast('Delete request sent for approval', 'info'); return; }
    closeModal(); showToast(SINGLE[c.key] + ' deleted', 'warning'); loadStats(); load(true);
  } catch (e) { closeModal(); showToast(e.message || 'Could not delete', 'error'); }
}

// ============================================================= EVENTS + INIT
document.getElementById('searchInput').addEventListener('input', function (e) {
  clearTimeout(searchTimer);
  var v = e.target.value.trim();
  searchTimer = setTimeout(function () { if (v === state.search) return; state.search = v; state.page = 1; load(); }, 400);
});
document.getElementById('filterStatus').addEventListener('change', function (e) { state.status = e.target.value; state.page = 1; load(); });
document.getElementById('filterCustomer').addEventListener('change', function (e) { state.customer = e.target.value; state.page = 1; load(); });
document.getElementById('pageSize').addEventListener('change', function (e) { state.size = parseInt(e.target.value, 10) || 10; state.page = 1; load(); });
document.getElementById('clearBtn').addEventListener('click', function () {
  state.search = ''; state.status = 'all'; state.customer = 'all'; state.page = 1;
  document.getElementById('searchInput').value = ''; buildStatusOptions(); buildCustomerOptions(); load();
});

(async function init() {
  var h = (location.hash || '').replace('#', ''); if (MODS[h]) state.module = h;
  renderTabs(); renderStats(); buildStatusOptions();
  loadStats(); load();
  await loadCustomers(); buildCustomerOptions();
})();
</script>
