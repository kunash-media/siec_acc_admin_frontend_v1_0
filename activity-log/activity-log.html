<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
// ============================================================= CONFIG
var API_BASE = 'http://localhost:9093';
var ORG_STORAGE_KEY = 'siec_organization_id';
var DEFAULT_TEMPLATE = 'tpl-modern';
// Module pages used for Edit (deep link: <page>?edit=<document number>). Adjust file names if yours differ.
var PAGES = { quotes: 'quotations.html', orders: 'sales-orders.html', challans: 'delivery-challan.html', invoices: 'invoices.html' };

NavSidebar.init({ basePath: "", activePage: "activity", pageTitle: "Activity & Logs", user: { name: "Admin", role: "Super Admin", avatarUrl: "" } });

var MODS = {
  quotes:   { label: 'Quotations',        icon: 'fa-file-lines',          tint: 'bg-amber-50 text-amber-600' },
  orders:   { label: 'Sales Orders',      icon: 'fa-cart-shopping',       tint: 'bg-blue-50 text-blue-600' },
  challans: { label: 'Delivery Challans', icon: 'fa-truck-fast',          tint: 'bg-purple-50 text-purple-600' },
  invoices: { label: 'Invoices',          icon: 'fa-file-invoice-dollar', tint: 'bg-green-50 text-green-600' }
};
var SINGLE = { quotes: 'Quotation', orders: 'Sales Order', challans: 'Delivery Challan', invoices: 'Invoice', proformas: 'Proforma Invoice' };
// status -> [label, badge class], per source
var ST = {
  quotes:    { DRAFT: ['Draft', 'badge-gray'], SENT: ['Sent', 'badge-blue'], ACCEPTED: ['Accepted', 'badge-green'], DECLINED: ['Declined', 'badge-red'], EXPIRED: ['Expired', 'badge-amber'] },
  orders:    { PENDING: ['Pending', 'badge-amber'], APPROVED: ['Approved', 'badge-blue'], REJECTED: ['Rejected', 'badge-red'] },
  challans:  { DRAFT: ['Draft', 'badge-gray'], DISPATCHED: ['Dispatched', 'badge-blue'], DELIVERED: ['Delivered', 'badge-green'] },
  invoices:  { UNPAID: ['Unpaid', 'badge-amber'], PARTIAL: ['Partial Paid', 'badge-blue'], PAID: ['Paid', 'badge-green'], OVERDUE: ['Overdue', 'badge-red'] },
  proformas: { OPEN: ['Open', 'badge-blue'], CONVERTED: ['Converted', 'badge-green'], DECLINED: ['Declined', 'badge-red'] }
};
var ORDER_FILTERS = [['pending', 'Pending'], ['approved', 'Approved'], ['rejected', 'Rejected'], ['partial', 'Partial Fulfilled'], ['fulfilled', 'Fulfilled']];
var FUL_STYLE = { pending: 'badge-amber', partial: 'badge-purple', fulfilled: 'badge-green' };

// ============================================================= SHARED HELPERS
var company = { name: '', address: '', gstin: '', pan: '', phone: '', email: '', state: '', stateCode: '', bankName: '', bankAccount: '', bankIfsc: '', logoUrl: '', logoData: '',
  bank: { beneficiary: '', name: '', branch: '', address: '', account: '', ifsc: '' } };
var STATE_CODES = { 'jammu and kashmir': '01', 'himachal pradesh': '02', 'punjab': '03', 'chandigarh': '04', 'uttarakhand': '05', 'haryana': '06', 'delhi': '07', 'rajasthan': '08',
  'uttar pradesh': '09', 'bihar': '10', 'sikkim': '11', 'arunachal pradesh': '12', 'nagaland': '13', 'manipur': '14', 'mizoram': '15', 'tripura': '16', 'meghalaya': '17', 'assam': '18',
  'west bengal': '19', 'jharkhand': '20', 'odisha': '21', 'chhattisgarh': '22', 'madhya pradesh': '23', 'gujarat': '24', 'dadra and nagar haveli and daman and diu': '26',
  'maharashtra': '27', 'karnataka': '29', 'goa': '30', 'lakshadweep': '31', 'kerala': '32', 'tamil nadu': '33', 'puducherry': '34', 'andaman and nicobar islands': '35',
  'telangana': '36', 'andhra pradesh': '37', 'ladakh': '38' };
function stateCodeFor(state, gstin) {
  if (/^\d{2}/.test(gstin || '')) return gstin.slice(0, 2);
  return STATE_CODES[String(state || '').trim().toLowerCase()] || '';
}
var currencyMeta = { INR: { symbol: '₹' }, USD: { symbol: '$' }, AED: { symbol: 'د.إ' }, EUR: { symbol: '€' }, OMR: { symbol: '﷼' } };
function getCurrencySymbol(c) { return (currencyMeta[c] && currencyMeta[c].symbol) || '₹'; }
function money(n, c) { return getCurrencySymbol(c || 'INR') + Number(n || 0).toLocaleString('en-IN'); }
function formatCurrency(a, c) { return getCurrencySymbol(c) + Number(a || 0).toLocaleString('en-IN'); }
function fm(n, c) {
  var o = c === 'INR' ? { minimumFractionDigits: 2, maximumFractionDigits: 2 } : { maximumFractionDigits: 2 };
  return getCurrencySymbol(c) + Number(n || 0).toLocaleString(c === 'INR' ? 'en-IN' : 'en-US', o);
}
function n2(v) { return Number(v || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fd(s) { if (!s) return '—'; var p = String(s).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : s; }
function escH(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function label(s) { return String(s).charAt(0).toUpperCase() + String(s).slice(1); }

var W_ONES = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
var W_TENS = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
function w2(x) { return x < 20 ? W_ONES[x] : W_TENS[Math.floor(x / 10)] + (x % 10 ? '-' + W_ONES[x % 10] : ''); }
function w3(x) { return (x >= 100 ? W_ONES[Math.floor(x / 100)] + ' Hundred' + (x % 100 ? ' ' : '') : '') + (x % 100 ? w2(x % 100) : ''); }
function numWords(n, ind) {
  if (n === 0) return 'Zero';
  var out = '', U = ind ? [[1e7, 'Crore'], [1e5, 'Lakh'], [1e3, 'Thousand']] : [[1e9, 'Billion'], [1e6, 'Million'], [1e3, 'Thousand']];
  U.forEach(function (u) { if (n >= u[0]) { out += numWords(Math.floor(n / u[0]), ind) + ' ' + u[1] + ' '; n = n % u[0]; } });
  if (n > 0) out += w3(n);
  return out.trim();
}
var CUR_NAMES = { INR: ['Indian Rupee', 'Paise'], USD: ['United States Dollar', 'Cents'], AED: ['UAE Dirham', 'Fils'], EUR: ['Euro', 'Cents'], OMR: ['Omani Rial', 'Baisa'] };
function amountInWords(total, cur) {
  var t = Math.round(Number(total || 0) * 100), major = Math.floor(t / 100), minor = t % 100, nm = CUR_NAMES[cur] || [cur, ''];
  return nm[0] + ' ' + numWords(major, cur === 'INR') + (minor ? ' and ' + numWords(minor, false) + ' ' + nm[1] : '') + ' Only';
}

async function apiFetch(path, options) {
  options = options || {};
  var res;
  try { res = await fetch(API_BASE + path, options); }
  catch (e) { throw new Error('Something went wrong! Check your connection.'); }
  var isJson = (res.headers.get('content-type') || '').indexOf('application/json') !== -1;
  if (!res.ok) {
    var message = 'Something went wrong (HTTP ' + res.status + ').';
    if (isJson) { try { var b = await res.json(); message = b.message || b.error || message; } catch (e) {} }
    throw new Error(message);
  }
  if (res.status === 204) return null;
  return isJson ? res.json() : res;
}
async function fetchLogoDataUrl(url) {
  try {
    var res = await fetch(url); if (!res.ok) return '';
    var obj = URL.createObjectURL(await res.blob());
    var img = await new Promise(function (ok, no) { var i = new Image(); i.onload = function () { ok(i); }; i.onerror = no; i.src = obj; });
    var w = Math.min(320, img.naturalWidth), h = Math.round(img.naturalHeight * w / img.naturalWidth);
    var cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(obj);
    return cv.toDataURL('image/png');
  } catch (e) { return ''; }
}
async function loadOrganization() {
  var orgId = null;
  try { orgId = localStorage.getItem(ORG_STORAGE_KEY); } catch (e) {}
  if (!orgId) { showToast('Organization id not found (localStorage key: ' + ORG_STORAGE_KEY + ')', 'error'); return; }
  try {
    var o = await apiFetch('/api/organization/' + encodeURIComponent(orgId), { method: 'GET' });
    var name = o.legalName || o.companyName || '', st = o.state || o.taxState || '';
    company = {
      name: name, address: [o.address, o.city, st, o.pincode].filter(Boolean).join(', '),
      gstin: o.gstNumber || '', pan: '', phone: o.phone || '', email: o.email || '',
      state: st, stateCode: stateCodeFor(st, o.gstNumber),
      bankName: o.bankName || '', bankAccount: o.bankAccountNumber || '', bankIfsc: o.bankIfscCode || '',
      logoUrl: o.logoUrl ? API_BASE + o.logoUrl : '', logoData: '',
      bank: { beneficiary: name, name: o.bankName || '', branch: '', address: '', account: o.bankAccountNumber || '', ifsc: o.bankIfscCode || '' }
    };
    if (company.logoUrl) company.logoData = await fetchLogoDataUrl(company.logoUrl);
  } catch (e) { showToast(e.message || 'Could not load organization details', 'error'); }
}
var orgReady = loadOrganization();

// ============================================================= UI PRIMITIVES
function showToast(message, kind) {
  var colors = { success: 'bg-green-600', info: 'bg-primary', warning: 'bg-amber-600', error: 'bg-red-600' };
  var el = document.createElement('div');
  el.className = 'toast ' + colors[kind || 'success'] + ' text-white font-semibold px-3 py-2 rounded-lg shadow-lg flex items-center gap-2 max-w-xs';
  el.innerHTML = '<span>' + message + '</span>';
  document.getElementById('toastWrap').appendChild(el);
  setTimeout(function () { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(function () { el.remove(); }, 300); }, 2600);
}
function openModal(innerHtml, width) {
  document.getElementById('modalRoot').innerHTML =
    '<div class="fixed inset-0 z-[100] flex items-center justify-center p-3"><div class="absolute inset-0 bg-black/40 backdrop-blur-[1px]" onclick="closeModal()"></div>' +
    '<div class="relative bg-white rounded-xl shadow-2xl w-full ' + (width || 'max-w-md') + ' max-h-[92vh] overflow-hidden animate-modal">' + innerHtml + '</div></div>';
  document.body.style.overflow = 'hidden';
}
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; document.body.style.overflow = ''; }
function modalHeader(title, subtitle) {

function buildCustomerOptions() {
  document.getElementById('filterCustomer').innerHTML = '<option value="all">All Customers</option>' +
    customers.map(function (c) { return '<option value="' + c.id + '"' + (String(state.customer) === String(c.id) ? ' selected' : '') + '>' + escH(c.name) + '</option>'; }).join('');
}
function switchModule(k) {
  if (state.module === k) return;
  state.module = k; state.sub = 'invoice'; state.status = 'all'; state.page = 1;
  try { history.replaceState(null, '', '#' + k); } catch (e) {}
  renderTabs(); renderStats(); buildStatusOptions(); load();
}
function switchSub(s) { state.sub = s; state.status = 'all'; state.page = 1; renderTabs(); buildStatusOptions(); load(); }
function goToPage(p) { state.page = p; load(); }

// ============================================================= LIST
async function fetchKey(key) {
  if (key === 'orders') {
    var res = await apiFetch('/api/sales-orders/get-all-sales-orders', { method: 'GET' });
    allOrders = (Array.isArray(res) ? res : []).map(normalizeSO); cnt.orders = allOrders.length; renderStats();
    var q = state.search.toLowerCase(), cu = customers.find(function (c) { return String(c.id) === String(state.customer); });
    var rows = allOrders.filter(function (so) {
      var mSearch = !q || so.number.toLowerCase().indexOf(q) !== -1 || so.clientName.toLowerCase().indexOf(q) !== -1 || so.id.toLowerCase().indexOf(q) !== -1;
      var mStatus = state.status === 'all' || ((state.status === 'partial' || state.status === 'fulfilled') ? so.fulfillmentStatus === state.status : so.status === state.status);
      var mCust = state.customer === 'all' || (cu && so.clientId === cu.strId);
      return mSearch && mStatus && mCust;
    });
    var tp = Math.max(1, Math.ceil(rows.length / state.size)); if (state.page > tp) state.page = tp;
    return { cards: rows.slice((state.page - 1) * state.size, state.page * state.size).map(orderCard), totalPages: tp, total: rows.length };
  }
  var S = SRC[key], p = new URLSearchParams();
  if (state.status !== 'all') p.set('status', state.status);
  if (state.customer !== 'all') p.set(S.cust, state.customer);
  if (state.search) p.set('search', state.search);
  p.set('pageNumber', state.page); p.set('pageSize', state.size);
  var r = await apiFetch(S.list + '?' + p.toString(), { method: 'GET' });
  return { cards: (r.content || []).map(S.card), totalPages: r.totalPages || 1, total: r.totalElements || 0 };
}
function cardHtml(c, i) {
  var M = MODS[c.mod], st = ST[c.key][c.status] || [c.status, 'badge-gray'];
  var meta = c.meta.map(function (x) { return '<div class="min-w-0"><div class="meta-label">' + x[0] + '</div><div class="meta-value truncate">' + escH(x[1]) + '</div></div>'; }).join('');
  var b = function (fn, t, ic, cls) { return '<button onclick="doAct(\'' + fn + '\',' + i + ')" class="btn-icon-action ' + (cls || '') + '" title="' + t + '"><i class="fa-solid ' + ic + '"></i></button>'; };
  var acts = b('view', 'View', 'fa-eye') + (c.canEdit ? b('edit', 'Edit', 'fa-pen') : '') + b('download', 'Download PDF', 'fa-download') + (c.canDelete ? b('delete', 'Delete', 'fa-trash', 'danger') : '');
  return '<div class="record-card bg-white rounded-xl p-3.5">' +
    '<div class="flex items-start justify-between gap-2"><div class="flex items-center gap-2.5 min-w-0"><span class="mod-icon ' + M.tint + '"><i class="fa-solid ' + M.icon + '"></i></span>' +
    '<div class="min-w-0"><div class="font-bold text-[13px] text-gray-900 truncate">' + escH(c.number) + '</div><div class="text-[11px] text-gray-500 truncate">' + escH(c.customer) + '</div></div></div>' +
    '<div class="text-right shrink-0 flex flex-col items-end gap-1"><span class="badge ' + st[1] + '"><span class="badge-dot"></span>' + st[0] + '</span>' + c.extra + '</div></div>' +
    '<div class="grid grid-cols-3 gap-2 mt-3 pt-3 border-t border-gray-100">' + meta + '</div>' +
    '<div class="flex items-center justify-between mt-3 pt-2.5 border-t border-gray-100"><div><div class="meta-label">Total</div>' +
    '<div class="font-mono font-bold text-[14px] text-primary-dark">' + fm(c.total, c.currency) + '</div></div><div class="flex gap-0.5">' + acts + '</div></div></div>';
}
async function load() {
  var my = ++tok, grid = document.getElementById('recordsGrid'), key = curKey(), res;
  grid.innerHTML = '<div class="col-span-full text-center py-10 text-gray-400 text-xs"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Loading…</div>';
  try { res = await fetchKey(key); }
  catch (e) {
    if (my !== tok) return;
    cards = []; document.getElementById('pager').innerHTML = '';
    grid.innerHTML = '<div class="col-span-full text-center py-10 text-sm text-red-500">' + escH(e.message || 'Failed to load data') + '</div>';
    return;
  }
  if (my !== tok) return;
  if (res.total > 0 && !res.cards.length && state.page > 1) { state.page = Math.max(1, res.totalPages); return load(); }
  cards = res.cards;
  grid.innerHTML = cards.length ? cards.map(cardHtml).join('') :
    '<div class="col-span-full text-center py-10 text-gray-400 text-sm"><i class="fa-regular fa-folder-open text-2xl opacity-30 block mb-2"></i>No records found. Try adjusting your filters.</div>';
  var rs = (state.page - 1) * state.size + 1, re = Math.min(rs + cards.length - 1, res.total);
  document.getElementById('pager').innerHTML = cards.length ?
    '<span class="text-[10px] text-gray-400">Showing ' + rs + '–' + re + ' of ' + res.total + '</span>' +
    '<div class="flex items-center gap-2"><button onclick="goToPage(' + (state.page - 1) + ')" ' + (state.page <= 1 ? 'disabled' : '') + ' class="text-[10px] px-2 py-1 border border-gray-200 rounded disabled:opacity-40">Prev</button>' +
    '<span class="text-[10px] text-gray-500">Page ' + state.page + ' of ' + res.totalPages + '</span>' +
    '<button onclick="goToPage(' + (state.page + 1) + ')" ' + (state.page >= res.totalPages ? 'disabled' : '') + ' class="text-[10px] px-2 py-1 border border-gray-200 rounded disabled:opacity-40">Next</button></div>' : '';
}

// ============================================================= ACTIONS
function doAct(kind, i) {
  var c = cards[i]; if (!c) return;
  if (kind === 'view') viewCard(c, i);
  else if (kind === 'edit') editCard(c);
  else if (kind === 'download') downloadCard(c);
  else if (kind === 'delete') askDelete(i);
}
async function viewCard(c, i) {
  await orgReady;
  var html, sub = escH(c.number);
  try {
    if (c.key === 'orders') { var f = await loadSoFull(c.id); html = buildSoHtml(f.so, f.ci, f.pl); }
    else if (c.key === 'quotes') html = buildQuoteHtml(c.raw);
    else if (c.key === 'challans') { html = buildDcHtml(c.raw); if (c.raw.warehouseName) sub += ' · Warehouse: ' + escH(c.raw.warehouseName) + (c.raw.destName ? ' → ' + escH(c.raw.destName) : ''); }
    else html = buildDocumentInnerHtml(c.raw, c.raw.templateId);
  } catch (e) { showToast(e.message || 'Could not load the document', 'error'); return; }
  openModal(modalHeader(SINGLE[c.key], sub) + '<div class="px-5 py-4 modal-scroll">' + html + '</div>' +
    modalFooter('<button onclick="doAct(\'download\',' + i + ')" class="text-xs font-semibold text-primary hover:underline flex items-center gap-1"><i class="fa-solid fa-download"></i> Download PDF</button>', BTN_CANCEL), 'max-w-4xl');
}
function editCard(c) {
  if (!c.canEdit) { showToast('This record can no longer be edited', 'warning'); return; }
  window.location.href = PAGES[c.mod] + '?edit=' + encodeURIComponent(c.number) + (c.key === 'proformas' ? '&type=proforma' : '');
}
async function downloadCard(c) {
  if (c.key === 'orders') {
    // Sales Orders have no stored PDF, so it is generated here from the same preview
    try {
      await orgReady; showToast('Preparing PDF…', 'info');
      var f = await loadSoFull(c.id);
      await html2pdf().from('<div style="background:#fff;width:100%">' + buildSoHtml(f.so, f.ci, f.pl) + '</div>', 'string').set({
        margin: 8, filename: f.so.number + '.pdf', html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', scrollX: 0, scrollY: 0 },
        jsPDF: { unit: 'pt', format: 'a4', orientation: 'portrait' }
      }).save();
    } catch (e) { showToast(e.message || 'Could not generate the PDF', 'error'); }
    return;
  }
  if (!c.pdfUrl) { showToast('No PDF stored for ' + c.number + ' yet.', 'error'); return; }
  window.open(API_BASE + c.pdfUrl, '_blank');
}
function askDelete(i) {
  var c = cards[i]; if (!c || !c.canDelete) return;
  openModal(modalHeader('Delete ' + SINGLE[c.key], escH(c.number)) +
    '<div class="px-5 py-4 text-sm text-gray-600"><p>Are you sure you want to permanently delete <b class="text-gray-800">' + escH(c.number) + '</b>?</p>' +
    '<p class="text-gray-400 text-[11px] mt-1">This action cannot be undone.</p><p class="text-amber-600 text-[11px] mt-2">Total Value: ' + fm(c.total, c.currency) + '</p></div>' +
    modalFooter('', '<button onclick="closeModal()" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-600 border border-gray-200 hover:bg-white transition">Cancel</button>' +
      '<button onclick="confirmDelete(' + i + ')" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-white bg-red-600 hover:bg-red-700 transition shadow-sm">Delete</button>'), 'max-w-md');
}
async function confirmDelete(i) {
  var c = cards[i]; if (!c) return;
  try {
    await apiFetch(SRC[c.key].del + encodeURIComponent(c.id), { method: 'DELETE' });
    closeModal(); showToast(SINGLE[c.key] + ' deleted', 'warning'); loadStats(); load();
  } catch (e) { closeModal(); showToast(e.message || 'Could not delete', 'error'); }
}

// ============================================================= EVENTS + INIT
document.getElementById('searchInput').addEventListener('input', function (e) {
  clearTimeout(searchTimer);
  var v = e.target.value.trim();
  searchTimer = setTimeout(function () { if (v === state.search) return; state.search = v; state.page = 1; load(); }, 400);
});
document.getElementById('filterStatus').addEventListener('change', function (e) { state.status = e.target.value; state.page = 1; load(); });
document.getElementById('filterCustomer').addEventListener('change', function (e) { state.customer = e.target.value; state.page = 1; load(); });
document.getElementById('pageSize').addEventListener('change', function (e) { state.size = parseInt(e.target.value, 10) || 10; state.page = 1; load(); });
document.getElementById('clearBtn').addEventListener('click', function () {
  state.search = ''; state.status = 'all'; state.customer = 'all'; state.page = 1;
  document.getElementById('searchInput').value = ''; buildStatusOptions(); buildCustomerOptions(); load();
});

(async function init() {
  var h = (location.hash || '').replace('#', ''); if (MODS[h]) state.module = h;
  renderTabs(); renderStats(); buildStatusOptions();
  loadStats(); load();
  await loadCustomers(); buildCustomerOptions();
})();
</script>
</body>
</html>
