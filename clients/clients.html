  .badge-blue { background: #dbeafe; color: #1e40af; }

  .btn-page {

  @keyframes fadeIn {

    to { opacity: 1; transform: translateY(0); }
  }

    // ---------- Toast System ----------
    function showToast(message, kind) {
      kind = kind || 'success';
      var wrap = document.getElementById('toastWrap');
      var colors = {
        success: 'bg-green-600',
        info: 'bg-primary',
        warning: 'bg-amber-600',
        error: 'bg-red-600'
      };
      var el = document.createElement('div');
      el.className = 'toast ' + colors[kind] + ' text-white text-sm font-semibold px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 max-w-xs';
      el.innerHTML = '<span>' + message + '</span>';
      wrap.appendChild(el);
      setTimeout(function() {
        el.style.transition = 'opacity .3s';
        el.style.opacity = '0';
        setTimeout(function() { el.remove(); }, 300);
      }, 2600);
    }

    // ---------- Modal System ----------
    function openModal(innerHtml, opts) {
      opts = opts || {};
      var root = document.getElementById('modalRoot');
      root.innerHTML = `
        <div class="fixed inset-0 z-[100] flex items-center justify-center p-4" id="modalOverlay">
          <div class="absolute inset-0 bg-black/40 backdrop-blur-[2px]" id="modalBackdrop"></div>
          <div class="relative bg-white rounded-2xl shadow-2xl w-full ${opts.width || 'max-w-3xl'} max-h-[92vh] flex flex-col animate-modal">
            ${innerHtml}
          </div>
        </div>`;
      document.getElementById('modalBackdrop').addEventListener('click', closeModal);
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      var root = document.getElementById('modalRoot');
      root.innerHTML = '';
      document.body.style.overflow = '';
    }

    function modalHeader(title, subtitle) {
      return `
        <div class="flex items-start justify-between px-6 py-5 border-b border-gray-100 shrink-0">
          <div>
            <h3 class="text-lg font-bold text-gray-900">${title}</h3>
            ${subtitle ? '<p class="text-xs text-gray-500 mt-0.5">' + subtitle + '</p>' : ''}
          </div>
          <button onclick="closeModal()" class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-gray-700 transition shrink-0">${iconX()}</button>
        </div>`;
    }

    function modalFooter(saveLabel, onSaveAttr, extraBtns, variant) {
  variant = variant || 'primary';
  var btnClass = variant === 'danger'
    ? 'bg-red-600 hover:bg-red-700'
    : 'bg-primary hover:bg-primary-dark';
  return `
    <div class="flex items-center justify-between gap-2 px-6 py-4 border-t border-gray-100 bg-gray-50 rounded-b-2xl shrink-0">
      <div>${extraBtns || ''}</div>
      <div class="flex gap-2 ml-auto">
        <button onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm font-semibold text-gray-600 border border-gray-200 hover:bg-white transition">Cancel</button>
        <button ${onSaveAttr} class="px-4 py-2 rounded-lg text-sm font-semibold text-white ${btnClass} transition shadow-sm inline-flex items-center gap-1.5">
          ${iconSave()} ${saveLabel}
        </button>
      </div>
    </div>`;
}

    function fld(label, inputHtml, hint, extraClass) {
      return `
        <div class="form-field ${extraClass || ''}">
          <label class="form-label">${label}</label>
          ${inputHtml}
          ${hint ? '<div class="form-hint">' + hint + '</div>' : ''}
        </div>`;
    }

    function inputBase() { return "form-input"; }

    // ---------- Dropdown ----------
    document.addEventListener('click', function(e) {
      if (!e.target.closest('[data-dd-trigger]')) {
        document.querySelectorAll('[data-dd-menu]').forEach(function(m) { m.classList.add('hidden'); });
      }
    });

    // ---------- Helpers ----------
    function money(n) { return '₹' + Number(n).toLocaleString('en-IN'); }

    function badge(text, color) {
      var map = { green: 'badge-green', amber: 'badge-amber', red: 'badge-red', gray: 'badge-gray', blue: 'badge-blue', purple: 'badge-purple' };
      var dot = { green: 'badge-dot-green', amber: 'badge-dot-amber', red: 'badge-dot-red', gray: 'badge-dot-gray', blue: 'badge-dot-blue', purple: 'badge-dot-purple' };
      return '<span class="badge ' + map[color] + '"><span class="badge-dot ' + dot[color] + '"></span>' + text + '</span>';
    }

    // Client type badge: business / government / individual have fixed styles,
    // anything else (custom "Other" text typed by the user) is shown as a gray badge.
    var STANDARD_CLIENT_TYPES = ['business', 'individual', 'government'];

    function typeBadgeHtml(t) {
      var key = (t || '').toLowerCase();
      if (key === 'business') return badge('Business', 'purple');
      if (key === 'government') return badge('Government', 'blue');
      if (key === 'individual') return badge('Individual', 'gray');
      return badge(t ? escHtml(t) : 'Other', 'gray');
    }

    // ---------- small helpers ----------
    function escHtml(v) {
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // ---------- Client types (dropdown values come from backend: GET /get-client-types) ----------
    // Starts with the 3 standard types so the page still works if the API is unreachable.
    var CLIENT_TYPES = STANDARD_CLIENT_TYPES.slice();
    var OTHER_TYPE_VALUE = '__other__';   // value of the "Other" option in the form dropdown

    function typeLabel(t) {
      if (STANDARD_CLIENT_TYPES.indexOf(String(t).toLowerCase()) !== -1) {
        return t.charAt(0).toUpperCase() + t.slice(1).toLowerCase();
      }
      return t;
    }

    function typeOptionsHtml(selected) {
      var sel = (selected || '').toLowerCase();
      return CLIENT_TYPES.map(function(t) {
        return '<option value="' + escHtml(t) + '"' + (t.toLowerCase() === sel ? ' selected' : '') + '>' + escHtml(typeLabel(t)) + '</option>';
      }).join('');
    }

    // ---------- Countries / States (static lists, no backend needed) ----------
    var COUNTRIES = ['India', 'Indonesia', 'Nepal', 'New Zealand', 'North Korea', 'Russia','Singapore', 'South Africa'];

    var INDIA_STATES = ['Maharashtra', 'Delhi', 'Karnataka', 'Tamil Nadu', 'Gujarat', 'Uttar Pradesh', 'Rajasthan', 'Kerala', 'Telangana', 'West Bengal', 'Andhra Pradesh', 'Bihar', 'Chhattisgarh', 'Goa', 'Haryana', 'Himachal Pradesh', 'Jharkhand', 'Madhya Pradesh', 'Odisha', 'Punjab', 'Uttarakhand',
      'Arunachal Pradesh', 'Assam', 'Manipur', 'Meghalaya', 'Mizoram', 'Nagaland', 'Sikkim', 'Tripura',
      'Andaman and Nicobar Islands', 'Chandigarh', 'Dadra and Nagar Haveli and Daman and Diu', 'Jammu and Kashmir', 'Ladakh', 'Lakshadweep', 'Puducherry'];

    function countrySelectHtml(current) {
      current = current || '';
      var list = COUNTRIES.slice();
      // a country saved earlier as free text that is not in the list must not be lost
      if (current && list.indexOf(current) === -1) list.push(current);
      return '<select id="f_country" class="form-input" onchange="onCountryChange()">' +
        '<option value=""' + (current ? '' : ' selected') + '>Select Country</option>' +
        list.map(function(c) {
          return '<option value="' + escHtml(c) + '"' + (c === current ? ' selected' : '') + '>' + escHtml(c) + '</option>';
        }).join('') + '</select>';
    }

    // India -> dropdown of states / UTs.  Any other country -> plain text input (state / province).
    function stateFieldHtml(country, current, keepUnknown) {
      current = current || '';
      if (country === 'India') {
        var list = INDIA_STATES.slice();
        if (keepUnknown && current && list.indexOf(current) === -1) list.push(current);
        return '<select id="f_state" class="form-input">' + list.map(function(st) {
          return '<option value="' + escHtml(st) + '"' + (st === current ? ' selected' : '') + '>' + escHtml(st) + '</option>';
        }).join('') + '</select>';
      }
      return '<input id="f_state" value="' + escHtml(current) + '" placeholder="State / Province" class="form-input">';
    }

    function rowActionsHtml(editFn, delFn, viewFn) {
      var html = '<div class="flex gap-1 justify-end">';
      if (viewFn) {
        html += '<button onclick="' + viewFn + '" class="btn-icon-action" title="View">' + iconEye() + '</button>';
      }
      html += '<button onclick="' + editFn + '" class="btn-icon-action" title="Edit">' + iconEdit() + '</button>';
      html += '<button onclick="' + delFn + '" class="btn-icon-action danger" title="Delete">' + iconTrash() + '</button>';
      html += '</div>';
      return html;
    }

    function panelWrap(titleHtml, bodyHtml, extraHead) {
      return `
        <div class="bg-white border border-[#6da84c] rounded-xl shadow-sm overflow-hidden">
          <div class="flex items-center justify-between gap-3 flex-wrap px-5 py-4 border-b border-gray-100">
            <div class="font-bold text-[14.5px] text-gray-800 flex items-center gap-2">${titleHtml}</div>
            ${extraHead || ''}
          </div>
          <div>${bodyHtml}</div>
        </div>`;
    }

    function tableHtml(cols, rowsHtml, aligns) {
      aligns = aligns || [];
      var colHeaders = cols.map(function(c, i) {
        var align = aligns[i] || 'left';
        return '<th class="text-' + align + ' text-[11px] font-bold uppercase tracking-wide text-gray-500 px-4 py-3 whitespace-nowrap">' + c + '</th>';
      }).join('');
      return `
        <div class="overflow-x-auto">
          <table class="w-full text-[13px]">
            <thead>
              <tr class="bg-gray-200 border border-[#6da84c]">${colHeaders}</tr>
            </thead>
            <tbody id="tbody-anchor">${rowsHtml}</tbody>
          </table>
        </div>`;
    }

    // ---------- Pagination controls (rendered from backend's pagination object) ----------
    // Shows only the current page number, styled like the old highlighted button, + Previous/Next.
    function paginationHtml(totalItems, page, size, totalPages, hasNext, hasPrevious) {
      totalPages = totalPages || Math.max(1, Math.ceil(totalItems / size));

      return `
        <div class="flex items-center justify-between gap-3 flex-wrap px-5 py-3.5 border-t border-gray-100">
          <select id="pageSizeSelect" onchange="changePageSize(this.value)" class="mini-select">
            <option value="10">10 / page</option>
            <option value="25">25 / page</option>
            <option value="50">50 / page</option>
            <option value="100">100 / page</option>
          </select>
          <div class="flex items-center gap-1.5">
            <button onclick="goToPage(${page - 1})" class="btn-page" ${!hasPrevious ? 'disabled' : ''}>${iconChevronLeft()}</button>
            <span class="btn-page !bg-primary !border-primary !text-white" style="cursor:default;">${page}</span>
            <button onclick="goToPage(${page + 1})" class="btn-page" ${!hasNext ? 'disabled' : ''}>${iconChevronRight()}</button>
          </div>
        </div>`;
    }

    // =============================================================
    // DATA  (backend-driven pagination + filtering)
    // =============================================================

    var customerColors = ['#6da84c', '#1985bf', '#d97706', '#7c3aed', '#dc2626', '#0891b2', '#4f46e5', '#e11d48', '#0d9488'];

    // Backend base URL (Spring Boot, server.port in application.properties)
    var API_BASE = 'http://localhost:9093/api/clients/v1';

    var customers = [];    // current page's rows only — comes straight from backend
    var META = null;       // stat cards, comes from the same /get-all-clients response
    var PAGINATION = null; // { page, size, totalItems, totalPages, hasNext, hasPrevious }

    // Small fetch wrapper: returns json.data, throws Error(message) on failure
    function api(method, path, body) {
      var opts = { method: method };
      if (body) {
        opts.headers = { 'Content-Type': 'application/json' };
        opts.body = JSON.stringify(body);
      }
      return fetch(API_BASE + path, opts).then(function(res) {
        return res.text().then(function(text) {
          var json = null;
          try { json = JSON.parse(text); } catch (e) {}
          console.log('[API]', method, path, res.status, json || text);
          if (!res.ok) throw new Error((json && json.message) || ('Request failed (HTTP ' + res.status + ')'));
          return json ? json.data : null;
        });
      }, function(err) {
        console.error('[API] network error', method, path, err);
        throw new Error('Cannot reach backend at ' + API_BASE + ' - is the server running?');
      });
    }

    // Backend can return null for optional fields; the page code expects strings/numbers
    function normalizeCustomer(c) {
      ['name', 'companyName', 'customerType', 'gstin', 'pan', 'email', 'phone', 'billingAddress',
       'shippingAddress', 'city', 'state', 'country', 'pincode', 'paymentTerms', 'status', 'createdAt']
        .forEach(function(k) { if (c[k] == null) c[k] = ''; });
      c.creditLimit = Number(c.creditLimit) || 0;
      c.receivable = Number(c.receivable) || 0;
      c.gstRegistered = !!c.gstRegistered;
      if (!c.color) c.color = customerColors[0];
      return c;
    }

    // Pagination + filter state — this drives the backend query string
    var currentPage = 1;
    var pageSize = 10;
    var activeFilters = { status: 'all', gst: 'all', type: 'all' };
    var searchDebounceTimer = null;

    function buildQuery() {
      var searchInput = document.getElementById('searchInput');
      var q = searchInput ? searchInput.value.trim() : '';
      var params = new URLSearchParams();
      params.set('status', activeFilters.status);
      params.set('gst', activeFilters.gst);
      params.set('type', activeFilters.type);
      if (q) params.set('search', q);
      params.set('page', currentPage);
      params.set('size', pageSize);
      return params.toString();
    }

    // Fetch client types (standard + custom saved in DB) for the form and the "All Types" filter
    function loadClientTypes() {
      return api('GET', '/get-client-types')
        .then(function(list) {
          if (Array.isArray(list) && list.length) CLIENT_TYPES = list;
        })
        .catch(function(err) { console.warn('Could not load client types, using defaults:', err.message); });
    }

    function loadCustomers() {
      return api('GET', '/get-all-clients?' + buildQuery())
        .then(function(data) {
          customers = ((data && data.customers) || []).map(normalizeCustomer);
          PAGINATION = (data && data.pagination) || null;
          META = (data && data.meta) || null; // meta now arrives in the same response, no separate call needed
        })
        .catch(function(err) { showToast(err.message, 'error'); })
        .then(function() { renderCustomers(); });
    }

    // =============================================================
    // FUNCTIONS
    // =============================================================

    function getInitials(name) {
      if (!name) return 'C';
      var parts = name.split(' ');
      if (parts.length === 1) return name.substring(0, 2).toUpperCase();
      return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
    }

    function renderStats() {
      var m = META;
      document.getElementById('totalCustomers').textContent = m ? m.totalCustomers : customers.length;
      document.getElementById('activeCustomers').textContent = m ? m.activeCustomers : customers.filter(function(c) { return c.status === 'active'; }).length;
      document.getElementById('gstCustomers').textContent = m ? m.gstRegisteredCustomers : customers.filter(function(c) { return c.gstRegistered; }).length;
      var total = m ? m.totalReceivable : customers.reduce(function(sum, c) { return sum + c.receivable; }, 0);
      document.getElementById('totalReceivable').textContent = money(total);
    }

    // Filter toolbar shown inside the table panel header
    function filtersToolbarHtml() {
      return `
        <div class="flex items-center gap-2  flex-wrap">
          <select id="filterStatus" onchange="filterCustomers()" class="mini-select border-gray-400">
            <option value="all">All Status</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
          <select id="filterGST" onchange="filterCustomers()" class="mini-select border-gray-400">
            <option value="all">All GST</option>
            <option value="registered">Registered</option>
            <option value="unregistered">Unregistered</option>
          </select>
          <select id="filterType" onchange="filterCustomers()" class="mini-select border-gray-400">
            <option value="all">All Types</option>
            ${typeOptionsHtml('')}
          </select>
          <button onclick="resetFilters()" class="btn-reset border border-gray-400" title="Reset all filters &amp; search">
            ${iconRefresh()} Reset
          </button>
        </div>`;
    }

    function renderCustomers() {
      var rowsHtml = '';
      if (!customers.length) {
        rowsHtml = `
          <tr>
            <td colspan="8" class="text-center py-10 text-gray-400 text-sm">
              <div class="flex justify-center mb-2 empty-icon-svg">${iconUser()}</div>
              No clients found. Try adjusting your filters or
              <button onclick="openAddCustomer()" class="text-primary font-semibold hover:underline">add a new client</button>.
            </td>
          </tr>`;
      } else {
        rowsHtml = customers.map(function(c) {
          var statusBadgeHtml = c.status === 'active' ? badge('Active', 'green') : badge('Inactive', 'gray');
          var gstBadge = c.gstRegistered ? badge('GST Registered', 'blue') : badge('Unregistered', 'amber');
          var typeBadge = typeBadgeHtml(c.customerType);
          return `
            <tr class="border-b border-gray-400 table-row-hover">
              <td class="px-4 py-3 align-middle">
                <div class="flex items-center gap-3">
                  <div class="customer-avatar" style="background:${c.color}">${getInitials(c.name)}</div>
                  <div>
                    <div class="font-semibold text-gray-800">${c.name}</div>
                    <div class="text-[11.5px] text-gray-400 font-mono">${c.id}</div>
                  </div>
                </div>
              </td>
              <td class="px-4 py-3 align-middle text-gray-600">${c.companyName || '—'}</td>
              <td class="px-4 py-3 align-middle text-center">${typeBadge}</td>
              <td class="px-4 py-3 align-middle font-mono text-[12px] text-gray-500">${c.gstin || '—'}</td>
              <td class="px-4 py-3 align-middle text-center">${gstBadge}</td>
              <td class="px-4 py-3 align-middle font-mono font-semibold text-amber-600 text-right">${money(c.receivable)}</td>
              <td class="px-4 py-3 align-middle text-center">${statusBadgeHtml}</td>
              <td class="px-4 py-3 align-middle">${rowActionsHtml(
                "editCustomer('"+c.id+"')",
                "delCustomer('"+c.id+"')",
                "viewCustomer('"+c.id+"')"
              )}</td>
            </tr>`;
        }).join('');
      }

      var totalItems   = PAGINATION ? PAGINATION.totalItems  : customers.length;
      var pgPage       = PAGINATION ? PAGINATION.page         : currentPage;
      var pgSize       = PAGINATION ? PAGINATION.size         : pageSize;
      var pgTotalPages = PAGINATION ? PAGINATION.totalPages   : 1;
      var pgHasNext    = PAGINATION ? PAGINATION.hasNext      : false;
      var pgHasPrev    = PAGINATION ? PAGINATION.hasPrevious  : false;

      var bodyHtml = tableHtml(
        ['Client', 'Company', 'Type', 'GSTIN', 'GST Status', 'Receivable', 'Status', 'Actions'],
        rowsHtml,
        ['left', 'left', 'center', 'left', 'center', 'right', 'center', 'right']
      ) + paginationHtml(totalItems, pgPage, pgSize, pgTotalPages, pgHasNext, pgHasPrev);

      var panelHtml = panelWrap(
        'All Clients <span class="text-[11px] font-bold bg-primary-soft text-primary-dark px-2 py-0.5 rounded-full ml-1">' + totalItems + '</span>',
        bodyHtml,
        filtersToolbarHtml()
      );

      document.getElementById('customersPanel').innerHTML = panelHtml;

      // restore filter/page-size selections after re-render
      var st = document.getElementById('filterStatus'); if (st) st.value = activeFilters.status;
      var gs = document.getElementById('filterGST'); if (gs) gs.value = activeFilters.gst;
      var ty = document.getElementById('filterType'); if (ty) ty.value = activeFilters.type;
      var ps = document.getElementById('pageSizeSelect'); if (ps) ps.value = String(pgSize);

      renderStats();
    }

    // Any filter change resets to page 1 and asks the backend again
    function filterCustomers() {
      var st = document.getElementById('filterStatus');
      var gs = document.getElementById('filterGST');
      var ty = document.getElementById('filterType');
      if (st) activeFilters.status = st.value;
      if (gs) activeFilters.gst = gs.value;
      if (ty) activeFilters.type = ty.value;
      currentPage = 1;
      loadCustomers();
    }

    function changePageSize(val) {
      pageSize = parseInt(val, 10) || 10;
      currentPage = 1;
      loadCustomers();
    }

    function goToPage(p) {
      var totalPages = PAGINATION ? PAGINATION.totalPages : 1;
      if (p < 1 || p > totalPages) return;
      currentPage = p;
      loadCustomers();
    }

    function resetFilters() {
      activeFilters = { status: 'all', gst: 'all', type: 'all' };
      pageSize = 10;
      currentPage = 1;
      var searchInput = document.getElementById('searchInput');
      if (searchInput) searchInput.value = '';
      loadCustomers();
      showToast('Filters reset', 'info');
    }

    // Debounced so typing doesn't fire a request on every keystroke
    function debouncedSearch() {
      if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(function() {
        currentPage = 1;
        loadCustomers();
      }, 350);
    }

    // =============================================================
    // ADD / EDIT CUSTOMER
    // =============================================================

    function openAddCustomer() { openCustomerModal(null); }

    function editCustomer(id) {
      api('GET', '/get-client/' + encodeURIComponent(id))
        .then(function(c) { openCustomerModal(normalizeCustomer(c)); })
        .catch(function(err) { showToast(err.message, 'error'); });
    }

    function viewCustomer(id) {
      api('GET', '/get-client/' + encodeURIComponent(id))
        .then(function(c) { showCustomerDetails(normalizeCustomer(c)); })
        .catch(function(err) { showToast(err.message, 'error'); });
    }

    function showCustomerDetails(c) {

  // small helper so every row looks identical: bordered card + label + value
  function detailCard(label, valueHtml) {
    return `
      <div class="border border-gray-200 rounded-lg bg-white px-3.5 py-2.5">
        <div class="text-[10.5px] font-semibold uppercase tracking-wider text-gray-500 mb-1">${label}</div>
        <div class="text-[13px] text-gray-800">${valueHtml}</div>
      </div>`;
  }

  function sectionTitle(icon, text) {
    return `
      <div class="flex items-center gap-2 mt-5 mb-2.5 first:mt-0">
        <span class="text-primary">${icon}</span>
        <span class="text-[11px] font-bold uppercase tracking-wider text-gray-600">${text}</span>
        <div class="flex-1 h-px bg-gray-200"></div>
      </div>`;
  }

  // Builds the full address only when the street address actually exists.
  // If the street address is empty, show a dash instead of ", City, State - Pincode".
  function buildFullAddress(street, cust) {
    street = (street || '').trim();
    if (!street) return '—';
    return street +
      (cust.city ? ', ' + cust.city : '') +
      (cust.state ? ', ' + cust.state : '') +
      (cust.country ? ', ' + cust.country : '') +
      (cust.pincode ? ' - ' + cust.pincode : '');
  }

  var modalContent = `
    ${modalHeader('Client Details — ' + c.name, c.id)}
    <div class="px-6 py-5 modal-scroll">

      <!-- Header card -->
      <div class="flex items-center gap-4 mb-2 p-4 border border-gray-200 rounded-xl bg-gray-50">
        <div class="customer-avatar" style="background:${c.color}; width:52px; height:52px; font-size:20px;">${getInitials(c.name)}</div>
        <div class="min-w-0">
          <div class="text-lg font-bold text-gray-900 truncate">${c.name}</div>
          <div class="text-[12.5px] text-gray-500 truncate">${c.companyName || 'Individual Client'}</div>
          <div class="mt-1.5 flex gap-1.5 flex-wrap">
            ${c.status === 'active' ? badge('Active', 'green') : badge('Inactive', 'gray')}

      ${sectionTitle(iconUser(), 'Identity')}
      <div class="grid grid-cols-2 form-grid-2 gap-3">
        ${detailCard('Client ID', '<span class="font-mono font-semibold">' + c.id + '</span>')}
        ${detailCard('Client Type', typeBadgeHtml(c.customerType))}
        ${detailCard('Company Name', c.companyName || '—')}
        ${detailCard('Created On', '<span class="text-gray-600">' + (c.createdAt || '—') + '</span>')}
      </div>

      <!-- Contact -->
      ${sectionTitle(iconMail(), 'Contact')}
      <div class="grid grid-cols-2 form-grid-2 gap-3">
        ${detailCard('Email', c.email ? '<a href="mailto:' + c.email + '" class="text-secondary hover:underline">' + c.email + '</a>' : '—')}
        ${detailCard('Phone', c.phone ? '<a href="tel:' + c.phone + '" class="text-secondary hover:underline">' + c.phone + '</a>' : '—')}
      </div>

      <!-- Address -->
      ${sectionTitle(iconLocation(), 'Address')}
      <div class="grid grid-cols-1 gap-3">
        ${detailCard('Billing Address', buildFullAddress(c.billingAddress, c))}
        ${detailCard('Shipping Address', buildFullAddress(c.shippingAddress || c.billingAddress, c))}
        ${detailCard('Country', c.country || '—')}

      <!-- Tax -->
      ${sectionTitle(iconGST(), 'Tax & GST')}
      <div class="grid grid-cols-2 form-grid-2 gap-3">
        ${detailCard('GSTIN', '<span class="font-mono">' + (c.gstin || '—') + '</span>')}
        ${detailCard('PAN', '<span class="font-mono">' + (c.pan || '—') + '</span>')}
        ${detailCard('GST Status',
          c.gstRegistered ? badge('Registered', 'blue') : badge('Unregistered', 'amber')
        )}
      </div>

      <!-- Financials -->
      ${sectionTitle(iconCredit(), 'Payment & Credit')}
      <div class="grid grid-cols-3 form-grid-3 gap-3">
        ${detailCard('Payment Terms', '<span class="font-semibold">' + (c.paymentTerms || '—') + '</span>')}
        ${detailCard('Credit Limit', '<span class="font-semibold">' + (c.creditLimit > 0 ? money(c.creditLimit) : '—') + '</span>')}
        ${detailCard('Total Receivable', '<span class="font-semibold text-amber-600">' + money(c.receivable) + '</span>')}
      </div>

    </div>
    ${modalFooter('Close', 'onclick="closeModal()"')}
  `;

  openModal(modalContent, { width: 'max-w-2xl' });
}

    function openCustomerModal(existing) {
      var e = existing || {
        name: '',
        companyName: '',
        customerType: 'business',
        gstin: '',
        pan: '',
        email: '',
        phone: '',
        billingAddress: '',
        shippingAddress: '',
        city: '',
        state: 'Maharashtra',
        country: 'India',
        pincode: '',
        paymentTerms: 'Net 15 days',
        creditLimit: '',
        gstRegistered: false,
        status: 'active',
        color: customerColors[Math.floor(Math.random() * customerColors.length)]
      };
      var isEdit = !!existing;

      // Client type: custom types (added via "Other" -> Add) come from the backend list.
      // If this client has a type that is somehow not in the list yet, keep it so it is not lost.
      if (e.customerType && CLIENT_TYPES.map(function(t) { return t.toLowerCase(); }).indexOf(e.customerType.toLowerCase()) === -1) {
        CLIENT_TYPES = CLIENT_TYPES.concat([e.customerType]);
      }

      var modalContent = `
        ${modalHeader(isEdit ? 'Edit Client' : 'Add New Client', isEdit ? e.id : 'Create a new client master record')}
        <div class="px-6 py-5 modal-scroll">
          <div class="flex border-b border-gray-200 mb-5 gap-1 overflow-x-auto" id="modalTabs">
            <button class="modal-tab-btn active" data-tab="tab-basic">
              ${iconUser()}<span>Basic Info</span>
            </button>
            <button class="modal-tab-btn" data-tab="tab-address">
              ${iconLocation()}<span>Address</span>
            </button>
            <button class="modal-tab-btn" data-tab="tab-tax">
              ${iconGST()}<span>Tax &amp; GST</span>
            </button>
            <button class="modal-tab-btn" data-tab="tab-payment">
              ${iconCredit()}<span>Payment &amp; Credit</span>
            </button>
          </div>

          <div id="tab-basic" class="modal-tab-panel active">
            <div class="grid grid-cols-2 form-grid-2 gap-x-4 gap-y-4">
              ${fld('Client Name', '<input id="f_name" value="' + e.name + '" placeholder="e.g. XYZ Retail Store" class="' + inputBase() + '">')}
              ${fld('Company Name', '<input id="f_company" value="' + (e.companyName || '') + '" placeholder="Company legal name" class="' + inputBase() + '">')}
              ${fld('Client Type', '<select id="f_type" class="' + inputBase() + '" onchange="toggleTypeOther()">' + typeOptionsHtml(e.customerType) + '<option value="' + OTHER_TYPE_VALUE + '">Other</option></select>', null, 'col-span-2')}
              <div id="f_typeOtherWrap" class="col-span-2 hidden">
                ${fld('Specify Client Type', `<div style="display:flex;align-items:center;gap:8px;">
                    <input id="f_typeOther" maxlength="30" placeholder="e.g. Trust, NGO, Partnership" class="form-input" style="flex:1;min-width:0;"
                      onkeydown="if(event.key==='Enter'){event.preventDefault();addCustomClientType();}">
                    <button type="button" id="f_typeAddBtn" onclick="addCustomClientType()"
                      class="px-4 py-2 rounded-lg text-sm font-semibold text-white bg-primary hover:bg-primary-dark transition shadow-sm whitespace-nowrap">Add</button>
                  </div>`, )}
              </div>
              ${fld('Email', '<input id="f_email" type="email" value="' + e.email + '" placeholder="client@domain.com" class="' + inputBase() + '">')}
              ${fld('Phone', '<input id="f_phone" value="' + e.phone + '" placeholder="+91-XXXXXXXXXX" class="' + inputBase() + '">')}
            </div>
          </div>

          <div id="tab-address" class="modal-tab-panel">
            <div class="grid grid-cols-1 gap-y-4 mb-4">
              ${fld('Billing Address', '<textarea id="f_billingAddress" rows="2" class="' + inputBase() + '" placeholder="Street address">' + (e.billingAddress || '') + '</textarea>')}
              ${fld('Shipping Address', '<textarea id="f_shippingAddress" rows="2" class="' + inputBase() + '" placeholder="Shipping address (if different)">' + (e.shippingAddress || '') + '</textarea>')}
            </div>
            <div class="grid grid-cols-3 form-grid-3 gap-x-4 gap-y-4">
              ${fld('City', '<input id="f_city" value="' + (e.city || '') + '" placeholder="City" class="' + inputBase() + '">')}
              ${fld('State', '<div id="f_stateWrap">' + stateFieldHtml(e.country, e.state, true) + '</div>')}
              ${fld('Country', countrySelectHtml(e.country))}
              ${fld('Pincode', '<input id="f_pincode" value="' + (e.pincode || '') + '" placeholder="6-digit PIN" class="' + inputBase() + '">')}
            </div>
          </div>

          <div id="tab-tax" class="modal-tab-panel">
            <div class="grid grid-cols-2 form-grid-2 gap-x-4 gap-y-4 mb-4">
              ${fld('GSTIN', '<input id="f_gstin" value="' + (e.gstin || '') + '" placeholder="15-digit GSTIN" class="' + inputBase() + '">', 'Format: 2-digit state code + 10-digit PAN + 3-digit entity code')}
              ${fld('PAN', '<input id="f_pan" value="' + (e.pan || '') + '" placeholder="10-digit PAN" class="' + inputBase() + '">')}
            </div>
            ${fld('GST Registered?', '<div class="form-radio-row"><label><input type="radio" name="gstReg" value="true" ' + (e.gstRegistered ? 'checked' : '') + '> <span class="font-medium">Yes</span></label><label><input type="radio" name="gstReg" value="false" ' + (!e.gstRegistered ? 'checked' : '') + '> <span class="font-medium">No</span></label></div>')}
          </div>

          <div id="tab-payment" class="modal-tab-panel">
            <div class="grid grid-cols-2 form-grid-2 gap-x-4 gap-y-4 mb-4">
              ${fld('Payment Terms', '<select id="f_paymentTerms" class="' + inputBase() + '"><option ' + (e.paymentTerms === 'Net 7 days' ? 'selected' : '') + '>Net 7 days</option><option ' + (e.paymentTerms === 'Net 15 days' ? 'selected' : '') + '>Net 15 days</option><option ' + (e.paymentTerms === 'Net 30 days' ? 'selected' : '') + '>Net 30 days</option><option ' + (e.paymentTerms === 'Net 45 days' ? 'selected' : '') + '>Net 45 days</option><option ' + (e.paymentTerms === 'Net 60 days' ? 'selected' : '') + '>Net 60 days</option><option ' + (e.paymentTerms === 'Advance Payment' ? 'selected' : '') + '>Advance Payment</option><option ' + (e.paymentTerms === 'Cash on Delivery' ? 'selected' : '') + '>Cash on Delivery</option></select>')}
              ${fld('Credit Limit (₹)', '<input id="f_creditLimit" type="number" value="' + (e.creditLimit || '') + '" placeholder="e.g. 100000" class="' + inputBase() + '">', 'Set 0 for no credit limit')}
            </div>
            ${fld('Status', '<div class="form-radio-row"><label><input type="radio" name="customerStatus" value="active" ' + (e.status === 'active' ? 'checked' : '') + '> <span class="font-medium">Active</span></label><label><input type="radio" name="customerStatus" value="inactive" ' + (e.status === 'inactive' ? 'checked' : '') + '> <span class="font-medium">Inactive</span></label></div>')}
          </div>
        </div>
        ${modalFooter(isEdit ? 'Update Client' : 'Save Client', 'onclick="saveCustomer(\'' + (isEdit ? e.id : '') + '\')"')}
      `;

      openModal(modalContent, { width: 'max-w-2xl' });

      // Tab switching
      setTimeout(function() {
        var tabs = document.querySelectorAll('.modal-tab-btn');
        tabs.forEach(function(btn) {
          btn.addEventListener('click', function() {
            tabs.forEach(function(b) { b.classList.remove('active'); });
            this.classList.add('active');
            var panels = document.querySelectorAll('.modal-tab-panel');
            panels.forEach(function(p) { p.classList.remove('active'); });
            document.getElementById(this.dataset.tab).classList.add('active');
          });
        });
      }, 50);
    }

    // Show / hide the "Specify Client Type" input when "Other" is chosen
    function toggleTypeOther() {
      var sel = document.getElementById('f_type');
      var wrap = document.getElementById('f_typeOtherWrap');
      if (!sel || !wrap) return;
      if (sel.value === OTHER_TYPE_VALUE) {
        wrap.classList.remove('hidden');
        var inp = document.getElementById('f_typeOther');
        if (inp) inp.focus();
      } else {
        wrap.classList.add('hidden');
      }
    }

    // "Other" -> Add button: puts the typed type in the Client Type dropdown and selects it.
    // It is saved in the DB when the client is saved; after that it also appears in the
    // "All Types" filter (loaded from GET /get-client-types).
    function addCustomClientType() {
      var inp = document.getElementById('f_typeOther');
      var sel = document.getElementById('f_type');
      if (!inp || !sel) return;
      var name = inp.value.trim().replace(/\s+/g, ' ');
      if (!name) { showToast('Please enter a client type', 'warning'); inp.focus(); return; }
      if (name.toLowerCase() === 'other') { showToast('"Other" is reserved, please enter a specific type', 'warning'); return; }

      // already in the dropdown (any casing)? just select it
      var found = null;
      for (var k = 0; k < sel.options.length; k++) {
        if (sel.options[k].value !== OTHER_TYPE_VALUE && sel.options[k].value.toLowerCase() === name.toLowerCase()) { found = sel.options[k]; break; }
      }
      if (!found) {
        found = document.createElement('option');
        found.value = name;
        found.textContent = name;
        sel.insertBefore(found, sel.querySelector('option[value="' + OTHER_TYPE_VALUE + '"]'));
      }
      sel.value = found.value;

      inp.value = '';
      document.getElementById('f_typeOtherWrap').classList.add('hidden');
      showToast('"' + found.value + '" added. It will be saved when you save the client', 'success');
    }

    // Country changed -> India shows the state dropdown, other countries get a free-text state
    function onCountryChange() {
      var c = document.getElementById('f_country');
      var wrap = document.getElementById('f_stateWrap');
      if (!c || !wrap) return;
      var stEl = document.getElementById('f_state');
      var cur = stEl ? stEl.value : '';
      if (c.value === 'India' && INDIA_STATES.indexOf(cur) === -1) cur = 'Maharashtra';
      wrap.innerHTML = stateFieldHtml(c.value, cur, false);
    }

    // =============================================================
    // SAVE / DELETE CUSTOMER
    // =============================================================

    function saveCustomer(existingId) {
      var name = document.getElementById('f_name') ? document.getElementById('f_name').value.trim() : '';
      var companyName = document.getElementById('f_company') ? document.getElementById('f_company').value.trim() : '';
      var customerType = document.getElementById('f_type') ? document.getElementById('f_type').value : 'business';
      if (customerType === OTHER_TYPE_VALUE) {
        var otherText = document.getElementById('f_typeOther') ? document.getElementById('f_typeOther').value.trim() : '';
        if (!otherText) {
          showToast('Please specify the client type', 'warning');
          return;
        }
        customerType = otherText; // typed but "Add" not clicked -> backend saves it as a new type anyway
      }
      var email = document.getElementById('f_email') ? document.getElementById('f_email').value.trim() : '';
      var phone = document.getElementById('f_phone') ? document.getElementById('f_phone').value.trim() : '';
      var billingAddress = document.getElementById('f_billingAddress') ? document.getElementById('f_billingAddress').value.trim() : '';
      var shippingAddress = document.getElementById('f_shippingAddress') ? document.getElementById('f_shippingAddress').value.trim() : '';
      var city = document.getElementById('f_city') ? document.getElementById('f_city').value.trim() : '';
      var state = document.getElementById('f_state') ? document.getElementById('f_state').value : 'Maharashtra';
      var country = document.getElementById('f_country') ? document.getElementById('f_country').value.trim() : '';
      var pincode = document.getElementById('f_pincode') ? document.getElementById('f_pincode').value.trim() : '';
      var gstin = document.getElementById('f_gstin') ? document.getElementById('f_gstin').value.trim().toUpperCase() : '';
      var pan = document.getElementById('f_pan') ? document.getElementById('f_pan').value.trim().toUpperCase() : '';
      var paymentTerms = document.getElementById('f_paymentTerms') ? document.getElementById('f_paymentTerms').value : 'Net 15 days';
      var creditLimit = document.getElementById('f_creditLimit') ? parseFloat(document.getElementById('f_creditLimit').value) || 0 : 0;
      var gstRegRadio = document.querySelector('input[name="gstReg"]:checked');
      var gstRegistered = gstRegRadio ? gstRegRadio.value === 'true' : false;
      var statusRadio = document.querySelector('input[name="customerStatus"]:checked');
      var status = statusRadio ? statusRadio.value : 'active';

      var body = {
        name: name,
        companyName: companyName,
        customerType: customerType,
        email: email,
        phone: phone,
        billingAddress: billingAddress,
        shippingAddress: shippingAddress || billingAddress,
        city: city,
        state: state,
        country: country,
        pincode: pincode,
        gstin: gstin,
        pan: pan,
        paymentTerms: paymentTerms,
        creditLimit: creditLimit,
        gstRegistered: gstRegistered,
        status: status
      };

      var request;
      if (existingId) {
        request = api('PUT', '/update-client/' + encodeURIComponent(existingId), body);
      } else {
        body.receivable = 0;
        body.color = customerColors[Math.floor(Math.random() * customerColors.length)];
        request = api('POST', '/create-client', body);
      }

      request
        .then(function() {
          closeModal();
          showToast(existingId ? 'Client updated successfully' : 'Client added successfully', 'success');
          return loadClientTypes().then(loadCustomers);
        })
        .catch(function(err) { showToast(err.message, 'error'); });
    }

    function delCustomer(id) {
  var c = customers.find(function(x) { return x.id === id; });
  if (!c) return;

  var modalContent = `
    ${modalHeader('Delete Client', c.name)}
    <div class="px-6 py-5 text-sm text-gray-600">
      <div class="flex items-start gap-3 p-3.5 border border-red-200 bg-red-50 rounded-lg mb-4">
        <div class="w-9 h-9 rounded-full bg-red-100 text-red-600 flex items-center justify-center shrink-0">
          ${iconTrash()}
        </div>
        <div>
          <p class="font-semibold text-red-700">This action cannot be undone</p>
          <p class="text-[12px] text-red-600 mt-0.5">The client record and its associations will be permanently removed.</p>
        </div>
      </div>

      <p class="mb-2">Are you sure you want to permanently delete
        <b class="text-gray-900">${c.name}</b>${c.companyName ? ' (' + c.companyName + ')' : ''}?</p>

      ${c.receivable > 0
        ? '<div class="border border-amber-200 bg-amber-50 rounded-lg px-3.5 py-2.5 mt-3 text-[12.5px] text-amber-700">⚠ This client has an outstanding receivable of <b>' + money(c.receivable) + '</b>.</div>'
        : ''}
    </div>
    ${modalFooter('Delete', 'onclick="confirmDeleteCustomer(\'' + id + '\')"', '', 'danger')}
  `;
  openModal(modalContent, { width: 'max-w-md' });
}

    function confirmDeleteCustomer(id) {
      api('DELETE', '/delete-client/' + encodeURIComponent(id))
        .then(function() {
          closeModal();
          showToast('Client deleted successfully', 'warning');
          return loadCustomers();
        })
        .catch(function(err) { showToast(err.message, 'error'); });
    }

    // =============================================================
    // SEARCH
    // =============================================================

    (function addSearchToTopbar() {
      var searchContainer = document.querySelector('.app-main header');
      if (searchContainer) {
        var searchHtml = `
          <div class="hidden sm:flex flex-1 max-w-[420px] relative ml-4">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">${iconSearch()}</span>
            <input type="text" id="searchInput" placeholder="Search clients by name, company, phone…"
              onkeyup="debouncedSearch()"
              class="w-full border border-gray-200 bg-gray-50 focus:bg-white rounded-lg pl-9 pr-3 py-2 text-[13px] outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition placeholder:text-gray-400">
          </div>
        `;
        var headerContent = searchContainer.innerHTML;
        var hamburgerIndex = headerContent.indexOf('lg:hidden');
        if (hamburgerIndex !== -1) {
          var firstDivEnd = headerContent.indexOf('</div>', hamburgerIndex) + 6;
          var before = headerContent.substring(0, firstDivEnd);
          var after = headerContent.substring(firstDivEnd);
          searchContainer.innerHTML = before + searchHtml + after;
        }
      }
    })();

    // =============================================================
    // INIT
    // =============================================================

    loadClientTypes().then(loadCustomers);

    console.log('Clients Module Loaded - API:', API_BASE, '| backend-driven pagination');

  </script>

</body>
</html>
