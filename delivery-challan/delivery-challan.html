  <script>
    // ============================================================= CONFIG
    var API_BASE = 'http://localhost:9093';
    var DS = '/api/v1/delivery-challans';
    var EMAIL_API = '/api/v1/emails/send-dc';            // body: { dcPrimeId, toEmail }
    var PRODUCT_API = '/api/products/v1/get-product-list';
    var WAREHOUSE_API = '/api/warehouses/v1/get-all-warehouses';
    var SO_API = '/api/sales-orders/sales-order-list';
    var PROJECT_API = '';                                 // TODO: set your project list API path (same one used on invoices)
    var ORG_STORAGE_KEY = 'siec_organization_id';
    var company = { name: '', address: '', gstin: '', phone: '', email: '', state: '', stateCode: '', logoUrl: '', logoData: '' };
    var DC_TYPES = [['JOB_WORK', 'Job Work'], ['SUPPLY_ON_APPROVAL', 'Supply on Approval'], ['STOCK_TRANSFER', 'Stock Transfer'],
      ['EXHIBITION_OR_FAIRS', 'Exhibition or Fairs'], ['SUPPLY_OF_LIQUID_GAS', 'Supply of Liquid Gas'], ['LINE_SALES', 'Line Sales'], ['OTHERS', 'Others']];
    function typeLabel(c) { var t = DC_TYPES.find(function (x) { return x[0] === c; }); return t ? t[1] : (c || ''); }

    var STATE_CODES = { 'jammu and kashmir': '01', 'himachal pradesh': '02', 'punjab': '03', 'chandigarh': '04', 'uttarakhand': '05', 'haryana': '06', 'delhi': '07', 'rajasthan': '08',
      'uttar pradesh': '09', 'bihar': '10', 'sikkim': '11', 'arunachal pradesh': '12', 'nagaland': '13', 'manipur': '14', 'mizoram': '15', 'tripura': '16', 'meghalaya': '17', 'assam': '18',
      'west bengal': '19', 'jharkhand': '20', 'odisha': '21', 'chhattisgarh': '22', 'madhya pradesh': '23', 'gujarat': '24', 'dadra and nagar haveli and daman and diu': '26',
      'maharashtra': '27', 'karnataka': '29', 'goa': '30', 'lakshadweep': '31', 'kerala': '32', 'tamil nadu': '33', 'puducherry': '34', 'andaman and nicobar islands': '35',
      'telangana': '36', 'andhra pradesh': '37', 'ladakh': '38' };
    function stateCodeFor(state, gstin) {
      if (/^\d{2}/.test(gstin || '')) return gstin.slice(0, 2);
      return STATE_CODES[String(state || '').trim().toLowerCase()] || '';
    }
    function toTitle(s) { return String(s || '').toLowerCase().replace(/\b\w/g, function (c) { return c.toUpperCase(); }); }
    function stateNameFor(code) {
      var k = Object.keys(STATE_CODES).find(function (n) { return STATE_CODES[n] === code; });
      return k ? toTitle(k) : '';
    }
    async function fetchLogoDataUrl(url) {
      try {
        var res = await fetch(url); if (!res.ok) return '';
        var obj = URL.createObjectURL(await res.blob());
        var img = await new Promise(function (ok, no) { var i = new Image(); i.onload = function () { ok(i); }; i.onerror = no; i.src = obj; });
        var w = Math.min(320, img.naturalWidth), h = Math.round(img.naturalHeight * w / img.naturalWidth);
        var cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(obj);
        return cv.toDataURL('image/png');
      } catch (e) { return ''; }
    }
    async function apiFetch(path, options) {
      options = options || {};
      var res;
      try { res = await fetch(API_BASE + path, options); }
      catch (e) { throw new Error('Something went wrong! Check your connection.'); }
      var isJson = (res.headers.get('content-type') || '').indexOf('application/json') !== -1;
      if (!res.ok) {
        var message = 'Something went wrong (HTTP ' + res.status + ').';
        if (isJson) { try { var b = await res.json(); message = b.message || b.error || message; } catch (e) {} }
        throw new Error(message);
      }
      if (res.status === 204) return null;
      return isJson ? res.json() : res;
    }
    async function loadOrganization() {
      var orgId = null;
      try { orgId = localStorage.getItem(ORG_STORAGE_KEY); } catch (e) {}
      if (!orgId) { showToast('Organization id not found (localStorage key: ' + ORG_STORAGE_KEY + ')', 'error'); return; }
      try {
        var o = await apiFetch('/api/organization/' + encodeURIComponent(orgId), { method: 'GET' });
        var name = o.legalName || o.companyName || '', st = o.state || o.taxState || '';
        company = {
          name: name, address: [o.address, o.city, st, o.pincode].filter(Boolean).join(', '),
          gstin: o.gstNumber || '', phone: o.phone || '', email: o.email || '',
          state: st, stateCode: stateCodeFor(st, o.gstNumber),
          logoUrl: o.logoUrl ? API_BASE + o.logoUrl : '', logoData: ''
        };
        if (company.logoUrl) company.logoData = await fetchLogoDataUrl(company.logoUrl);
      } catch (e) { showToast(e.message || 'Could not load organization details', 'error'); }
    }

    NavSidebar.init({ basePath: "", activePage: "delivery-challan", pageTitle: "Delivery Challan", user: { name: "Admin", role: "Super Admin", avatarUrl: "" } });

    // ============================================================= ICONS
    function iconPlus() { return '<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>'; }
    function iconEdit() { return '<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>'; }
    function iconTrash() { return '<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>'; }
    function iconEye() { return '<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'; }
    function iconX() { return '<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg>'; }
    function iconSave() { return '<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>'; }
    function iconDocument() { return '<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z"/><path d="M14 2v6h6"/></svg>'; }

        return '<tr class="border-b border-gray-100 table-row-hover">' +
          '<td class="px-3 py-2.5"><div class="font-semibold text-gray-800 text-sm">' + escH(d.number) + '</div><div class="text-[10px] text-gray-400 font-mono">#' + d.id + '</div></td>' +
          '<td class="px-3 py-2.5 text-xs">' + fd(d.date) + '</td><td class="px-3 py-2.5 text-sm text-gray-700">' + escH(d.customerName) + '</td>' +
          '<td class="px-3 py-2.5 text-xs">' + escH(typeLabel(d.type)) + '</td><td class="px-3 py-2.5 text-xs">' + escH(d.soNumber || '—') + '</td>' +
          '<td class="px-3 py-2.5 font-mono font-semibold text-sm">' + fm(d.total) + '</td><td class="px-3 py-2.5">' + statusBadge(d.status) + '</td>' +

        '<tr><td colspan="8" class="text-center py-10 text-gray-400 text-sm"><div class="flex justify-center mb-2 empty-icon-svg">' + iconDocument() + '</div>No delivery challans found. Try adjusting your filters or ' +
        '<button onclick="openAddDC()" class="text-primary font-semibold hover:underline">create a new delivery challan</button>.</td></tr>';

      var sizes = [10, 25, 50, 100].map(function (n) { return '<option value="' + n + '"' + (n === pageSize ? ' selected' : '') + '>' + n + '</option>'; }).join('');
      var pag = '';
      if (dcs.length) {

          '<span class="text-[10px] text-gray-500">Page ' + currentPage + ' of ' + totalPages + '</span>' +

      }
      document.getElementById('dcPanel').innerHTML = panelWrap(
        'Delivery Challans <span class="text-[10px] font-bold bg-primary-soft text-primary-dark px-2 py-0.5 rounded-full ml-1">' + totalElements + '</span>',
        tableHtml(['DC #', 'Date', 'Customer', 'Type', 'SO Reference', 'Total', 'Status', 'Actions'], rows) + pag,
        '<div class="flex items-center gap-2"><span class="text-[10px] text-gray-400">Show:</span><select onchange="changePageSize(this.value)" class="text-[10px] border border-gray-300 rounded-lg px-2 py-1 bg-white outline-none">' + sizes + '</select></div>');

        { width: 'max-w-sm' });

    async function sendViaEmail(id) {
      var d = findDc(id); if (!d) return;
      var inp = document.getElementById('f_sendEmail'), err = document.getElementById('emailSendError'), email = (inp.value || '').trim();
      if (!isValidEmail(email)) { err.textContent = 'Please enter a valid email address.'; err.classList.remove('hidden'); inp.classList.add('border-red-400'); return; }
      if (!d.pdfUrl) { showToast('No PDF stored for this delivery challan yet.', 'error'); return; }

    // ============================================================= ADD / EDIT FORM

      i = i || {};
      return '<tr class="border-b border-gray-100 line-item-row" data-pid="' + (i.pid || '') + '" data-vid="' + (i.vid || '') + '" data-name="' + escH(i.name || '') + '" data-unit="' + escH(i.unit || '') + '">' +

    function pickProduct(btn) {
      openPicker(btn, {
        fetchPage: fetchProductPage,
        render: function (o) { return '<div style="font-weight:600">' + escH(o.name) + '</div><div style="color:#9ca3af;font-size:10px">' + escH(o.sub || '') + ' · ' + Number(o.price || 0).toLocaleString('en-IN') + ' / ' + escH(o.unit || '') + '</div>'; },
        onPick: function (o) {

    function readItems() {
      var out = [];

        out.push({
          pid: r.dataset.pid ? Number(r.dataset.pid) : null, vid: r.dataset.vid ? Number(r.dataset.vid) : null, name: r.dataset.name, unit: r.dataset.unit,

    function calcDcTotal() {

      document.getElementById('f_taxInfo').textContent = (same ? 'CGST + SGST' : 'IGST') + ': ' + fm(tax) + ' (company state ' + (company.stateCode || '?') + ' vs supply state ' + (posCode || '?') + ')';

      openModal(
        modalHeader(ex ? 'Edit Delivery Challan' : 'New Delivery Challan', ex ? escH(e.number) : 'Record goods leaving your warehouse') +
        '<div class="px-5 py-4 modal-scroll">' +
        '<div class="grid grid-cols-2 md:grid-cols-4 gap-3">' +
        fld('DC #', '<input class="form-input" value="' + escH(e.number) + '" disabled>') +
        fld('Date *', '<input type="date" class="form-input" id="f_date" value="' + e.date + '">') +

        fld('Project Code', '<div style="display:flex;gap:4px"><button type="button" id="f_projectBtn" class="form-input text-left" data-code="' + escH(e.projectCode || '') + '" onclick="pickProject(this)">' + projTxt + '</button>' +
          '<button type="button" onclick="clearProject()" class="text-gray-400 hover:text-red-500" title="Clear">' + iconX() + '</button></div>') +
        fld('Place of Supply *', '<select class="form-input" id="f_pos" onchange="calcDcTotal()"><option value=""></option>' + states + '</select>', 'Decides CGST+SGST vs IGST') + '</div>' +
        '<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-2">' +
        fld('Warehouse *', '<select class="form-input" id="f_wh">' + whOpts(selWh) + '</select>', 'Stock reduces from here on dispatch') +
        '<div id="destWrap" style="display:none">' + fld('Destination Warehouse *', '<select class="form-input" id="f_destWh"><option value="">Select…</option>' + whOpts(ex ? ex.destStrId : '') + '</select>', 'Stock is added here on dispatch') + '</div>' +
        '<div class="col-span-2">' + fld('Ship To', '<textarea rows="2" class="form-input" id="f_shipTo">' + escH(ex ? (ex.shipTo || '') : (first ? (first.shipAddress || first.address) : '')) + '</textarea>') + '</div></div>' +
        '<div class="mt-3"><div class="flex items-center justify-between mb-1.5"><label class="form-label mb-0">Items</label>' +
        '<button onclick="addLineItem()" class="text-[10px] font-semibold text-primary hover:underline flex items-center gap-1">' + iconPlus() + ' Add Item</button></div>' +
        '<div class="border border-gray-200 rounded-lg overflow-x-auto"><table class="w-full text-xs"><thead class="bg-gray-50"><tr>' +
        '<th class="px-2 py-1.5 text-left">Item</th><th class="px-2 py-1.5 text-left">Description</th><th class="px-2 py-1.5 text-left">HSN</th>' +
        '<th class="px-2 py-1.5">Qty</th><th class="px-2 py-1.5">Rate</th><th class="px-2 py-1.5">GST %</th><th class="px-2 py-1.5 text-left">Serial / Batch</th><th style="width:36px"></th></tr></thead>' +
        '<tbody id="lineItemsBody">' + (e.items.length ? e.items.map(lineRowHtml).join('') : EMPTY_ROW) + '</tbody></table></div></div>' +
        '<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-3">' +
        fld('Total Amount', '<input class="form-input" id="f_total" disabled style="font-weight:bold;color:#6da84c;">', '<span id="f_taxInfo"></span>') + '</div>' +
        fld('Notes', '<textarea rows="2" class="form-input" id="f_notes">' + escH(e.notes || '') + '</textarea>') + '</div>' +
        modalFooter(ex ? 'Update Delivery Challan' : 'Save Delivery Challan', 'onclick="saveDC(\'' + (ex ? ex.id : '') + '\')"'),
        { width: 'max-w-5xl' });
      var c0 = ex ? customers.find(function (c) { return String(c.id) === String(ex.customerId); }) : first;
      refreshSoOptions(c0, e.soNumber || '');
      toggleDest();
      setTimeout(calcDcTotal, 100);
    }

    async function saveDC(existingId) {
      var g = function (i) { return document.getElementById(i).value; }, cb = document.getElementById('f_clientBtn');
      var cust = customers.find(function (c) { return String(c.id) === String(cb.dataset.id); }) || _editCust;
      var items = readItems().filter(function (i) { return i.name && i.qty > 0 && i.rate >= 0; });
      var pos = g('f_pos'), posCode = STATE_CODES[String(pos).toLowerCase()] || '', type = g('f_type');
      if (!g('f_date') || !cust) { showToast('Please fill Date and Client', 'error'); return; }
      if (!items.length) { showToast('Please add at least one item', 'error'); return; }
      if (items.some(function (i) { return !i.pid; })) { showToast('Every item must be selected from the product list', 'error'); return; }
      if (!g('f_wh')) { showToast('Please select a warehouse', 'error'); return; }
      if (type === 'STOCK_TRANSFER' && !g('f_destWh')) { showToast('Please select the destination warehouse', 'error'); return; }
      if (!company.stateCode || !posCode) { showToast('Company state or Place of Supply is missing — needed to decide the GST type', 'error'); return; }

      var dto = {
        dcDate: g('f_date'), dcType: type, dcClientPrimeId: Number(cust.id), dcClientName: cust.contactName || cust.name, dcClientCompanyName: cust.name,
        dcClientGstin: cust.gst, dcClientEmail: cust.email, dcClientState: cust.state, dcClientStateCode: cust.stateCode, dcClientCountry: cust.country,
        dcClientBillingAddress: cust.address, dcShippingAddress: g('f_shipTo'), dcCompanyStateCode: company.stateCode, dcPlaceOfSupply: pos, dcPlaceOfSupplyStateCode: posCode,
        dcSoNumber: g('f_so'), dcReferenceNumber: g('f_ref'), dcProjectCode: document.getElementById('f_projectBtn').dataset.code || '',
        dcWarehouseStrId: g('f_wh'), dcDestWarehouseStrId: type === 'STOCK_TRANSFER' ? g('f_destWh') : null, dcNotes: g('f_notes'),
        dcItems: items.map(function (i) {
          return { dcItemProductId: i.pid, dcItemVariantId: i.vid, dcItemName: i.name, dcItemDescription: i.desc, dcItemHsnCode: i.hsn, dcItemUnit: i.unit,
            dcItemQty: i.qty, dcItemRate: i.rate, dcItemGstPercent: i.gst, dcItemSerial: i.serial };
        })
      };

      var btn = document.getElementById('modalSaveBtn'), orig = btn.innerHTML; btn.disabled = true; btn.innerHTML = SPINNER + ' Saving…';
      try {
        var r;
        if (existingId) r = await apiFetch(DS + '/update/' + existingId, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(dto) });
        else {
          var f = new FormData(); f.append('dc', new Blob([JSON.stringify(dto)], { type: 'application/json' }));
          r = await apiFetch(DS + '/create', { method: 'POST', body: f });
        }
        var saved = mapDc(r);
        try { await uploadPdf(saved.id, saved); showToast('Delivery challan ' + saved.number + ' saved', 'success'); }
        catch (e) { showToast('Saved, but PDF upload failed: ' + (e.message || ''), 'warning'); }
        closeModal(); currentPage = 1; renderDC();
      } catch (err) {
        showToast(err.message || 'Could not save — please try again', 'error');
        btn.disabled = false; btn.innerHTML = orig;
      }
    }

    // ============================================================= SEARCH (topbar) + INIT
    (function addSearchToTopbar() {
      var header = document.querySelector('.app-main header');
      if (!header) return;
      var searchHtml = '<div class="hidden sm:flex flex-1 max-w-[420px] relative ml-4">' +
        '<span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">' + iconSearch() + '</span>' +
        '<input type="text" id="searchInput" placeholder="Search delivery challans by number, client, SO…" onkeyup="filterDC()" ' +
        'class="w-full border border-gray-200 bg-gray-50 focus:bg-white rounded-lg pl-9 pr-3 py-1.5 text-xs outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition placeholder:text-gray-400"></div>';
      var html = header.innerHTML, i = html.indexOf('lg:hidden');
      if (i !== -1) { var end = html.indexOf('</div>', i) + 6; header.innerHTML = html.substring(0, end) + searchHtml + html.substring(end); }
    })();

    (async function init() {
      await Promise.all([loadOrganization(), loadCustomers(), loadWarehouses(), loadSalesOrders()]);
      renderDC();
    })();
</script>
</body>
