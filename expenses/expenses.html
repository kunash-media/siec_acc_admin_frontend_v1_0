  <script>
    // =============================================================
    // NAV-SIDEBAR INIT
    // =============================================================
    NavSidebar.init({
      basePath: "",

    });

    // =============================================================
    // API CONFIG
    // =============================================================
    var API_BASE = 'http://localhost:9093/api/expenses';

    // Fetch wrapper — returns json.data on success, throws Error(message) on failure.
    function api(method, path, body) {
      var opts = { method: method };
      if (body !== undefined && body !== null) {
        opts.headers = { 'Content-Type': 'application/json' };
        opts.body = JSON.stringify(body);
      }
      return fetch(API_BASE + path, opts).then(function(res) {
        return res.text().then(function(text) {
          var json = null;
          try { json = text ? JSON.parse(text) : null; } catch (e) {}
          if (!res.ok) {
            var msg = (json && (json.message || json.error)) || ('Request failed (HTTP ' + res.status + ')');
            throw new Error(msg);
          }
          return json ? json.data : null;
        });
      }, function(err) {
        console.error('[API] network error', method, path, err);
        throw new Error('Cannot reach backend at ' + API_BASE + ' — is the server running?');
      });
    }

    // =============================================================
    // TOAST
    // =============================================================
    function showToast(message, kind) {
      kind = kind || 'success';
      var wrap = document.getElementById('toastWrap');
      var colors = { success: 'bg-green-600', info: 'bg-primary', warning: 'bg-amber-600', error: 'bg-red-600' };
      var el = document.createElement('div');
      el.className = 'toast ' + colors[kind] + ' text-white font-semibold px-3 py-2 rounded-lg shadow-lg flex items-center gap-2 max-w-xs';
      el.innerHTML = '<span>' + message + '</span>';
      wrap.appendChild(el);
      setTimeout(function() {
        el.style.transition = 'opacity .3s';
        el.style.opacity = '0';
        setTimeout(function() { el.remove(); }, 300);
      }, 2600);
    }

      var root = document.getElementById('modalRoot');

        <div class="fixed inset-0 z-[100] flex items-center justify-center p-3" id="modalOverlay">
          <div class="absolute inset-0 bg-black/40 backdrop-blur-[1px]" id="modalBackdrop"></div>
          <div class="relative bg-white rounded-xl shadow-2xl w-full ${opts.width || 'max-w-4xl'} max-h-[92vh] overflow-hidden animate-modal">
            ${innerHtml}
          </div>

    function closeModal() {
      var root = document.getElementById('modalRoot');
      root.innerHTML = '';
      document.body.style.overflow = '';
      pendingReceiptData = null;
    }

    function modalHeader(title, subtitle) {
      return `
        <div class="flex items-start justify-between px-5 py-3.5 border-b border-gray-100 sticky top-0 bg-white z-10">
          <div>
            <h3 class="modal-title text-gray-900">${title}</h3>
            ${subtitle ? '<p class="modal-subtitle mt-0.5">' + subtitle + '</p>' : ''}

          <button onclick="closeModal()" class="w-7 h-7 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-gray-700 transition">${iconX()}</button>
        </div>`;
    }

    function modalFooter(saveLabel, onSaveAttr, extraBtns, variant) {
      variant = variant || 'primary';
      var btnClass = variant === 'danger'
        ? 'bg-red-600 hover:bg-red-700'
        : 'bg-primary hover:bg-primary-dark';
      return `
        <div class="flex items-center justify-between gap-2 px-5 py-3 border-t border-gray-100 bg-gray-50 rounded-b-xl sticky bottom-0">

          <div class="flex gap-2">

              ${iconSave()} ${saveLabel}

          </div>

    function fld(label, inputHtml, hint) {
      return `
        <div class="mb-2">
          <label class="form-label">${label}</label>
          ${inputHtml}
          ${hint ? '<div class="form-hint">' + hint + '</div>' : ''}
        </div>`;
    }

    function inputBase() { return "form-input"; }

    // =============================================================
    // DROPDOWN
    // =============================================================
    document.addEventListener('click', function(e) {
      if (!e.target.closest('[data-dd-trigger]')) {
        document.querySelectorAll('[data-dd-menu]').forEach(function(m) { m.classList.add('hidden'); });
      }

    function toggleFilterDD() {
      var menu = document.getElementById('filterDD');
      var isHidden = menu.classList.contains('hidden');
      document.querySelectorAll('[data-dd-menu]').forEach(function(m) { m.classList.add('hidden'); });
      if (isHidden) menu.classList.remove('hidden');
    }

    // =============================================================
    // HELPERS
    // =============================================================
    function money(n) { return '₹' + Number(n || 0).toLocaleString('en-IN'); }

    function statusBadge(status) {
      var map = { pending: 'badge-amber', approved: 'badge-green', rejected: 'badge-red' };
      var dot = { pending: 'badge-dot-amber', approved: 'badge-dot-green', rejected: 'badge-dot-red' };
      var label = status.charAt(0).toUpperCase() + status.slice(1);
      return '<span class="badge ' + map[status] + '"><span class="badge-dot ' + dot[status] + '"></span>' + label + '</span>';
    }

    function rowActionsHtml(editFn, delFn, viewFn, approveFn, rejectFn) {
      var html = '<div class="flex gap-1">';
      if (viewFn) html += '<button onclick="' + viewFn + '" class="btn-icon-action" title="View">' + iconEye() + '</button>';
      if (approveFn) html += '<button onclick="' + approveFn + '" class="btn-icon-action primary" title="Approve">' + iconApprove() + '</button>';
      if (rejectFn) html += '<button onclick="' + rejectFn + '" class="btn-icon-action danger" title="Reject">' + iconReject() + '</button>';
      html += '<button onclick="' + editFn + '" class="btn-icon-action" title="Edit">' + iconEdit() + '</button>';
      html += '<button onclick="' + delFn + '" class="btn-icon-action danger" title="Delete">' + iconTrash() + '</button>';
      html += '</div>';
      return html;
    }

    function detailCard(label, valueHtml) {
      return `
        <div class="border border-gray-200 rounded-lg bg-white px-3.5 py-2.5">
          <div class="text-[9.5px] font-bold uppercase tracking-wider text-gray-500 mb-1">${label}</div>
          <div class="text-[12.5px] text-gray-800 break-words">${valueHtml}</div>
        </div>`;
    }

    function detailSection(icon, text) {
      return `
        <div class="flex items-center gap-2 mt-4 mb-2.5 first:mt-0">
          <span class="text-primary">${icon}</span>
          <span class="text-[10px] font-bold uppercase tracking-wider text-gray-600">${text}</span>
          <div class="flex-1 h-px bg-gray-200"></div>
        </div>`;
    }

    // =============================================================
    // STATIC LOOKUPS
    // =============================================================
    var expenseCategories = [
      'Rent', 'Salaries', 'Utilities', 'Transport & Logistics', 'Raw Materials',
      'Office Supplies', 'Marketing & Advertising', 'Travel', 'Insurance',
      'Professional Fees', 'Maintenance', 'Other'
    ];

    // Project master — replace with a backend fetch later if you wire up the project module.
       // ---- Project dropdown (API-driven, searchable, paginated) ----
    var PROJECT_API = 'http://localhost:9093/api/projects/v1/project-list';
    var projectCache = {};   // projectStrId -> project object
    var ppState = {};        // per-picker paging state
    var ppTimers = {};       // per-picker debounce timers

    function ppEsc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function projectLabel(p) { return p.projectName + ' (' + p.projectCode + ')'; }

    function getProjectName(id) {
      if (!id) return '—';
      var p = projectCache[id];
      return p ? projectLabel(p) : id;
    }

    function fetchProjects(search, page, size) {
      var qs = new URLSearchParams();
      qs.set('page', page);
      qs.set('size', size || 20);
      if (search) qs.set('search', search);
      return fetch(PROJECT_API + '?' + qs.toString()).then(function(res) {
        if (!res.ok) throw new Error('Could not load projects (HTTP ' + res.status + ')');
        return res.json();
      }).then(function(data) {
        (data.content || []).forEach(function(p) { projectCache[p.projectStrId] = p; });
        return data;
      });
    }

    function projectPickerHtml(id, value, emptyValue, emptyLabel) {
      var val = value || emptyValue;
      var label = val !== emptyValue ? getProjectName(val) : emptyLabel;
      return '<div class="relative" data-pp="' + id + '" data-empty-value="' + emptyValue + '" data-empty-label="' + emptyLabel + '">' +
        '<input type="hidden" id="' + id + '" value="' + ppEsc(val) + '">' +
        '<button type="button" class="form-input text-left flex items-center justify-between gap-2" onclick="toggleProjectPicker(\'' + id + '\')">' +
          '<span id="' + id + '_label" class="truncate">' + ppEsc(label) + '</span><span class="text-gray-400">▾</span>' +
        '</button>' +
        '<div id="' + id + '_panel" class="pp-panel hidden absolute left-0 right-0 mt-1 bg-white border border-gray-200 rounded-lg shadow-lg z-[60] p-2">' +
          '<input type="text" id="' + id + '_search" class="form-input mb-1.5" placeholder="Search name or code…" autocomplete="off" oninput="debouncedProjectSearch(\'' + id + '\')">' +
          '<div id="' + id + '_list" class="max-h-44 overflow-y-auto" onscroll="ppScroll(\'' + id + '\')"></div>' +
        '</div></div>';
    }

    function closeProjectPickers() {
      document.querySelectorAll('.pp-panel').forEach(function(p) { p.classList.add('hidden'); });
    }

    function toggleProjectPicker(id) {
      var panel = document.getElementById(id + '_panel');
      var willOpen = panel.classList.contains('hidden');
      closeProjectPickers();
      if (!willOpen) return;
      panel.classList.remove('hidden');
      var s = document.getElementById(id + '_search');
      s.value = '';
      s.focus();
      loadProjectList(id, true);
    }

    function debouncedProjectSearch(id) {
      clearTimeout(ppTimers[id]);
      ppTimers[id] = setTimeout(function() { loadProjectList(id, true); }, 350);
    }

    function ppScroll(id) {
      var list = document.getElementById(id + '_list');
      if (list.scrollTop + list.clientHeight >= list.scrollHeight - 20) loadProjectList(id, false);
    }

    function ppRow(id, value, name, code) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'w-full text-left px-2 py-1.5 rounded hover:bg-primary-soft text-[11px] flex items-center justify-between gap-2';
      var n = document.createElement('span');
      n.className = 'truncate';
      n.textContent = name;
      b.appendChild(n);
      if (code) {
        var c = document.createElement('span');
        c.className = 'font-mono text-[10px] text-gray-400 shrink-0';
        c.textContent = code;
        b.appendChild(c);
      }
      b.onclick = function() { selectProject(id, value, code ? name + ' (' + code + ')' : name); };
      return b;
    }

    function selectProject(id, value, label) {
      document.getElementById(id).value = value;
      document.getElementById(id + '_label').textContent = label;
      closeProjectPickers();
      if (id === 'filterProject') filterExpenses();
    }

    function loadProjectList(id, reset) {
      var st = reset ? (ppState[id] = { page: 0, totalPages: 1, loading: false }) : ppState[id];
      if (!st || st.loading || st.page >= st.totalPages) return;
      var list = document.getElementById(id + '_list');
      var root = document.querySelector('[data-pp="' + id + '"]');
      var search = document.getElementById(id + '_search').value.trim();
      st.loading = true;
      if (reset) {
        list.innerHTML = '';
        list.appendChild(ppRow(id, root.getAttribute('data-empty-value'), root.getAttribute('data-empty-label'), ''));
      }
      fetchProjects(search, st.page + 1).then(function(data) {
        if (ppState[id] !== st) return; // stale response
        var items = data.content || [];
        st.page = data.pageNumber || (st.page + 1);
        st.totalPages = data.totalPages || 1;
        items.forEach(function(p) { list.appendChild(ppRow(id, p.projectStrId, p.projectName, p.projectCode)); });
        if (reset && items.length === 0) {
          var empty = document.createElement('div');
          empty.className = 'text-center text-[10px] text-gray-400 py-2';
          empty.textContent = 'No projects found';
          list.appendChild(empty);
        }
      }).catch(function(err) {
        st.page = st.totalPages; // stop further paging
        showToast(err.message, 'error');
      }).then(function() { st.loading = false; });
    }

    document.addEventListener('click', function(e) {
      if (!e.target.closest('[data-pp]')) closeProjectPickers();
    });

    // =============================================================
    // STATE
    // =============================================================
    var currentPage = 1;
    var pageSize = 25;
    var sortField = 'date';
    var sortDir = 'desc';
    var selectedIds = new Set();
    var pendingReceiptData = null;

    var expenses = [];     // current page rows only (from backend)
    var pagination = null; // { page, size, totalItems, totalPages, hasNext, hasPrevious }
    var stats = null;      // { totalExpenses, totalAmount, pendingCount, approvedCount, rejectedCount }

    // =============================================================
    // LOAD FROM BACKEND
    // =============================================================
    function buildQueryString() {
      var searchInput = document.getElementById('searchInput');
      var q = searchInput ? searchInput.value.trim() : '';
      var params = new URLSearchParams();
      var cat = document.getElementById('filterCategory');
      var st  = document.getElementById('filterStatus');
      var pr  = document.getElementById('filterProject');
      var df  = document.getElementById('filterDateFrom');
      var dt  = document.getElementById('filterDateTo');

      params.set('status',   st  ? st.value  : 'all');
      params.set('category', cat ? cat.value : 'all');
      params.set('project',  pr  ? pr.value  : 'all');
      if (df && df.value) params.set('dateFrom', df.value);
      if (dt && dt.value) params.set('dateTo',   dt.value);
      if (q) params.set('search', q);
      params.set('page', currentPage);
      params.set('size', pageSize);
      params.set('sort', sortField);
      params.set('dir',  sortDir);
      return params.toString();
    }

    function loadExpenses() {
      var panel = document.getElementById('expensesPanel');
      if (panel) panel.classList.add('table-loading');

      return api('GET', '/get-all-expenses?' + buildQueryString())
        .then(function(data) {
          expenses   = (data && data.expenses)   || [];
          pagination = (data && data.pagination) || null;
          stats      = (data && data.stats)      || null;
        })
        .catch(function(err) {
          showToast(err.message, 'error');
          expenses = [];
          pagination = null;
          stats = null;
        })
        .then(function() {
          if (panel) panel.classList.remove('table-loading');
          renderExpenses();
        });
    }

    // =============================================================
    // RENDER — STATS
    // =============================================================
    function renderStats() {
      var s = stats || { totalExpenses: 0, totalAmount: 0, pendingCount: 0, approvedCount: 0, rejectedCount: 0 };
      document.getElementById('totalExpenses').textContent   = s.totalExpenses;
      document.getElementById('totalAmount').textContent     = money(s.totalAmount);
      document.getElementById('pendingExpenses').textContent = s.pendingCount;
      document.getElementById('approvedExpenses').textContent= s.approvedCount;
      document.getElementById('rejectedExpenses').textContent= s.rejectedCount;

      // filter dropdowns — populate categories + projects once
      var filterCategory = document.getElementById('filterCategory');
      var curCat = filterCategory.value;
      filterCategory.innerHTML = '<option value="all">All Categories</option>' +
        expenseCategories.map(function(c) { return '<option value="' + c + '">' + c + '</option>'; }).join('');
      filterCategory.value = curCat || 'all';

      

      updateFilterBadge();
    }

    function updateFilterBadge() {
      var count = 0;
      var cat = document.getElementById('filterCategory').value;
      var st  = document.getElementById('filterStatus').value;
      var pr  = document.getElementById('filterProject').value;
      var df  = document.getElementById('filterDateFrom').value;
      var dt  = document.getElementById('filterDateTo').value;
      if (cat !== 'all') count++;
      if (st  !== 'all') count++;
      if (pr  !== 'all') count++;
      if (df) count++;
      if (dt) count++;

      var badge = document.getElementById('filterBadge');
      if (count > 0) { badge.textContent = count; badge.classList.remove('hidden'); }
      else { badge.classList.add('hidden'); }
    }

    // =============================================================
    // SORT — server-side
    // =============================================================
    function toggleSort(field) {
      if (sortField === field) {
        sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        sortField = field;
        sortDir = 'asc';
      }
      currentPage = 1;
      loadExpenses();
    }

    function sortIcon(field) {
      if (sortField !== field) return '<span class="text-gray-300 ml-1">↕</span>';
      return sortDir === 'asc'
        ? '<span class="text-primary ml-1">↑</span>'
        : '<span class="text-primary ml-1">↓</span>';
    }

    // =============================================================
    // PAGINATION — server-driven
    // =============================================================
    function goToPage(p) {
      var tp = pagination ? pagination.totalPages : 1;
      if (p < 1 || p > tp) return;
      currentPage = p;
      loadExpenses();
    }

    function changePageSize(val) {
      pageSize = parseInt(val, 10) || 25;
      currentPage = 1;
      loadExpenses();
    }

    function renderPagination() {
      var totalItems   = pagination ? pagination.totalItems  : 0;
      var curPage      = pagination ? pagination.page         : 1;
      var sz           = pagination ? pagination.size         : pageSize;
      var totalPages   = pagination ? pagination.totalPages   : 1;
      var hasNext      = pagination ? pagination.hasNext      : false;
      var hasPrev      = pagination ? pagination.hasPrevious  : false;

      var start = totalItems === 0 ? 0 : (curPage - 1) * sz + 1;
      var end   = Math.min(curPage * sz, totalItems);

      var pageBtns = '';
      var maxBtns = 5;
      var startPage = Math.max(1, curPage - Math.floor(maxBtns / 2));
      var endPage   = Math.min(totalPages, startPage + maxBtns - 1);
      if (endPage - startPage + 1 < maxBtns) startPage = Math.max(1, endPage - maxBtns + 1);

      for (var i = startPage; i <= endPage; i++) {
        pageBtns += '<button class="pagination-btn ' + (i === curPage ? 'active' : '') + '" onclick="goToPage(' + i + ')">' + i + '</button>';
      }

      return `
        <div class="flex flex-wrap items-center justify-between gap-2 px-4 py-2.5 border-t border-gray-100 bg-gray-50">
          <div class="text-[11px] text-gray-500">
            Showing <b class="text-gray-700">${start}</b>–<b class="text-gray-700">${end}</b> of <b class="text-gray-700">${totalItems}</b>
          </div>
          <div class="flex items-center gap-1">
            <button class="pagination-btn" onclick="goToPage(1)" ${!hasPrev ? 'disabled' : ''}>«</button>
            <button class="pagination-btn" onclick="goToPage(${curPage - 1})" ${!hasPrev ? 'disabled' : ''}>‹</button>
            ${pageBtns}
            <button class="pagination-btn" onclick="goToPage(${curPage + 1})" ${!hasNext ? 'disabled' : ''}>›</button>
            <button class="pagination-btn" onclick="goToPage(${totalPages})" ${!hasNext ? 'disabled' : ''}>»</button>
          </div>
        </div>`;
    }

    // =============================================================
    // BULK ACTIONS — call backend
    // =============================================================
    function toggleSelectAll(checked) {
      expenses.forEach(function(e) {
        if (checked) selectedIds.add(e.id);
        else selectedIds.delete(e.id);
      });
      renderExpenses();
    }

    function toggleRowSelect(id, checked) {
      if (checked) selectedIds.add(id);
      else selectedIds.delete(id);
      updateBulkBar();
      updateSelectAllCheckbox();
    }

    function updateBulkBar() {
      var bar = document.getElementById('bulkBar');
      if (!bar) return;
      if (selectedIds.size === 0) { bar.classList.add('hidden'); return; }
      bar.classList.remove('hidden');
      var countEl = document.getElementById('bulkCount');
      if (countEl) countEl.textContent = selectedIds.size;
    }

    function updateSelectAllCheckbox() {
      var cb = document.getElementById('selectAllCheckbox');
      if (!cb) return;
      var allSelected = expenses.length > 0 && expenses.every(function(e) { return selectedIds.has(e.id); });
      cb.checked = allSelected;
    }

    function clearSelection() {
      selectedIds.clear();
      renderExpenses();
    }

    function bulkApprove() {
      if (selectedIds.size === 0) return;
      var ids = Array.from(selectedIds);
      api('PATCH', '/bulk-approve', { ids: ids })
        .then(function() {
          selectedIds.clear();
          showToast(ids.length + ' expense(s) approved', 'success');
          return loadExpenses();
        })
        .catch(function(err) { showToast(err.message, 'error'); });
    }

    function bulkReject() {
      if (selectedIds.size === 0) return;
      var ids = Array.from(selectedIds);
      api('PATCH', '/bulk-reject', { ids: ids })
        .then(function() {
          selectedIds.clear();
          showToast(ids.length + ' expense(s) rejected', 'warning');
          return loadExpenses();
        })
        .catch(function(err) { showToast(err.message, 'error'); });
    }

    function bulkDelete() {
      if (selectedIds.size === 0) return;
      var count = selectedIds.size;
      var modalContent = `
        ${modalHeader('Delete Expenses', count + ' selected')}
        <div class="px-5 py-4 text-sm text-gray-600">
          <div class="flex items-start gap-3 p-3.5 border border-red-200 bg-red-50 rounded-lg mb-4">
            <div class="w-9 h-9 rounded-full bg-red-100 text-red-600 flex items-center justify-center shrink-0">
              ${iconTrash()}
            </div>
            <div>
              <p class="font-semibold text-red-700">This action cannot be undone</p>
              <p class="text-[11px] text-red-600 mt-0.5">All selected expense records will be permanently removed.</p>
            </div>
          </div>
          <p class="text-[12px]">Are you sure you want to delete <b class="text-gray-900">${count}</b> expense(s)?</p>
        </div>
        ${modalFooter('Delete All', 'onclick="confirmBulkDelete()"', '', 'danger')}
      `;
      openModal(modalContent, { width: 'max-w-md' });
    }

    function confirmBulkDelete() {
      var ids = Array.from(selectedIds);
      api('PATCH', '/bulk-delete', { ids: ids })
        .then(function() {
          selectedIds.clear();
          closeModal();
          showToast(ids.length + ' expense(s) deleted', 'warning');
          return loadExpenses();
        })
        .catch(function(err) { showToast(err.message, 'error'); });
    }

    // =============================================================
    // EXPORT CSV — uses current page rows
    // =============================================================
    function exportExpensesCSV() {
      if (expenses.length === 0) {
        showToast('No expenses on this page to export', 'warning');
        return;
      }
      var headers = ['Expense ID', 'Date', 'Category', 'Description', 'Amount', 'Tax %', 'Tax Amount', 'Total', 'Vendor', 'Payment Account', 'Project', 'Status', 'Notes'];
      var rows = expenses.map(function(e) {
        var taxAmt = Number(e.taxAmount != null ? e.taxAmount : (e.amount * (e.tax || 0)) / 100);
        var total  = Number(e.total != null ? e.total : (Number(e.amount) + taxAmt));
        return [
          e.id, e.date, e.category, e.description, e.amount,
          (e.tax || 0) + '%', taxAmt.toFixed(2), total.toFixed(2),
          e.vendor || '', e.paymentAccount || '', getProjectName(e.projectId),
          e.status, e.notes || ''
        ];
      });
      var csvContent = [headers].concat(rows).map(function(row) {
        return row.map(function(cell) {
          var s = String(cell == null ? '' : cell);
          if (s.indexOf(',') !== -1 || s.indexOf('"') !== -1 || s.indexOf('\n') !== -1) {
            s = '"' + s.replace(/"/g, '""') + '"';
          }
          return s;
        }).join(',');
      }).join('\n');

      var blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'expenses_page' + (pagination ? pagination.page : 1) + '_' + new Date().toISOString().split('T')[0] + '.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Exported ' + expenses.length + ' expense(s) to CSV', 'success');
    }

    // =============================================================
    // RECEIPT UPLOAD
    // =============================================================
    function handleReceiptUpload(input) {
  var file = input.files && input.files[0];
  if (!file) return;

  if (file.size > 5 * 1024 * 1024) {
    showToast('Receipt file must be under 5MB', 'error');
    input.value = '';
    return;
  }
  if (!file.type.startsWith('image/')) {
    showToast('Please upload an image file', 'error');
    input.value = '';
    return;
  }

  // Upload immediately and keep the returned URL (NOT base64)
  var form = new FormData();
  form.append('file', file);

  fetch(API_BASE + '/upload-receipt', { method: 'POST', body: form })
    .then(function(res) {
      return res.text().then(function(text) {
        var json = null;
        try { json = JSON.parse(text); } catch (e) {}
        if (!res.ok) {
          throw new Error((json && json.message) || ('Upload failed (HTTP ' + res.status + ')'));
        }
        return json ? json.data : null;
      });
    })
    .then(function(data) {
      var url = data && data.url ? data.url : null;
      if (!url) throw new Error('Upload succeeded but no URL was returned');

      pendingReceiptData = url;   // ← URL string, not base64

      var wrap = document.getElementById('receiptPreviewWrap');

    function updateTaxSummary() {
      var amountEl = document.getElementById('f_amount');
      var taxEl = document.getElementById('f_tax');
      if (!amountEl || !taxEl) return;
      var amount = parseFloat(amountEl.value) || 0;
      var taxPct = parseInt(taxEl.value, 10) || 0;
      var taxAmt = (amount * taxPct) / 100;
      var total  = amount + taxAmt;
      var subEl = document.getElementById('taxSubtotal');
      var taxAmtEl = document.getElementById('taxAmount');
      var totalEl = document.getElementById('taxTotal');
      if (subEl) subEl.textContent = money(amount);
      if (taxAmtEl) taxAmtEl.textContent = money(taxAmt) + ' (' + taxPct + '%)';
      if (totalEl) totalEl.textContent = money(total);
    }

    function applyQuickRange(range) {
      var from = document.getElementById('filterDateFrom');
      var to   = document.getElementById('filterDateTo');
      var today = new Date();
      var y = today.getFullYear();
      var m = today.getMonth();

      if (range === 'this_month') {
        from.value = new Date(y, m, 1).toISOString().split('T')[0];
        to.value   = new Date(y, m + 1, 0).toISOString().split('T')[0];
      } else if (range === 'last_month') {
        from.value = new Date(y, m - 1, 1).toISOString().split('T')[0];
        to.value   = new Date(y, m, 0).toISOString().split('T')[0];
      } else if (range === 'this_quarter') {
        var qStart = Math.floor(m / 3) * 3;
        from.value = new Date(y, qStart, 1).toISOString().split('T')[0];
        to.value   = new Date(y, qStart + 3, 0).toISOString().split('T')[0];
      } else if (range === 'this_year') {
        from.value = new Date(y, 0, 1).toISOString().split('T')[0];
        to.value   = new Date(y, 11, 31).toISOString().split('T')[0];
      }
      currentPage = 1;
      loadExpenses();
    }

      document.getElementById('filterCategory').value = 'all';

      document.getElementById('filterProject').value = 'all';

      if (dTo)   dTo.value = '';
      if (qr)    qr.value = '';
      var searchInput = document.getElementById('searchInput');
      if (searchInput) searchInput.value = '';
      currentPage = 1;
      selectedIds.clear();
      loadExpenses();
      toggleFilterDD();
    }

    // =============================================================
    // SAVE (create / update)
    // =============================================================
    function saveExpense(existingId) {
      var date         = document.getElementById('f_date').value;
      var category     = document.getElementById('f_category').value;
      var amount       = parseFloat(document.getElementById('f_amount').value) || 0;
      var tax          = parseFloat(document.getElementById('f_tax').value) || 0;
      var description  = document.getElementById('f_description').value.trim();
      var vendor       = document.getElementById('f_vendor').value.trim() || null;
      var paymentAccount = document.getElementById('f_account').value;
      var status       = document.getElementById('f_status').value;
      var projectId    = document.getElementById('f_project').value || null;
      var notes        = document.getElementById('f_notes').value.trim() || null;

      if (!date || !category || !description || amount <= 0) {
        showToast('Please fill all required fields (Date, Category, Description, Amount)', 'error');
        return;
      }

      var body = {
        date: date,
        category: category,
        description: description,
        amount: amount,
        tax: tax,
        vendor: vendor,
        paymentAccount: paymentAccount,
        status: status,
        projectId: projectId,
        notes: notes,
        receipt: pendingReceiptData
      };

      var request = existingId
        ? api('PATCH', '/update-expense/' + encodeURIComponent(existingId), body)
        : api('POST',  '/create-expense', body);

      request
        .then(function() {
          pendingReceiptData = null;
          closeModal();
          showToast(existingId ? 'Expense updated successfully' : 'Expense created successfully', 'success');
          return loadExpenses();
        })
        .catch(function(err) { showToast(err.message, 'error'); });
    }

          return loadExpenses();
        })
        .catch(function(err) { showToast(err.message, 'error'); });
    }

    // =============================================================
    // KEYBOARD SHORTCUTS
    // =============================================================
    document.addEventListener('keydown', function(ev) {
      if (ev.key === 'Escape') {
        var modal = document.getElementById('modalRoot');
        if (modal && modal.innerHTML.trim() !== '') closeModal();
        var dd = document.getElementById('filterDD');
        if (dd) dd.classList.add('hidden');
      }
    });

    // =============================================================
    // SEARCH IN TOPBAR
    // =============================================================
    (function addSearchToTopbar() {
      var searchContainer = document.querySelector('.app-main header');
      if (searchContainer) {
        var searchHtml = `
          <div class="hidden sm:flex flex-1 max-w-[420px] relative ml-4">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">${iconSearch()}</span>
            <input type="text" id="searchInput" placeholder="Search expenses by description, category, vendor…"
              onkeyup="debouncedSearch()"
              class="w-full border border-gray-200 bg-gray-50 focus:bg-white rounded-lg pl-9 pr-3 py-1.5 text-xs outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition placeholder:text-gray-400">
          </div>
        `;
        var headerContent = searchContainer.innerHTML;
        var hamburgerIndex = headerContent.indexOf('lg:hidden');
        if (hamburgerIndex !== -1) {
          var firstDivEnd = headerContent.indexOf('</div>', hamburgerIndex) + 6;
          var before = headerContent.substring(0, firstDivEnd);
          var after  = headerContent.substring(firstDivEnd);
          searchContainer.innerHTML = before + searchHtml + after;
        }
      }
    })();

    var searchDebounceTimer = null;
    function debouncedSearch() {
      if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(function() {
        currentPage = 1;
        loadExpenses();
      }, 350);
    }

    // =============================================================
    // INIT — first backend call
    // =============================================================
    document.getElementById('filterProjectWrap').innerHTML = projectPickerHtml('filterProject', 'all', 'all', 'All Projects');

    // Prefetch projects so table rows show "name (code)" instead of the raw ID
    fetchProjects('', 1, 100).catch(function() {}).then(loadExpenses);

    console.log('💰 Expense Module Loaded — backend-driven');
    console.log('   API:', API_BASE);
    console.log('   Endpoints: get-all-expenses, get-expense, create-expense, update-expense, delete-expense, bulk-*, approve-expense, reject-expense');
  </script>

</body>
</html>
