<style>
  body {
    font-size: 12px;
    background: #f3f4f6;
  }

  .form-input {
    width: 100%;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 11px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    background: #fafafa;
    color: #1a1a2e;
  }
  .form-input:focus {
    border-color: #6da84c;
    box-shadow: 0 0 0 3px rgba(109, 168, 76, 0.12);
    background: #ffffff;
  }
  .form-input:disabled {
    background: #f3f4f6;
    cursor: not-allowed;
  }

  .form-label {
    font-size: 10px;
    font-weight: 600;
    color: #374151;
    display: block;
    margin-bottom: 3px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .form-label .required { color: #ef4444; margin-left: 2px; }
  .form-hint { font-size: 9.5px; color: #9ca3af; margin-top: 2px; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 12px;
  }
  .badge-green { background: #dcfce7; color: #166534; }
  .badge-amber { background: #fef3c7; color: #92400e; }
  .badge-red { background: #fee2e2; color: #991b1b; }
  .badge-gray { background: #f1f5f9; color: #475569; }
  .badge-blue { background: #dbeafe; color: #1e40af; }
  .badge-purple { background: #ede9fe; color: #5b21b6; }
  .badge-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    display: inline-block;
  }
  .badge-dot-green { background: #22c55e; }
  .badge-dot-amber { background: #f59e0b; }
  .badge-dot-red { background: #ef4444; }
  .badge-dot-gray { background: #94a3b8; }
  .badge-dot-blue { background: #3b82f6; }
  .badge-dot-purple { background: #8b5cf6; }

  .stat-card {
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    padding: 10px 14px !important;
  }
  .stat-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
  }
  .stat-card .stat-label {
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #6b7280;
  }
  .stat-card .stat-value {
    font-size: 17px;
    font-weight: 700;
    color: #1a1a2e;
    margin-top: 2px;
  }

  .table-row-hover:hover {
    background: #f8fafc;
  }

  .btn-icon-action {
    transition: all 0.15s ease;
    width: 28px;
    height: 28px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #94a3b8;
    background: transparent;
    border: none;
    cursor: pointer;
  }
  .btn-icon-action:hover {
    background: #f1f5f9;
    color: #6da84c;
  }
  .btn-icon-action.danger:hover {
    background: #fee2e2;
    color: #ef4444;
  }
  .btn-icon-action.primary:hover {
    background: #eef5e8;
    color: #6da84c;
  }

  .toast {
    animation: fadeIn 0.2s ease;
    font-size: 12px;
  }
  .toast-success { background: #16a34a; }
  .toast-error { background: #dc2626; }
  .toast-warning { background: #f59e0b; }
  .toast-info { background: #6da84c; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.96) translateY(6px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .animate-modal { animation: modalIn 0.18s ease; }

  .modal-scroll {
    max-height: 55vh;
    overflow-y: auto;
  }
  .modal-scroll::-webkit-scrollbar {
    width: 4px;

  .modal-scroll::-webkit-scrollbar-thumb {

  .empty-icon-svg {

  .page-title {

  .page-subtitle {
    font-size: 12px;

  .page-breadcrumb {
    font-size: 10px;

    text-transform: uppercase;

  table th {

  table td {

  .filter-btn {

  .receipt-preview {
    max-width: 80px;

    border-radius: 4px;

</style>

<body class="bg-gray-50 text-gray-800 antialiased text-sm">

  <div class="flex min-h-screen">
    <div id="sidebar-root"></div>

    <div class="app-main flex-1 flex flex-col min-w-0">

      <main class="p-3 sm:p-4 lg:p-5">

        <div id="toastWrap" class="fixed bottom-5 right-5 z-[200] flex flex-col gap-2 items-end"></div>
        <div id="modalRoot"></div>

        <div class="max-w-7xl mx-auto">

          <!-- ===== PAGE HEADER ===== -->
          <div class="flex flex-wrap items-start justify-between gap-3 mb-4">
            <div>
              <div class="page-breadcrumb">Finance</div>

            <div class="flex gap-2 flex-wrap">
              <div class="relative inline-block" data-dd-trigger>
                <button onclick="toggleFilterDD()" class="filter-btn inline-flex items-center gap-1.5 bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 font-semibold rounded-lg transition">

                    <path d="M3 6h18M7 12h10M11 18h2"/>
                  </svg>
                  Filter
                  <span id="filterBadge" class="hidden text-[9px] bg-primary text-white px-1.5 py-0.5 rounded-full">0</span>
                </button>
                <div id="filterDD" data-dd-menu class="hidden absolute top-full left-0 mt-2 w-56 bg-white border border-gray-200 rounded-xl shadow-lg p-3 z-50">
                  <div class="mb-2">
                    <label class="text-[9px] font-semibold text-gray-500 uppercase tracking-wide">Category</label>
                    <select id="filterCategory" onchange="filterExpenses()" class="form-input text-[10px]">
                      <option value="all">All Categories</option>
                    </select>
                  </div>
                  <div class="mb-2">
                    <label class="text-[9px] font-semibold text-gray-500 uppercase tracking-wide">Status</label>
                    <select id="filterStatus" onchange="filterExpenses()" class="form-input text-[10px]">
                      <option value="all">All Status</option>
                      <option value="pending">Pending</option>
                      <option value="approved">Approved</option>
                      <option value="rejected">Rejected</option>
                    </select>
                  </div>
                  <div class="mb-2">
                    <label class="text-[9px] font-semibold text-gray-500 uppercase tracking-wide">Project</label>
                    <select id="filterProject" onchange="filterExpenses()" class="form-input text-[10px]">
                      <option value="all">All Projects</option>
                    </select>
                  </div>
                  <button onclick="clearFilters()" class="text-[10px] text-primary font-semibold hover:underline">Clear Filters</button>
                </div>
              </div>

              <button onclick="openAddExpense()" class="inline-flex items-center gap-1.5 bg-primary hover:bg-primary-dark text-white text-[11px] font-semibold px-3 py-2 rounded-lg transition shadow-sm">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <path d="M12 5v14M5 12h14"/>
                </svg>
                New Expense
              </button>
            </div>
          </div>

          <!-- ===== STATS CARDS ===== -->
          <div class="grid grid-cols-2 md:grid-cols-5 gap-2.5 mb-4">
            <div class="bg-white border border-gray-200 rounded-xl shadow-sm stat-card">
              <div class="stat-label">Total</div>
              <div class="stat-value" id="totalExpenses">0</div>
            </div>
            <div class="bg-white border border-gray-200 rounded-xl shadow-sm stat-card">
              <div class="stat-label">Total Amount</div>
              <div class="stat-value text-primary" id="totalAmount">₹0</div>
            </div>
            <div class="bg-white border border-gray-200 rounded-xl shadow-sm stat-card">
              <div class="stat-label">Pending</div>
              <div class="stat-value text-amber-600" id="pendingExpenses">0</div>
            </div>
            <div class="bg-white border border-gray-200 rounded-xl shadow-sm stat-card">
              <div class="stat-label">Approved</div>
              <div class="stat-value text-green-600" id="approvedExpenses">0</div>
            </div>
            <div class="bg-white border border-gray-200 rounded-xl shadow-sm stat-card">
              <div class="stat-label">Rejected</div>
              <div class="stat-value text-red-600" id="rejectedExpenses">0</div>
            </div>
          </div>

          <!-- ===== EXPENSES TABLE ===== -->
          <div id="expensesPanel"></div>

        </div>
      </main>
    </div>
  </div>

  <!-- ========================================================== -->
  <!-- SCRIPTS -->
  <!-- ========================================================== -->

  <script src="/assets/js/nav-sidebar.js"></script>
  <script>
    // =============================================================
    // NAV-SIDEBAR INIT
    // =============================================================
    NavSidebar.init({
      basePath: "",
      activePage: "expenses",
      pageTitle: "Expenses",
      user: {
        name: "Admin",
        role: "Super Admin",
        avatarUrl: "",
      },
    });

    // =============================================================
    // SVG ICONS
    // =============================================================
    function iconPlus() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>`;
    }
    function iconEdit() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>`;
    }
    function iconTrash() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>`;
    }
    function iconEye() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    }
    function iconX() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg>`;
    }
    function iconFilter() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M7 12h10M11 18h2"/></svg>`;
    }
    function iconSave() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>`;
    }
    function iconInfo() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 3"/></svg>`;
    }
    function iconDocument() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z"/><path d="M14 2v6h6"/></svg>`;
    }
    function iconSearch() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>`;
    }
    function iconWallet() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18v11a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/><path d="M17 7V5a2 2 0 00-2-2H9a2 2 0 00-2 2v2"/><path d="M15 14h.01"/></svg>`;
    }
    function iconApprove() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>`;
    }
    function iconReject() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>`;
    }
    function iconAttach() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>`;
    }

    // =============================================================
    // TOAST
    // =============================================================
    function showToast(message, kind) {
      kind = kind || 'success';
      var wrap = document.getElementById('toastWrap');
      var colors = {
        success: 'bg-green-600',
        info: 'bg-primary',
        warning: 'bg-amber-600',
        error: 'bg-red-600'
      };
      var el = document.createElement('div');
      el.className = 'toast ' + colors[kind] + ' text-white font-semibold px-3 py-2 rounded-lg shadow-lg flex items-center gap-2 max-w-xs';
      el.innerHTML = '<span>' + message + '</span>';
      wrap.appendChild(el);
      setTimeout(function() {
        el.style.transition = 'opacity .3s';
        el.style.opacity = '0';
        setTimeout(function() { el.remove(); }, 300);
      }, 2600);
    }

    // =============================================================
    // MODAL
    // =============================================================
    function openModal(innerHtml, opts) {
      opts = opts || {};
      var root = document.getElementById('modalRoot');
      root.innerHTML = `
        <div class="fixed inset-0 z-[100] flex items-center justify-center p-3" id="modalOverlay">
          <div class="absolute inset-0 bg-black/40 backdrop-blur-[1px]" id="modalBackdrop"></div>
          <div class="relative bg-white rounded-xl shadow-2xl w-full ${opts.width || 'max-w-4xl'} max-h-[92vh] overflow-hidden animate-modal">
            ${innerHtml}
          </div>
        </div>`;
      document.getElementById('modalBackdrop').addEventListener('click', closeModal);
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      var root = document.getElementById('modalRoot');
      root.innerHTML = '';
      document.body.style.overflow = '';
    }

    function modalHeader(title, subtitle) {
      return `
        <div class="flex items-start justify-between px-5 py-3.5 border-b border-gray-100 sticky top-0 bg-white z-10">
          <div>
            <h3 class="modal-title text-gray-900">${title}</h3>
            ${subtitle ? '<p class="modal-subtitle mt-0.5">' + subtitle + '</p>' : ''}
          </div>
          <button onclick="closeModal()" class="w-7 h-7 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-gray-700 transition">${iconX()}</button>
        </div>`;
    }

    function modalFooter(saveLabel, onSaveAttr, extraBtns) {
      return `
        <div class="flex items-center justify-between gap-2 px-5 py-3 border-t border-gray-100 bg-gray-50 rounded-b-xl sticky bottom-0">
          <div>${extraBtns || ''}</div>
          <div class="flex gap-2">
            <button onclick="closeModal()" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-600 border border-gray-200 hover:bg-white transition">Cancel</button>
            <button ${onSaveAttr} class="px-3 py-1.5 rounded-lg text-xs font-semibold text-white bg-primary hover:bg-primary-dark transition shadow-sm flex items-center gap-1.5">
              ${iconSave()} ${saveLabel}
            </button>
          </div>
        </div>`;
    }

    function fld(label, inputHtml, hint) {
      return `
        <div class="mb-2">
          <label class="form-label">${label}</label>
          ${inputHtml}
          ${hint ? '<div class="form-hint">' + hint + '</div>' : ''}
        </div>`;
    }

    function inputBase() { return "form-input"; }

    // =============================================================
    // DROPDOWN
    // =============================================================
    document.addEventListener('click', function(e) {
      if (!e.target.closest('[data-dd-trigger]')) {
        document.querySelectorAll('[data-dd-menu]').forEach(function(m) { m.classList.add('hidden'); });
      }
    });

    function toggleFilterDD() {
      var menu = document.getElementById('filterDD');
      var isHidden = menu.classList.contains('hidden');
      document.querySelectorAll('[data-dd-menu]').forEach(function(m) { m.classList.add('hidden'); });
      if (isHidden) menu.classList.remove('hidden');
    }

    // =============================================================
    // HELPERS
    // =============================================================
    function money(n) { return '₹' + Number(n).toLocaleString('en-IN'); }

    function statusBadge(status) {
      var map = {
        pending: 'badge-amber',
        approved: 'badge-green',
        rejected: 'badge-red'
      };
      var dot = {
        pending: 'badge-dot-amber',
        approved: 'badge-dot-green',
        rejected: 'badge-dot-red'
      };
      var label = status.charAt(0).toUpperCase() + status.slice(1);
      return '<span class="badge ' + map[status] + '"><span class="badge-dot ' + dot[status] + '"></span>' + label + '</span>';
    }

    function rowActionsHtml(editFn, delFn, viewFn, approveFn, rejectFn) {
      var html = '<div class="flex gap-1">';
      if (viewFn) {
        html += '<button onclick="' + viewFn + '" class="btn-icon-action" title="View">' + iconEye() + '</button>';
      }
      if (approveFn) {
        html += '<button onclick="' + approveFn + '" class="btn-icon-action primary" title="Approve">' + iconApprove() + '</button>';
      }
      if (rejectFn) {
        html += '<button onclick="' + rejectFn + '" class="btn-icon-action danger" title="Reject">' + iconReject() + '</button>';
      }
      html += '<button onclick="' + editFn + '" class="btn-icon-action" title="Edit">' + iconEdit() + '</button>';
      html += '<button onclick="' + delFn + '" class="btn-icon-action danger" title="Delete">' + iconTrash() + '</button>';
      html += '</div>';
      return html;
    }

    function panelWrap(titleHtml, bodyHtml, extraHead) {
      return `
        <div class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
          <div class="flex items-center justify-between gap-3 flex-wrap px-4 py-2.5 border-b border-gray-100">
            <div class="font-semibold text-sm text-gray-800 flex items-center gap-2">${titleHtml}</div>
            ${extraHead || ''}
          </div>
          <div>${bodyHtml}</div>
        </div>`;
    }

    function tableHtml(cols, rowsHtml) {
      var colHeaders = cols.map(function(c) {
        return '<th class="text-left font-semibold whitespace-nowrap">' + c + '</th>';
      }).join('');
      return `
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead>
              <tr class="bg-gray-50 border-b border-gray-200">${colHeaders}</tr>
            </thead>
            <tbody id="tbody-anchor">${rowsHtml}</tbody>
          </table>
        </div>`;
    }

    // =============================================================
    // DATA
    // =============================================================

    var expenseCategories = [
      'Rent',
      'Salaries',
      'Utilities',
      'Transport & Logistics',
      'Raw Materials',
      'Office Supplies',
      'Marketing & Advertising',
      'Travel',
      'Insurance',
      'Professional Fees',
      'Maintenance',
      'Other'
    ];

    var projects = [
      { id: 'PRJ-001', name: 'Operation & Supervision — WHE' },
      { id: 'PRJ-002', name: 'Odor Control Unit — Retrofit' },
      { id: 'PRJ-003', name: 'Dual Media Filter — Phase II' },
    ];

    var vendors = [

    // =============================================================
    // FUNCTIONS
    // =============================================================

    function getProjectName(id) {
      if (!id) return '—';
      var p = projects.find(function(x) { return x.id === id; });
      return p ? p.name : id;
    }

    function renderStats() {
      var total = expenses.length;
      var totalAmt = expenses.reduce(function(sum, e) { return sum + e.amount; }, 0);
      var pending = expenses.filter(function(e) { return e.status === 'pending'; }).length;
      var approved = expenses.filter(function(e) { return e.status === 'approved'; }).length;
      var rejected = expenses.filter(function(e) { return e.status === 'rejected'; }).length;

      document.getElementById('totalExpenses').textContent = total;
      document.getElementById('totalAmount').textContent = money(totalAmt);
      document.getElementById('pendingExpenses').textContent = pending;
      document.getElementById('approvedExpenses').textContent = approved;
      document.getElementById('rejectedExpenses').textContent = rejected;

      // Update filter dropdowns
      var filterCategory = document.getElementById('filterCategory');
      var currentCat = filterCategory.value;
      filterCategory.innerHTML = '<option value="all">All Categories</option>';
      expenseCategories.forEach(function(c) {
        filterCategory.innerHTML += '<option value="' + c + '">' + c + '</option>';
      });
      filterCategory.value = currentCat;

      var filterProject = document.getElementById('filterProject');
      var currentProj = filterProject.value;
      filterProject.innerHTML = '<option value="all">All Projects</option>';
      projects.forEach(function(p) {
        filterProject.innerHTML += '<option value="' + p.id + '">' + p.name + '</option>';
      });
      filterProject.value = currentProj;
    }

    function getFilteredExpenses() {
      var searchInput = document.getElementById('searchInput');
      var q = searchInput ? searchInput.value.toLowerCase() : '';
      var category = document.getElementById('filterCategory').value || 'all';
      var status = document.getElementById('filterStatus').value || 'all';
      var project = document.getElementById('filterProject').value || 'all';

      return expenses.filter(function(e) {
        var matchSearch = e.description.toLowerCase().indexOf(q) !== -1 ||
          e.id.toLowerCase().indexOf(q) !== -1 ||
          e.category.toLowerCase().indexOf(q) !== -1 ||
          (e.vendor && e.vendor.toLowerCase().indexOf(q) !== -1);
        var matchCategory = category === 'all' || e.category === category;
        var matchStatus = status === 'all' || e.status === status;
        var matchProject = project === 'all' || e.projectId === project || (!e.projectId && project === 'null');
        return matchSearch && matchCategory && matchStatus && matchProject;
      });
    }

    function renderExpenses() {
      var filtered = getFilteredExpenses();

      var rowsHtml = '';
      if (filtered.length === 0) {
        rowsHtml = `
          <tr>
            <td colspan="8" class="text-center py-10 text-gray-400 text-sm">
              <div class="flex justify-center mb-2 empty-icon-svg">${iconWallet()}</div>
              No expenses found. Try adjusting your filters or
              <button onclick="openAddExpense()" class="text-primary font-semibold hover:underline">create a new expense</button>.
            </td>
          </tr>`;
      } else {
        rowsHtml = filtered.map(function(e) {
          var canApprove = e.status === 'pending';
          var canReject = e.status === 'pending';
          return `
            <tr class="border-b border-gray-100 table-row-hover">
              <td class="px-3 py-2.5">
                <div class="font-semibold text-gray-800 text-sm">${e.id}</div>
                <div class="text-[10px] text-gray-400">${e.date}</div>
              </td>
              <td class="px-3 py-2.5 text-sm text-gray-700">${e.category}</td>
              <td class="px-3 py-2.5 text-sm text-gray-600">${e.description}</td>
              <td class="px-3 py-2.5 font-mono font-semibold text-primary">${money(e.amount)}</td>
              <td class="px-3 py-2.5 text-xs">${e.vendor || '—'}</td>
              <td class="px-3 py-2.5 text-[10px] text-gray-500 max-w-[100px] truncate" title="${getProjectName(e.projectId)}">${getProjectName(e.projectId)}</td>
              <td class="px-3 py-2.5">${statusBadge(e.status)}</td>
              <td class="px-3 py-2.5">${rowActionsHtml(
                "editExpense('"+e.id+"')",
                "delExpense('"+e.id+"')",
                "viewExpense('"+e.id+"')",
                canApprove ? "approveExpense('"+e.id+"')" : null,
                canReject ? "rejectExpense('"+e.id+"')" : null
              )}</td>
            </tr>`;
        }).join('');
      }

      var panelHtml = panelWrap(
        'Expenses <span class="text-[10px] font-bold bg-primary-soft text-primary-dark px-2 py-0.5 rounded-full ml-1">' + filtered.length + '</span>',
        tableHtml(['Expense ID', 'Category', 'Description', 'Amount', 'Vendor', 'Project', 'Status', 'Actions'], rowsHtml),
        '<div class="flex items-center gap-2"><span class="text-[10px] text-gray-400">Show:</span><select id="pageSizeSelect" onchange="renderExpenses()" class="text-[10px] border border-gray-200 rounded-lg px-2 py-1 bg-white outline-none"><option value="10">10</option><option value="25" selected>25</option><option value="50">50</option><option value="100">100</option></select></div>'
      );

      document.getElementById('expensesPanel').innerHTML = panelHtml;
      renderStats();
    }

    function filterExpenses() { renderExpenses(); }

    function clearFilters() {
      document.getElementById('filterCategory').value = 'all';
      document.getElementById('filterStatus').value = 'all';
      document.getElementById('filterProject').value = 'all';
      var searchInput = document.getElementById('searchInput');
      if (searchInput) searchInput.value = '';
      renderExpenses();
      toggleFilterDD();
    }

    // =============================================================
    // VIEW EXPENSE
    // =============================================================

    function viewExpense(id) {
      var e = expenses.find(function(x) { return x.id === id; });
      if (!e) return;

      var modalContent = `
        ${modalHeader('Expense Details', e.id)}
        <div class="px-5 py-4">
          <div class="grid grid-cols-2 gap-3 text-sm">
            <div><span class="text-gray-500">Date</span><br><span class="font-semibold">${e.date}</span></div>
            <div><span class="text-gray-500">Category</span><br><span class="font-semibold">${e.category}</span></div>
            <div><span class="text-gray-500">Amount</span><br><span class="font-semibold text-primary">${money(e.amount)}</span></div>
            <div><span class="text-gray-500">Status</span><br>${statusBadge(e.status)}</div>
            <div><span class="text-gray-500">Vendor/Payee</span><br><span class="font-semibold">${e.vendor || '—'}</span></div>
            <div><span class="text-gray-500">Payment Account</span><br><span class="font-semibold">${e.paymentAccount || '—'}</span></div>
            <div><span class="text-gray-500">Tax</span><br><span class="font-semibold">${e.tax || 0}%</span></div>
            <div><span class="text-gray-500">Project</span><br><span class="font-semibold">${getProjectName(e.projectId)}</span></div>
            <div class="col-span-2"><span class="text-gray-500">Description</span><br><span class="font-semibold">${e.description}</span></div>
            ${e.notes ? `<div class="col-span-2"><span class="text-gray-500">Notes</span><br><span class="text-sm">${e.notes}</span></div>` : ''}
            ${e.receipt ? `<div class="col-span-2"><span class="text-gray-500">Receipt</span><br><img src="${e.receipt}" class="receipt-preview mt-1" alt="Receipt"></div>` : ''}
          </div>
        </div>
        ${modalFooter('Close', 'onclick="closeModal()"')}
      `;

      openModal(modalContent, { width: 'max-w-lg' });
    }

    // =============================================================
    // ADD / EDIT EXPENSE
    // =============================================================

    function openAddExpense() { openExpenseModal(null); }

    function editExpense(id) {
      var e = expenses.find(function(x) { return x.id === id; });
      if (e) openExpenseModal(e);
    }

    function openExpenseModal(existing) {
      var e = existing || {
        date: new Date().toISOString().split('T')[0],
        category: expenseCategories[0],
        amount: '',
        description: '',
        vendor: '',
        paymentAccount: 'Bank',
        tax: 0,
        status: 'pending',
        projectId: '',
        notes: '',
        receipt: null
      };
      var isEdit = !!existing;

      var modalContent = `
        ${modalHeader(isEdit ? 'Edit Expense' : 'New Expense', isEdit ? e.id : 'Record a new business expense')}
        <div class="px-5 py-4 modal-scroll">
          <div class="grid grid-cols-2 gap-3">
            ${fld('Date *', '<input type="date" class="form-input" id="f_date" value="' + e.date + '">')}
            ${fld('Category *', '<select class="form-input" id="f_category">' + expenseCategories.map(function(c) { return '<option ' + (c === e.category ? 'selected' : '') + '>' + c + '</option>'; }).join('') + '</select>')}
            ${fld('Amount (₹) *', '<input type="number" class="form-input" id="f_amount" value="' + e.amount + '" placeholder="0.00" step="0.01">')}
            ${fld('Tax Rate (%)', '<select class="form-input" id="f_tax"><option ' + (e.tax == 0 ? 'selected' : '') + '>0</option><option ' + (e.tax == 5 ? 'selected' : '') + '>5</option><option ' + (e.tax == 12 ? 'selected' : '') + '>12</option><option ' + (e.tax == 18 ? 'selected' : '') + '>18</option><option ' + (e.tax == 28 ? 'selected' : '') + '>28</option></select>')}
          </div>
          ${fld('Description *', '<input type="text" class="form-input" id="f_description" value="' + (e.description || '') + '" placeholder="Brief description">')}
          <div class="grid grid-cols-2 gap-3">
            ${fld('Vendor / Payee', '<input type="text" class="form-input" id="f_vendor" value="' + (e.vendor || '') + '" placeholder="Vendor name">')}
            ${fld('Payment Account', '<select class="form-input" id="f_account"><option ' + (e.paymentAccount === 'Bank' ? 'selected' : '') + '>Bank</option><option ' + (e.paymentAccount === 'Cash' ? 'selected' : '') + '>Cash</option><option ' + (e.paymentAccount === 'Credit Card' ? 'selected' : '') + '>Credit Card</option><option ' + (e.paymentAccount === 'UPI' ? 'selected' : '') + '>UPI</option></select>')}
          </div>
          <div class="grid grid-cols-2 gap-3">
            ${fld('Project (Optional)', '<select class="form-input" id="f_project"><option value="">None</option>' + projects.map(function(p) { return '<option ' + (p.id === e.projectId ? 'selected' : '') + ' value="' + p.id + '">' + p.name + '</option>'; }).join('') + '</select>', 'Allocate expense to a project')}
            ${fld('Status', '<select class="form-input" id="f_status"><option ' + (e.status === 'pending' ? 'selected' : '') + ' value="pending">Pending</option><option ' + (e.status === 'approved' ? 'selected' : '') + ' value="approved">Approved</option><option ' + (e.status === 'rejected' ? 'selected' : '') + ' value="rejected">Rejected</option></select>')}
          </div>
          ${fld('Notes', '<textarea rows="2" class="form-input" id="f_notes" placeholder="Additional notes">' + (e.notes || '') + '</textarea>')}
          ${fld('Receipt Attachment', '<input type="file" class="form-input" id="f_receipt" accept="image/*">', 'Upload receipt image (optional)')}
        </div>
        ${modalFooter(isEdit ? 'Update Expense' : 'Save Expense', 'onclick="saveExpense(\'' + (isEdit ? e.id : '') + '\')"')}
      `;

      openModal(modalContent, { width: 'max-w-lg' });
    }

    // =============================================================
    // SAVE / DELETE EXPENSE
    // =============================================================

    function saveExpense(existingId) {
      var date = document.getElementById('f_date').value;
      var category = document.getElementById('f_category').value;
      var amount = parseFloat(document.getElementById('f_amount').value) || 0;
      var tax = parseInt(document.getElementById('f_tax').value) || 0;
      var description = document.getElementById('f_description').value.trim();
      var vendor = document.getElementById('f_vendor').value.trim() || null;
      var paymentAccount = document.getElementById('f_account').value;
      var status = document.getElementById('f_status').value;
      var projectId = document.getElementById('f_project').value || null;
      var notes = document.getElementById('f_notes').value.trim() || '';
      var receipt = null;

      if (!date || !category || !description || amount <= 0) {
        showToast('Please fill all required fields (Date, Category, Description, Amount)', 'error');
        return;
      }

      if (existingId) {
        var e = expenses.find(function(x) { return x.id === existingId; });
        if (e) {
          e.date = date;
          e.category = category;
          e.amount = amount;
          e.tax = tax;
          e.description = description;
          e.vendor = vendor;
          e.paymentAccount = paymentAccount;
          e.status = status;
          e.projectId = projectId;
          e.notes = notes;
          showToast('Expense updated successfully', 'success');
        }
      } else {
        var newExpense = {
          id: 'EXP-' + String(nextExpNo++).padStart(3, '0'),
          date: date,
          category: category,
          amount: amount,
          tax: tax,
          description: description,
          vendor: vendor,
          paymentAccount: paymentAccount,
          status: status,
          projectId: projectId,
          notes: notes,
          receipt: receipt,
          createdAt: date
        };
        expenses.unshift(newExpense);
        showToast('Expense created successfully', 'success');
      }

      closeModal();
      renderExpenses();
    }

    function delExpense(id) {
      var e = expenses.find(function(x) { return x.id === id; });
      if (!e) return;

      var modalContent = `
        ${modalHeader('Delete Expense', e.id)}
        <div class="px-5 py-4 text-sm text-gray-600">
          <p>Are you sure you want to delete this expense?</p>
          <p class="text-gray-400 text-[11px] mt-1">This action cannot be undone.</p>
          <p class="text-amber-600 text-[11px] mt-2">Amount: ${money(e.amount)}</p>
        </div>
        ${modalFooter('Delete', 'onclick="confirmDeleteExpense(\'' + id + '\')"', '')}
      `;
      openModal(modalContent, { width: 'max-w-md' });
    }

    function confirmDeleteExpense(id) {
      expenses = expenses.filter(function(x) { return x.id !== id; });
      closeModal();
      renderExpenses();
      showToast('Expense deleted successfully', 'warning');
    }

    // =============================================================
    // ACTIONS
    // =============================================================

    function approveExpense(id) {
      var e = expenses.find(function(x) { return x.id === id; });
      if (!e) return;
      e.status = 'approved';
      renderExpenses();
      showToast('Expense ' + e.id + ' approved!', 'success');
    }

    function rejectExpense(id) {
      var e = expenses.find(function(x) { return x.id === id; });
      if (!e) return;
      e.status = 'rejected';
      renderExpenses();
      showToast('Expense ' + e.id + ' rejected.', 'warning');
    }

    // =============================================================
    // SEARCH
    // =============================================================

    (function addSearchToTopbar() {
      var searchContainer = document.querySelector('.app-main header');
      if (searchContainer) {
        var searchHtml = `
          <div class="hidden sm:flex flex-1 max-w-[420px] relative ml-4">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">${iconSearch()}</span>
            <input type="text" id="searchInput" placeholder="Search expenses by description, category, vendor…"
              onkeyup="filterExpenses()"
              class="w-full border border-gray-200 bg-gray-50 focus:bg-white rounded-lg pl-9 pr-3 py-1.5 text-xs outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition placeholder:text-gray-400">
          </div>
        `;
        var headerContent = searchContainer.innerHTML;
        var hamburgerIndex = headerContent.indexOf('lg:hidden');
        if (hamburgerIndex !== -1) {
          var firstDivEnd = headerContent.indexOf('</div>', hamburgerIndex) + 6;
          var before = headerContent.substring(0, firstDivEnd);
          var after = headerContent.substring(firstDivEnd);
          searchContainer.innerHTML = before + searchHtml + after;
        }
      }
    })();

    // =============================================================
    // INIT
    // =============================================================

    renderExpenses();

    console.log('💰 Expense Module Loaded Successfully');
    console.log('📊 Total Expenses:', expenses.length);
    console.log('📌 Status: Pending(' + expenses.filter(function(e) { return e.status === 'pending'; }).length +
      '), Approved(' + expenses.filter(function(e) { return e.status === 'approved'; }).length +
      '), Rejected(' + expenses.filter(function(e) { return e.status === 'rejected'; }).length + ')');

  </script>
