  /* ---- TABS ---- */

  <script>
    // =============================================================
    // NAV-SIDEBAR INIT
    // =============================================================
    NavSidebar.init({
      basePath: "",
      activePage: "invoices",
      pageTitle: "Invoices",
      user: {
        name: "Admin",
        role: "Super Admin",
        avatarUrl: "",
      },
    });

    // =============================================================
    // SVG ICONS
    // =============================================================
    function iconPlus() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>`;
    }
    function iconEdit() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>`;
    }
    function iconTrash() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>`;
    }
    function iconEye() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    }
    function iconX() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg>`;
    }
    function iconSave() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>`;
    }
    function iconDocument() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z"/><path d="M14 2v6h6"/></svg>`;
    }
    function iconSearch() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>`;
    }
    function iconSend() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>`;
    }
    function iconDownload() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>`;
    }

    // =============================================================
    // CURRENCY CONFIG
    // =============================================================
    var currencyMeta = {
      INR: { symbol: '₹', label: 'India',  countries: ['India'], rate: 1 },
      USD: { symbol: '$', label: 'America', countries: ['America', 'USA', 'United States'], rate: 83.5 },
      AED: { symbol: 'د.إ', label: 'Dubai', countries: ['Dubai', 'UAE', 'United Arab Emirates'], rate: 22.7 },
      EUR: { symbol: '€', label: 'Europe', countries: ['Europe', 'Germany', 'France'], rate: 90.2 },
      OMR: { symbol: '﷼', label: 'Oman', countries: ['Oman'], rate: 217.5 },
    };

    function getCurrencySymbol(currency) {
      return (currencyMeta[currency] && currencyMeta[currency].symbol) || '₹';
    }
    function getCurrencyRate(currency) {
      return (currencyMeta[currency] && currencyMeta[currency].rate) || 1;
    }

      var colors = {

        info: 'bg-primary',
        warning: 'bg-amber-600',
        error: 'bg-red-600'

      var el = document.createElement('div');
      el.className = 'toast ' + colors[kind] + ' text-white font-semibold px-3 py-2 rounded-lg shadow-lg flex items-center gap-2 max-w-xs';
      el.innerHTML = '<span>' + message + '</span>';
      wrap.appendChild(el);
      setTimeout(function() {

        el.style.opacity = '0';
        setTimeout(function() { el.remove(); }, 300);

        var discountAmt = subtotal * (inv.discount / 100);

    // =============================================================
    // LINE ITEM FUNCTIONS
    // =============================================================

    function addLineItem() {
      var tbody = document.getElementById('lineItemsBody');
      if (!tbody) return;
      var emptyRow = tbody.querySelector('tr td[colspan]');
      if (emptyRow) tbody.innerHTML = '';

      var idx = tbody.children.length;
      var row = document.createElement('tr');
      row.className = 'border-b border-gray-100 line-item-row';
      row.innerHTML = `
        <td class="px-2 py-1">
          <select class="form-input text-[10px] item-select" data-idx="${idx}">
            ${items.map(function(it) { return '<option value="' + it.id + '">' + it.name + '</option>'; }).join('')}
          </select>
        </td>
        <td class="px-2 py-1">
          <input type="number" class="form-input text-[10px] item-qty" value="1" data-idx="${idx}" placeholder="Qty" onchange="calcInvoiceTotal()">
        </td>
        <td class="px-2 py-1">
          <input type="number" class="form-input text-[10px] item-rate" value="0" data-idx="${idx}" placeholder="Rate" onchange="calcInvoiceTotal()">
        </td>
        <td class="px-2 py-1 text-center">
          <button onclick="removeLineItem(this)" class="text-red-500 hover:text-red-700 transition">${iconX()}</button>
        </td>
      `;
      tbody.appendChild(row);

      var select = row.querySelector('.item-select');
      select.addEventListener('change', function() {
        var selectedItem = items.find(function(it) { return it.id === this.value; });
        var rateInput = this.closest('tr').querySelector('.item-rate');
        if (selectedItem && rateInput) {
          rateInput.value = selectedItem.price;
          calcInvoiceTotal();
        }
      });
      select.dispatchEvent(new Event('change'));
    }

    function removeLineItem(btn) {
      var row = btn.closest('tr');
      if (row) row.remove();
      var tbody = document.getElementById('lineItemsBody');
      if (tbody && tbody.children.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center py-3 text-gray-400 text-xs">No items added. Click "Add Item" to add products/services.</td></tr>';
      }
      calcInvoiceTotal();
    }

    function updateCustomerDetails() {
      // Auto-set place of supply AND currency based on the customer's country
      var customerId = document.getElementById('f_customer').value;
      var customer = customers.find(function(c) { return c.id === customerId; });
      if (customer) {
        document.getElementById('f_placeSupply').value = customer.state || customer.country;
        var autoCurrency = currencyForCountry(customer.country);
        document.getElementById('f_currency').value = autoCurrency;
        updateCurrency();
      }
    }

    function updateCurrency() {
      var currency = document.getElementById('f_currency').value;
      document.getElementById('f_exchangeRate').value = getCurrencyRate(currency);
      calcInvoiceTotal();
    }

    function calcInvoiceTotal() {
      var rows = document.querySelectorAll('#lineItemsBody .line-item-row');
      var subtotal = 0;
      rows.forEach(function(row) {
        var qty = parseFloat(row.querySelector('.item-qty').value) || 0;
        var rate = parseFloat(row.querySelector('.item-rate').value) || 0;
        subtotal += qty * rate;
      });

      var discount = parseFloat(document.getElementById('f_discount').value) || 0;
      var tax = parseFloat(document.getElementById('f_tax').value) || 0;
      var shipping = parseFloat(document.getElementById('f_shipping').value) || 0;
      var otherCharges = parseFloat(document.getElementById('f_otherCharges').value) || 0;
      var exchangeRate = parseFloat(document.getElementById('f_exchangeRate').value) || 1;
      var currency = document.getElementById('f_currency').value;

      var discountAmt = subtotal * (discount / 100);
      var afterDiscount = subtotal - discountAmt;
      var taxAmt = afterDiscount * (tax / 100);
      var total = afterDiscount + taxAmt + shipping + otherCharges;

      document.getElementById('f_total').value = formatCurrency(total, currency);

      var totalINR = total * exchangeRate;
      document.getElementById('f_inrEquivalent').value = money(totalINR, 'INR');

      return total;
    }

    // =============================================================
    // SAVE / DELETE INVOICE
    // =============================================================

    function saveInvoice(existingId, type) {
      var isProforma = type === 'proforma';
      var number = document.getElementById('f_number').value;
      var date = document.getElementById('f_date').value;
      var customerId = document.getElementById('f_customer').value;
      var dueDate = document.getElementById('f_dueDate').value;
      var currency = document.getElementById('f_currency').value;
      var exchangeRate = parseFloat(document.getElementById('f_exchangeRate').value) || 1;
      var discount = parseFloat(document.getElementById('f_discount').value) || 0;
      var tax = parseFloat(document.getElementById('f_tax').value) || 0;
      var shipping = parseFloat(document.getElementById('f_shipping').value) || 0;
      var otherCharges = parseFloat(document.getElementById('f_otherCharges').value) || 0;
      var status = document.getElementById('f_status').value;
      var placeSupply = document.getElementById('f_placeSupply').value || '';
      var terms = document.getElementById('f_terms').value || '';

      if (!date || !customerId || !dueDate) {
        showToast('Please fill all required fields (Date, Customer, ' + (isProforma ? 'Valid Until' : 'Due Date') + ')', 'error');
        return;
      }

      var itemsData = [];
      var rows = document.querySelectorAll('#lineItemsBody .line-item-row');
      rows.forEach(function(row) {
        var itemId = row.querySelector('.item-select').value;
        var qty = parseFloat(row.querySelector('.item-qty').value) || 0;
        var rate = parseFloat(row.querySelector('.item-rate').value) || 0;
        if (qty > 0 && rate > 0) {
          var item = items.find(function(it) { return it.id === itemId; });
          itemsData.push({
            itemId: itemId,
            name: item ? item.name : '',
            hsn: item ? item.hsn : '',
            qty: qty,
            rate: rate,
            gst: item ? item.gst : 18,
            unit: item ? item.unit : 'Pcs'
          });
        }
      });

      if (itemsData.length === 0) {
        showToast('Please add at least one item to the ' + (isProforma ? 'proforma invoice' : 'invoice'), 'error');
        return;
      }

      var subtotal = itemsData.reduce(function(sum, item) { return sum + (item.qty * item.rate); }, 0);
      var discountAmt = subtotal * (discount / 100);
      var afterDiscount = subtotal - discountAmt;
      var taxAmt = afterDiscount * (tax / 100);
      var total = afterDiscount + taxAmt + shipping + otherCharges;
      var totalINR = total * exchangeRate;

      var customer = customers.find(function(c) { return c.id === customerId; });
      var customerName = customer ? customer.name : '';

      if (existingId) {
        var inv = invoices.find(function(x) { return x.id === existingId; });
        if (inv) {
          inv.number = number;
          inv.date = date;
          if (isProforma) { inv.validUntil = dueDate; inv.dueDate = dueDate; } else { inv.dueDate = dueDate; }
          inv.customerId = customerId;
          inv.customerName = customerName;
          inv.customerGST = customer ? customer.gst : '';
          inv.customerState = customer ? customer.state : '';
          inv.customerStateCode = customer ? customer.stateCode : '';
          inv.customerAddress = customer ? customer.address : '';
          inv.currency = currency;
          inv.exchangeRate = exchangeRate;
          inv.items = itemsData;
          inv.discount = discount;
          inv.tax = tax;
          inv.shipping = shipping;
          inv.otherCharges = otherCharges;
          inv.status = status;
          inv.total = total;
          inv.totalINR = totalINR;
          inv.placeOfSupply = placeSupply || (customer ? customer.state : '');
          inv.terms = terms;
          showToast((isProforma ? 'Proforma invoice' : 'Invoice') + ' updated successfully', 'success');
        }
      } else {
        var newInvoice = {
          id: (isProforma ? 'PRO-' : 'INV-') + String(isProforma ? nextProNo++ : nextInvNo++).padStart(3, '0'),
          invoiceType: type,
          number: number || (isProforma ? ('PI/25-26/' + String(invoices.length + 1).padStart(3, '0')) : ('INV/25-26/' + String(invoices.length + 1).padStart(3, '0'))),
          date: date,
          dueDate: dueDate,
          validUntil: isProforma ? dueDate : undefined,
          customerId: customerId,
          customerName: customerName,
          customerGST: customer ? customer.gst : '',
          customerState: customer ? customer.state : '',
          customerStateCode: customer ? customer.stateCode : '',
          customerAddress: customer ? customer.address : '',
          currency: currency,
          exchangeRate: exchangeRate,
          items: itemsData,
          discount: discount,
          tax: tax,
          shipping: shipping,
          otherCharges: otherCharges,
          status: status,
          total: total,
          totalINR: totalINR,
          paid: 0,
          createdAt: date,
          placeOfSupply: placeSupply || (customer ? customer.state : ''),
          terms: terms,
          // Backend note: populate once the PDF is generated/stored server-side.
          pdfUrl: null
        };
        invoices.unshift(newInvoice);
        showToast((isProforma ? 'Proforma invoice' : 'Invoice') + ' created successfully', 'success');
      }

      closeModal();
      renderInvoices();
    }

    function delInvoice(id) {
      var inv = invoices.find(function(x) { return x.id === id; });
      if (!inv) return;
      var isProforma = inv.invoiceType === 'proforma';

      var modalContent = `
        ${modalHeader('Delete ' + (isProforma ? 'Proforma Invoice' : 'Invoice'), inv.number)}
        <div class="px-5 py-4 text-sm text-gray-600">
          <p>Are you sure you want to permanently delete <b class="text-gray-800">${inv.number}</b>?</p>
          <p class="text-gray-400 text-[11px] mt-1">This action cannot be undone. All associated data will be removed.</p>
          <p class="text-amber-600 text-[11px] mt-2">Total Value: ${formatCurrency(inv.total, inv.currency)}</p>
        </div>
        ${modalFooter('Delete', 'onclick="confirmDeleteInvoice(\'' + id + '\')"', '')}
      `;
      openModal(modalContent, { width: 'max-w-md' });
    }

    function confirmDeleteInvoice(id) {
      invoices = invoices.filter(function(x) { return x.id !== id; });
      closeModal();
      renderInvoices();
      showToast('Deleted successfully', 'warning');
    }

    // =============================================================
    // ACTIONS
    // =============================================================

    function sendInvoice(id) {
      var inv = invoices.find(function(x) { return x.id === id; });
      if (!inv) return;
      if (inv.invoiceType === 'proforma') {
        showToast('Proforma ' + inv.number + ' sent to customer!', 'success');
      } else {
        showToast('Invoice ' + inv.number + ' sent to customer!', 'success');
      }
    }

    function downloadInvoice(id) {
      var inv = invoices.find(function(x) { return x.id === id; });
      if (!inv) return;
      showToast('Downloading PDF for ' + inv.number + '...', 'info');
    }

    // =============================================================
    // CHOOSE TEMPLATE (Invoices only)
    // =============================================================

    function openChooseTemplate() {
      var selected = savedTemplateId || invoiceTemplates[0].id;
      renderChooseTemplate(selected);
    }

    function renderChooseTemplate(selectedId) {
      var cardsHtml = invoiceTemplates.map(function(t) {
        return `
          <div class="template-card ${t.id === selectedId ? 'selected' : ''}" onclick="renderChooseTemplate('${t.id}')">
            <div class="template-thumb mb-2">
              ${templateThumbSvg(t.id)}
            </div>
            <div class="text-xs font-semibold text-gray-800">${t.name}</div>
            <div class="text-[10px] text-gray-500 mt-0.5">${t.description}</div>
          </div>`;
      }).join('');

      var previewHtml = templatePreviewHtml(selectedId);

      var modalContent = `
        <div class="flex items-start justify-between px-5 py-3.5 border-b border-gray-100 sticky top-0 bg-white z-10">
          <div>
            <h3 class="modal-title text-gray-900">Choose Invoice Template</h3>
            <p class="modal-subtitle mt-0.5">Pick a layout, preview it with placeholder data, then save it as your default.</p>
          </div>
          <button onclick="closeModal()" class="w-7 h-7 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-gray-700 transition">${iconX()}</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-[220px_1fr] gap-0">
          <div class="p-4 border-r border-gray-100 space-y-3 modal-scroll" style="max-height:60vh;">
            ${cardsHtml}
          </div>
          <div class="p-4 modal-scroll" style="max-height:60vh;">
            ${previewHtml}
          </div>
        </div>
        <div class="flex items-center justify-between gap-2 px-5 py-3 border-t border-gray-100 bg-gray-50 rounded-b-xl sticky bottom-0">
          <div class="text-[10px] text-gray-400">Saved template is used automatically whenever you create a new invoice.</div>
          <div class="flex gap-2">
            <button onclick="closeModal()" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-600 border border-gray-200 hover:bg-white transition">Cancel</button>
            <button onclick="saveTemplateChoice('${selectedId}')" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-white bg-primary hover:bg-primary-dark transition shadow-sm flex items-center gap-1.5">
              ${iconSave()} Save Template
            </button>
          </div>
        </div>
      `;
      openModal(modalContent, { width: 'max-w-4xl' });
    }

    function templateThumbSvg(id) {
      if (id === 'tpl-modern') {
        return `<div style="height:70px;" class="flex flex-col gap-1">
          <div style="height:14px;background:#6da84c;border-radius:3px;"></div>
          <div style="height:6px;width:60%;background:#e5e7eb;border-radius:2px;"></div>
          <div style="height:6px;width:80%;background:#e5e7eb;border-radius:2px;"></div>
          <div style="height:6px;width:40%;background:#e5e7eb;border-radius:2px;"></div>
        </div>`;
      }
      return `<div style="height:70px;" class="flex flex-col gap-1">
        <div class="flex justify-between"><div style="height:10px;width:30%;background:#d1d5db;border-radius:2px;"></div><div style="height:10px;width:35%;background:#6da84c;border-radius:2px;"></div></div>
        <div style="height:6px;width:100%;background:#e5e7eb;border-radius:2px;margin-top:6px;"></div>
        <div style="height:6px;width:90%;background:#e5e7eb;border-radius:2px;"></div>
        <div style="height:6px;width:70%;background:#e5e7eb;border-radius:2px;"></div>
      </div>`;
    }

    function templatePreviewHtml(id) {
      // Dummy placeholder data for preview purposes only
      var dummy = {
        company: 'Kunash Media Pvt. Ltd.',
        number: 'INV/25-26/00X',
        date: '2026-01-01',
        due: '2026-01-15',
        customer: 'Sample Customer Pvt. Ltd.',
        items: [
          { name: 'Sample Product / Service', qty: 2, rate: 10000, amount: 20000 },
          { name: 'Sample Add-on Service', qty: 1, rate: 5000, amount: 5000 },
        ],
        total: 29500
      };

      if (id === 'tpl-modern') {
        return `
          <div class="border border-gray-200 rounded-lg overflow-hidden" style="max-width:480px;margin:0 auto;">
            <div style="background:#6da84c;" class="text-white px-4 py-3">
              <div class="text-[10px] uppercase tracking-wide opacity-80">Invoice</div>
              <div class="text-sm font-bold">${dummy.number}</div>
            </div>
            <div class="p-3 text-[11px] text-gray-600">
              <div class="flex justify-between mb-2">
                <div><div class="font-semibold text-gray-800">${dummy.company}</div><div>${dummy.date}</div></div>
                <div class="text-right"><div class="font-semibold text-gray-800">${dummy.customer}</div><div>Due ${dummy.due}</div></div>
              </div>
              <table class="w-full text-[10px] mt-2">
                <thead><tr class="text-gray-400"><th class="text-left py-1">Item</th><th class="text-center">Qty</th><th class="text-right">Amount</th></tr></thead>
                <tbody>
                  ${dummy.items.map(function(it){ return '<tr><td class="py-1">'+it.name+'</td><td class="text-center">'+it.qty+'</td><td class="text-right">₹'+it.amount.toLocaleString('en-IN')+'</td></tr>'; }).join('')}
                </tbody>
              </table>
              <div class="text-right font-bold text-primary mt-2 text-xs">Total: ₹${dummy.total.toLocaleString('en-IN')}</div>
            </div>
          </div>
          <p class="text-[10px] text-gray-400 text-center mt-2">Placeholder preview — actual values populate once wired to real data.</p>
        `;
      }

      return `
        <div class="invoice-preview" style="max-width:480px;padding:16px 18px;">
          <div class="invoice-header" style="padding-bottom:10px;margin-bottom:10px;">
            <div class="w-16 h-12 bg-gray-100 rounded flex items-center justify-center text-gray-400 text-[9px] border border-gray-200">Logo</div>
            <div class="invoice-company">
              <div class="invoice-company-name" style="font-size:13px;">${dummy.company}</div>
              <div class="invoice-company-details" style="font-size:9px;">Sample Address, City</div>
            </div>
          </div>
          <div class="text-center mb-2"><span class="invoice-title" style="font-size:14px;">TAX INVOICE</span></div>
          <div class="invoice-meta" style="font-size:9px;gap:6px;margin-bottom:8px;">
            <div><div class="meta-label" style="font-size:8px;">Bill To</div><div class="meta-value">${dummy.customer}</div></div>
            <div style="text-align:right;"><div>Invoice # ${dummy.number}</div><div>Date ${dummy.date}</div></div>
          </div>
          <table class="invoice-table" style="font-size:9px;">
            <thead><tr><th>Item</th><th class="text-center">Qty</th><th class="text-right">Amount</th></tr></thead>
            <tbody>
              ${dummy.items.map(function(it){ return '<tr><td>'+it.name+'</td><td class="text-center">'+it.qty+'</td><td class="text-right">₹'+it.amount.toLocaleString('en-IN')+'</td></tr>'; }).join('')}
            </tbody>
          </table>
          <div class="invoice-totals" style="font-size:10px;margin-top:6px;padding-top:6px;">
            <div class="grand-total total-row" style="font-size:12px;"><span class="label">Total</span><span class="value">₹${dummy.total.toLocaleString('en-IN')}</span></div>
          </div>
        </div>
        <p class="text-[10px] text-gray-400 text-center mt-2">Placeholder preview — actual values populate once wired to real data.</p>
      `;
    }

    function saveTemplateChoice(id) {
      savedTemplateId = id;
      closeModal();
      var t = invoiceTemplates.find(function(x) { return x.id === id; });
      showToast('"' + (t ? t.name : id) + '" saved as your default invoice template', 'success');
    }

    // =============================================================
    // SEARCH
    // =============================================================

    (function addSearchToTopbar() {
      var searchContainer = document.querySelector('.app-main header');
      if (searchContainer) {
        var searchHtml = `
          <div class="hidden sm:flex flex-1 max-w-[420px] relative ml-4">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">${iconSearch()}</span>
            <input type="text" id="searchInput" placeholder="Search invoices by number, customer…"
              onkeyup="filterInvoices()"
              class="w-full border border-gray-200 bg-gray-50 focus:bg-white rounded-lg pl-9 pr-3 py-1.5 text-xs outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition placeholder:text-gray-400">
          </div>
        `;
        var headerContent = searchContainer.innerHTML;
        var hamburgerIndex = headerContent.indexOf('lg:hidden');
        if (hamburgerIndex !== -1) {
          var firstDivEnd = headerContent.indexOf('</div>', hamburgerIndex) + 6;
          var before = headerContent.substring(0, firstDivEnd);
          var after = headerContent.substring(firstDivEnd);
          searchContainer.innerHTML = before + searchHtml + after;
        }
      }
    })();

    // =============================================================
    // INIT
    // =============================================================

    buildStatusFilterOptions();
    renderInvoices();

  </script>

</body>
</html>
