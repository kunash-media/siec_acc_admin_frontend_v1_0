  <script>
// ============================================================= CONFIG
var API_BASE = 'http://localhost:9093';
var PROJECT_API = '/api/projects/v1/project-list'; // GET ?search=  -> [{projectName, projectPrimeId, projectCode}]
var PRODUCT_API = '/api/products/v1/get-product-list'; // GET ?page=&size=&search=
var DEFAULT_TEMPLATE = 'tpl-modern';
var ORG_STORAGE_KEY = 'siec_organization_id';
var company = { name: '', address: '', gstin: '', pan: '', phone: '', email: '', state: '', stateCode: '', bankName: '', bankAccount: '', bankIfsc: '', logoUrl: '', logoData: '',
  bank: { beneficiary: '', name: '', branch: '', address: '', account: '', ifsc: '' } };
var STATE_CODES = { 'jammu and kashmir': '01', 'himachal pradesh': '02', 'punjab': '03', 'chandigarh': '04', 'uttarakhand': '05', 'haryana': '06', 'delhi': '07', 'rajasthan': '08',
  'uttar pradesh': '09', 'bihar': '10', 'sikkim': '11', 'arunachal pradesh': '12', 'nagaland': '13', 'manipur': '14', 'mizoram': '15', 'tripura': '16', 'meghalaya': '17', 'assam': '18',
  'west bengal': '19', 'jharkhand': '20', 'odisha': '21', 'chhattisgarh': '22', 'madhya pradesh': '23', 'gujarat': '24', 'dadra and nagar haveli and daman and diu': '26',
  'maharashtra': '27', 'karnataka': '29', 'goa': '30', 'lakshadweep': '31', 'kerala': '32', 'tamil nadu': '33', 'puducherry': '34', 'andaman and nicobar islands': '35',
  'telangana': '36', 'andhra pradesh': '37', 'ladakh': '38' };
function stateCodeFor(state, gstin) {
  if (/^\d{2}/.test(gstin || '')) return gstin.slice(0, 2);
  return STATE_CODES[String(state || '').trim().toLowerCase()] || '';
}
async function fetchLogoDataUrl(url) {
  try {
    var res = await fetch(url); if (!res.ok) return '';
    var obj = URL.createObjectURL(await res.blob());
    var img = await new Promise(function (ok, no) { var i = new Image(); i.onload = function () { ok(i); }; i.onerror = no; i.src = obj; });
    var w = Math.min(320, img.naturalWidth), h = Math.round(img.naturalHeight * w / img.naturalWidth);
    var cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(obj);
    return cv.toDataURL('image/png');
  } catch (e) { return ''; }
}
async function loadOrganization() {
  var orgId = null;
  try { orgId = localStorage.getItem(ORG_STORAGE_KEY); } catch (e) {}
  if (!orgId) { showToast('Organization id not found (localStorage key: ' + ORG_STORAGE_KEY + ')', 'error'); return; }
  try {
    var o = await apiFetch('/api/organization/' + encodeURIComponent(orgId), { method: 'GET' });
    var name = o.legalName || o.companyName || '', st = o.state || o.taxState || '';
    company = {
      name: name, address: [o.address, o.city, st, o.pincode].filter(Boolean).join(', '),
      gstin: o.gstNumber || '', pan: '', phone: o.phone || '', email: o.email || '',
      state: st, stateCode: stateCodeFor(st, o.gstNumber),
      bankName: o.bankName || '', bankAccount: o.bankAccountNumber || '', bankIfsc: o.bankIfscCode || '',
      logoUrl: o.logoUrl ? API_BASE + o.logoUrl : '', logoData: '',
      bank: { beneficiary: name, name: o.bankName || '', branch: '', address: '', account: o.bankAccountNumber || '', ifsc: o.bankIfscCode || '' }
    };
    if (company.logoUrl) company.logoData = await fetchLogoDataUrl(company.logoUrl);
  } catch (e) { showToast(e.message || 'Could not load organization details', 'error'); }
}

async function apiFetch(path, options) {
  options = options || {};
  var res;
  try { res = await fetch(API_BASE + path, options); }
  catch (e) { throw new Error('Somthing Went Wrong!, Check Your Connection.'); }
  var isJson = (res.headers.get('content-type') || '').indexOf('application/json') !== -1;
  if (!res.ok) {

  return getCurrencySymbol(c) + Number(n || 0).toLocaleString(c === 'INR' ? 'en-IN' : 'en-US', o);
}
function fd(s) { if (!s) return '—'; var p = String(s).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : s; }

var W_ONES = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
var W_TENS = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
function w2(x) { return x < 20 ? W_ONES[x] : W_TENS[Math.floor(x / 10)] + (x % 10 ? '-' + W_ONES[x % 10] : ''); }
function w3(x) { return (x >= 100 ? W_ONES[Math.floor(x / 100)] + ' Hundred' + (x % 100 ? ' ' : '') : '') + (x % 100 ? w2(x % 100) : ''); }
function numWords(n, ind) {
  if (n === 0) return 'Zero';
  var out = '', U = ind ? [[1e7, 'Crore'], [1e5, 'Lakh'], [1e3, 'Thousand']] : [[1e9, 'Billion'], [1e6, 'Million'], [1e3, 'Thousand']];
  U.forEach(function (u) { if (n >= u[0]) { out += numWords(Math.floor(n / u[0]), ind) + ' ' + u[1] + ' '; n = n % u[0]; } });
  if (n > 0) out += w3(n);
  return out.trim();
}
var CUR_NAMES = { INR: ['Indian Rupee', 'Paise'], USD: ['United States Dollar', 'Cents'], AED: ['UAE Dirham', 'Fils'], EUR: ['Euro', 'Cents'], OMR: ['Omani Rial', 'Baisa'] };

// ============================================================= SEARCHABLE PICKER (debounce + scroll pagination)
function closePicker() { var b = document.getElementById('pickerBox'); if (b) b.remove(); document.removeEventListener('mousedown', pickerOutside); }
function pickerOutside(e) { var b = document.getElementById('pickerBox'); if (b && !b.contains(e.target)) closePicker(); }
function openPicker(anchor, cfg) {
  closePicker();
  var r = anchor.getBoundingClientRect(), box = document.createElement('div');
  box.id = 'pickerBox';
  box.style.cssText = 'position:fixed;z-index:300;background:#fff;border:1px solid #d1d5db;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);width:' + Math.max(r.width, 320) + 'px;left:' + r.left + 'px;top:' + (r.bottom + 4) + 'px;';
  box.innerHTML = '<input class="form-input" placeholder="Type 2+ letters to search…" style="margin:6px;width:calc(100% - 12px)"><div style="max-height:220px;overflow-y:auto"></div>';
  document.body.appendChild(box);
  var inp = box.firstChild, list = box.lastChild, page = 0, more = true, busy = false, q = '', tok = 0, t;
  async function load(reset) {
    if (reset) { tok++; page = 0; more = true; busy = false; list.innerHTML = ''; }
    if (busy || !more) return;
    busy = true; var my = tok;
    var ld = document.createElement('div'); ld.textContent = 'Loading…'; ld.style.cssText = 'padding:8px;font-size:11px;color:#9ca3af'; list.appendChild(ld);
    try {
      var res = await cfg.fetchPage(q, page);
      if (my !== tok) return;
      ld.remove(); more = !!res.hasNext; page = res.nextPage != null ? res.nextPage : page + 1;
      res.items.forEach(function (it) {
        var d = document.createElement('div');
        d.style.cssText = 'padding:7px 10px;font-size:11px;cursor:pointer;border-top:1px solid #f3f4f6';
        d.innerHTML = cfg.render(it);
        d.onmouseenter = function () { d.style.background = '#f8fafc'; }; d.onmouseleave = function () { d.style.background = ''; };
        d.onclick = function () { cfg.onPick(it); closePicker(); };
        list.appendChild(d);
      });
      if (!list.children.length) list.innerHTML = '<div style="padding:8px;font-size:11px;color:#9ca3af">No results</div>';
    } catch (e) { if (my === tok) { ld.remove(); more = false; showToast(e.message || 'Could not load', 'error'); } }
    finally { if (my === tok) busy = false; }
  }
  list.onscroll = function () { if (list.scrollTop + list.clientHeight >= list.scrollHeight - 24) load(false); };
  inp.oninput = function () {
    clearTimeout(t);
    t = setTimeout(function () { var v = inp.value.trim(); if (v.length === 1 || v === q) return; q = v; load(true); }, 400);
  };
  setTimeout(function () { document.addEventListener('mousedown', pickerOutside); }, 0);
  inp.focus(); load(true);
}
async function fetchProductPage(q, page) {
  var r = await apiFetch(PRODUCT_API + '?page=' + page + '&size=20' + (q ? '&search=' + encodeURIComponent(q) : ''), { method: 'GET' });
  var d = r.data || r, out = [];
  (d.content || []).forEach(function (p) {
    var base = { hsn: p.productHsnCode || '', gst: p.productGstRate != null ? Number(p.productGstRate) : null, pid: p.productPrimeId };
    if (!p.variants || !p.variants.length) {
      out.push(Object.assign({}, base, { vid: null, name: p.productName, unit: p.productUnit, price: p.productSellingPrice, sub: p.productStrId }));
    } else {
      p.variants.forEach(function (v) {
        out.push(Object.assign({}, base, { vid: v.variantPrimeId, name: p.productName + ' — ' + v.variantName, unit: v.variantUnit || p.productUnit,
          price: v.variantSellingPrice != null ? v.variantSellingPrice : p.productSellingPrice, sub: v.variantSku || v.variantStrId }));
      });
    }
  });
  return { items: out, hasNext: !!d.hasNext, nextPage: d.nextPage };

function updateCustomerDetails() {
  var c = selCustomer(); if (!c) return;
  document.getElementById('f_placeSupply').value = c.state || c.country || '';
  document.getElementById('f_shipTo').value = c.shipAddress || '';
  document.getElementById('f_currency').value = currencyForCountry(c.country);
  updateCurrency();
}
function updateCurrency() {
  document.getElementById('f_exchangeRate').value = getCurrencyRate(document.getElementById('f_currency').value);
  calcInvoiceTotal();
}
function calcInvoiceTotal() {
  var sub = 0;
  document.querySelectorAll('#lineItemsBody .line-item-row').forEach(function (r) {
    sub += (parseFloat(r.querySelector('.item-qty').value) || 0) * (parseFloat(r.querySelector('.item-rate').value) || 0);
  });
  var g = function (i) { return parseFloat(document.getElementById(i).value) || 0; };
  var after = sub - sub * (g('f_discount') / 100);
  var total = after + after * (g('f_tax') / 100) + g('f_shipping') + g('f_otherCharges');
  var cur = document.getElementById('f_currency').value;
  document.getElementById('f_total').value = formatCurrency(total, cur);
  document.getElementById('f_inrEquivalent').value = money(total * (g('f_exchangeRate') || 1), 'INR');
  return total;
}

async function uploadPdf(isPro, id, row, tpl) {

  f.append('file', blob, 'document.pdf');
  await apiFetch((isPro ? '/api/v1/proformas/' : '/api/v1/invoices/') + id + '/upload-pdf', { method: 'POST', body: f });
}
async function saveInvoice(existingId, type) {
  var isPro = type === 'proforma', P = isPro ? 'proforma' : 'invoice', g = function (i) { return document.getElementById(i).value; };
  var date = g('f_date'), due = g('f_dueDate'), cust = selCustomer(), cur = g('f_currency'), rate = parseFloat(g('f_exchangeRate')) || 1;
  var disc = parseFloat(g('f_discount')) || 0, tax = parseFloat(g('f_tax')) || 0, ship = parseFloat(g('f_shipping')) || 0, oth = parseFloat(g('f_otherCharges')) || 0;
  if (!date || !due || !cust) { showToast('Please fill Date, Customer and ' + (isPro ? 'Valid Until' : 'Due Date'), 'error'); return; }
  var its = [];
  document.querySelectorAll('#lineItemsBody .line-item-row').forEach(function (r) {
    var q = parseFloat(r.querySelector('.item-qty').value) || 0, rt = parseFloat(r.querySelector('.item-rate').value) || 0;
    if (q > 0 && rt > 0 && r.dataset.name) its.push({
      itemId: r.dataset.pid ? Number(r.dataset.pid) : null, variantId: r.dataset.vid ? Number(r.dataset.vid) : null, name: r.dataset.name,
      hsn: r.querySelector('.item-hsn').value, qty: q, rate: rt, gst: parseFloat(r.querySelector('.item-gst').value) || 0,
      unit: r.dataset.unit, note: r.querySelector('.item-note').value.trim()
    });
  });
  if (!its.length) { showToast('Please add at least one item', 'error'); return; }
  var sub = its.reduce(function (s, i) { return s + i.qty * i.rate; }, 0), after = sub - sub * disc / 100;
  var total = after + after * tax / 100 + ship + oth, totalINR = total * rate;
  var proj = document.getElementById('f_projectBtn').dataset.code || '', ref = g('f_refNo'), shipTo = g('f_shipTo'), pos = g('f_placeSupply') || cust.state || '', terms = g('f_terms');
  var tpl = isPro ? null : (savedTemplateId || DEFAULT_TEMPLATE);

  var f = { Date: date, CustomerId: isNaN(Number(cust.id)) ? cust.id : Number(cust.id), CustomerName: cust.name, CustomerGst: cust.gst, CustomerEmail: cust.email,
    CustomerState: cust.state, CustomerStateCode: cust.stateCode, CustomerAddress: cust.address, ShippingAddress: shipTo, Currency: cur, ExchangeRate: rate,
    DiscountPercent: disc, TaxPercent: tax, ShippingCharges: ship, OtherCharges: oth, Status: g('f_status'), PlaceOfSupply: pos, Terms: terms,
    ReferenceNumber: ref, ProjectCode: proj };
  f[isPro ? 'ValidUntil' : 'DueDate'] = due;
  var dto = {}; Object.keys(f).forEach(function (k) { dto[P + k] = f[k]; });
  dto[P + 'Items'] = its.map(function (i) {
    var o = {}; o[P + 'ItemProductId'] = i.itemId; o[P + 'ItemVariantId'] = i.variantId; o[P + 'ItemName'] = i.name; o[P + 'ItemHsnCode'] = i.hsn;
    o[P + 'ItemQty'] = i.qty; o[P + 'ItemRate'] = i.rate; o[P + 'ItemGstPercent'] = i.gst; o[P + 'ItemUnit'] = i.unit; o[P + 'ItemDescription'] = i.note; return o;
  });
  if (!isPro) dto.invoiceTemplateId = tpl;

  var btn = document.getElementById('modalSaveBtn'), orig = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = SPINNER + ' Saving…'; }
  try {
    var id = existingId, number;
    if (existingId) {
      var ex = invoices.find(function (x) { return String(x.id) === String(existingId); });
      number = ex ? ex.number : '';
      await apiFetch(isPro ? '/api/v1/proformas/update/' + existingId : '/api/v1/invoices/update/' + existingId, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(dto) });
    } else {
      var fd2 = new FormData();
      fd2.append(isPro ? 'proforma' : 'invoice', new Blob([JSON.stringify(dto)], { type: 'application/json' }));
      var res = await apiFetch(isPro ? '/api/v1/proformas' : '/api/v1/invoices/create', { method: 'POST', body: fd2 });
      id = isPro ? res.proformaPrimeId : res.invoicePrimeId; number = isPro ? res.proformaStrId : res.invoiceStrId;
    }
    var row = { invoiceType: type, number: number, date: date, dueDate: due, validUntil: due, customerName: cust.name, customerGST: cust.gst, customerState: cust.state,
      customerStateCode: cust.stateCode, customerAddress: cust.address, shipTo: shipTo, projectCode: proj, refNo: ref, currency: cur, exchangeRate: rate, items: its,
      discount: disc, tax: tax, shipping: ship, otherCharges: oth, total: total, totalINR: totalINR, placeOfSupply: pos, terms: terms };
    try { await uploadPdf(isPro, id, row, tpl); showToast((isPro ? 'Proforma' : 'Invoice') + ' saved', 'success'); }
    catch (e) { showToast('Saved, but PDF upload failed: ' + (e.message || ''), 'warning'); }
    closeModal(); currentPage = 1; renderInvoices();
  } catch (err) {
    showToast(err.message || 'Could not save — please try again', 'error');
    if (btn) { btn.disabled = false; btn.innerHTML = orig; }
  }
}

    <div class="flex items-center justify-between gap-2 px-5 py-3 border-t border-gray-100 bg-gray-50 rounded-b-xl">
      <button onclick="openSendOverlay('${id}')" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-600 border border-gray-200 hover:bg-white transition">Back</button>
      <button id="emailSendBtn" onclick="sendViaEmail('${id}')" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-white bg-primary hover:bg-primary-dark transition shadow-sm flex items-center gap-1.5">${iconSend()} Send Email</button></div>`, { width: 'max-w-sm' });
}
// Email API: { invoicePrimeId | proformaPrimeId, toEmail }
async function sendViaEmail(id) {
  var inv = invoices.find(function (x) { return String(x.id) === String(id); }); if (!inv) return;
  var pro = inv.invoiceType === 'proforma', inp = document.getElementById('f_sendEmail'), err = document.getElementById('emailSendError'), email = (inp.value || '').trim();
  if (!isValidEmail(email)) { err.textContent = 'Please enter a valid email address.'; err.classList.remove('hidden'); inp.classList.add('border-red-400'); return; }
  if (!inv.pdfUrl) { showToast('No PDF stored for this document yet.', 'error'); return; }
  err.classList.add('hidden'); inp.classList.remove('border-red-400');
  var btn = document.getElementById('emailSendBtn'); btn.disabled = true; btn.innerHTML = SPINNER + ' Sending…';
  try {
    await apiFetch(pro ? '/api/v1/emails/send-proforma' : '/api/v1/emails/send-invoice', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(pro ? { proformaPrimeId: Number(inv.id), toEmail: email } : { invoicePrimeId: Number(inv.id), toEmail: email })
    });
    if (!pro) { try { await apiFetch('/api/v1/invoices/patch/' + inv.id + '/mark-sent', { method: 'PATCH' }); } catch (e) { console.warn('mark-sent failed', e); } }
    closeModal(); showToast((pro ? 'Proforma' : 'Invoice') + ' ' + inv.number + ' emailed to ' + email, 'success'); renderInvoices();
  } catch (e) { btn.disabled = false; btn.innerHTML = iconSend() + ' Send Email'; showToast(e.message || 'Could not send the email', 'error'); }
}
function sendViaWhatsapp(id) {
  var inv = invoices.find(function (x) { return String(x.id) === String(id); }); if (!inv) return;
  var pro = inv.invoiceType === 'proforma', label = pro ? 'Proforma Invoice' : 'Invoice';
  if (!inv.pdfUrl) { showToast('No PDF has been generated for this ' + (pro ? 'proforma' : 'invoice') + ' yet.', 'error'); return; }
  var msg = label + ' ' + inv.number + ' from ' + company.name + '\nCustomer: ' + inv.customerName + '\nAmount: ' + fm(inv.total, inv.currency) + '\n' +
    (pro ? 'Valid Until: ' + fd(inv.validUntil || inv.dueDate) : 'Due Date: ' + fd(inv.dueDate)) + '\nView / Download: ' + API_BASE + inv.pdfUrl;
  var cu = customers.find(function (c) { return String(c.id) === String(inv.customerId); });
  var phone = cu && cu.phone ? String(cu.phone).replace(/[^0-9]/g, '') : '';
  window.open('https://wa.me/' + phone + '?text=' + encodeURIComponent(msg), '_blank');
  closeModal(); showToast('Opening WhatsApp to send ' + inv.number + '…', 'info');
}
function downloadInvoice(id) {
  var inv = invoices.find(function (x) { return String(x.id) === String(id); }); if (!inv) return;
  if (!inv.pdfUrl) { showToast('No PDF has been generated for ' + inv.number + ' yet.', 'error'); return; }
  showToast('Opening ' + inv.number + '…', 'info');
  window.open(API_BASE + inv.pdfUrl, '_blank');
}

// ============================================================= CHOOSE TEMPLATE
function openChooseTemplate() { renderChooseTemplate(savedTemplateId || DEFAULT_TEMPLATE); }
function renderChooseTemplate(selectedId) {
  var cards = invoiceTemplates.map(function (t) {
    return `<div class="template-card ${t.id === selectedId ? 'selected' : ''}" onclick="renderChooseTemplate('${t.id}')">
      <div class="template-thumb mb-2">${templateThumbSvg(t.id)}</div>
      <div class="text-xs font-semibold text-gray-800">${t.name}</div><div class="text-[10px] text-gray-500 mt-0.5">${t.description}</div></div>`;
  }).join('');
  openModal(`<div class="flex items-start justify-between px-5 py-3.5 border-b border-gray-100 sticky top-0 bg-white z-10">
      <div><h3 class="modal-title text-gray-900">Choose Invoice Template</h3><p class="modal-subtitle mt-0.5">Pick a layout, preview it, then save it as your default.</p></div>
      <button onclick="closeModal()" class="w-7 h-7 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-gray-700 transition">${iconX()}</button></div>
    <div class="grid grid-cols-1 md:grid-cols-[220px_1fr] gap-0">
      <div class="p-4 border-r border-gray-100 space-y-3 modal-scroll" style="max-height:60vh;">${cards}</div>
      <div class="p-4 modal-scroll" style="max-height:60vh;">${templatePreviewHtml(selectedId)}</div></div>
    <div class="flex items-center justify-between gap-2 px-5 py-3 border-t border-gray-100 bg-gray-50 rounded-b-xl sticky bottom-0">
      <div class="text-[10px] text-gray-400">Saved template is used automatically whenever you create a new invoice.</div>
      <div class="flex gap-2"><button onclick="closeModal()" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-600 border border-gray-200 hover:bg-white transition">Cancel</button>
      <button onclick="saveTemplateChoice('${selectedId}')" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-white bg-primary hover:bg-primary-dark transition shadow-sm flex items-center gap-1.5">${iconSave()} Save Template</button></div></div>`, { width: 'max-w-4xl' });
}
function templateThumbSvg(id) {
  if (id === 'tpl-modern') return `<div style="height:70px;" class="flex flex-col gap-1"><div style="height:14px;background:#0d6e5b;border-radius:3px;"></div><div style="height:6px;width:60%;background:#e5e7eb;border-radius:2px;"></div><div style="height:6px;width:80%;background:#e5e7eb;border-radius:2px;"></div><div style="height:6px;width:40%;background:#e6f4f1;border-radius:2px;"></div></div>`;
  return `<div style="height:70px;" class="flex flex-col gap-1"><div class="flex justify-between"><div style="height:10px;width:30%;background:#d1d5db;border-radius:2px;"></div><div style="height:10px;width:35%;background:#6da84c;border-radius:2px;"></div></div><div style="height:6px;width:100%;background:#e5e7eb;border-radius:2px;margin-top:6px;"></div><div style="height:6px;width:90%;background:#e5e7eb;border-radius:2px;"></div><div style="height:6px;width:70%;background:#e5e7eb;border-radius:2px;"></div></div>`;
}
function templatePreviewHtml(id) {
  var sample = { company: company.name, number: 'INV/XX', date: new Date().toISOString().split('T')[0], customer: 'Sample Customer',
    items: [{ name: 'Sample Product / Service', qty: 2, rate: 10000 }, { name: 'Sample Add-on Service', qty: 1, rate: 5000 }] };
  var inv = { invoiceType: 'invoice', number: sample.number, date: sample.date, dueDate: sample.date, customerName: sample.customer, customerAddress: 'Sample address', customerGST: '', customerState: company.state,
    customerStateCode: company.stateCode, currency: 'INR', exchangeRate: 1, items: sample.items.map(function (i) { return { name: i.name, qty: i.qty, rate: i.rate, hsn: '0000', unit: 'Pcs' }; }),
    discount: 0, tax: 18, shipping: 0, otherCharges: 0, total: 29500, totalINR: 29500, terms: 'Payment terms sample' };
  return '<div style="transform:scale(.62);transform-origin:top left;width:820px;">' + buildDocumentInnerHtml(inv, id) + '</div>' +
    '<p class="text-[10px] text-gray-400 text-center mt-2" style="margin-top:-250px">Preview uses sample data.</p>';
}
function saveTemplateChoice(id) {
  savedTemplateId = id; closeModal();
  var t = invoiceTemplates.find(function (x) { return x.id === id; });
  showToast('"' + (t ? t.name : id) + '" saved as your default invoice template', 'success');
}

// ============================================================= SEARCH (topbar) + INIT
(function addSearchToTopbar() {
  var header = document.querySelector('.app-main header');
  if (!header) return;
  var searchHtml = `<div class="hidden sm:flex flex-1 max-w-[420px] relative ml-4">
    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">${iconSearch()}</span>
    <input type="text" id="searchInput" placeholder="Search invoices by number, customer…" onkeyup="filterInvoices()"
      class="w-full border border-gray-200 bg-gray-50 focus:bg-white rounded-lg pl-9 pr-3 py-1.5 text-xs outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition placeholder:text-gray-400"></div>`;
  var html = header.innerHTML, i = html.indexOf('lg:hidden');
  if (i !== -1) { var end = html.indexOf('</div>', i) + 6; header.innerHTML = html.substring(0, end) + searchHtml + html.substring(end); }
})();

document.addEventListener('siec:perms', function () { renderInvoices(); });
(async function init() {
  buildStatusFilterOptions();
  await Promise.all([loadOrganization(), loadCustomers()]);
  renderInvoices();
})();
