<style>
  /* Form styles */
  .form-input {
    width: 100%;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    background: #fafafa;
    color: #1a1a2e;
  }
  .form-input:focus {
    border-color: #6da84c;
    box-shadow: 0 0 0 3px rgba(109, 168, 76, 0.15);
    background: #ffffff;
  }
  .form-label {
    font-size: 11.5px;
    font-weight: 600;
    color: #374151;
    display: block;
    margin-bottom: 4px;
  }
  .form-label .required { color: #ef4444; margin-left: 2px; }
  .form-hint { font-size: 10.5px; color: #9ca3af; margin-top: 3px; }

  /* Badge */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
  }
  .badge-green { background: #dcfce7; color: #166534; }
  .badge-amber { background: #fef3c7; color: #92400e; }
  .badge-red { background: #fee2e2; color: #991b1b; }
  .badge-gray { background: #f1f5f9; color: #475569; }
  .badge-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    display: inline-block;
  }
  .badge-dot-green { background: #22c55e; }
  .badge-dot-amber { background: #f59e0b; }
  .badge-dot-red { background: #ef4444; }
  .badge-dot-gray { background: #94a3b8; }

  /* Stats card */
  .stat-card {
    border: 1px solid #7dc057;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    height: 70px;
  }
  .stat-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
  }
  .stat-icon-wrap {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: 1px solid #6da84c;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }

  /* Table row hover */
  .table-row-hover:hover {
    background: #f8fafc;
  }

  /* Modal tabs */
  .modal-tab-btn {
    transition: all 0.2s ease;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 500;
    border-bottom: 2px solid transparent;
    color: #6b7280;
    cursor: pointer;
    background: transparent;
    display: flex;
    gap: 8px;
  }
  .modal-tab-btn.active {
    color: #6da84c;
    border-bottom-color: #6da84c;
  }
  .modal-tab-btn:hover:not(.active) {
    color: #1f2937;
    border-bottom-color: #d1d5db;
  }
  .modal-tab-panel { display: none; }
  .modal-tab-panel.active { display: block; animation: fadeIn 0.25s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.96) translateY(6px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .animate-modal { animation: modalIn 0.18s ease; }

  /* Action buttons */
  .btn-icon-action {
    transition: all 0.15s ease;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #94a3b8;
    background: transparent;
    border: 1px solid gray;
    cursor: pointer;
  }
  .btn-icon-action:hover {
    background: #f1f5f9;
    color: #6da84c;
  }
  .btn-icon-action.danger:hover {
    background: #fee2e2;
    color: #ef4444;
  }


  /* Toast */
  .toast {
    animation: fadeIn 0.2s ease;
  }
  .toast-success { background: #16a34a; }
  .toast-error { background: #dc2626; }
  .toast-warning { background: #f59e0b; }
  .toast-info { background: #6da84c; }

  /* Scrollbar for modal */
  .modal-scroll {
    max-height: 60vh;
    overflow-y: auto;
  }
  .modal-scroll::-webkit-scrollbar {
    width: 4px;
  }
  .modal-scroll::-webkit-scrollbar-thumb {
    background: #d1d5db;
    border-radius: 4px;
  }

  /* Empty state */
  .empty-icon-svg {
    opacity: 0.2;
    width: 48px;
    height: 48px;
    color: #94a3b8;
  }
</style>

  <!-- Main Items JS (all logic) -->
 <script>
    // =============================================================
    // NAV-SIDEBAR INIT
    // =============================================================
    NavSidebar.init({
      basePath: "",
      activePage: "products",
      pageTitle: "Items / Products",
      user: {
        name: "Admin",
        role: "Super Admin",
        avatarUrl: "",
      },
    });

    // =============================================================
    // CONFIG  (only these 3 lines may need adjusting)
    // =============================================================
    var API_BASE = 'http://localhost:9093';                 // e.g. 'http://localhost:9093' when the page is served from another origin
    var AUTH_TOKEN_KEY = 'token';      // localStorage key holding the JWT
    var VENDOR_LIST_URL = '/api/vendor/vendor-list';          // e.g. '/api/vendor/get-all-vendors' once a vendor list endpoint exists

    var EP = {
      products: '/api/products/v1',
      variants: '/api/variants/v1',
      inventory: '/api/inventory/v1',
      warehouses: '/api/warehouses/v1',
      vendorQuickCreate: '/api/vendor/quick-create'
    };

    // =============================================================
    // CORE UTILITIES
    // =============================================================
    function esc(v) {
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // blank -> null, otherwise trimmed string
    function nz(v) {
      if (v === undefined || v === null) return null;
      var s = String(v).trim();
      return s === '' ? null : s;
    }

    // '' -> null, valid number -> number, invalid -> NaN
    function numOrNull(s) {
      if (s === '' || s === null || s === undefined) return null;
      var n = Number(s);
      return isFinite(n) ? n : NaN;
    }

    function val(id) {
      var el = document.getElementById(id);
      return el ? String(el.value).trim() : '';
    }

    function errMsg(e) {
      if (!e) return 'Something went wrong';
      if (e.name === 'TypeError') return 'Cannot reach the server. Please check your connection.';
      return e.message || 'Something went wrong';
    }

    function getAuthToken() {
      try { return localStorage.getItem(AUTH_TOKEN_KEY) || sessionStorage.getItem(AUTH_TOKEN_KEY) || ''; }
      catch (e) { return ''; }
    }

    // Returns the "data" part of the ApiResponse wrapper; throws Error(message) on failure
    async function apiRequest(method, path, body, signal) {
      var headers = { 'Accept': 'application/json' };
      var token = getAuthToken();
      if (token) headers['Authorization'] = 'Bearer ' + token;
      var opts = { method: method, headers: headers };
      if (body !== undefined && body !== null) {
        headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(body);
      }
      if (signal) opts.signal = signal;

      var res = await fetch(API_BASE + path, opts);
      var json = null;
      try { json = await res.json(); } catch (e) { json = null; }

      if (!res.ok) {
        var msg = (json && (json.message || json.error)) || ('Request failed (' + res.status + ')');
        if (res.status === 401) msg = 'Session expired. Please log in again.';
        var err = new Error(msg);
        err.status = res.status;
        throw err;
      }
      return json && json.data !== undefined ? json.data : json;
    }

    // Disables a button while its async action runs (blocks double submits)
    async function withBusy(btn, fn) {
      if (btn) {
        if (btn.dataset.busy === '1') return;
        btn.dataset.busy = '1';
        btn.disabled = true;
        btn.classList.add('opacity-60', 'cursor-not-allowed');
      }
      try { return await fn(); }
      finally {
        if (btn && btn.isConnected) {
          btn.dataset.busy = '';
          btn.disabled = false;
          btn.classList.remove('opacity-60', 'cursor-not-allowed');
        }
      }
    }

    // ---------- SVG Icons (used inside modals/table rows) ----------
    function iconEdit() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>`;
    }
    function iconTrash() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>`;
    }
    function iconEye() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    }
    function iconX() {
      return `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg>`;
    }
    function iconSave() {
      return `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>`;
    }
    function iconBox() {
      return `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>`;
    }
    function iconUser() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;
    }
    function iconTag() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18"/><path d="M5 21V10M10 21V10M14 21V10M19 21V10"/><path d="M2 10l10-6 10 6"/></svg>`;
    }
    function iconSearch() {
      return `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>`;
    }

    // ---------- Toast System (text only, never injects HTML) ----------
    function showToast(message, kind) {
      kind = kind || 'success';
      var wrap = document.getElementById('toastWrap');
      var colors = {
        success: 'bg-green-600',
        info: 'bg-primary',
        warning: 'bg-amber-600',
        error: 'bg-red-600'
      };
      var el = document.createElement('div');
      el.className = 'toast ' + colors[kind] + ' text-white text-sm font-semibold px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 max-w-xs';
      var span = document.createElement('span');
      span.textContent = message;
      el.appendChild(span);
      wrap.appendChild(el);
      setTimeout(function() {
        el.style.transition = 'opacity .3s';
        el.style.opacity = '0';
        setTimeout(function() { el.remove(); }, 300);
      }, kind === 'error' ? 4500 : 2600);
    }

    // ---------- Modal System ----------
    // modalSeq changes on every open/close, so async flows can detect a stale modal and stop.
    var modalSeq = 0;
    var modalPickers = [];

    function destroyPickers() {
      modalPickers.forEach(function(p) { p.destroy(); });
      modalPickers = [];
    }

    function openModal(innerHtml, opts) {
      opts = opts || {};
      destroyPickers();
      modalSeq++;
      var root = document.getElementById('modalRoot');
      root.innerHTML = `
        <div class="fixed inset-0 z-[100] flex items-center justify-center p-4" id="modalOverlay">
          <div class="absolute inset-0 bg-black/40 backdrop-blur-[2px]" id="modalBackdrop"></div>
          <div class="relative bg-white rounded-2xl shadow-2xl w-full ${opts.width || 'max-w-3xl'} max-h-[92vh] overflow-hidden animate-modal">
            ${innerHtml}
          </div>
        </div>`;
      document.getElementById('modalBackdrop').addEventListener('click', closeModal);
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      destroyPickers();
      modalSeq++;
      var root = document.getElementById('modalRoot');
      root.innerHTML = '';
      document.body.style.overflow = '';
    }

    function modalHeader(title, subtitle) {
      return `
        <div class="flex items-start justify-between px-6 py-5 border-b border-gray-300 sticky top-0 bg-white z-10">
          <div>
            <h3 class="text-lg font-bold text-gray-900">${esc(title)}</h3>
            ${subtitle ? '<p class="text-xs text-gray-500 mt-0.5">' + esc(subtitle) + '</p>' : ''}
          </div>
          <button onclick="closeModal()" class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-gray-700 transition">${iconX()}</button>
        </div>`;
    }

    function modalFooter(saveLabel, onSaveAttr, extraBtns) {
      return `
        <div class="flex items-center justify-between gap-2 px-6 py-4 border-t border-gray-100 bg-gray-50 rounded-b-2xl sticky bottom-0">
          <div>${extraBtns || ''}</div>
          <div class="flex gap-2">
            <button onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm font-semibold text-gray-600 border border-gray-200 hover:bg-white transition">Cancel</button>
            <button ${onSaveAttr} class="px-4 py-2 rounded-lg text-sm font-semibold text-white bg-primary hover:bg-primary-dark transition shadow-sm flex items-center gap-1.5">
              ${iconSave()} ${saveLabel}
            </button>
          </div>
        </div>`;
    }

    function openLoadingModal(title, subtitle, width) {
      openModal(
        modalHeader(title, subtitle) +
        '<div class="px-6 py-10 text-center text-sm text-gray-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading…</div>',
        { width: width || 'max-w-2xl' }
      );
      return modalSeq;
    }

    function fld(label, inputHtml, hint) {
      return `
        <div class="mb-3">
          <label class="form-label">${label}</label>
          ${inputHtml}
          ${hint ? '<div class="form-hint">' + hint + '</div>' : ''}
        </div>`;
    }

    function inputBase() { return "form-input"; }

    function fldErr(id) {
      return '<div id="err_' + id + '" class="hidden text-[10.5px] text-red-500 mt-1">This field is required</div>';
    }

    function setFieldError(id, hasError) {
      var el = document.getElementById(id);
      var err = document.getElementById('err_' + id);
      if (el) el.classList.toggle('border-red-500', !!hasError);
      if (err) err.classList.toggle('hidden', !hasError);
    }

    // ---------- Dropdown ----------
    document.addEventListener('click', function(e) {
      if (!e.target.closest('[data-dd-trigger]')) {
        document.querySelectorAll('[data-dd-menu]').forEach(function(m) { m.classList.add('hidden'); });
      }
    });

    function toggleFilterDD() {
      var menu = document.getElementById('filterDD');
      var isHidden = menu.classList.contains('hidden');
      document.querySelectorAll('[data-dd-menu]').forEach(function(m) { m.classList.add('hidden'); });
      if (isHidden) menu.classList.remove('hidden');
    }

    // ---------- Helpers ----------
    function money(n) { return '₹' + Number(n || 0).toLocaleString('en-IN'); }

    function badge(text, color) {
      var map = { green: 'badge-green', amber: 'badge-amber', red: 'badge-red', gray: 'badge-gray' };
      var dot = { green: 'badge-dot-green', amber: 'badge-dot-amber', red: 'badge-dot-red', gray: 'badge-dot-gray' };
      color = map[color] ? color : 'gray';
      return '<span class="badge ' + map[color] + '"><span class="badge-dot ' + dot[color] + '"></span>' + esc(text) + '</span>';
    }

    function rowActionsHtml(editFn, delFn, viewFn) {
      var html = '<div class="flex gap-1">';
      if (viewFn) {
        html += '<button onclick="' + viewFn + '" class="btn-icon-action" title="View">' + iconEye() + '</button>';
      }
      html += '<button onclick="' + editFn + '" class="btn-icon-action" title="Edit">' + iconEdit() + '</button>';
      html += '<button onclick="' + delFn + '" class="btn-icon-action danger" title="Delete">' + iconTrash() + '</button>';
      html += '</div>';
      return html;
    }

    function panelWrap(titleHtml, bodyHtml, extraHead) {
      return `
        <div class="bg-white border border-[#6da84c] rounded-xl shadow-sm overflow-hidden">
          <div class="flex items-center justify-between gap-3 flex-wrap px-5 py-4 border-b border-gray-100">
            <div class="font-bold text-[14.5px] text-gray-800 flex items-center gap-2">${titleHtml}</div>
            ${extraHead || ''}
          </div>
          <div>${bodyHtml}</div>
        </div>`;
    }

    function tableHtml(cols, rowsHtml) {
      var colHeaders = cols.map(function(c) {
        return '<th class="text-left text-[11px] font-bold uppercase tracking-wide text-gray-500 px-4 py-3 whitespace-nowrap">' + c + '</th>';
      }).join('');
      return `
        <div class="overflow-auto h-[370px]">
          <table class="w-full text-[13px]">
            <thead class="sticky top-0">
              <tr class="bg-gray-200 border border-[#6da84c]">${colHeaders}</tr>
            </thead>
            <tbody id="tbody-anchor">${rowsHtml}</tbody>
          </table>
        </div>`;
    }

    // =============================================================
    // STATE + DATA LOADING
    // =============================================================
    var items = [];
    var itemsState = { loading: true, error: '' };
    var tableState = { page: 1, pageSize: 25 };
    var warehouses = [];
    var vendors = [];   // session list; replaced by the API list when VENDOR_LIST_URL is set

    function statusLabel(s) {
      return s === 'green' ? 'In Stock' : s === 'amber' ? 'Low Stock' : 'Reorder';
    }

    // Same thresholds as the backend (> 20 green, > 5 amber, else red); only a fallback
    function stockStatus(qty) {
      qty = Number(qty) || 0;
      return qty > 20 ? 'green' : qty > 5 ? 'amber' : 'red';
    }

    function normalizeProduct(p) {
      var stock = Number(p.productStock) || 0;
      return {
        id: p.productStrId,
        primeId: p.productPrimeId,
        name: p.productName || '',
        sku: p.productSku || '',
        category: p.productCategory || '',
        subCategory: p.productSubCategory || '',
        hsn: p.productHsnCode || '',
        unit: p.productUnit || '',
        height: p.productHeight || '',
        width: p.productWidth || '',
        length: p.productLength || '',
        materialType: p.productMaterialType || '',
        size: p.productSize || '',
        productNumber: p.productNumber || '',
        description: p.productDescription || '',
        sellingPrice: p.productSellingPrice == null ? '' : Number(p.productSellingPrice),
        mrpPrice: p.productMrpPrice == null ? '' : Number(p.productMrpPrice),
        gstRate: p.productGstRate || '',
        vendorName: p.productVendorName || '',
        vendorCompany: p.productVendorCompany || '',
        stock: stock,
        status: p.productStatus || stockStatus(stock)
      };
    }

    function normalizeVendor(v) {
      var name = v.vendorName || v.name || '';
      var company = v.companyName || v.vendorCompany || '';
      return {
        id: v.vendorStrId || v.vendorId || v.id || '',
        vendorName: name,
        companyName: company,
        label: company ? (name ? name + ' — ' + company : company) : (name || 'Unnamed vendor')
      };
    }

    async function loadWarehouses() {
      try {
        var data = await apiRequest('GET', EP.warehouses + '/get-all-warehouses');
        warehouses = (data || []).map(function(w) {
          return {
            id: w.warehouseStrId,
            name: w.warehouseName,
            isDefault: !!w.warehouseIsDefault,
            active: w.warehouseStatus === 'ACTIVE'
          };
        });
      } catch (e) {
        warehouses = [];
        showToast('Could not load warehouses: ' + errMsg(e), 'error');
      }
    }

    function activeWarehouses() { return warehouses.filter(function(w) { return w.active; }); }

    function defaultWarehouseId() {
      var d = warehouses.find(function(w) { return w.isDefault; });
      if (d) return d.id;
      var a = activeWarehouses()[0];
      return a ? a.id : '';
    }

    function getWarehouseName(id) {
      var w = warehouses.find(function(x) { return x.id === id; });
      return w ? w.name : id;
    }

    // Empty list -> a blank option, which makes the server use the default warehouse
    function warehouseOptionsHtml(list, selectedId) {
      if (!list.length) return '<option value="">Default warehouse</option>';
      return list.map(function(w) {
        return '<option value="' + esc(w.id) + '"' + (w.id === selectedId ? ' selected' : '') + '>' +
          esc(w.name) + (w.active ? '' : ' (inactive)') + '</option>';
      }).join('');
    }

    async function loadItems() {
      itemsState.loading = true;
      itemsState.error = '';
      renderItems();
      try {
        var data = await apiRequest('GET', EP.products + '/get-all-products');
        items = (data || []).map(normalizeProduct).sort(function(a, b) { return (b.primeId || 0) - (a.primeId || 0); });
      } catch (e) {
        itemsState.error = errMsg(e);
        if (items.length) showToast('Could not refresh items: ' + itemsState.error, 'error');
      } finally {
        itemsState.loading = false;
        renderItems();
      }
    }

    // =============================================================
    // TABLE, STATS, FILTERS, PAGINATION
    // =============================================================
    function renderStats() {
      document.getElementById('totalItems').textContent = items.length;
      var uniqueCats = new Set(items.map(function(i) { return (i.category || '').trim().toLowerCase(); }).filter(Boolean));
      document.getElementById('totalCategories').textContent = uniqueCats.size;
      var lowStock = items.filter(function(i) { return i.status === 'amber' || i.status === 'red'; });
      document.getElementById('lowStockCount').textContent = lowStock.length;
      var totalVal = items.reduce(function(sum, i) { return sum + (i.stock * (Number(i.sellingPrice) || 0)); }, 0);
      document.getElementById('totalStockValue').textContent = money(totalVal);

      var filterCat = document.getElementById('filterCategory');
      var currentVal = filterCat.value;
      var distinctCats = Array.from(new Set(items.map(function(i) { return i.category; }).filter(Boolean))).sort();
      filterCat.innerHTML = '<option value="all">All Categories</option>' +
        distinctCats.map(function(c) { return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join('');
      filterCat.value = distinctCats.indexOf(currentVal) !== -1 ? currentVal : 'all';
    }

    function getFilteredItems() {
      var searchInput = document.getElementById('searchInput');
      var q = searchInput ? searchInput.value.trim().toLowerCase() : '';
      var cat = document.getElementById('filterCategory').value || 'all';
      var status = document.getElementById('filterStatus').value || 'all';

      return items.filter(function(it) {
        var matchSearch = q.length < 2 ? true : (
          it.name.toLowerCase().indexOf(q) !== -1 ||
          it.sku.toLowerCase().indexOf(q) !== -1 ||
          String(it.id).toLowerCase().indexOf(q) !== -1 ||
          it.hsn.toLowerCase().indexOf(q) !== -1 ||
          it.category.toLowerCase().indexOf(q) !== -1 ||
          it.vendorName.toLowerCase().indexOf(q) !== -1
        );
        var matchCat = cat === 'all' || it.category === cat;
        var matchStatus = status === 'all' || it.status === status;
        return matchSearch && matchCat && matchStatus;
      });
    }

    function renderItems() {
      var filtered = getFilteredItems();
      var total = filtered.length;
      var pages = Math.max(1, Math.ceil(total / tableState.pageSize));
      if (tableState.page > pages) tableState.page = pages;
      var start = (tableState.page - 1) * tableState.pageSize;
      var pageRows = filtered.slice(start, start + tableState.pageSize);

      var rowsHtml = '';
      if (itemsState.loading && items.length === 0) {
        rowsHtml = `<tr><td colspan="8" class="text-center py-10 text-gray-400 text-sm"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading items…</td></tr>`;
      } else if (itemsState.error && items.length === 0) {
        rowsHtml = `
          <tr>
            <td colspan="8" class="text-center py-10 text-sm">
              <div class="text-red-500 mb-2">${esc(itemsState.error)}</div>
              <button onclick="loadItems()" class="text-primary font-semibold hover:underline">Retry</button>
            </td>
          </tr>`;
      } else if (total === 0) {
        rowsHtml = `
          <tr>
            <td colspan="8" class="text-center py-10 text-gray-400 text-sm">
              <div class="flex justify-center mb-2 empty-icon-svg">${iconBox()}</div>
              No items found. Try adjusting your filters or
              <button onclick="openAddItem()" class="text-primary font-semibold hover:underline">add a new item</button>.
            </td>
          </tr>`;
      } else {
        rowsHtml = pageRows.map(function(it) {
          var idAttr = esc(it.id);
          return `
            <tr class="border-b border-gray-400 table-row-hover">
              <td class="px-4 py-3">
                <div class="font-semibold text-gray-800">${esc(it.name)}</div>
                <div class="text-[11.5px] text-gray-400 font-mono">${esc(it.id)}${it.sku ? ' · ' + esc(it.sku) : ''}</div>
              </td>
              <td class="px-4 py-3 text-gray-600">${esc(it.category) || '—'}${it.subCategory ? '<div class="text-[11px] text-gray-400">' + esc(it.subCategory) + '</div>' : ''}</td>
              <td class="px-4 py-3 font-mono font-semibold">${esc(it.stock)}${it.unit ? ' <span class="text-[10.5px] text-gray-400 font-sans">' + esc(it.unit) + '</span>' : ''}</td>
              <td class="px-4 py-3 text-[11px] text-gray-500">${esc(it.vendorName) || '—'}${it.vendorCompany ? '<div class="text-gray-400">' + esc(it.vendorCompany) + '</div>' : ''}</td>
              <td class="px-4 py-3 font-mono font-semibold">${money(it.sellingPrice)}</td>
              <td class="px-4 py-3 font-mono text-gray-500">${it.gstRate ? esc(it.gstRate) + '%' : '—'}</td>
              <td class="px-4 py-3">${badge(statusLabel(it.status), it.status)}</td>
              <td class="px-4 py-3">${rowActionsHtml(
                "editItem('" + idAttr + "')",
                "delItem('" + idAttr + "')",
                "viewItem('" + idAttr + "')"
              )}</td>
            </tr>`;
        }).join('');
      }

      var from = total === 0 ? 0 : start + 1;
      var to = Math.min(start + tableState.pageSize, total);
      var footer = `
        <div class="flex items-center justify-between flex-wrap gap-2 px-5 py-3 border-t border-gray-100 text-[12px] text-gray-500">
          <span>Showing ${from}–${to} of ${total}</span>
          <div class="flex items-center gap-2">
            <button onclick="goTablePage(-1)" ${tableState.page <= 1 ? 'disabled' : ''} class="px-3 py-1 rounded-lg border border-gray-200 bg-white hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed">Prev</button>
            <span>Page ${tableState.page} / ${pages}</span>
            <button onclick="goTablePage(1)" ${tableState.page >= pages ? 'disabled' : ''} class="px-3 py-1 rounded-lg border border-gray-200 bg-white hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed">Next</button>
          </div>
        </div>`;

      var sizes = [10, 25, 50, 100].map(function(n) {
        return '<option value="' + n + '"' + (n === tableState.pageSize ? ' selected' : '') + '>' + n + '</option>';
      }).join('');

      var panelHtml = panelWrap(
        'All Items <span class="text-[11px] font-bold bg-primary-soft text-primary-dark px-2 py-0.5 rounded-full ml-1">' + total + '</span>',
        tableHtml(['Item', 'Category', 'Stock', 'Vendor', 'Price', 'GST', 'Status', 'Actions'], rowsHtml) + footer,
        '<div class="flex items-center gap-2"><span class="text-[11px] text-gray-400">Show:</span><select onchange="changePageSize(this.value)" class="text-[12px] border border-[#6da84c] rounded-lg px-2 py-1 bg-white outline-none">' + sizes + '</select></div>'
      );

      document.getElementById('itemsPanel').innerHTML = panelHtml;
      renderStats();
    }

    function goTablePage(delta) {
      tableState.page = Math.max(1, tableState.page + delta);
      renderItems();
    }

    function changePageSize(v) {
      tableState.pageSize = Number(v) || 25;
      tableState.page = 1;
      renderItems();
    }

    function filterItems() { tableState.page = 1; renderItems(); }

    function clearFilters() {
      document.getElementById('filterCategory').value = 'all';
      document.getElementById('filterStatus').value = 'all';
      var searchInput = document.getElementById('searchInput');
      if (searchInput) searchInput.value = '';
      tableState.page = 1;
      renderItems();
      toggleFilterDD();
    }

    // =============================================================
    // PRODUCT PICKER  (debounced search + infinite scroll over get-product-list)
    // mode 'product': only products are selectable (variants shown for reference)
    // mode 'stock'  : products and variants are both selectable
    // =============================================================
    function createProductPicker(cfg) {
      var inputEl = document.getElementById(cfg.inputId);
      var listEl = document.getElementById(cfg.listId);
      if (!inputEl || !listEl) return null;

      var PAGE_SIZE = 20;
      var destroyed = false;
      var st = {
        query: '', nextPage: 0, hasNext: true, loading: false, started: false,
        error: '', reqId: 0, controller: null, rows: [], selectedKey: '', timer: null
      };

      function pKey(pid) { return 'p:' + pid; }
      function vKey(vid) { return 'v:' + vid; }

      function render() {
        if (destroyed) return;
        var html = '';
        st.rows.forEach(function(p) {
          var sel = st.selectedKey === pKey(p.productStrId);
          var meta = [p.productUnit, p.productSize].filter(Boolean).join(' · ');
          var sub = [meta, p.productSellingPrice != null ? money(p.productSellingPrice) : '', p.productVendorName].filter(Boolean).join(' · ');
          html += '<div data-pick="product" data-pid="' + esc(p.productStrId) + '" class="px-3 py-2 text-[12.5px] cursor-pointer ' + (sel ? 'bg-primary-soft' : 'hover:bg-gray-50') + '">' +
            '<div class="flex items-center  justify-between gap-2"><span class="font-semibold text-gray-700 truncate">' + esc(p.productName) + '</span>' +
            '<span class="text-gray-400 font-mono text-[11px] whitespace-nowrap">' + esc(p.productStrId) + '</span></div>' +
            (sub ? '<div class="text-[11px] text-gray-400">' + esc(sub) + '</div>' : '') + '</div>';

          (p.variants || []).forEach(function(v) {
            var selectable = cfg.mode === 'stock';
            var vSel = st.selectedKey === vKey(v.variantStrId);
            var price = v.variantSellingPrice != null ? v.variantSellingPrice : p.productSellingPrice;
            var vMeta = [v.variantSku, v.variantSize, price != null ? money(price) : ''].filter(Boolean).join(' · ');
            html += '<div data-pick="variant border-b border-gray-300" data-pid="' + esc(p.productStrId) + '" data-vid="' + esc(v.variantStrId) + '" class="pl-8 pr-3 py-1.5 text-[12px] ' +
              (selectable ? 'cursor-pointer ' + (vSel ? 'bg-primary-soft' : 'hover:bg-gray-50') : 'text-gray-500') + '">' +
              '<span class="text-gray-600 mr-1">↳ VAR :</span><span class="font-semibold text-gray-600">' + esc(v.variantName || 'Unnamed variant') + '</span>' +
              (vMeta ? ' <span class="text-[11px] text-gray-500">' + esc(vMeta) + '</span>' : '') + '</div>';
          });
        });

        if (st.error) {
          html += '<div data-retry="1" class="px-3 py-2 text-[12px] text-red-500 cursor-pointer">' + esc(st.error) + ' — click to retry</div>';
        } else if (st.loading) {
          html += '<div class="text-center py-3 text-gray-400 text-[12px]"><i class="fa-solid fa-spinner fa-spin mr-1"></i>Loading…</div>';
        } else if (st.started && st.rows.length === 0) {
          html += '<div class="text-center py-4 text-gray-400 text-[12.5px]">No matching products</div>';
        } else if (st.rows.length && !st.hasNext) {
          html += '<div class="text-center py-2 text-gray-300 text-[11px]">End of list</div>';
        }
        listEl.innerHTML = html;

        // short first page that does not fill the box: keep loading (only while the list is visible)
        if (st.started && st.hasNext && !st.loading && !st.error && listEl.offsetParent !== null &&
            listEl.scrollHeight <= listEl.clientHeight + 4) {
          loadNext();
        }
      }

      function reset() {
        st.reqId++;
        if (st.controller) st.controller.abort();
        st.rows = [];
        st.nextPage = 0;
        st.hasNext = true;
        st.loading = false;
        st.error = '';
        listEl.scrollTop = 0;
      }

      async function loadNext() {
        if (destroyed || st.loading || !st.hasNext || st.error) return;
        st.loading = true;
        var myReq = st.reqId;
        var ctrl = new AbortController();
        st.controller = ctrl;
        render();
        try {
          var qs = '?page=' + st.nextPage + '&size=' + PAGE_SIZE + (st.query ? '&search=' + encodeURIComponent(st.query) : '');
          var data = await apiRequest('GET', EP.products + '/get-product-list' + qs, null, ctrl.signal);
          if (destroyed || myReq !== st.reqId) return;
          st.rows = st.rows.concat((data && data.content) || []);
          st.hasNext = !!(data && data.hasNext);
          if (st.hasNext && data.nextPage != null) st.nextPage = data.nextPage;
        } catch (e) {
          if (destroyed || e.name === 'AbortError' || myReq !== st.reqId) return;
          st.error = errMsg(e);
        } finally {
          if (!destroyed && myReq === st.reqId) { st.loading = false; render(); }
        }
      }

      listEl.addEventListener('scroll', function() {
        if (listEl.scrollTop + listEl.clientHeight >= listEl.scrollHeight - 40) loadNext();
      });

      listEl.addEventListener('click', function(e) {
        if (e.target.closest('[data-retry]')) { st.error = ''; loadNext(); return; }
        var el = e.target.closest('[data-pick]');
        if (!el || !listEl.contains(el)) return;
        var kind = el.getAttribute('data-pick');
        if (kind === 'variant' && cfg.mode !== 'stock') return;
        var pid = el.getAttribute('data-pid');
        var product = st.rows.find(function(p) { return p.productStrId === pid; });
        if (!product) return;
        var variant = null;
        if (kind === 'variant') {
          var vid = el.getAttribute('data-vid');
          variant = (product.variants || []).find(function(v) { return v.variantStrId === vid; }) || null;
          if (!variant) return;
          st.selectedKey = vKey(vid);
        } else {
          st.selectedKey = pKey(pid);
        }
        render();
        cfg.onSelect({ kind: kind, product: product, variant: variant });
      });

      inputEl.addEventListener('input', function() {
        clearTimeout(st.timer);
        st.timer = setTimeout(function() {
          var q = inputEl.value.trim();
          if (q.length === 1) return;          // wait for at least 2 characters
          if (q === st.query && st.started) return;
          st.query = q;
          reset();
          st.started = true;
          loadNext();
        }, 300);
      });

      return {
        activate: function() { if (!st.started) { st.started = true; loadNext(); } },
        clearSelection: function() { st.selectedKey = ''; render(); },
        destroy: function() { destroyed = true; clearTimeout(st.timer); if (st.controller) st.controller.abort(); }
      };
    }

    // =============================================================
    // VIEW ITEM
    // =============================================================
    async function viewItem(id) {
      var it = items.find(function(x) { return x.id === id; });
      if (!it) return;
      var seq = openLoadingModal('Item Details — ' + it.name, it.id + (it.sku ? ' · ' + it.sku : ''), 'max-w-2xl');

      var results = await Promise.allSettled([
        apiRequest('GET', EP.inventory + '/get-product-stock/' + encodeURIComponent(id)),
        apiRequest('GET', EP.variants + '/get-variants-by-product/' + encodeURIComponent(id))
      ]);
      if (seq !== modalSeq) return;

      var stockSummary = results[0].status === 'fulfilled' ? results[0].value : null;
      var variantList = results[1].status === 'fulfilled' ? (results[1].value || []) : null;
      var totalStock = stockSummary ? stockSummary.totalStock : it.stock;

      var whHtml;
      if (!stockSummary) {
        whHtml = '<div class="text-[12px] text-red-500">Could not load warehouse stock: ' + esc(errMsg(results[0].reason)) + '</div>';
      } else if (!stockSummary.warehouses || !stockSummary.warehouses.length) {
        whHtml = '<div class="text-[12px] text-gray-400">No stock recorded yet.</div>';
      } else {
        whHtml = '<div class="border border-gray-300 rounded-lg divide-y divide-gray-300">' +
          stockSummary.warehouses.map(function(r) {
            return '<div class="px-3 py-2 text-sm flex items-center justify-between"><span class="font-semibold">' + esc(r.warehouseName) +
              '</span><span class="font-mono font-semibold">' + esc(r.productStock) + ' ' + esc(it.unit) + '</span></div>';
          }).join('') + '</div>';
      }

      var variantHtml;
      if (variantList === null) {
        variantHtml = '<div class="text-[12px] text-red-500">Could not load variants: ' + esc(errMsg(results[1].reason)) + '</div>';
      } else if (!variantList.length) {
        variantHtml = '<div class="text-[12px] text-gray-400">No variants.</div>';
      } else {
        variantHtml = '<div class="border border-gray-300 rounded-lg divide-y divide-gray-300">' +
          variantList.map(function(v) {
            var meta = [v.variantSku, v.variantSize, v.variantSellingPrice != null ? 'Sell ' + money(v.variantSellingPrice) : '', v.variantMrpPrice != null ? 'MRP ' + money(v.variantMrpPrice) : ''].filter(Boolean).join(' · ');
            return '<div class="px-3 py-2 text-sm flex items-center justify-between gap-3"><div><div class="font-semibold">' + esc(v.variantName || 'Unnamed Variant') +
              '</div><div class="text-[11px] text-gray-500 font-mono">' + esc(v.variantStrId) + (meta ? ' · ' + esc(meta) : '') + '</div></div>' +
              '<span class="font-mono font-semibold whitespace-nowrap">' + esc(v.variantStock == null ? 0 : v.variantStock) + ' ' + esc(v.variantUnit || it.unit) + '</span></div>';
          }).join('') + '</div>';
      }

      var cell = function(label, valueHtml) {
        return '<div><span class="text-gray-500">' + label + '</span><br>' + valueHtml + '</div>';
      };
      var strong = function(t) { return '<span class="font-semibold">' + (esc(t) || '—') + '</span>'; };

      var modalContent = `
        ${modalHeader('Item Details — ' + it.name, it.id + (it.sku ? ' · ' + it.sku : ''))}
        <div class="px-6 py-4 modal-scroll">
          <div class="grid grid-cols-2 gap-4 text-sm p-3 rounded-lg border border-gray-300">
            ${cell('Category', strong(it.category))}
            ${cell('Sub Category', strong(it.subCategory))}
            ${cell('HSN/SAC', '<span class="font-mono font-semibold">' + (esc(it.hsn) || '—') + '</span>')}
            ${cell('Unit', strong(it.unit))}
            ${cell('Status', badge(statusLabel(it.status), it.status))}
            ${cell('Total Stock (all warehouses)', '<span class="font-semibold">' + esc(totalStock) + ' ' + esc(it.unit) + '</span>')}
            ${cell('Selling Price', '<span class="font-semibold text-primary">' + money(it.sellingPrice) + '</span>')}

    function buildVariantRowHtml(idx) {

    function addVariantRow() {
      var rowsWrap = document.getElementById('variantRowsWrap');
      if (!rowsWrap) return;
      var idx = variantRowCounter++;
      rowsWrap.insertAdjacentHTML('beforeend', buildVariantRowHtml(idx));
    }

    function removeVariantRow(idx) {
      var rowsWrap = document.getElementById('variantRowsWrap');
      if (!rowsWrap) return;
      var row = rowsWrap.querySelector('.variant-row[data-idx="' + idx + '"]');
      if (row) row.remove();
      if (rowsWrap.children.length === 0) addVariantRow();   // always keep one row to fill in
    }

    async function saveVariant(btn) {
      if (!variantTarget) { showToast('Please select a product first', 'error'); return; }

      var rows = Array.prototype.slice.call(document.querySelectorAll('#variantRowsWrap .variant-row'));
      var entries = [];
      var invalid = '';

      rows.forEach(function(row, n) {
        var idx = row.dataset.idx;
        var get = function(f) { return val('v_' + f + '_' + idx); };
        var textFields = ['variantName', 'sku', 'height', 'width', 'length', 'unit', 'materialType', 'size',
                          'productNumber', 'variantCategory', 'variantSubCategory', 'sellingPrice', 'mrpPrice', 'stock'];
        var isEmpty = textFields.every(function(f) { return get(f) === ''; });
        if (isEmpty) return;   // untouched row

        var name = get('variantName');
        var selling = numOrNull(get('sellingPrice'));
        var mrp = numOrNull(get('mrpPrice'));
        var stock = numOrNull(get('stock'));
        if (!name) { invalid = invalid || ('Variant name is required (row ' + (n + 1) + ')'); setFieldError('v_variantName_' + idx, true); return; }
        setFieldError('v_variantName_' + idx, false);
        [selling, mrp, stock].forEach(function(x) {
          if (Number.isNaN(x) || (x !== null && x < 0)) invalid = invalid || ('Prices and stock must be valid non-negative numbers (row ' + (n + 1) + ')');
        });

        entries.push({
          row: row,
          label: name,
          payload: {
            productStrId: variantTarget.productStrId,
            variantName: name,
            variantSku: nz(get('sku')),
            variantHeight: nz(get('height')),
            variantWidth: nz(get('width')),
            variantLength: nz(get('length')),
            variantUnit: nz(get('unit')),
            variantMaterialType: nz(get('materialType')),
            variantSize: nz(get('size')),
            variantProductNumber: nz(get('productNumber')),
            variantCategory: nz(get('variantCategory')),
            variantSubCategory: nz(get('variantSubCategory')),
            variantSellingPrice: selling,
            variantMrpPrice: mrp,
            variantStock: stock,
            warehouseStrId: nz(val('v_warehouse_' + idx))
          }
        });
      });

      if (invalid) { showToast(invalid, 'error'); return; }
      if (entries.length === 0) { showToast('Fill in at least one variant before saving', 'error'); return; }

      var seq = modalSeq;
      var target = variantTarget;
      await withBusy(btn, async function() {
        var ok = 0;
        var failures = [];
        // sequential, so one bad row (e.g. duplicate SKU) does not hide the result of the others
        for (var i = 0; i < entries.length; i++) {
          try {
            await apiRequest('POST', EP.variants + '/create-variant', entries[i].payload);
            ok++;
            if (seq === modalSeq && entries[i].row.isConnected) entries[i].row.remove();
          } catch (e) {
            failures.push(entries[i].label + ': ' + errMsg(e));
          }
        }
        if (ok > 0) showToast(ok + ' variant(s) added to ' + target.name, 'success');
        if (failures.length) showToast(failures[0] + (failures.length > 1 ? ' (+' + (failures.length - 1) + ' more failed)' : ''), 'error');

        if (seq === modalSeq) {
          var rowsWrap = document.getElementById('variantRowsWrap');
          if (rowsWrap && rowsWrap.children.length === 0) addVariantRow();
        }
      });
    }

    // =============================================================
    // SAVE / DELETE ITEM
    // =============================================================
    async function saveItem(btn) {
      var ctx = itemModalCtx;
      var name = val('f_name');
      var stockRaw = val('f_stock');

      var nameMissing = !name;
      var stockMissing = !ctx.isEdit && stockRaw === '';
      setFieldError('f_name', nameMissing);
      setFieldError('f_stock', stockMissing);
      if (nameMissing || stockMissing) { showToast('Please fill the required fields', 'error'); return; }

      var selling = numOrNull(val('f_selling'));
      var mrp = numOrNull(val('f_mrp'));
      var stock = numOrNull(stockRaw);
      var bad = [selling, mrp, stock].some(function(x) { return Number.isNaN(x) || (x !== null && x < 0); });
      if (bad) { showToast('Prices and stock must be valid non-negative numbers', 'error'); return; }

      var payload = {
        productName: name,
        productSku: nz(val('f_sku')),
        productCategory: nz(val('f_category')),
        productSubCategory: nz(val('f_subcategory')),
        productHsnCode: nz(val('f_hsn')),
        productUnit: nz(val('f_unit')),
        productHeight: nz(val('f_height')),
        productWidth: nz(val('f_width')),
        productLength: nz(val('f_length')),
        productMaterialType: nz(val('f_materialType')),
        productSize: nz(val('f_size')),
        productNumber: nz(val('f_productNumber')),
        productDescription: nz(val('f_description')),
        productSellingPrice: selling,
        productMrpPrice: mrp,
        productGstRate: nz(val('f_gst')),
        productVendorName: nz(val('f_vendorName')),
        productVendorCompany: nz(val('f_vendorCompany'))
      };

      var wh = nz(val('f_warehouse'));
      if (ctx.isEdit) {
        // send stock only when it really changed for the selected warehouse
        if (stock !== null) {
          var original = Number(ctx.stockByWh[wh] || 0);
          if (stock !== original) { payload.productStock = stock; payload.warehouseStrId = wh; }
        }
      } else {
        payload.productStock = stock;
        payload.warehouseStrId = wh;
      }

      await withBusy(btn, async function() {
        try {
          if (ctx.isEdit) {
            await apiRequest('PATCH', EP.products + '/patch-product/' + encodeURIComponent(ctx.id), payload);
          } else {
            await apiRequest('POST', EP.products + '/create-product', payload);
          }
          closeModal();
          showToast(ctx.isEdit ? 'Item updated successfully' : 'Item added successfully', 'success');
          await loadItems();
        } catch (e) {
          showToast(errMsg(e), 'error');
        }
      });
    }

    function delItem(id) {
      var it = items.find(function(x) { return x.id === id; });
      if (!it) return;

      var modalContent = `
        ${modalHeader('Delete Item', it.name)}
        <div class="px-6 py-4 text-sm text-gray-600">
          <p>Are you sure you want to permanently delete <b class="text-gray-800">${esc(it.name)}</b>?</p>
          <p class="text-gray-400 text-[12px] mt-1">Its variants and stock in every warehouse will be deleted too. Stock history is kept. This action cannot be undone.</p>
        </div>
        ${modalFooter('Delete', 'onclick="confirmDeleteItem(\'' + esc(id) + '\', this)"', '')}
      `;
      openModal(modalContent, { width: 'max-w-md' });
    }

    async function fetchVendorList() {
      if (!VENDOR_LIST_URL) return vendors;
      try {
        var data = await apiRequest('GET', VENDOR_LIST_URL);
        var list = Array.isArray(data) ? data : ((data && data.content) || []);
        vendors = list.map(normalizeVendor).filter(function(v) { return v.id || v.vendorName || v.companyName; });
      } catch (e) {
        showToast('Could not load vendors: ' + errMsg(e), 'error');
      }
      return vendors;
    }

    async function openVendorPurchase() {
      var seq = openLoadingModal('Vendor Purchase', 'Select a vendor to start a purchase', 'max-w-lg');
      var vendorList = await fetchVendorList();
      if (seq !== modalSeq) return;
      renderVendorPurchaseModal(vendorList);
    }

    function selectedVendor() {
      var sel = document.getElementById('f_vendorPurchase');
      if (!sel || !sel.value) return null;
      return vendors.find(function(v) { return v.id === sel.value; }) || null;
    }

    function renderVendorPurchaseModal(vendorList, selectVendorId) {
      vpTarget = null;
      var vendorOptions = vendorList.map(function(v) {
        return '<option ' + (v.id === selectVendorId ? 'selected' : '') + ' value="' + esc(v.id) + '">' + esc(v.label) + '</option>';
      }).join('');
      var activeWh = activeWarehouses();
      var defWh = defaultWarehouseId();

      var modalContent = `
        ${modalHeader('Vendor Purchase', 'Select a vendor to start a purchase')}
        <div class="px-6 py-5 modal-scroll">
          <div class="flex items-end gap-2">
            <div class="flex-1">
              ${fld('Vendor', '<select id="f_vendorPurchase" class="' + inputBase() + '">' + vendorOptions + '</select>', vendorList.length ? '' : 'No vendors yet — use Add New Vendor')}
            </div>
          </div>

          <div class="flex flex-wrap gap-2 mb-1">
            <button onclick="toggleAddVendorForm()" class="inline-flex items-center gap-1.5 bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 text-[12px] font-semibold px-3 py-2 rounded-lg transition whitespace-nowrap">
              ${iconUser()} Add New Vendor
            </button>
            <button onclick="toggleAddItemForm()" class="inline-flex items-center gap-1.5 bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 text-[12px] font-semibold px-3 py-2 rounded-lg transition whitespace-nowrap">
              ${iconBox()} Add Item
            </button>
          </div>

          <div id="addVendorFormWrap" class="hidden mt-2 pt-4 border-t border-gray-100">
            <div class="text-[12.5px] font-semibold text-gray-700 mb-2">New Vendor</div>
            ${fld('Vendor Name <span class="required">*</span>', '<input id="nv_vendorName" placeholder="e.g. Rajesh Kumar" class="' + inputBase() + '">')}
            ${fld('Company Name', '<input id="nv_companyName" placeholder="e.g. Global Imports Inc." class="' + inputBase() + '">')}
            ${fld('Phone', '<input id="nv_phone" type="tel" placeholder="e.g. 9876543210" class="' + inputBase() + '">')}
            <button onclick="saveNewVendor(this)" class="inline-flex items-center gap-1.5 bg-primary hover:bg-primary-dark text-white text-[12.5px] font-semibold px-4 py-2 rounded-lg transition">
              ${iconSave()} Save Vendor
            </button>
          </div>

          <div id="addItemFormWrap" class="hidden mt-2 pt-4 border-t border-gray-100">
            <div class="text-[12.5px] font-semibold text-gray-700 mb-2">Add Item <span class="font-normal text-gray-400">— adds directly to your product inventory</span></div>

            <div class="flex gap-2 mb-3">
              <button type="button" id="vpModeBtn_new" onclick="switchVpItemMode('new')" class="modal-tab-btn active" style="border:1px solid #e5e7eb; border-radius:8px; padding:6px 12px;">New Item</button>
              <button type="button" id="vpModeBtn_existing" onclick="switchVpItemMode('existing')" class="modal-tab-btn" style="border:1px solid #e5e7eb; border-radius:8px; padding:6px 12px;">Existing Item / Variant</button>
            </div>

            <!-- ============ NEW ITEM PANEL ============ -->
            <div id="vpNewItemPanel">
              <div class="grid grid-cols-2 gap-3">
                <div class="mb-3">
                  <label class="form-label">Item Name <span class="required">*</span></label>
                  <input id="vp_name" placeholder="e.g. Centrifugal Blower — 5HP" class="${inputBase()}">
                  ${fldErr('vp_name')}
                </div>
                ${fld('SKU / Code', '<input id="vp_sku" placeholder="e.g. BLW-5HP-001" class="' + inputBase() + '">')}
              </div>
              <div class="grid grid-cols-2 gap-3">
                ${fld('Category', '<input id="vp_category" placeholder="e.g. Blowers" class="' + inputBase() + '">')}
                ${fld('Sub Category', '<input id="vp_subcategory" placeholder="e.g. Industrial Blowers" class="' + inputBase() + '">')}
              </div>
              <div class="grid grid-cols-2 gap-3">
                ${fld('HSN / SAC Code', '<input id="vp_hsn" class="' + inputBase() + '">')}
                ${fld('Unit', '<input id="vp_unit" placeholder="e.g. Pcs / Kg / Ltr" class="' + inputBase() + '">')}
              </div>
              <div class="grid grid-cols-3 gap-3">
                ${fld('Height', '<input id="vp_height" class="' + inputBase() + '">')}
                ${fld('Width', '<input id="vp_width" class="' + inputBase() + '">')}
                ${fld('Length', '<input id="vp_length" class="' + inputBase() + '">')}
              </div>
              <div class="grid grid-cols-3 gap-3">
                ${fld('Material Type', '<input id="vp_materialType" class="' + inputBase() + '">')}
                ${fld('Size', '<input id="vp_size" class="' + inputBase() + '">')}
                ${fld('Product Number', '<input id="vp_productNumber" class="' + inputBase() + '">')}
              </div>
              <div class="grid grid-cols-2 gap-3">
                ${fld('Selling Price (₹)', '<input id="vp_selling" type="number" min="0" step="any" class="' + inputBase() + '">')}
                ${fld('MRP Price (₹)', '<input id="vp_mrp" type="number" min="0" step="any" class="' + inputBase() + '">')}
              </div>
              <div class="grid grid-cols-2 gap-3">
                ${fld('GST Rate (%)', '<input id="vp_gst" placeholder="e.g. 18" class="' + inputBase() + '">')}
                <div class="mb-3">
                  <label class="form-label">Opening Stock <span class="required">*</span></label>
                  <input id="vp_stock" type="number" min="0" step="any" class="${inputBase()}">
                  ${fldErr('vp_stock')}
                </div>
              </div>
              ${fld('Warehouse', '<select id="vp_warehouse" class="' + inputBase() + '">' + warehouseOptionsHtml(activeWh, defWh) + '</select>')}
              ${fld('Description', '<textarea id="vp_description" rows="2" class="' + inputBase() + '" placeholder="Brief description"></textarea>')}

              <div class="form-hint mb-2">Only Item Name and Stock are required. The selected vendor is saved on the item.</div>
              <button onclick="saveVendorPurchaseItem(this)" class="inline-flex items-center gap-1.5 bg-primary hover:bg-primary-dark text-white text-[12.5px] font-semibold px-4 py-2 rounded-lg transition">
                ${iconSave()} Save Item to Inventory
              </button>
            </div>

            <!-- ============ EXISTING ITEM / VARIANT PANEL ============ -->
            <div id="vpExistingItemPanel" class="hidden">
              <div class="mb-3">
                <label class="form-label">Search Existing Product</label>
                <div class="relative">
                  <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">${iconSearch()}</span>
                  <input id="vpExistingSearch" autocomplete="off" placeholder="Search by name, SKU, ID or variant… (min 2 letters)" class="${inputBase()}" style="padding-left:34px;">
                </div>
              </div>
              <div id="vpExistingProductList" class="border border-gray-200 rounded-lg divide-y divide-gray-300 max-h-48 overflow-y-auto"></div>

              <div id="vpExistingStockFormWrap" class="hidden mt-4 pt-4 border-t border-gray-100">
                <div class="flex items-center justify-between mb-1">
                  <div class="text-[12.5px] font-semibold text-gray-700">Adding stock for: <span id="vpExistingProductName" class="text-primary"></span></div>
                  <button onclick="clearVpExistingSelection()" class="text-[11px] text-gray-400 hover:text-gray-600">${iconX()} Change</button>
                </div>
                <div id="vpExistingStockInfo" class="text-[11.5px] text-gray-500 mb-3"></div>
                <div class="grid grid-cols-2 gap-3">
                  <div class="mb-3">
                    <label class="form-label">Add Stock Qty <span class="required">*</span></label>
                    <input id="vpExistingQty" type="number" min="0" step="any" placeholder="e.g. 25" class="${inputBase()}">
                    ${fldErr('vpExistingQty')}
                  </div>
                  ${fld('Warehouse', '<select id="vpExistingWarehouse" class="' + inputBase() + '">' + warehouseOptionsHtml(activeWh, defWh) + '</select>')}
                </div>
                <div class="form-hint mb-2">This adds to the current stock of the selected warehouse — it will not create a duplicate product.</div>
                <button onclick="saveVpExistingStock(this)" class="inline-flex items-center gap-1.5 bg-primary hover:bg-primary-dark text-white text-[12.5px] font-semibold px-4 py-2 rounded-lg transition">
                  ${iconSave()} Add Stock to Inventory
                </button>
              </div>
            </div>
          </div>
        </div>
        ${modalFooter('Proceed', 'onclick="proceedVendorPurchase()"')}
      `;
      openModal(modalContent, { width: 'max-w-lg' });

      vpPicker = createProductPicker({
        inputId: 'vpExistingSearch',
        listId: 'vpExistingProductList',
        mode: 'stock',
        onSelect: onVpTargetSelected
      });
      if (vpPicker) modalPickers.push(vpPicker);
    }

    function toggleAddVendorForm() {
      var wrap = document.getElementById('addVendorFormWrap');
      if (wrap) wrap.classList.toggle('hidden');
    }

    function toggleAddItemForm() {
      var wrap = document.getElementById('addItemFormWrap');
      if (wrap) wrap.classList.toggle('hidden');
    }

    function switchVpItemMode(mode) {
      var newPanel = document.getElementById('vpNewItemPanel');
      var existingPanel = document.getElementById('vpExistingItemPanel');
      var newBtn = document.getElementById('vpModeBtn_new');
      var existingBtn = document.getElementById('vpModeBtn_existing');
      if (!newPanel || !existingPanel) return;

      if (mode === 'existing') {
        newPanel.classList.add('hidden');
        existingPanel.classList.remove('hidden');
        newBtn.classList.remove('active');
        existingBtn.classList.add('active');
        if (vpPicker) vpPicker.activate();
      } else {
        newPanel.classList.remove('hidden');
        existingPanel.classList.add('hidden');
        newBtn.classList.add('active');
        existingBtn.classList.remove('active');
      }
    }

    function onVpTargetSelected(sel) {
      var isVariant = sel.kind === 'variant';
      vpTarget = {
        kind: sel.kind,
        productStrId: sel.product.productStrId,
        variantStrId: isVariant ? sel.variant.variantStrId : null,
        label: isVariant
          ? sel.product.productName + ' — ' + (sel.variant.variantName || 'Variant') + ' (' + sel.variant.variantStrId + ')'
          : sel.product.productName + ' (' + sel.product.productStrId + ')',
        unit: (isVariant && sel.variant.variantUnit) || sel.product.productUnit || '',
        seq: ++vpTargetSeq
      };
      document.getElementById('vpExistingStockFormWrap').classList.remove('hidden');
      document.getElementById('vpExistingProductName').textContent = vpTarget.label;
      loadVpTargetStock();
    }

    async function loadVpTargetStock() {
      var info = document.getElementById('vpExistingStockInfo');
      var target = vpTarget;
      if (!info || !target) return;
      info.textContent = 'Loading current stock…';
      try {
        var isVariant = target.kind === 'variant';
        var path = (isVariant ? '/get-variant-stock/' : '/get-product-stock/') + encodeURIComponent(isVariant ? target.variantStrId : target.productStrId);
        var s = await apiRequest('GET', EP.inventory + path);
        if (!vpTarget || vpTarget.seq !== target.seq) return;
        var parts = (s.warehouses || []).map(function(r) { return r.warehouseName + ': ' + r.productStock; });
        info.textContent = 'Current total stock: ' + s.totalStock + ' ' + target.unit + (parts.length ? '  (' + parts.join(', ') + ')' : '');
      } catch (e) {
        if (!vpTarget || vpTarget.seq !== target.seq) return;
        info.textContent = 'Could not load current stock: ' + errMsg(e);
      }
    }

    function clearVpExistingSelection() {
      vpTarget = null;
      var formWrap = document.getElementById('vpExistingStockFormWrap');
      if (formWrap) formWrap.classList.add('hidden');
      if (vpPicker) vpPicker.clearSelection();
    }

    async function saveVpExistingStock(btn) {
      if (!vpTarget) { showToast('Please select a product or variant first', 'error'); return; }

      var qty = numOrNull(val('vpExistingQty'));
      var qtyBad = qty === null || Number.isNaN(qty) || qty <= 0;
      setFieldError('vpExistingQty', qtyBad);
      if (qtyBad) { showToast('Please enter a valid quantity', 'error'); return; }

      var target = vpTarget;
      var vendor = selectedVendor();
      var body = {
        changeQty: qty,
        warehouseStrId: nz(val('vpExistingWarehouse')),
        source: 'VENDOR_PURCHASE',
        remarks: vendor ? 'Vendor purchase: ' + vendor.label : 'Vendor purchase'
      };
      var isVariant = target.kind === 'variant';
      var path = isVariant
        ? '/add-variant-stock/' + encodeURIComponent(target.variantStrId)
        : '/add-stock/' + encodeURIComponent(target.productStrId);

      await withBusy(btn, async function() {
        try {
          await apiRequest('PATCH', EP.inventory + path, body);
          showToast('Added ' + qty + ' stock to ' + target.label, 'success');
          var qtyEl = document.getElementById('vpExistingQty');
          if (qtyEl) qtyEl.value = '';
          setFieldError('vpExistingQty', false);
          clearVpExistingSelection();
          var searchEl = document.getElementById('vpExistingSearch');
          if (searchEl) searchEl.value = '';
          loadItems();   // refresh the main table in the background
        } catch (e) {
          showToast(errMsg(e), 'error');
        }
      });
    }

    async function saveVendorPurchaseItem(btn) {
      var name = val('vp_name');
      var stockRaw = val('vp_stock');
      var nameMissing = !name;
      var stockMissing = stockRaw === '';
      setFieldError('vp_name', nameMissing);
      setFieldError('vp_stock', stockMissing);
      if (nameMissing || stockMissing) { showToast('Please fill the required fields', 'error'); return; }

      var stock = numOrNull(stockRaw);
      var selling = numOrNull(val('vp_selling'));
      var mrp = numOrNull(val('vp_mrp'));
      var bad = [stock, selling, mrp].some(function(x) { return Number.isNaN(x) || (x !== null && x < 0); });
      if (bad) { showToast('Prices and stock must be valid non-negative numbers', 'error'); return; }

      var vendor = selectedVendor();
      var payload = {
        productName: name,
        productSku: nz(val('vp_sku')),
        productCategory: nz(val('vp_category')),
        productSubCategory: nz(val('vp_subcategory')),
        productHsnCode: nz(val('vp_hsn')),
        productUnit: nz(val('vp_unit')),
        productHeight: nz(val('vp_height')),
        productWidth: nz(val('vp_width')),
        productLength: nz(val('vp_length')),
        productMaterialType: nz(val('vp_materialType')),
        productSize: nz(val('vp_size')),
        productNumber: nz(val('vp_productNumber')),
        productDescription: nz(val('vp_description')),
        productSellingPrice: selling,
        productMrpPrice: mrp,
        productGstRate: nz(val('vp_gst')),
        productVendorName: vendor ? nz(vendor.vendorName) : null,
        productVendorCompany: vendor ? nz(vendor.companyName) : null,
        productStock: stock,
        warehouseStrId: nz(val('vp_warehouse'))
      };

      await withBusy(btn, async function() {
        try {
          await apiRequest('POST', EP.products + '/create-product', payload);
          showToast('Item added to inventory', 'success');

          document.getElementById('addItemFormWrap').classList.add('hidden');
          ['vp_name', 'vp_sku', 'vp_category', 'vp_subcategory', 'vp_hsn', 'vp_unit', 'vp_height', 'vp_width', 'vp_length',
           'vp_materialType', 'vp_size', 'vp_productNumber', 'vp_selling', 'vp_mrp', 'vp_gst', 'vp_stock', 'vp_description'].forEach(function(id) {
            var el = document.getElementById(id);
            if (el) el.value = '';
          });
          setFieldError('vp_name', false);
          setFieldError('vp_stock', false);
          loadItems();   // refresh the main table in the background
        } catch (e) {
          showToast(errMsg(e), 'error');
        }
      });
    }

    async function saveNewVendor(btn) {
      var vendorName = val('nv_vendorName');
      var companyName = val('nv_companyName');
      var phone = val('nv_phone');

      if (!vendorName) { showToast('Vendor name is required', 'error'); return; }
      if (phone && !/^[0-9+\-\s]{7,15}$/.test(phone)) { showToast('Please enter a valid phone number', 'error'); return; }

      await withBusy(btn, async function() {
        try {
          var data = await apiRequest('POST', EP.vendorQuickCreate, {
            vendorName: vendorName,
            companyName: companyName,
            phone: phone
          });
          var v = normalizeVendor(data && typeof data === 'object' ? data : {});
          if (!v.vendorName) v.vendorName = vendorName;
          if (!v.companyName) v.companyName = companyName;
          v.label = v.companyName ? v.vendorName + ' — ' + v.companyName : v.vendorName;
          if (!v.id) v.id = 'new-' + Date.now();

          vendors = vendors.filter(function(x) { return x.id !== v.id; });
          vendors.push(v);

          showToast('Vendor added', 'success');
          renderVendorPurchaseModal(vendors, v.id);
        } catch (e) {
          showToast(errMsg(e), 'error');
        }
      });
    }

    function proceedVendorPurchase() {
      var vendor = selectedVendor();
      if (!vendor) {
        showToast('Please select a vendor', 'error');
        return;
      }
      closeModal();
      showToast('Starting purchase for ' + vendor.label, 'info');
      // Hook up navigation to the Purchase Bill screen here once available.
    }

    // =============================================================
    // SEARCH (debounced, min 2 characters, client-side over the loaded list)
    // =============================================================
    var searchDebounceTimer = null;

    function onSearchInput() {
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(function() {
        tableState.page = 1;
        renderItems();
      }, 300);
    }

    // Add search input to top bar
    (function addSearchToTopbar() {
      var searchContainer = document.querySelector('.app-main header');
      if (searchContainer) {
        var searchHtml = `
          <div class="hidden sm:flex flex-1 max-w-[420px] relative ml-4">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">${iconSearch()}</span>
            <input type="text" id="searchInput" placeholder="Search items by name, SKU, HSN… (min 2 letters)"
              oninput="onSearchInput()"
              class="w-full border border-gray-200 bg-gray-50 focus:bg-white rounded-lg pl-9 pr-3 py-2 text-[13px] outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition placeholder:text-gray-400">
          </div>
        `;
        var headerContent = searchContainer.innerHTML;
        var hamburgerIndex = headerContent.indexOf('lg:hidden');
        if (hamburgerIndex !== -1) {
          var firstDivEnd = headerContent.indexOf('</div>', hamburgerIndex) + 6;
          var before = headerContent.substring(0, firstDivEnd);
          var after = headerContent.substring(firstDivEnd);
          searchContainer.innerHTML = before + searchHtml + after;
        }
      }
    })();

    // =============================================================
    // INIT
    // =============================================================
    renderItems();
    Promise.all([loadWarehouses(), loadItems()]);
</script>

</body>
</html>
