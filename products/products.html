<!-- Page-specific styles -->
<style>
  /* Form styles */
  .form-input {
    width: 100%;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    background: #fafafa;
    color: #1a1a2e;
  }
  .form-input:focus {
    border-color: #6da84c;
    box-shadow: 0 0 0 3px rgba(109, 168, 76, 0.15);
    background: #ffffff;
  }
  .form-label {
    font-size: 11.5px;
    font-weight: 600;
    color: #374151;
    display: block;
    margin-bottom: 4px;
  }
  .form-label .required { color: #ef4444; margin-left: 2px; }
  .form-hint { font-size: 10.5px; color: #9ca3af; margin-top: 3px; }

  /* Badge */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
  }
  .badge-green { background: #dcfce7; color: #166534; }
  .badge-amber { background: #fef3c7; color: #92400e; }
  .badge-red { background: #fee2e2; color: #991b1b; }
  .badge-gray { background: #f1f5f9; color: #475569; }
  .badge-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    display: inline-block;
  }
  .badge-dot-green { background: #22c55e; }
  .badge-dot-amber { background: #f59e0b; }
  .badge-dot-red { background: #ef4444; }
  .badge-dot-gray { background: #94a3b8; }

  /* Stats card */
  .stat-card {
    border: 1px solid #7dc057;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .stat-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
  }
  .stat-icon-wrap {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }

  /* Table row hover */
  .table-row-hover:hover {
    background: #f8fafc;
  }

  /* Modal tabs */
  .modal-tab-btn {
    transition: all 0.2s ease;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 500;
    border-bottom: 2px solid transparent;
    color: #6b7280;
    cursor: pointer;
    background: transparent;
    display: flex;
    gap: 8px;
  }
  .modal-tab-btn.active {
    color: #6da84c;
    border-bottom-color: #6da84c;
  }
  .modal-tab-btn:hover:not(.active) {
    color: #1f2937;
    border-bottom-color: #d1d5db;
  }
  .modal-tab-panel { display: none; }
  .modal-tab-panel.active { display: block; animation: fadeIn 0.25s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.96) translateY(6px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .animate-modal { animation: modalIn 0.18s ease; }

  /* Action buttons */
  .btn-icon-action {
    transition: all 0.15s ease;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #94a3b8;
    background: transparent;
    border: none;
    cursor: pointer;
  }
  .btn-icon-action:hover {
    background: #f1f5f9;
    color: #6da84c;
  }
  .btn-icon-action.danger:hover {
    background: #fee2e2;
    color: #ef4444;
  }

  /* Toast */
  .toast {
    animation: fadeIn 0.2s ease;
  }
  .toast-success { background: #16a34a; }
  .toast-error { background: #dc2626; }
  .toast-warning { background: #f59e0b; }
  .toast-info { background: #6da84c; }

  /* Scrollbar for modal */
  .modal-scroll {
    max-height: 60vh;
    overflow-y: auto;
  }
  .modal-scroll::-webkit-scrollbar {
    width: 4px;
  }
  .modal-scroll::-webkit-scrollbar-thumb {
    background: #d1d5db;
    border-radius: 4px;
  }

  /* Empty state */
  .empty-icon-svg {
    opacity: 0.2;
    width: 48px;
    height: 48px;
    color: #94a3b8;
  }
</style>

                <div class="text-[10.5px] font-semibold uppercase tracking-wider text-gray-500">Categories</div>

  <!-- Main Items JS (all logic) -->
  <script>
    // =============================================================
    // NAV-SIDEBAR INIT
    // =============================================================
    NavSidebar.init({
      basePath: "",
      activePage: "products",
      pageTitle: "Items / Products",
      user: {
        name: "Admin",
        role: "Super Admin",
        avatarUrl: "",
      },
    });

    // =============================================================
    // ITEMS MODULE — Complete Logic
    // =============================================================

    // ---------- SVG Icons (used inside modals/table rows) ----------
    function iconEdit() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>`;
    }
    function iconTrash() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>`;
    }
    function iconEye() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    }
    function iconX() {
      return `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg>`;
    }
    function iconSave() {
      return `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>`;
    }
    function iconBox() {
      return `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>`;
    }
    function iconUser() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;
    }
    function iconTag() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18"/><path d="M5 21V10M10 21V10M14 21V10M19 21V10"/><path d="M2 10l10-6 10 6"/></svg>`;
    }
    function iconSearch() {
      return `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>`;
    }

    // ---------- Toast System ----------
    function showToast(message, kind) {
      kind = kind || 'success';
      var wrap = document.getElementById('toastWrap');
      var colors = {
        success: 'bg-green-600',
        info: 'bg-primary',
        warning: 'bg-amber-600',
        error: 'bg-red-600'
      };
      var el = document.createElement('div');
      el.className = 'toast ' + colors[kind] + ' text-white text-sm font-semibold px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 max-w-xs';
      el.innerHTML = '<span>' + message + '</span>';
      wrap.appendChild(el);
      setTimeout(function() {
        el.style.transition = 'opacity .3s';
        el.style.opacity = '0';
        setTimeout(function() { el.remove(); }, 300);
      }, 2600);
    }

    // ---------- Modal System ----------
    function openModal(innerHtml, opts) {
      opts = opts || {};
      var root = document.getElementById('modalRoot');
      root.innerHTML = `
        <div class="fixed inset-0 z-[100] flex items-center justify-center p-4" id="modalOverlay">
          <div class="absolute inset-0 bg-black/40 backdrop-blur-[2px]" id="modalBackdrop"></div>
          <div class="relative bg-white rounded-2xl shadow-2xl w-full ${opts.width || 'max-w-3xl'} max-h-[92vh] overflow-hidden animate-modal">
            ${innerHtml}
          </div>
        </div>`;
      document.getElementById('modalBackdrop').addEventListener('click', closeModal);
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      var root = document.getElementById('modalRoot');
      root.innerHTML = '';
      document.body.style.overflow = '';
    }

    function modalHeader(title, subtitle) {
      return `
        <div class="flex items-start justify-between px-6 py-5 border-b border-gray-100 sticky top-0 bg-white z-10">
          <div>
            <h3 class="text-lg font-bold text-gray-900">${title}</h3>
            ${subtitle ? '<p class="text-xs text-gray-500 mt-0.5">' + subtitle + '</p>' : ''}
          </div>
          <button onclick="closeModal()" class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-gray-700 transition">${iconX()}</button>
        </div>`;
    }

    function modalFooter(saveLabel, onSaveAttr, extraBtns) {
      return `
        <div class="flex items-center justify-between gap-2 px-6 py-4 border-t border-gray-100 bg-gray-50 rounded-b-2xl sticky bottom-0">
          <div>${extraBtns || ''}</div>
          <div class="flex gap-2">
            <button onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm font-semibold text-gray-600 border border-gray-200 hover:bg-white transition">Cancel</button>
            <button ${onSaveAttr} class="px-4 py-2 rounded-lg text-sm font-semibold text-white bg-primary hover:bg-primary-dark transition shadow-sm flex items-center gap-1.5">
              ${iconSave()} ${saveLabel}
            </button>
          </div>
        </div>`;
    }

    function fld(label, inputHtml, hint) {
      return `
        <div class="mb-3">
          <label class="form-label">${label}</label>
          ${inputHtml}
          ${hint ? '<div class="form-hint">' + hint + '</div>' : ''}
        </div>`;
    }

    function inputBase() { return "form-input"; }

    // ---------- Dropdown ----------
    document.addEventListener('click', function(e) {
      if (!e.target.closest('[data-dd-trigger]')) {
        document.querySelectorAll('[data-dd-menu]').forEach(function(m) { m.classList.add('hidden'); });
      }
    });

    function toggleFilterDD() {
      var menu = document.getElementById('filterDD');
      var isHidden = menu.classList.contains('hidden');
      document.querySelectorAll('[data-dd-menu]').forEach(function(m) { m.classList.add('hidden'); });
      if (isHidden) menu.classList.remove('hidden');
    }

    // ---------- Helpers ----------
    function money(n) { return '₹' + Number(n || 0).toLocaleString('en-IN'); }

    function badge(text, color) {
      var map = { green: 'badge-green', amber: 'badge-amber', red: 'badge-red', gray: 'badge-gray' };
      var dot = { green: 'badge-dot-green', amber: 'badge-dot-amber', red: 'badge-dot-red', gray: 'badge-dot-gray' };
      return '<span class="badge ' + map[color] + '"><span class="badge-dot ' + dot[color] + '"></span>' + text + '</span>';
    }

    function rowActionsHtml(editFn, delFn, viewFn) {
      var html = '<div class="flex gap-1">';
      if (viewFn) {
        html += '<button onclick="' + viewFn + '" class="btn-icon-action" title="View">' + iconEye() + '</button>';
      }
      html += '<button onclick="' + editFn + '" class="btn-icon-action" title="Edit">' + iconEdit() + '</button>';
      html += '<button onclick="' + delFn + '" class="btn-icon-action danger" title="Delete">' + iconTrash() + '</button>';
      html += '</div>';
      return html;
    }

    function panelWrap(titleHtml, bodyHtml, extraHead) {
      return `
        <div class="bg-white border border-[#6da84c] rounded-xl shadow-sm overflow-hidden">
          <div class="flex items-center justify-between gap-3 flex-wrap px-5 py-4 border-b border-gray-100">
            <div class="font-bold text-[14.5px] text-gray-800 flex items-center gap-2">${titleHtml}</div>
            ${extraHead || ''}
          </div>
          <div>${bodyHtml}</div>
        </div>`;
    }

    function tableHtml(cols, rowsHtml) {
      var colHeaders = cols.map(function(c) {
        return '<th class="text-left text-[11px] font-bold uppercase tracking-wide text-gray-500 px-4 py-3 whitespace-nowrap">' + c + '</th>';
      }).join('');
      return `
        <div class="overflow-auto h-[370px]">
          <table class="w-full text-[13px]">
            <thead class="sticky top-0">
              <tr class="bg-gray-50 border-b border-gray-200">${colHeaders}</tr>
            </thead>
            <tbody id="tbody-anchor">${rowsHtml}</tbody>
          </table>
        </div>`;
    }

    // =============================================================
    // DATA (only 2 dummy items retained)
    // =============================================================

    var warehouses = [
      { id: 'WH-001', name: 'Main Warehouse - Mumbai' },
      { id: 'WH-002', name: 'Branch Warehouse - Pune' },
      { id: 'WH-003', name: 'Storage - Bhiwandi' },
    ];

    // Fallback dummy vendors — replace with live API data (see fetchVendorList below)
    var vendors = [
      { id: 'VEN-001', name: 'Global Imports Inc.' },
      { id: 'VEN-002', name: 'Local Supplier Co.' },
    ];

    var items = [{
      id: 'ITM-1001',
      name: 'Centrifugal Blower — 5HP',
      sku: 'BLW-5HP-001',
      category: 'Blowers',
      subCategory: 'Industrial Blowers',
      hsn: '9503',
      unit: 'Pcs',
      sellingPrice: 42000,
      mrpPrice: 45000,
      gstRate: '18',
      stock: 48,
      warehouse: 'WH-001',
      description: 'Heavy duty industrial blower',
      status: 'green'
    }, {
      id: 'ITM-1002',
      name: 'Dual Media Filter Vessel — 500L',
      sku: 'FIL-500L-002',
      category: 'Filtration',
      subCategory: 'Filter Vessels',
      hsn: '8421',
      unit: 'Pcs',
      sellingPrice: 118000,
      mrpPrice: 125000,
      gstRate: '18',
      stock: 6,
      warehouse: 'WH-001',
      description: '500L capacity filtration vessel',
      status: 'amber'
    }];

    // Variant field id -> label map (also reused for the product's own extra spec fields)
    var variantSpecFields = [
      { id: 'height', label: 'Height' },
      { id: 'width', label: 'Width' },
      { id: 'length', label: 'Length' },
      { id: 'materialType', label: 'Material Type' },
      { id: 'size', label: 'Size' },
      { id: 'productNumber', label: 'Product Number' }
    ];

    var nextItemNo = 1003;

    // =============================================================
    // FUNCTIONS
    // =============================================================

    function statusLabel(s) {
      return s === 'green' ? 'In Stock' : s === 'amber' ? 'Low Stock' : 'Reorder';
    }

    // No reorder-level field anymore — derive status purely from stock quantity
    function stockStatus(qty) {
      qty = Number(qty) || 0;
      return qty > 20 ? 'green' : qty > 5 ? 'amber' : 'red';
    }

    function getWarehouseName(id) {
      var w = warehouses.find(function(x) { return x.id === id; });
      return w ? w.name : id;
    }

    function renderStats() {
      document.getElementById('totalItems').textContent = items.length;
      var uniqueCats = new Set(items.map(function(i) { return (i.category || '').trim().toLowerCase(); }).filter(Boolean));
      document.getElementById('totalCategories').textContent = uniqueCats.size;
      var lowStock = items.filter(function(i) { return i.status === 'amber' || i.status === 'red'; });
      document.getElementById('lowStockCount').textContent = lowStock.length;
      var totalVal = items.reduce(function(sum, i) { return sum + (i.stock * i.sellingPrice); }, 0);
      document.getElementById('totalStockValue').textContent = money(totalVal);

      var filterCat = document.getElementById('filterCategory');
      var currentVal = filterCat.value;
      var distinctCats = Array.from(new Set(items.map(function(i) { return i.category; }).filter(Boolean))).sort();
      filterCat.innerHTML = '<option value="all">All Categories</option>';
      distinctCats.forEach(function(c) {
        filterCat.innerHTML += '<option value="' + c + '">' + c + '</option>';
      });
      filterCat.value = currentVal;
    }

    function getFilteredItems() {
      var searchInput = document.getElementById('searchInput');
      var q = searchInput ? searchInput.value.trim().toLowerCase() : '';
      var cat = document.getElementById('filterCategory').value || 'all';
      var status = document.getElementById('filterStatus').value || 'all';

      return items.filter(function(it) {
        var matchSearch = q.length < 2 ? true : (
          it.name.toLowerCase().indexOf(q) !== -1 ||
          it.sku.toLowerCase().indexOf(q) !== -1 ||
          it.id.toLowerCase().indexOf(q) !== -1 ||
          it.hsn.indexOf(q) !== -1
        );
        var matchCat = cat === 'all' || it.category === cat;
        var matchStatus = status === 'all' || it.status === status;
        return matchSearch && matchCat && matchStatus;
      });
    }

    // ---------- Add Variant tab helpers ----------
    function renderVariantProductList() {
      var wrap = document.getElementById('variantProductList');
      if (!wrap) return;
      var q = (document.getElementById('variantProductSearch') || {}).value || '';
      q = q.trim().toLowerCase();
      var matches = items.filter(function(it) {
        return q.length === 0 ||
          it.name.toLowerCase().indexOf(q) !== -1 ||
          it.sku.toLowerCase().indexOf(q) !== -1;
      });
      if (matches.length === 0) {
        wrap.innerHTML = '<div class="text-center py-4 text-gray-400 text-[12.5px]">No matching products</div>';
        return;
      }
      wrap.innerHTML = matches.map(function(it) {
        var isSel = it.id === variantSelectedProductId;
        return '<div onclick="selectVariantProduct(\'' + it.id + '\')" class="px-3 py-2 text-[12.5px] cursor-pointer flex items-center justify-between ' + (isSel ? 'bg-primary-soft' : 'hover:bg-gray-50') + '">' +
          '<span class="font-semibold text-gray-700">' + it.name + '</span>' +
          '<span class="text-gray-400 font-mono">' + it.sku + '</span></div>';
      }).join('');
    }

    function selectVariantProduct(itemId) {
      variantSelectedProductId = itemId;
      var it = items.find(function(x) { return x.id === itemId; });
      renderVariantProductList();
      var formWrap = document.getElementById('variantFormWrap');
      if (!it || !formWrap) return;
      formWrap.classList.remove('hidden');
      document.getElementById('variantForProductName').textContent = it.name + ' (' + it.sku + ')';

      // start fresh with a single blank variant row
      variantRowCounter = 0;
      document.getElementById('variantRowsWrap').innerHTML = '';
      addVariantRow();
    }

    function clearVariantSelection() {
      variantSelectedProductId = null;
      var formWrap = document.getElementById('variantFormWrap');
      if (formWrap) formWrap.classList.add('hidden');
      var rowsWrap = document.getElementById('variantRowsWrap');
      if (rowsWrap) rowsWrap.innerHTML = '';
      variantRowCounter = 0;
      renderVariantProductList();
    }

    // ---------- Multiple variant rows (one product can have many variants) ----------
    var variantRowCounter = 0;

    function buildVariantRowHtml(idx) {
      return `
        <div class="variant-row border border-gray-200 rounded-lg p-3 relative" data-idx="${idx}">
          <button onclick="removeVariantRow(${idx})" class="absolute top-2 right-2 text-gray-400 hover:text-red-500 transition" title="Remove this variant">${iconX()}</button>
          <div class="grid grid-cols-2 gap-3 pr-6">
            ${fld('Variant Name', '<input id="v_variantName_' + idx + '" placeholder="e.g. Red / Large" class="' + inputBase() + '">')}
            ${fld('SKU', '<input id="v_sku_' + idx + '" placeholder="e.g. BLW-5HP-001-RED-L" class="' + inputBase() + '">')}
          </div>
          <div class="grid grid-cols-3 gap-3">
            ${fld('Height', '<input id="v_height_' + idx + '" class="' + inputBase() + '">')}
            ${fld('Width', '<input id="v_width_' + idx + '" class="' + inputBase() + '">')}
            ${fld('Length', '<input id="v_length_' + idx + '" class="' + inputBase() + '">')}
          </div>
          <div class="grid grid-cols-2 gap-3">
            ${fld('Unit', '<input id="v_unit_' + idx + '" placeholder="e.g. Pcs" class="' + inputBase() + '">')}
            ${fld('Material Type', '<input id="v_materialType_' + idx + '" class="' + inputBase() + '">')}
          </div>
          <div class="grid grid-cols-2 gap-3">
            ${fld('Size', '<input id="v_size_' + idx + '" class="' + inputBase() + '">')}
            ${fld('Product Number', '<input id="v_productNumber_' + idx + '" class="' + inputBase() + '">')}
          </div>
          <div class="grid grid-cols-2 gap-3">
            ${fld('Variant Category', '<input id="v_variantCategory_' + idx + '" class="' + inputBase() + '">')}
            ${fld('Variant Sub Category', '<input id="v_variantSubCategory_' + idx + '" class="' + inputBase() + '">')}
          </div>
        </div>`;
    }

    function addVariantRow() {
      var rowsWrap = document.getElementById('variantRowsWrap');
      if (!rowsWrap) return;
      var idx = variantRowCounter++;
      rowsWrap.insertAdjacentHTML('beforeend', buildVariantRowHtml(idx));
    }

    function removeVariantRow(idx) {
      var rowsWrap = document.getElementById('variantRowsWrap');
      if (!rowsWrap) return;
      var row = rowsWrap.querySelector('.variant-row[data-idx="' + idx + '"]');
      if (row) row.remove();
      // always keep at least one row available to fill in
      if (rowsWrap.children.length === 0) addVariantRow();
    }

    function saveVariant() {
      if (!variantSelectedProductId) {
        showToast('Please select a product first', 'error');
        return;
      }
      var it = items.find(function(x) { return x.id === variantSelectedProductId; });
      if (!it) return;

      var rows = document.querySelectorAll('#variantRowsWrap .variant-row');
      var addedCount = 0;
      it.variants = it.variants || [];

      rows.forEach(function(row) {
        var idx = row.dataset.idx;
        var get = function(field) {
          var el = document.getElementById('v_' + field + '_' + idx);
          return el ? el.value.trim() : '';
        };
        var variant = {
          variantName: get('variantName'),
          sku: get('sku'),
          height: get('height'),
          width: get('width'),
          length: get('length'),
          unit: get('unit'),
          materialType: get('materialType'),
          size: get('size'),
          productNumber: get('productNumber'),
          variantCategory: get('variantCategory'),
          variantSubCategory: get('variantSubCategory')
        };
        // skip a row that was left completely empty
        var isEmpty = Object.keys(variant).every(function(k) { return !variant[k]; });
        if (!isEmpty) {
          it.variants.push(variant);
          addedCount++;
        }
      });

      if (addedCount === 0) {
        showToast('Fill in at least one variant before saving', 'error');
        return;
      }

      showToast(addedCount + ' variant(s) added to ' + it.name, 'success');

      // reset back to a single blank row for the next batch
      variantRowCounter = 0;
      document.getElementById('variantRowsWrap').innerHTML = '';
      addVariantRow();
    }

    function saveItem(existingId) {
      var name = document.getElementById('f_name') ? document.getElementById('f_name').value.trim() : '';
      var sku = document.getElementById('f_sku') ? document.getElementById('f_sku').value.trim() : '';
      var category = document.getElementById('f_category') ? document.getElementById('f_category').value.trim() : '';
      var subCategory = document.getElementById('f_subcategory') ? document.getElementById('f_subcategory').value.trim() : '';
      var hsn = document.getElementById('f_hsn') ? document.getElementById('f_hsn').value.trim() : '';
      var unit = document.getElementById('f_unit') ? document.getElementById('f_unit').value.trim() : '';
      var height = document.getElementById('f_height') ? document.getElementById('f_height').value.trim() : '';
      var width = document.getElementById('f_width') ? document.getElementById('f_width').value.trim() : '';
      var length = document.getElementById('f_length') ? document.getElementById('f_length').value.trim() : '';
      var materialType = document.getElementById('f_materialType') ? document.getElementById('f_materialType').value.trim() : '';
      var size = document.getElementById('f_size') ? document.getElementById('f_size').value.trim() : '';
      var productNumber = document.getElementById('f_productNumber') ? document.getElementById('f_productNumber').value.trim() : '';
      var sellingPrice = document.getElementById('f_selling') ? parseFloat(document.getElementById('f_selling').value) || 0 : 0;
      var mrpPrice = document.getElementById('f_mrp') ? parseFloat(document.getElementById('f_mrp').value) || 0 : 0;
      var gstRate = document.getElementById('f_gst') ? document.getElementById('f_gst').value.trim() : '';
      var stockRaw = document.getElementById('f_stock') ? document.getElementById('f_stock').value.trim() : '';
      var stock = stockRaw === '' ? '' : (parseInt(stockRaw) || 0);
      var warehouse = document.getElementById('f_warehouse') ? document.getElementById('f_warehouse').value || 'WH-001' : 'WH-001';
      var description = document.getElementById('f_description') ? document.getElementById('f_description').value || '' : '';

      // Only Item Name and Total Stock are mandatory
      var nameMissing = !name;
      var stockMissing = stockRaw === '';
      setFieldError('f_name', nameMissing);
      setFieldError('f_stock', stockMissing);

      if (nameMissing || stockMissing) {
        showToast('Please fill the required fields', 'error');
        return;
      }

      if (existingId) {
        var it = items.find(function(x) { return x.id === existingId; });
        if (it) {
          it.name = name;
          it.sku = sku;
          it.category = category;
          it.subCategory = subCategory;
          it.hsn = hsn;
          it.unit = unit;
          it.height = height;
          it.width = width;
          it.length = length;
          it.materialType = materialType;
          it.size = size;
          it.productNumber = productNumber;
          it.sellingPrice = sellingPrice;
          it.mrpPrice = mrpPrice;
          it.gstRate = gstRate;
          it.stock = stock;
          it.warehouse = warehouse;
          it.description = description;
          it.status = stockStatus(stock);
          showToast('Item updated successfully', 'success');
        }
      } else {
        var newItem = {
          id: 'ITM-' + (nextItemNo++),
          name: name,
          sku: sku,
          category: category,
          subCategory: subCategory,
          hsn: hsn,
          unit: unit,
          height: height,
          width: width,
          length: length,
          materialType: materialType,
          size: size,
          productNumber: productNumber,
          sellingPrice: sellingPrice,
          mrpPrice: mrpPrice,
          gstRate: gstRate,
          stock: stock,
          warehouse: warehouse,
          description: description,
          variants: [],
          status: stockStatus(stock)
        };
        items.unshift(newItem);
        showToast('Item added successfully', 'success');
      }

      closeModal();
      renderItems();
    }

    function delItem(id) {
      var it = items.find(function(x) { return x.id === id; });
      if (!it) return;

      var modalContent = `
        ${modalHeader('Delete Item', it.name)}
        <div class="px-6 py-4 text-sm text-gray-600">
          <p>Are you sure you want to permanently delete <b class="text-gray-800">${it.name}</b>?</p>
          <p class="text-gray-400 text-[12px] mt-1">This action cannot be undone. All associated transactions will be affected.</p>
        </div>
        ${modalFooter('Delete', 'onclick="confirmDeleteItem(\'' + id + '\')"', '')}
      `;
      openModal(modalContent, { width: 'max-w-md' });
    }

    function confirmDeleteItem(id) {
      items = items.filter(function(x) { return x.id !== id; });
      closeModal();
      renderItems();
      showToast('Item deleted successfully', 'warning');
    }

    // =============================================================
    // VENDOR PURCHASE (select vendor overlay)
    // =============================================================

    // TODO: replace fallback with live API once backend endpoint is ready.
    async function fetchVendorList() {
      try {
        // const res = await fetch('/api/vendors'); // <-- enable this when the vendors API is live
        // if (!res.ok) throw new Error('Vendor API failed');
        // const data = await res.json();
        // return data;
        throw new Error('Vendor API not wired up yet — using fallback list');
      } catch (err) {

    async function openVendorPurchase() {
      var loadingContent = `
        ${modalHeader('Vendor Purchase', 'Select a vendor to start a purchase')}
        <div class="px-6 py-10 text-center text-sm text-gray-400">Loading vendors…</div>
        ${modalFooter('Proceed', 'disabled class="px-4 py-2 rounded-lg text-sm font-semibold text-white bg-gray-300 cursor-not-allowed flex items-center gap-1.5"')}
      `;
      openModal(loadingContent, { width: 'max-w-lg' });

      var vendorList = await fetchVendorList();
      renderVendorPurchaseModal(vendorList);
    }

    function renderVendorPurchaseModal(vendorList, selectVendorId) {
      var vendorOptions = vendorList.map(function(v) {
        return '<option ' + (v.id === selectVendorId ? 'selected' : '') + ' value="' + v.id + '">' + v.name + '</option>';
      }).join('');

      var modalContent = `
        ${modalHeader('Vendor Purchase', 'Select a vendor to start a purchase')}
        <div class="px-6 py-5 modal-scroll">
          <div class="flex items-end gap-2">
            <div class="flex-1">
              ${fld('Vendor', '<select id="f_vendorPurchase" class="' + inputBase() + '">' + vendorOptions + '</select>', vendorList.length ? '' : 'No vendors found')}
            </div>
          </div>

          <div class="flex flex-wrap gap-2 mb-1">
            <button onclick="toggleAddVendorForm()" class="inline-flex items-center gap-1.5 bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 text-[12px] font-semibold px-3 py-2 rounded-lg transition whitespace-nowrap">
              ${iconUser()} Add New Vendor
            </button>
            <button onclick="toggleAddItemForm()" class="inline-flex items-center gap-1.5 bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 text-[12px] font-semibold px-3 py-2 rounded-lg transition whitespace-nowrap">
              ${iconBox()} Add Item
            </button>
          </div>

          <div id="addVendorFormWrap" class="hidden mt-2 pt-4 border-t border-gray-100">
            <div class="text-[12.5px] font-semibold text-gray-700 mb-2">New Vendor</div>
            ${fld('Vendor Name', '<input id="nv_vendorName" placeholder="e.g. Rajesh Kumar" class="' + inputBase() + '">')}
            ${fld('Company Name', '<input id="nv_companyName" placeholder="e.g. Global Imports Inc." class="' + inputBase() + '">')}
            ${fld('Phone', '<input id="nv_phone" type="tel" placeholder="e.g. 9876543210" class="' + inputBase() + '">')}
            <button onclick="saveNewVendor()" class="inline-flex items-center gap-1.5 bg-primary hover:bg-primary-dark text-white text-[12.5px] font-semibold px-4 py-2 rounded-lg transition">
              ${iconSave()} Save Vendor
            </button>
          </div>

          <div id="addItemFormWrap" class="hidden mt-2 pt-4 border-t border-gray-100">
            <div class="text-[12.5px] font-semibold text-gray-700 mb-2">Add Item <span class="font-normal text-gray-400">— adds directly to your product inventory</span></div>

            <!-- New vs Existing mode switch -->
            <div class="flex gap-2 mb-3">
              <button type="button" id="vpModeBtn_new" onclick="switchVpItemMode('new')" class="modal-tab-btn active" style="border:1px solid #e5e7eb; border-radius:8px; padding:6px 12px;">New Item</button>
              <button type="button" id="vpModeBtn_existing" onclick="switchVpItemMode('existing')" class="modal-tab-btn" style="border:1px solid #e5e7eb; border-radius:8px; padding:6px 12px;">Existing Item</button>
            </div>

            <!-- ============ NEW ITEM PANEL ============ -->
            <div id="vpNewItemPanel">
              <div class="grid grid-cols-2 gap-3">
                <div class="mb-3">
                  <label class="form-label">Item Name <span class="required">*</span></label>
                  <input id="vp_name" placeholder="e.g. Centrifugal Blower — 5HP" class="${inputBase()}">
                  ${fldErr('vp_name')}
                </div>
                ${fld('SKU / Code', '<input id="vp_sku" placeholder="e.g. BLW-5HP-001" class="' + inputBase() + '">')}
              </div>
              <div class="grid grid-cols-2 gap-3">
                ${fld('Category', '<input id="vp_category" placeholder="e.g. Blowers" class="' + inputBase() + '">')}
                ${fld('Sub Category', '<input id="vp_subcategory" placeholder="e.g. Industrial Blowers" class="' + inputBase() + '">')}
              </div>
              <div class="grid grid-cols-2 gap-3">
                ${fld('HSN / SAC Code', '<input id="vp_hsn" class="' + inputBase() + '">')}
                ${fld('Unit', '<input id="vp_unit" placeholder="e.g. Pcs / Kg / Ltr" class="' + inputBase() + '">')}
              </div>
              <div class="grid grid-cols-3 gap-3">
                ${fld('Height', '<input id="vp_height" class="' + inputBase() + '">')}
                ${fld('Width', '<input id="vp_width" class="' + inputBase() + '">')}
                ${fld('Length', '<input id="vp_length" class="' + inputBase() + '">')}
              </div>
              <div class="grid grid-cols-3 gap-3">
                ${fld('Material Type', '<input id="vp_materialType" class="' + inputBase() + '">')}
                ${fld('Size', '<input id="vp_size" class="' + inputBase() + '">')}
                ${fld('Product Number', '<input id="vp_productNumber" class="' + inputBase() + '">')}
              </div>
              <div class="grid grid-cols-2 gap-3">
                ${fld('Selling Price (₹)', '<input id="vp_selling" type="number" class="' + inputBase() + '">')}
                ${fld('MRP Price (₹)', '<input id="vp_mrp" type="number" class="' + inputBase() + '">')}
              </div>
              <div class="grid grid-cols-2 gap-3">
                ${fld('GST Rate (%)', '<input id="vp_gst" placeholder="e.g. 18" class="' + inputBase() + '">')}
                <div class="mb-3">
                  <label class="form-label">Total Stock <span class="required">*</span></label>
                  <input id="vp_stock" type="number" class="${inputBase()}">
                  ${fldErr('vp_stock')}
                </div>
              </div>
              ${fld('Warehouse', '<select id="vp_warehouse" class="' + inputBase() + '">' + warehouses.map(function(w) { return '<option value="' + w.id + '">' + w.name + '</option>'; }).join('') + '</select>')}
              ${fld('Description', '<textarea id="vp_description" rows="2" class="' + inputBase() + '" placeholder="Brief description"></textarea>')}

              <div class="form-hint mb-2">Only Item Name and Total Stock are required — rest can be filled in later by editing the item.</div>
              <button onclick="saveVendorPurchaseItem()" class="inline-flex items-center gap-1.5 bg-primary hover:bg-primary-dark text-white text-[12.5px] font-semibold px-4 py-2 rounded-lg transition">
                ${iconSave()} Save Item to Inventory
              </button>
            </div>

            <!-- ============ EXISTING ITEM PANEL ============ -->
            <div id="vpExistingItemPanel" class="hidden">
              <div class="mb-3">
                <label class="form-label">Search Existing Product</label>
                <div class="relative">
                  <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">${iconSearch()}</span>
                  <input id="vpExistingSearch" oninput="renderVpExistingProductList()" placeholder="Search by name or SKU…" class="${inputBase()}" style="padding-left:34px;">
                </div>
              </div>
              <div id="vpExistingProductList" class="border border-gray-200 rounded-lg divide-y divide-gray-100 max-h-40 overflow-y-auto"></div>

              <div id="vpExistingStockFormWrap" class="hidden mt-4 pt-4 border-t border-gray-100">
                <div class="flex items-center justify-between mb-3">
                  <div class="text-[12.5px] font-semibold text-gray-700">Adding stock for: <span id="vpExistingProductName" class="text-primary"></span></div>
                  <button onclick="clearVpExistingSelection()" class="text-[11px] text-gray-400 hover:text-gray-600">${iconX()} Change product</button>
                </div>
                <div class="grid grid-cols-2 gap-3">
                  <div class="mb-3">
                    <label class="form-label">Add Stock Qty <span class="required">*</span></label>
                    <input id="vpExistingQty" type="number" placeholder="e.g. 25" class="${inputBase()}">
                    ${fldErr('vpExistingQty')}
                  </div>
                  ${fld('Warehouse', '<select id="vpExistingWarehouse" class="' + inputBase() + '">' + warehouses.map(function(w) { return '<option value="' + w.id + '">' + w.name + '</option>'; }).join('') + '</select>')}
                </div>
                <div class="form-hint mb-2">This adds to the item's current stock — it will not create a duplicate product.</div>
                <button onclick="saveVpExistingStock()" class="inline-flex items-center gap-1.5 bg-primary hover:bg-primary-dark text-white text-[12.5px] font-semibold px-4 py-2 rounded-lg transition">
                  ${iconSave()} Add Stock to Inventory
                </button>
              </div>
            </div>
          </div>
        </div>
        ${modalFooter('Proceed', 'onclick="proceedVendorPurchase()"')}
      `;
      openModal(modalContent, { width: 'max-w-lg' });

    function toggleAddVendorForm() {
      var wrap = document.getElementById('addVendorFormWrap');
      if (wrap) wrap.classList.toggle('hidden');
    }

    function toggleAddItemForm() {
      var wrap = document.getElementById('addItemFormWrap');
      if (wrap) wrap.classList.toggle('hidden');
    }

    // ---------- New vs Existing item mode ----------
    var vpSelectedExistingItemId = null;

    function switchVpItemMode(mode) {
      var newPanel = document.getElementById('vpNewItemPanel');
      var existingPanel = document.getElementById('vpExistingItemPanel');
      var newBtn = document.getElementById('vpModeBtn_new');
      var existingBtn = document.getElementById('vpModeBtn_existing');
      if (!newPanel || !existingPanel) return;

      if (mode === 'existing') {
        newPanel.classList.add('hidden');
        existingPanel.classList.remove('hidden');
        newBtn.classList.remove('active');
        existingBtn.classList.add('active');
        renderVpExistingProductList();
      } else {
        newPanel.classList.remove('hidden');
        existingPanel.classList.add('hidden');
        newBtn.classList.add('active');
        existingBtn.classList.remove('active');
      }
    }

    function renderVpExistingProductList() {
      var wrap = document.getElementById('vpExistingProductList');
      if (!wrap) return;
      var q = (document.getElementById('vpExistingSearch') || {}).value || '';
      q = q.trim().toLowerCase();
      var matches = items.filter(function(it) {
        return q.length === 0 ||
          it.name.toLowerCase().indexOf(q) !== -1 ||
          it.sku.toLowerCase().indexOf(q) !== -1;
      });
      if (matches.length === 0) {
        wrap.innerHTML = '<div class="text-center py-4 text-gray-400 text-[12.5px]">No matching products</div>';
        return;
      }
      wrap.innerHTML = matches.map(function(it) {
        var isSel = it.id === vpSelectedExistingItemId;
        return '<div onclick="selectVpExistingProduct(\'' + it.id + '\')" class="px-3 py-2 text-[12.5px] cursor-pointer flex items-center justify-between ' + (isSel ? 'bg-primary-soft' : 'hover:bg-gray-50') + '">' +
          '<span class="font-semibold text-gray-700">' + it.name + '</span>' +
          '<span class="text-gray-400 font-mono">' + it.sku + ' · stock: ' + it.stock + '</span></div>';
      }).join('');
    }

    function selectVpExistingProduct(itemId) {
      vpSelectedExistingItemId = itemId;
      var it = items.find(function(x) { return x.id === itemId; });
      renderVpExistingProductList();
      var formWrap = document.getElementById('vpExistingStockFormWrap');
      if (!it || !formWrap) return;
      formWrap.classList.remove('hidden');
      document.getElementById('vpExistingProductName').textContent = it.name + ' (' + it.sku + ') — current stock: ' + it.stock;
      var whSel = document.getElementById('vpExistingWarehouse');
      if (whSel) whSel.value = it.warehouse;
    }

    function clearVpExistingSelection() {
      vpSelectedExistingItemId = null;
      var formWrap = document.getElementById('vpExistingStockFormWrap');
      if (formWrap) formWrap.classList.add('hidden');
      renderVpExistingProductList();
    }

    function saveVpExistingStock() {
      if (!vpSelectedExistingItemId) {
        showToast('Please select a product first', 'error');
        return;
      }
      var it = items.find(function(x) { return x.id === vpSelectedExistingItemId; });
      if (!it) return;

      var qtyRaw = (document.getElementById('vpExistingQty') || {}).value || '';
      qtyRaw = qtyRaw.trim();
      var qtyMissing = qtyRaw === '' || isNaN(parseInt(qtyRaw)) || parseInt(qtyRaw) <= 0;
      setFieldError('vpExistingQty', qtyMissing);
      if (qtyMissing) {
        showToast('Please enter a valid quantity', 'error');
        return;
      }

      var qty = parseInt(qtyRaw);
      it.stock = (Number(it.stock) || 0) + qty;
      it.status = stockStatus(it.stock);
      var whSel = document.getElementById('vpExistingWarehouse');
      if (whSel && whSel.value) it.warehouse = whSel.value;

      renderItems(); // keeps the main inventory table/stats in sync immediately
      showToast('Added ' + qty + ' stock to ' + it.name + ' (no duplicate created)', 'success');

      // reset for the next entry
      document.getElementById('vpExistingQty').value = '';
      setFieldError('vpExistingQty', false);
      clearVpExistingSelection();
      var searchEl = document.getElementById('vpExistingSearch');
      if (searchEl) searchEl.value = '';
    }

    function saveVendorPurchaseItem() {
      var name = (document.getElementById('vp_name') || {}).value || '';
      name = name.trim();
      var stockRaw = (document.getElementById('vp_stock') || {}).value || '';
      stockRaw = stockRaw.trim();

      var nameMissing = !name;
      var stockMissing = stockRaw === '';
      setFieldError('vp_name', nameMissing);
      setFieldError('vp_stock', stockMissing);
      if (nameMissing || stockMissing) {
        showToast('Please fill the required fields', 'error');
        return;
      }

      var get = function(id) {
        var el = document.getElementById(id);
        return el ? el.value.trim() : '';
      };
      var getNum = function(id) {
        var el = document.getElementById(id);
        return el ? (parseFloat(el.value) || 0) : 0;
      };

      var stock = parseInt(stockRaw) || 0;

      // Same shape as items added from the main "Add Item" form — keeps inventory in sync, no duplication.
      var newItem = {
        id: 'ITM-' + (nextItemNo++),
        name: name,
        sku: get('vp_sku'),
        category: get('vp_category'),
        subCategory: get('vp_subcategory'),
        hsn: get('vp_hsn'),
        unit: get('vp_unit'),
        height: get('vp_height'),
        width: get('vp_width'),
        length: get('vp_length'),
        materialType: get('vp_materialType'),
        size: get('vp_size'),
        productNumber: get('vp_productNumber'),
        sellingPrice: getNum('vp_selling'),
        mrpPrice: getNum('vp_mrp'),
        gstRate: get('vp_gst'),
        stock: stock,
        warehouse: (document.getElementById('vp_warehouse') || {}).value || warehouses[0].id,
        description: get('vp_description'),
        variants: [],
        status: stockStatus(stock)
      };

      items.unshift(newItem);
      renderItems(); // keeps the main inventory table/stats in sync immediately

      showToast('Item added to inventory', 'success');

      // collapse and reset the inline form
      document.getElementById('addItemFormWrap').classList.add('hidden');
      ['vp_name','vp_sku','vp_category','vp_subcategory','vp_hsn','vp_unit','vp_height','vp_width','vp_length',
       'vp_materialType','vp_size','vp_productNumber','vp_selling','vp_mrp','vp_gst','vp_stock','vp_description'].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.value = '';
      });
      setFieldError('vp_name', false);
      setFieldError('vp_stock', false);
    }

    function saveNewVendor() {
      var vendorName = (document.getElementById('nv_vendorName') || {}).value || '';
      var companyName = (document.getElementById('nv_companyName') || {}).value || '';
      var phone = (document.getElementById('nv_phone') || {}).value || '';

      vendorName = vendorName.trim();
      companyName = companyName.trim();
      phone = phone.trim();

      // TODO: POST this to the vendors API once available; for now push into the local dummy list.
      var newVendor = {
        id: 'VEN-' + (100 + vendors.length + 1),
        name: companyName ? (vendorName || companyName) + ' — ' + companyName : (vendorName || 'New Vendor'),
        contactName: vendorName,
        companyName: companyName,
        phone: phone
      };
      vendors.push(newVendor);

      showToast('Vendor added', 'success');
      renderVendorPurchaseModal(vendors, newVendor.id);
    }

    function proceedVendorPurchase() {
      var sel = document.getElementById('f_vendorPurchase');
      var vendorId = sel ? sel.value : null;
      var vendorName = sel && sel.selectedIndex >= 0 ? sel.options[sel.selectedIndex].text : '';
      if (!vendorId) {
        showToast('Please select a vendor', 'error');
        return;
      }
      closeModal();
      showToast('Starting purchase for ' + vendorName, 'info');
      // Hook up navigation to the Purchase Bill screen here once available.
    }

    // =============================================================
    // SEARCH (debounced, min 2 characters)
    // =============================================================

    var searchDebounceTimer = null;

    function onSearchInput() {
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(function() {
        renderItems();
      }, 300);
    }

    // Add search input to top bar
    (function addSearchToTopbar() {
      var searchContainer = document.querySelector('.app-main header');
      if (searchContainer) {
        var searchHtml = `
          <div class="hidden sm:flex flex-1 max-w-[420px] relative ml-4">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">${iconSearch()}</span>
            <input type="text" id="searchInput" placeholder="Search items by name, SKU, HSN… (min 2 letters)"
              oninput="onSearchInput()"
              class="w-full border border-gray-200 bg-gray-50 focus:bg-white rounded-lg pl-9 pr-3 py-2 text-[13px] outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition placeholder:text-gray-400">
          </div>
        `;
        var headerContent = searchContainer.innerHTML;
        var hamburgerIndex = headerContent.indexOf('lg:hidden');
        if (hamburgerIndex !== -1) {
          var firstDivEnd = headerContent.indexOf('</div>', hamburgerIndex) + 6;
          var before = headerContent.substring(0, firstDivEnd);
          var after = headerContent.substring(firstDivEnd);
          searchContainer.innerHTML = before + searchHtml + after;
        }
      }
    })();

    // =============================================================
    // INIT
    // =============================================================

    renderItems();

    console.log('Items Module Loaded Successfully');
    console.log('Total Items:', items.length);

  </script>
