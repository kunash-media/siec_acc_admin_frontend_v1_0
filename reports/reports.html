    function renderReportTypes() {

      activeReportType = id;

    // =============================================================
    // DATE RANGE QUICK SELECT
    // =============================================================

    function setQuickRange(days) {
      var to = new Date();
      var from = new Date();
      from.setDate(to.getDate() - days);

      document.getElementById('reportFromDate').value = from.toISOString().split('T')[0];
      document.getElementById('reportToDate').value = to.toISOString().split('T')[0];

      // Update active chip
      document.querySelectorAll('.date-chip').forEach(function(c) { c.classList.remove('active'); });
      event.target.classList.add('active');

      refreshReport();
    }

    // =============================================================
    // REPORT RENDERING
    // =============================================================

    function refreshReport() {
      var from = document.getElementById('reportFromDate').value;
      var to = document.getElementById('reportToDate').value;

      var html = '';
      switch(activeReportType) {
        case 'sales': html = renderSalesReport(from, to); break;
        case 'purchase': html = renderPurchaseReport(from, to); break;
        case 'stock': html = renderStockReport(from, to); break;
        case 'tax': html = renderTaxReport(from, to); break;
        case 'receivable': html = renderReceivableReport(from, to); break;
        case 'payable': html = renderPayableReport(from, to); break;
        case 'project': html = renderProjectReport(from, to); break;
        case 'accounting': html = renderAccountingReport(from, to); break;
        default: html = '<div class="text-center py-10 text-gray-400">Select a report type</div>';
      }

      document.getElementById('reportContent').innerHTML = html;
    }

    function statusBadgeSmall(status) {
      var map = {
        paid: 'badge-green', sent: 'badge-blue', partial: 'badge-amber', overdue: 'badge-red',
        received: 'badge-green', draft: 'badge-gray'
      };
      var dot = {
        paid: 'badge-dot-green', sent: 'badge-dot-blue', partial: 'badge-dot-amber', overdue: 'badge-dot-red',
        received: 'badge-dot-green', draft: 'badge-dot-gray'
      };
      var label = status.charAt(0).toUpperCase() + status.slice(1);
      return '<span class="badge ' + (map[status] || 'badge-gray') + '"><span class="badge-dot ' + (dot[status] || 'badge-dot-gray') + '"></span>' + label + '</span>';
    }

    function stockBadgeSmall(status) {
      var map = { green: 'badge-green', amber: 'badge-amber', red: 'badge-red' };
      var dot = { green: 'badge-dot-green', amber: 'badge-dot-amber', red: 'badge-dot-red' };
      var label = status === 'green' ? 'In Stock' : status === 'amber' ? 'Low Stock' : 'Out of Stock';
      return '<span class="badge ' + map[status] + '"><span class="badge-dot ' + dot[status] + '"></span>' + label + '</span>';
    }
