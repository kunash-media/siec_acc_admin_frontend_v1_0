    function iconSales() {

    // =============================================================
    // TOAST
    // =============================================================
    function showToast(message, kind) {
      kind = kind || 'success';
      var wrap = document.getElementById('toastWrap');
      var colors = {
        success: 'bg-green-600',
        info: 'bg-primary',
        warning: 'bg-amber-600',
        error: 'bg-red-600'
      };
      var el = document.createElement('div');
      el.className = 'toast ' + colors[kind] + ' text-white font-semibold px-3 py-2 rounded-lg shadow-lg flex items-center gap-2 max-w-xs';
      el.innerHTML = '<span>' + message + '</span>';
      wrap.appendChild(el);
      setTimeout(function () {
        el.style.transition = 'opacity .3s';
        el.style.opacity = '0';
        setTimeout(function () { el.remove(); }, 300);
      }, 2600);
    }

    // =============================================================
    // HELPERS
    // =============================================================
    var REPORT_API_BASE = "http://localhost:9093"; // same-origin by default; set to your API host if the frontend is served elsewhere

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function $(id) { return document.getElementById(id); }
    function val(id) { var el = $(id); return el ? el.value : ''; }
    function pad2(n) { return ('0' + n).slice(-2); }
    function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
    function parseYmd(v) {
      if (!v) return null;
      if (Array.isArray(v)) return new Date(v[0], v[1] - 1, v[2]);
      var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(v));
      return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
    }
    function formatDate(v) {
      var d = parseYmd(v);
      return d ? d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
    }
    // Indian grouping; paise shown only when non-zero (same rule as the Dashboard).
    function money(n) {
      var v = Number(n);
      if (!isFinite(v)) return '—';
      var abs = Math.abs(v);
      var hasPaise = Math.round(abs * 100) % 100 !== 0;
      var s = abs.toLocaleString('en-IN', { minimumFractionDigits: hasPaise ? 2 : 0, maximumFractionDigits: 2 });
      return (v < 0 ? '-' : '') + '₹' + s;
    }
    function fmtInt(n) { return Number(n).toLocaleString('en-IN'); }
    function fmtQty(n) { return Number(n).toLocaleString('en-IN', { maximumFractionDigits: 2 }); }
    function titleCase(s) { s = String(s || ''); return s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : s; }
    function nowStamp() {
      return new Date().toLocaleString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' });
    }

    function alignCls(a) { return a === 'right' ? 'text-right' : a === 'center' ? 'text-center' : 'text-left'; }
    function toneCls(tone, v) {
      var n = Number(v);
      switch (tone) {
        case 'primary': return 'text-primary';
        case 'amber': return 'text-amber-600';
        case 'red': return 'text-red-600';
        case 'green': return 'text-green-600';
        case 'blue': return 'text-blue-600';
        case 'muted': return 'text-gray-500';
        case 'signed': return n >= 0 ? 'text-green-600' : 'text-red-600';
        case 'signedInverse': return n >= 0 ? 'text-red-600' : 'text-green-600';
        default: return '';
      }
    }

    // =============================================================
    // REPORT TYPES + STATE
    // =============================================================
    var reportTypes = [
      { id: 'sales', name: 'Sales Report', desc: 'Sales summary & details', icon: iconSales() },
      { id: 'purchase', name: 'Purchase Report', desc: 'Vendor bills & purchases', icon: iconPurchase() },
      { id: 'stock', name: 'Stock Report', desc: 'Inventory & valuation', icon: iconStock() },
      { id: 'tax', name: 'GST / Tax Report', desc: 'Monthly GST summary', icon: iconTax() },
      { id: 'receivable', name: 'Receivable Report', desc: 'Customer aging', icon: iconReceivable() },
      { id: 'payable', name: 'Payable Report', desc: 'Vendor aging', icon: iconPayable() },
      { id: 'project', name: 'Project Report', desc: 'Cost & profitability', icon: iconProject() },
      { id: 'accounting', name: 'Accounting Report', desc: 'Profit & loss, position', icon: iconAccount() }
    ];

    // from / to: whether the report uses that date. group: whether Group By applies. paged: server paging.
    var REPORT_CFG = {
      sales:      { path: '/sales',       from: true,  to: true,  group: true,  paged: true,  fromHint: '', toHint: '' },
      purchase:   { path: '/purchases',   from: true,  to: true,  group: true,  paged: true,  fromHint: '', toHint: '' },
      stock:      { path: '/stock',       from: false, to: false, group: true,  paged: true,  fromHint: 'Stock is a current snapshot', toHint: 'Stock is a current snapshot' },
      tax:        { path: '/gst',         from: true,  to: true,  group: false, paged: false, fromHint: '', toHint: '' },
      receivable: { path: '/receivables', from: false, to: true,  group: true,  paged: true,  fromHint: 'Not used: balances are as of the To date', toHint: '' },
      payable:    { path: '/payables',    from: false, to: true,  group: true,  paged: true,  fromHint: 'Not used: balances are as of the To date', toHint: '' },
      project:    { path: '/projects',    from: true,  to: true,  group: false, paged: true,  fromHint: '', toHint: '' },
      accounting: { path: '/accounting',  from: true,  to: true,  group: false, paged: false, fromHint: '', toHint: '' }
    };

    var RS = { type: 'sales', groupBy: '', page: 1, size: 100, req: 0, last: null };
    var exportBusy = false;

    function renderReportTypes() {
      var html = reportTypes.map(function (rt) {
        return '<div class="report-type-card ' + (rt.id === RS.type ? 'active' : '') + '" onclick="selectReportType(\'' + rt.id + '\')">'
          + '<div class="rt-icon">' + rt.icon + '</div>'
          + '<div class="rt-name">' + esc(rt.name) + '</div>'
          + '<div class="rt-desc">' + esc(rt.desc) + '</div></div>';
      }).join('');
      $('reportTypesGrid').innerHTML = html;
    }

    function selectReportType(id) {
      if (!REPORT_CFG[id]) return;
      RS.type = id;
      RS.groupBy = '';   // the server picks the default grouping for the report
      RS.page = 1;
      renderReportTypes();
      loadReport();
    }

    // =============================================================
    // FILTERS
    // =============================================================
    function clearChips() {
      document.querySelectorAll('.date-chip').forEach(function (c) { c.classList.remove('active'); });
    }

    function setQuickRange(days) {
      var to = new Date();
      var from = new Date();
      from.setDate(to.getDate() - days);
      $('reportFromDate').value = ymd(from);
      $('reportToDate').value = ymd(to);
      document.querySelectorAll('.date-chip').forEach(function (c) {
        c.classList.toggle('active', c.getAttribute('onclick') === 'setQuickRange(' + days + ')');
      });
      refreshReport();
    }

    function setDisabled(id, disabled, hint) {
      var el = $(id);
      if (!el) return;
      el.disabled = !!disabled;
      el.title = disabled ? hint : '';
    }

    function applyFilterAvailability(cfg) {
      setDisabled('reportFromDate', !cfg.from, cfg.fromHint);
      setDisabled('reportToDate', !cfg.to, cfg.toHint);
      var chip = document.querySelector('.date-chip');
      if (chip && chip.parentNode) {
        var off = !cfg.from && !cfg.to;
        chip.parentNode.style.opacity = off ? '0.4' : '';
        chip.parentNode.style.pointerEvents = off ? 'none' : '';
      }
      var sel = $('reportGroupBy');
      if (sel && sel.parentNode) sel.parentNode.style.display = cfg.group ? '' : 'none';
    }

    function populateGroupBy(meta) {
      var sel = $('reportGroupBy');
      if (!sel || !sel.parentNode) return;
      var opts = (meta && meta.groupByOptions) || [];
      sel.parentNode.style.display = opts.length ? '' : 'none';
      sel.innerHTML = opts.map(function (o) { return '<option value="' + esc(o.value) + '">' + esc(o.label) + '</option>'; }).join('');
      if (opts.length) {
        sel.value = meta.groupBy || opts[0].value;
        RS.groupBy = sel.value;
      }
    }

    // Called by the date inputs and the Group By select (inline handlers in the page).
    function refreshReport() {
      var sel = $('reportGroupBy');
      if (sel && sel.parentNode && sel.parentNode.style.display !== 'none' && sel.value) RS.groupBy = sel.value;
      RS.page = 1;
      loadReport();
    }

    function goToPage(n) {
      var p = RS.last && RS.last.pagination;
      if (!p || n < 1 || n > p.totalPages) return;
      RS.page = n;
      loadReport();
    }

    // =============================================================
    // API
    // =============================================================
    function buildParams(type, extra) {
      var cfg = REPORT_CFG[type];
      var p = {};
      if (cfg.from) p.from = val('reportFromDate');
      if (cfg.to) p.to = val('reportToDate');
      if (cfg.group && RS.groupBy) p.groupBy = RS.groupBy;
      if (cfg.paged && extra) { p.page = extra.page; p.size = extra.size; }
      return p;
    }

    function qs(params) {
      var parts = [];
      Object.keys(params).forEach(function (k) {
        if (params[k] !== '' && params[k] != null) parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
      });
      return parts.length ? '?' + parts.join('&') : '';
    }

    function reportFetch(path, params) {
      return fetch(REPORT_API_BASE + '/api/v1/reports' + path + qs(params), { credentials: 'include', headers: { 'Accept': 'application/json' } })
        .then(function (res) {
          return res.json().catch(function () { return null; }).then(function (body) {
            if (!res.ok || !body || body.status !== 'SUCCESS') {
              throw new Error(body && body.message ? body.message : 'Request failed (' + res.status + ')');
            }
            return body.data;
          });
        });
    }

    // For export: every page, not just the one on screen (capped at 40 pages of 500 rows).
    function fetchFullReport(type) {
      var cfg = REPORT_CFG[type];
      return reportFetch(cfg.path, buildParams(type, { page: 1, size: 500 })).then(function (first) {
        var pages = first.pagination ? first.pagination.totalPages : 1;
        first.truncated = false;
        if (!cfg.paged || pages <= 1) return first;
        var jobs = [];
        for (var pg = 2; pg <= Math.min(pages, 40); pg++) jobs.push(reportFetch(cfg.path, buildParams(type, { page: pg, size: 500 })));
        first.truncated = pages > 40;
        return Promise.all(jobs).then(function (rest) {
          rest.forEach(function (rep) { first.rows = first.rows.concat(rep.rows); });
          return first;
        });
      });
    }

    function validRange(cfg) {
      var from = val('reportFromDate'), to = val('reportToDate');
      if (cfg.to && !to) { showToast('Please choose a To date.', 'warning'); return false; }
      if (cfg.from && !from) { showToast('Please choose a From date.', 'warning'); return false; }
      if (cfg.from && cfg.to && from > to) { showToast('From date cannot be after To date.', 'error'); return false; }
      return true;
    }

    // =============================================================
    // LOAD + RENDER
    // =============================================================
    function loadReport() {
      var cfg = REPORT_CFG[RS.type];
      applyFilterAvailability(cfg);
      if (!validRange(cfg)) return;
      var token = ++RS.req;
      showLoading();
      reportFetch(cfg.path, buildParams(RS.type, { page: RS.page, size: RS.size }))
        .then(function (rep) {
          if (token !== RS.req) return;   // a newer request replaced this one
          RS.last = rep;
          renderReport(rep);
        })
        .catch(function (e) {
          if (token !== RS.req) return;
          RS.last = null;
          showError(e && e.message ? e.message : 'Something went wrong.');
        });
    }

    function showLoading() {
      $('reportContent').innerHTML = '<div class="bg-white border border-gray-200 rounded-xl shadow-sm py-14 text-center text-gray-400 text-sm">'
        + '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading report…</div>';
    }
    function showError(msg) {
      $('reportContent').innerHTML = '<div class="bg-white border border-red-200 rounded-xl shadow-sm py-10 text-center">'
        + '<div class="text-sm font-semibold text-red-600 mb-1">Could not load this report</div>'
        + '<div class="text-xs text-gray-500 mb-3">' + esc(msg) + '</div>'
        + '<button onclick="loadReport()" class="inline-flex items-center gap-1.5 bg-primary hover:bg-primary-dark text-white text-[11px] font-semibold px-3 py-2 rounded-lg transition">Try again</button></div>';
    }

    function reportSubtitle(rep) {
      var m = rep.meta || {};
      if (m.asOf) return 'As of ' + formatDate(m.asOf);
      if (m.from && m.to) return formatDate(m.from) + ' to ' + formatDate(m.to);
      return '';
    }

    function renderReport(rep) {
      populateGroupBy(rep.meta);
      var html = printHeadHtml(rep);
      if (rep.cards && rep.cards.length) html += cardsHtml(rep.cards);
      if (rep.breakdown && rep.breakdown.length) html += breakdownHtml(rep.breakdown);
      html += (rep.statements && rep.statements.length) ? statementsHtml(rep) : tableHtml(rep);
      html += notesHtml(rep.notes);
      $('reportContent').innerHTML = html;
    }

    function printHeadHtml(rep) {
      return '<div class="print-only mb-3"><div style="font-size:18px;font-weight:700;">SIEC — ' + esc(rep.meta.title) + '</div>'
        + '<div style="font-size:12px;color:#4b5563;">' + esc(reportSubtitle(rep)) + '</div>'
        + '<div style="font-size:11px;color:#6b7280;">Generated ' + esc(nowStamp()) + ' · Amounts in Indian Rupees (₹)</div></div>';
    }

    function cardsHtml(cards) {
      return '<div class="grid grid-cols-2 md:grid-cols-4 gap-2.5 mb-4">' + cards.map(function (c) {
        var text = c.kind === 'count' ? fmtInt(c.value) : money(c.value);
        return '<div class="bg-white border border-[#6da84c] rounded-xl shadow-sm stat-card">'
          + '<div class="stat-label">' + esc(c.label) + '</div>'
          + '<div class="stat-value ' + toneCls(c.tone, c.value) + '">' + text + '</div></div>';
      }).join('') + '</div>';
    }

    function breakdownHtml(items) {
      return '<div class="mb-4"><div class="text-[10px] font-semibold uppercase tracking-wide text-gray-500 mb-1.5">Aging — balance by days past due date</div>'
        + '<div class="grid grid-cols-2 md:grid-cols-5 gap-2.5">' + items.map(function (c) {
          return '<div class="bg-white border border-gray-200 rounded-lg px-3 py-2">'
            + '<div class="text-[9.5px] font-semibold uppercase tracking-wide text-gray-500">' + esc(c.label) + '</div>'
            + '<div class="font-mono font-bold text-sm mt-0.5 ' + toneCls(c.tone, c.value) + '">' + money(c.value) + '</div></div>';
        }).join('') + '</div></div>';
    }

    // ----- badges -----
    function statusBadgeSmall(status) {
      var s = String(status || '').toLowerCase();
      var map = { paid: 'badge-green', unpaid: 'badge-blue', received: 'badge-blue', partial: 'badge-amber', overdue: 'badge-red' };
      var dot = { paid: 'badge-dot-green', unpaid: 'badge-dot-blue', received: 'badge-dot-blue', partial: 'badge-dot-amber', overdue: 'badge-dot-red' };
      return '<span class="badge ' + (map[s] || 'badge-gray') + '"><span class="badge-dot ' + (dot[s] || 'badge-dot-gray') + '"></span>' + esc(titleCase(s) || '—') + '</span>';
    }
    function stockBadgeSmall(status) {
      var map = { green: 'badge-green', amber: 'badge-amber', red: 'badge-red' };
      var dot = { green: 'badge-dot-green', amber: 'badge-dot-amber', red: 'badge-dot-red' };
      var label = status === 'green' ? 'In Stock' : status === 'amber' ? 'Low Stock' : 'Out of Stock';
      return '<span class="badge ' + (map[status] || 'badge-gray') + '"><span class="badge-dot ' + (dot[status] || 'badge-dot-gray') + '"></span>' + label + '</span>';
    }

    // ----- table -----
    function cellHtml(c, row, idx) {
      var v = row[c.key];
      var base = 'px-3 py-2.5 ' + alignCls(c.align) + ' ';
      switch (c.type) {
        case 'date':
          return '<td class="' + base + 'text-xs text-gray-500">' + formatDate(v) + '</td>';
        case 'int':
          return '<td class="' + base + 'font-mono text-sm ' + (v == null ? '' : toneCls(c.tone, v)) + '">' + (v == null ? '—' : fmtInt(v)) + '</td>';
        case 'qty':
          var unit = c.unitKey ? row[c.unitKey] : '';
          return '<td class="' + base + 'font-mono font-semibold text-sm">' + (v == null ? '—' : fmtQty(v)) + (unit ? ' ' + esc(unit) : '') + '</td>';
        case 'money':
          return '<td class="' + base + 'font-mono text-sm ' + (v == null ? '' : toneCls(c.tone, v)) + '">' + (v == null ? '—' : money(v)) + '</td>';
        case 'percent':
          return '<td class="' + base + 'text-xs font-semibold ' + (v == null ? 'text-gray-400' : toneCls(c.tone, v)) + '">' + (v == null ? '—' : Number(v).toFixed(1) + '%') + '</td>';
        case 'status':
          return '<td class="' + base + '">' + statusBadgeSmall(v) + '</td>';
        case 'stock':
          return '<td class="' + base + '">' + stockBadgeSmall(v) + '</td>';
        default:
          var cls = c.tone === 'muted' ? 'text-xs text-gray-500' : (idx === 0 ? 'text-sm font-semibold text-gray-800' : 'text-sm text-gray-700');
          var sub = c.subKey && row[c.subKey] ? '<div class="text-[10px] text-gray-400 font-normal">' + esc(row[c.subKey]) + '</div>' : '';
          return '<td class="' + base + cls + '"><div>' + (v == null || v === '' ? '—' : esc(v)) + '</div>' + sub + '</td>';
      }
    }

    function totalCellHtml(c, totals, idx) {
      var base = 'px-3 py-2.5 ' + alignCls(c.align) + ' ';
      if (idx === 0) return '<td class="' + base + 'font-semibold">TOTAL</td>';
      var v = totals[c.key];
      if (v == null) return '<td></td>';
      var tone = c.tone === 'muted' ? '' : toneCls(c.tone, v);
      if (c.type === 'money') return '<td class="' + base + 'font-mono font-bold ' + tone + '">' + money(v) + '</td>';
      if (c.type === 'int') return '<td class="' + base + 'font-mono font-bold">' + fmtInt(v) + '</td>';
      if (c.type === 'qty') return '<td class="' + base + 'font-mono font-bold">' + fmtQty(v) + '</td>';
      return '<td></td>';
    }

    function pagerHtml(p) {
      if (!p || p.totalPages <= 1) return '';
      var a = (p.page - 1) * p.size + 1, b = Math.min(p.page * p.size, p.totalItems);
      var btn = 'px-3 py-1.5 rounded-lg border border-gray-200 bg-white text-gray-700 font-semibold hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed';
      return '<div class="no-print flex items-center justify-between gap-3 flex-wrap px-4 py-2.5 border-t border-gray-100 text-[11px] text-gray-500">'
        + '<div>Showing ' + fmtInt(a) + '–' + fmtInt(b) + ' of ' + fmtInt(p.totalItems) + '</div>'
        + '<div class="flex items-center gap-2">'
        + '<button class="' + btn + '" onclick="goToPage(' + (p.page - 1) + ')"' + (p.page <= 1 ? ' disabled' : '') + '>Previous</button>'
        + '<span>Page ' + p.page + ' of ' + p.totalPages + '</span>'
        + '<button class="' + btn + '" onclick="goToPage(' + (p.page + 1) + ')"' + (p.page >= p.totalPages ? ' disabled' : '') + '>Next</button>'
        + '</div></div>';
    }

    function tableHtml(rep) {
      var cols = rep.columns || [], rows = rep.rows || [], totals = rep.totals || {};
      var m = rep.meta || {};
      var opts = m.groupByOptions || [];
      var groupLabel = '';
      for (var i = 1; i < opts.length; i++) { if (opts[i].value === m.groupBy) groupLabel = ' · grouped by ' + opts[i].label; }
      var thead = cols.map(function (c) {
        return '<th class="' + alignCls(c.align) + ' font-semibold whitespace-nowrap px-3 py-2.5 text-[9.5px] uppercase tracking-wide text-gray-500">' + esc(c.label) + '</th>';
      }).join('');
      var tbody = rows.length
        ? rows.map(function (row) {
            return '<tr class="border-b border-gray-100 table-row-hover">' + cols.map(function (c, idx) { return cellHtml(c, row, idx); }).join('') + '</tr>';
          }).join('')
        : '<tr><td colspan="' + Math.max(cols.length, 1) + '" class="text-center py-6 text-gray-400 text-sm">No records for this selection</td></tr>';
      var totalRow = rows.length
        ? '<tr class="total-row">' + cols.map(function (c, idx) { return totalCellHtml(c, totals, idx); }).join('') + '</tr>'
        : '';
      return '<div class="bg-white border border-[#6da84c] rounded-xl shadow-sm overflow-hidden">'
        + '<div class="flex items-center justify-between gap-3 flex-wrap px-4 py-2.5 border-b border-gray-100">'
        + '<div class="font-semibold text-sm text-gray-800">' + esc(m.title) + ' — ' + esc(reportSubtitle(rep)) + esc(groupLabel) + '</div></div>'
        + '<div class="overflow-x-auto"><table class="w-full"><thead><tr class="bg-gray-200 border border-[#6da84c]">' + thead + '</tr></thead>'
        + '<tbody>' + tbody + totalRow + '</tbody></table></div>'
        + pagerHtml(rep.pagination) + '</div>';
    }

    function notesHtml(notes) {
      if (!notes || !notes.length) return '';
      return '<div class="mt-3 px-1 space-y-1">' + notes.map(function (n) {
        return '<div class="flex gap-1.5 text-[10.5px] text-gray-500 leading-snug">' + iconInfo() + '<span>' + esc(n) + '</span></div>';
      }).join('') + '</div>';
    }

    // ----- accounting statements -----
    function statementCardHtml(s) {
      var rows = (s.lines || []).map(function (ln) {
        var pad = 10 + (ln.indent || 0) * 16;
        var amt = ln.amount == null ? '' : money(ln.amount);
        var tone = ln.amount == null ? '' : toneCls(ln.tone, ln.amount);
        switch (ln.kind) {
          case 'header':
            return '<tr class="group-header"><td>' + esc(ln.label) + '</td><td class="text-right">Amount (₹)</td></tr>';
          case 'subtotal':
            return '<tr class="total-row"><td class="text-right">' + esc(ln.label) + '</td><td class="text-right font-mono font-bold ' + tone + '">' + amt + '</td></tr>';
          case 'grand':
            return '<tr class="grand-total"><td class="text-right font-bold">' + esc(ln.label) + '</td><td class="text-right font-mono font-bold">' + amt + '</td></tr>';
          case 'memo':
            return '<tr><td style="padding-left:' + pad + 'px" class="text-gray-500 italic">' + esc(ln.label) + '</td><td class="text-right font-mono text-gray-500">' + amt + '</td></tr>';
          default:
            return '<tr><td style="padding-left:' + pad + 'px">' + esc(ln.label) + '</td><td class="text-right font-mono ' + tone + '">' + amt + '</td></tr>';
        }
      }).join('');
      return '<div class="bg-white border border-[#6da84c] rounded-xl shadow-sm overflow-hidden">'
        + '<div class="px-4 py-2.5 border-b border-gray-100"><div class="font-semibold text-sm text-gray-800">' + esc(s.title) + '</div>'
        + (s.subtitle ? '<div class="text-[10.5px] text-gray-400">' + esc(s.subtitle) + '</div>' : '') + '</div>'
        + '<table class="report-table"><tbody>' + rows + '</tbody></table></div>';
    }

    function statementsHtml(rep) {
      var st = rep.statements || [];
      var html = '<div class="grid grid-cols-1 md:grid-cols-2 gap-4">' + st.slice(0, 2).map(statementCardHtml).join('') + '</div>';
      if (st.length > 2) html += '<div class="mt-4">' + st.slice(2).map(statementCardHtml).join('') + '</div>';
      return html;
    }

    // =============================================================
    // EXCEL EXPORT (ExcelJS is loaded only when Download is clicked)
    // =============================================================
    var XL_FONT = 'Calibri';
    var XL = {
      ink: 'FF16182A', muted: 'FF64748B',
      green: 'FF6DA84C', greenDark: 'FF5C9140', greenSoft: 'FFEEF5E8', greenLine: 'FFDCEBD2', zebra: 'FFF8FBF6',
      hero: 'FF17331F', heroSub: 'FFB9D9A6',
      blue: 'FF1985BF', amber: 'FFD97706', rose: 'FFE11D48', emerald: 'FF059669', white: 'FFFFFFFF'
    };

    var excelJsPromise = null;
    function loadScriptOnce(src) {
      return new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = src; s.async = true;
        s.onload = function () { resolve(); };
        s.onerror = function () { s.remove(); reject(new Error('load failed: ' + src)); };
        document.head.appendChild(s);
      });
    }
    function loadExcelJs() {
      if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
      if (excelJsPromise) return excelJsPromise;
      excelJsPromise = loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js')
        .catch(function () { return loadScriptOnce('https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js'); })
        .then(function () {
          if (!window.ExcelJS) throw new Error('Excel library did not load');
          return window.ExcelJS;
        })
        .catch(function () {
          excelJsPromise = null;
          throw new Error('Could not load the Excel library (check internet / ad-blocker).');
        });
      return excelJsPromise;
    }

    function r2(v) { var n = Number(v); return isFinite(n) ? Math.round((n + Number.EPSILON) * 100) / 100 : 0; }
    function numOr0(v) { var n = Number(v); return isFinite(n) ? n : 0; }
    function colLetter(n) {
      var s = '';
      while (n > 0) { var m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
      return s;
    }
    function fileSafe(s) { return String(s || '').replace(/[^A-Za-z0-9._-]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 50); }
    function xlDate(v) {
      var d = parseYmd(v);
      return d ? new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())) : null;
    }
    function xfill(argb) { return { type: 'pattern', pattern: 'solid', fgColor: { argb: argb } }; }
    function xthin(argb) { return { style: 'thin', color: { argb: argb } }; }
    function xbox(argb) { var b = xthin(argb); return { top: b, left: b, bottom: b, right: b }; }

    // Indian lakh/crore grouping chosen per cell; negatives show red with a minus.
    function inrFmt(v) {
      var n = Math.abs(Number(v) || 0);
      var p = n >= 1e7 ? '##\\,##\\,##\\,##0.00' : n >= 1e5 ? '##\\,##\\,##0.00' : '#,##0.00';
      return '"₹"' + p + ';[Red]-"₹"' + p;
    }
    function statusStyle(s) {
      var k = String(s || '').toLowerCase();
      if (k === 'paid' || k === 'green') return { color: XL.emerald, bold: true };
      if (k === 'overdue' || k === 'red') return { color: XL.rose, bold: true };
      if (k === 'partial' || k === 'amber') return { color: XL.amber, bold: true };
      if (k === 'unpaid' || k === 'received') return { color: XL.blue, bold: true };
      return {};
    }
    function toneColor(tone, v) {
      var n = Number(v);
      switch (tone) {
        case 'primary': return XL.greenDark;
        case 'amber': return XL.amber;
        case 'red': return XL.rose;
        case 'green': return XL.emerald;
        case 'blue': return XL.blue;
        case 'muted': return XL.muted;
        case 'signed': return n >= 0 ? XL.emerald : XL.rose;
        case 'signedInverse': return n >= 0 ? XL.rose : XL.emerald;
        default: return null;
      }
    }

    function styleCell(cell, o) {
      o = o || {};
      cell.font = { name: XL_FONT, size: o.size || 10, bold: !!o.bold, italic: !!o.italic, color: { argb: o.color || XL.ink } };
      if (o.fill) cell.fill = xfill(o.fill);
      cell.alignment = { vertical: 'middle', horizontal: o.align || 'left', wrapText: o.wrap !== false, indent: o.indent || 0 };
      if (o.border !== false) cell.border = xbox(XL.greenLine);
    }
    function putHeader(cell, text, align) {
      cell.value = text;
      cell.font = { name: XL_FONT, size: 10, bold: true, color: { argb: XL.greenDark } };
      cell.fill = xfill(XL.greenSoft);
      cell.alignment = { horizontal: align || 'center', vertical: 'middle', wrapText: true };
      cell.border = { top: xthin(XL.green), left: xthin(XL.greenLine), right: xthin(XL.greenLine), bottom: { style: 'medium', color: { argb: XL.green } } };
      return cell;
    }
    function putText(cell, text, o) { cell.value = (text == null) ? '' : text; styleCell(cell, o); return cell; }
    function putMoney(cell, v, formula, o) {
      var n = r2(v);
      cell.value = formula ? { formula: formula, result: n } : n;
      styleCell(cell, Object.assign({ align: 'right' }, o || {}));
      cell.numFmt = inrFmt(n);
      return cell;
    }
    function putNumber(cell, v, formula, o, fmt) {
      var n = numOr0(v);
      cell.value = formula ? { formula: formula, result: n } : n;
      styleCell(cell, Object.assign({ align: 'center' }, o || {}));
      cell.numFmt = fmt || '#,##0';
      return cell;
    }
    function putPct(cell, frac, o) {
      cell.value = Math.round(numOr0(frac) * 1e6) / 1e6;
      styleCell(cell, Object.assign({ align: 'right' }, o || {}));
      cell.numFmt = '0.0%';
      return cell;
    }
    function putDate(cell, v, o) {
      var d = xlDate(v);
      cell.value = d || '—';
      styleCell(cell, Object.assign({ align: 'center' }, o || {}));
      if (d) cell.numFmt = 'dd-mmm-yyyy';
      return cell;
    }
    function mergeRow(ws, row, c1, c2, text, o) {
      if (c2 > c1) ws.mergeCells(row, c1, row, c2);
      var master = putText(ws.getCell(row, c1), text, o);
      for (var k = c1 + 1; k <= c2; k++) styleCell(ws.getCell(row, k), o);
      return master;
    }

    function newWorkbook(title) {
      var wb = new window.ExcelJS.Workbook();
      wb.creator = 'SIEC Reports';
      wb.created = new Date();
      wb.title = title;
      return wb;
    }
    function addSheet(wb, name) {
      return wb.addWorksheet(String(name).replace(/[\\\/?*\[\]:]/g, '').slice(0, 31) || 'Report', {
        properties: { tabColor: { argb: XL.green }, defaultRowHeight: 18 },
        views: [{ showGridLines: false }],
        pageSetup: { orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0, paperSize: 9 }
      });
    }
    function addBanner(ws, lastCol, title, subtitle) {
      var last = colLetter(lastCol);
      ws.mergeCells('A1:' + last + '1');
      var t = ws.getCell('A1');
      t.value = title;
      t.font = { name: XL_FONT, size: 18, bold: true, color: { argb: XL.white } };
      t.fill = xfill(XL.hero);
      t.alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
      ws.getRow(1).height = 36;
      ws.mergeCells('A2:' + last + '2');
      var s = ws.getCell('A2');
      s.value = subtitle;
      s.font = { name: XL_FONT, size: 10, color: { argb: XL.heroSub } };
      s.fill = xfill(XL.hero);
      s.alignment = { vertical: 'middle', horizontal: 'left', indent: 1, wrapText: true };
      ws.getRow(2).height = 24;
      ws.getRow(3).height = 5;
      for (var c = 1; c <= lastCol; c++) ws.getCell(3, c).fill = xfill(XL.green);
      ws.getRow(4).height = 8;
    }
    function addSection(ws, row, lastCol, text) {
      ws.mergeCells(row, 1, row, lastCol);
      var c = ws.getCell(row, 1);
      c.value = text;
      c.font = { name: XL_FONT, size: 11, bold: true, color: { argb: XL.white } };
      c.fill = xfill(XL.green);
      c.alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
      ws.getRow(row).height = 22;
    }

    function writeNotes(ws, r, lastCol, notes, extra) {
      var list = (notes || []).slice();
      if (extra) list.push(extra);
      if (!list.length) return r;
      r++;
      addSection(ws, r++, lastCol, 'NOTES');
      list.forEach(function (n) {
        mergeRow(ws, r, 1, lastCol, '•  ' + n, { size: 9, color: XL.muted, border: false });
        ws.getRow(r).height = Math.max(16, Math.ceil(String(n).length / (lastCol * 14)) * 13.5 + 6);
        r++;
      });
      return r;
    }

    function writeBodyCell(cell, c, row, zebra, first) {
      var v = row[c.key];
      var o = { fill: zebra };
      var tc = v == null ? null : toneColor(c.tone, v);
      if (tc) o.color = tc;
      switch (c.type) {
        case 'money':
          if (v == null) putText(cell, '—', { align: 'right', fill: zebra, color: XL.muted }); else putMoney(cell, v, null, o);
          break;
        case 'int':
          if (v == null) putText(cell, '—', { align: 'center', fill: zebra, color: XL.muted }); else putNumber(cell, v, null, o, '#,##0');
          break;
        case 'qty':
          if (v == null) { putText(cell, '—', { align: 'center', fill: zebra, color: XL.muted }); break; }
          var unit = c.unitKey && row[c.unitKey] ? String(row[c.unitKey]).replace(/"/g, '') : '';
          putNumber(cell, v, null, Object.assign({ bold: true }, o), unit ? 'General" ' + unit + '"' : 'General');
          break;
        case 'percent':
          if (v == null) putText(cell, '—', { align: 'right', fill: zebra, color: XL.muted }); else putPct(cell, numOr0(v) / 100, o);
          break;
        case 'date':
          putDate(cell, v, o);
          break;
        case 'status':
          putText(cell, titleCase(v) || '—', Object.assign({ align: 'center' }, o, statusStyle(v)));
          break;
        case 'stock':
          putText(cell, v === 'green' ? 'In Stock' : v === 'amber' ? 'Low Stock' : 'Out of Stock', Object.assign({ align: 'center' }, o, statusStyle(v)));
          break;
        default:
          var t = v == null || v === '' ? '—' : String(v);
          if (c.subKey && row[c.subKey]) t += '\n' + row[c.subKey];
          putText(cell, t, Object.assign({ bold: first && c.tone !== 'muted' }, o));
      }
    }

    function colWidth(c, first) {
      switch (c.type) {
        case 'money': return 18;
        case 'date': return 14;
        case 'int': return 11;
        case 'qty': return 14;
        case 'percent': return 10;
        case 'status': case 'stock': return 14;
        default: return first ? 36 : (c.tone === 'muted' ? 20 : 26);
      }
    }

    function buildTableWorkbook(wb, ws, rep, sub) {
      var cols = rep.columns || [], rows = rep.rows || [], totals = rep.totals || {};
      var n = Math.max(cols.length, 5);
      for (var w = 1; w <= n; w++) ws.getColumn(w).width = 18;
      cols.forEach(function (c, j) { ws.getColumn(j + 1).width = colWidth(c, j === 0); });
      addBanner(ws, n, 'SIEC — ' + rep.meta.title, sub);
      var r = 5;

      function block(title, items) {
        addSection(ws, r++, n, title);
        items.forEach(function (c, j) { putHeader(ws.getCell(r, j + 1), c.label, 'center'); });
        ws.getRow(r).height = 24; r++;
        items.forEach(function (c, j) {
          var cell = ws.getCell(r, j + 1);
          var o = { bold: true, size: 11 };
          var tc = toneColor(c.tone, c.value);
          if (tc) o.color = tc;
          if (c.kind === 'count') putNumber(cell, c.value, null, o, '#,##0'); else putMoney(cell, c.value, null, o);
        });
        ws.getRow(r).height = 24; r += 2;
      }
      if (rep.cards && rep.cards.length) block('SUMMARY', rep.cards);
      if (rep.breakdown && rep.breakdown.length) block('AGING — BALANCE BY DAYS PAST DUE DATE', rep.breakdown);

      addSection(ws, r++, n, 'DETAILS');
      var headerRow = r;
      cols.forEach(function (c, j) { putHeader(ws.getCell(r, j + 1), c.label, c.align === 'left' ? 'left' : 'center'); });
      ws.getRow(r).height = 26; r++;
      var first = r;
      if (!rows.length) {
        mergeRow(ws, r, 1, Math.max(cols.length, 1), 'No records for this selection.', { italic: true, color: XL.muted, align: 'center' });
        r++;
      } else {
        rows.forEach(function (row, i) {
          var hasSub = cols.some(function (c) { return c.subKey && row[c.subKey]; });
          cols.forEach(function (c, j) { writeBodyCell(ws.getCell(r, j + 1), c, row, i % 2 === 1 ? XL.zebra : null, j === 0); });
          ws.getRow(r).height = hasSub ? 30 : 20;
          r++;
        });
        var last = r - 1;
        ws.autoFilter = { from: { row: headerRow, column: 1 }, to: { row: last, column: cols.length } };
        cols.forEach(function (c, j) {
          var cell = ws.getCell(r, j + 1);
          var L = colLetter(j + 1);
          var tv = totals[c.key];
          var o = { bold: true, fill: XL.greenSoft, color: XL.greenDark, border: false };
          if (j === 0) putText(cell, 'TOTAL', o);
          else if (tv != null && c.type === 'money') putMoney(cell, tv, 'SUBTOTAL(109,' + L + first + ':' + L + last + ')', o);
          else if (tv != null && (c.type === 'int' || c.type === 'qty')) putNumber(cell, tv, 'SUBTOTAL(109,' + L + first + ':' + L + last + ')', o, '#,##0.##');
          else putText(cell, '', o);
          cell.border = { top: { style: 'medium', color: { argb: XL.green } }, bottom: xthin(XL.greenLine), left: xthin(XL.greenLine), right: xthin(XL.greenLine) };
        });
        ws.getRow(r).height = 24; r++;
      }
      writeNotes(ws, r, n, rep.notes, rep.truncated ? 'Export was limited to the first 20,000 rows. Totals above still cover every row.' : '');
    }

    function buildStatementsWorkbook(wb, ws, rep, sub) {
      ws.getColumn(1).width = 60;
      ws.getColumn(2).width = 24;
      addBanner(ws, 2, 'SIEC — ' + rep.meta.title, sub);
      var r = 5;
      (rep.statements || []).forEach(function (st) {
        addSection(ws, r++, 2, String(st.title).toUpperCase() + (st.subtitle ? '  ·  ' + st.subtitle : ''));
        (st.lines || []).forEach(function (ln) {
          var a = ws.getCell(r, 1), b = ws.getCell(r, 2);
          var tc = ln.amount == null ? null : toneColor(ln.tone, ln.amount);
          if (ln.kind === 'header') {
            putHeader(a, ln.label, 'left'); putHeader(b, 'Amount (₹)', 'center');
          } else if (ln.kind === 'subtotal') {
            putText(a, ln.label, { bold: true, fill: XL.greenSoft, color: XL.greenDark });
            putMoney(b, ln.amount, null, { bold: true, fill: XL.greenSoft, color: tc || XL.greenDark });
          } else if (ln.kind === 'grand') {
            putText(a, ln.label, { bold: true, fill: XL.green, color: XL.white });
            putMoney(b, ln.amount, null, { bold: true, fill: XL.green, color: XL.white });
          } else if (ln.kind === 'memo') {
            putText(a, ln.label, { italic: true, color: XL.muted, indent: ln.indent || 0 });
            putMoney(b, ln.amount, null, { italic: true, color: XL.muted });
          } else {
            putText(a, ln.label, { indent: ln.indent || 0 });
            putMoney(b, ln.amount, null, tc ? { color: tc } : {});
          }
          ws.getRow(r).height = 21; r++;
        });
        r++;
      });
      writeNotes(ws, r - 1, 2, rep.notes, '');
    }

    function buildReportWorkbook(rep) {
      var wb = newWorkbook(rep.meta.title);
      var ws = addSheet(wb, rep.meta.title);
      var sub = reportSubtitle(rep) + '  ·  Generated ' + nowStamp() + '  ·  Amounts in Indian Rupees (₹)';
      if (rep.statements && rep.statements.length) buildStatementsWorkbook(wb, ws, rep, sub);
      else buildTableWorkbook(wb, ws, rep, sub);
      return wb;
    }

    function reportFileName(rep) {
      var m = rep.meta || {};
      var when = m.asOf ? ('AsOf_' + m.asOf) : (m.from && m.to ? m.from + '_to_' + m.to : ymd(new Date()));
      return 'SIEC_' + fileSafe(m.title) + '_' + when + '.xlsx';
    }

    function downloadBuffer(buf, fileName) {
      var blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = fileName;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
    }

    function busyButton(btn, text) {
      if (!btn) return function () {};
      var html = btn.innerHTML;
      btn.disabled = true; btn.style.opacity = '0.7'; btn.style.cursor = 'wait';
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span class="ml-1.5">' + esc(text) + '</span>';
      return function () { btn.innerHTML = html; btn.disabled = false; btn.style.opacity = ''; btn.style.cursor = ''; };
    }

    // =============================================================
    // ACTIONS
    // =============================================================
    function downloadCurrentReport() {
      if (exportBusy) { showToast('An export is already running. Please wait a moment.', 'warning'); return; }
      var cfg = REPORT_CFG[RS.type];
      if (!validRange(cfg)) return;
      exportBusy = true;
      var btn = document.querySelector('button[onclick="downloadCurrentReport()"]');
      var done = busyButton(btn, 'Preparing…');
      showToast('Preparing Excel report…', 'info');
      Promise.all([loadExcelJs(), fetchFullReport(RS.type)])
        .then(function (r) {
          var wb = buildReportWorkbook(r[1]);
          return wb.xlsx.writeBuffer().then(function (buf) {
            downloadBuffer(buf, reportFileName(r[1]));
            showToast('Report downloaded', 'success');
          });
        })
        .catch(function (e) { showToast('Download failed: ' + esc(e && e.message ? e.message : 'unknown error'), 'error'); })
        .then(function () { exportBusy = false; done(); });
    }

    function printCurrentReport() {
      if (!RS.last) { showToast('Nothing to print yet.', 'warning'); return; }
      showToast('Opening print dialog...', 'info');
      setTimeout(function () { window.print(); }, 400);
    }

    // =============================================================
    // INIT
    // =============================================================
    (function injectPrintCss() {
      var css = '.print-only{display:none}'
        + '@page{size:A4 landscape;margin:10mm}'
        + '@media print{'
        + 'body{background:#fff !important}'
        + '#sidebar-root,#topbar-root,#reportTypesGrid,#toastWrap,.no-print{display:none !important}'
        + '.print-only{display:block !important}'
        + '.app-main{margin:0 !important;padding:0 !important;width:100% !important;max-width:100% !important}'
        + 'main{padding:0 !important}'
        + '.stat-card{box-shadow:none !important;transform:none !important}'
        + '.table-row-hover:hover{background:transparent !important}'
        + 'tr{page-break-inside:avoid}'
        + '}';
      var st = document.createElement('style');
      st.textContent = css;
      document.head.appendChild(st);
    })();

    (function initPage() {
      var to = new Date();
      var from = new Date();
      from.setDate(to.getDate() - 60);   // matches the "60 Days" chip that is active by default
      $('reportFromDate').value = ymd(from);
      $('reportToDate').value = ymd(to);

      var printBtn = document.querySelector('button[onclick="printCurrentReport()"]');
      if (printBtn && printBtn.parentNode) printBtn.parentNode.classList.add('no-print');
      var filterPanel = $('reportFromDate').closest('.bg-white');
      if (filterPanel) filterPanel.classList.add('no-print');

      ['reportFromDate', 'reportToDate'].forEach(function (id) { $(id).addEventListener('change', clearChips); });

      renderReportTypes();
      loadReport();
    })();
  </script>

</body>
