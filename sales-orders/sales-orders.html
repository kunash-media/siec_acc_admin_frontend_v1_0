  <script>
    // =============================================================
    // NAV-SIDEBAR INIT
    // =============================================================
    NavSidebar.init({
      basePath: "",
      activePage: "sales-orders",
      pageTitle: "Sales Orders",
      user: {
        name: "Admin",
        role: "Super Admin",
        avatarUrl: "",
      },
    });

    // =============================================================
    // API CONFIG  (Spring Boot backend on port 9093)
    // =============================================================
    // Single place to change host / port for every call made from this page.
    var API_ORIGIN = 'http://localhost:9093';
    var API_BASE = API_ORIGIN + '/api/sales-orders';

    // Company logo shown at the top of the Sales Order PDF.
    // Path is relative to this page; if the image lives elsewhere (e.g. '/assets/images/company-logo.png') change only this line.
    var COMPANY_LOGO = '/assets/Images/company-logo.png';

    // Rounds to 2 decimals (paise level) - used for every money calculation so the document always adds up
    function round2(n) { return Math.round(((Number(n) || 0) + Number.EPSILON) * 100) / 100; }

    // If the logo cannot be loaded, show the company name instead so the header is never empty
    function logoFallback(img) {
      var d = document.createElement('div');
      d.className = 'sd-co-name';
      d.textContent = company.name || 'Company Name';
      img.replaceWith(d);
    }

    var API = {
      create:  '/create-sales-order',
      getById: '/get-sales-order-by-id/',
      getAll:  '/get-all-sales-orders',
      update:  '/update-sales-order/',
      patch:   '/patch-sales-order/',
      remove:  '/delete-sales-order/'
    };

    // Shared lookup endpoints used by the Client / Product / Quotation / PI / Project dropdowns
    var LOOKUP_API = {
      clients:      '/api/clients/v1/client-list',
      clientGet:    '/api/clients/v1/get-client/',
      products:     '/api/products/v1/get-product-list',
      productGet:   '/api/products/v1/get-product/',
      quotes:       '/api/v1/quotes/quote-list',
      proformas:    '/api/v1/proformas/proforma-list',
      projects:     '/api/projects/v1/get-all-projects',
      projectGet:   '/api/projects/v1/get-project/',
      organization: '/api/organization'
    };

    var LOOKUP_PAGE_SIZE = 20;       // rows fetched per page by every dropdown
    var SEARCH_MIN_CHARS = 2;        // dropdown search starts after this many characters
    var SEARCH_DEBOUNCE_MS = 400;    // pause after the last keystroke before the API is called

    async function httpJson(url, method, body) {
      var opts = { method: method || 'GET', headers: { 'Accept': 'application/json' } };
      if (body !== undefined && body !== null) {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(body);
      }

      var res = await fetch(url, opts);
      if (!res.ok) {
        var raw = '';
        try { raw = await res.text(); } catch (e) {}
        var msg = raw;
        try { var j = JSON.parse(raw); if (j && j.message) msg = j.message; } catch (e) {}
        throw new Error(msg ? msg.substring(0, 200) : ('Request failed (HTTP ' + res.status + ')'));
      }
      if (res.status === 204) return null;
      var text = await res.text();
      return text ? JSON.parse(text) : null;
    }

    // Sales order endpoints (relative to /api/sales-orders)
    function apiRequest(path, method, body) {
      return httpJson(API_BASE + path, method, body);
    }

    // GET against any other module; empty / null params are dropped from the query string
    function apiGet(path, params) {
      var qs = [];
      Object.keys(params || {}).forEach(function(k) {
        var v = params[k];
        if (v === null || v === undefined || v === '') return;
        qs.push(encodeURIComponent(k) + '=' + encodeURIComponent(v));
      });
      return httpJson(API_ORIGIN + path + (qs.length ? '?' + qs.join('&') : ''), 'GET');
    }

    // Escapes anything coming from the backend before it is placed in innerHTML
    function esc(v) {
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // =============================================================
    // LOOKUP FETCHERS  (each returns { items, hasNext, next } for the dropdown)
    // =============================================================

    // GET /api/clients/v1/client-list   -> { content, page(0-based), hasNext, nextPage }
    function fetchClients(query, page) {
      return apiGet(LOOKUP_API.clients, {
        page: page == null ? 0 : page,
        size: LOOKUP_PAGE_SIZE,
        search: query
      }).then(function(res) {
        var rows = (res && res.content) || [];
        return {
          items: rows.map(function(c) {
            return {
              value: c.clientStrId,
              label: c.clientName || c.clientStrId,
              sub: [c.clientCompanyName, c.clientStrId].filter(Boolean).join(' · '),
              raw: c
            };
          }),
          hasNext: !!(res && res.hasNext),
          next: res ? res.nextPage : null
        };
      });
    }

    // GET /api/products/v1/get-product-list -> { data: { content, page(0-based), hasNext, nextPage } }
    function fetchProducts(query, page) {
      return apiGet(LOOKUP_API.products, {
        page: page == null ? 0 : page,
        size: LOOKUP_PAGE_SIZE,
        search: query
      }).then(function(res) {
        var data = (res && res.data) || {};
        var rows = data.content || [];
        return {
          items: rows.map(function(p) {
            var price = p.productSellingPrice != null ? money(p.productSellingPrice) : '';
            return {
              value: p.productStrId,
              label: p.productName || p.productStrId,
              sub: [p.productStrId, price ? price + (p.productUnit ? ' / ' + p.productUnit : '') : p.productUnit].filter(Boolean).join(' · '),
              raw: p
            };
          }),
          hasNext: !!data.hasNext,
          next: data.nextPage
        };
      });
    }

    // The quote / proforma list endpoints only accept pageNumber + pageSize (no search param),
    // so typed searches are matched here, in the browser, against the rows of each fetched page.
    // The dropdown keeps pulling the next page automatically until the visible list is filled.
    function matchesQuery(query, values) {
      if (!query) return true;
      var q = String(query).toLowerCase();
      return values.some(function(v) { return String(v == null ? '' : v).toLowerCase().indexOf(q) !== -1; });
    }

    // Reads the PagedResponseDto shape ({ content, pageNumber(1-based), totalPages }) defensively
    function pagedInfo(res, pn) {
      var cur = Number(res && res.pageNumber) || pn;
      var total = Number(res && res.totalPages) || 1;
      var hasNext = (res && typeof res.hasNext === 'boolean') ? res.hasNext : cur < total;
      return { hasNext: hasNext, next: cur + 1 };
    }

    // GET /api/v1/quotes/quote-list?pageNumber=&pageSize=  -> PagedResponseDto<QuoteSummaryResponseDto>
    function fetchQuotes(query, page) {
      var pn = page == null ? 1 : page;
      return apiGet(LOOKUP_API.quotes, {
        pageNumber: pn,
        pageSize: LOOKUP_PAGE_SIZE
      }).then(function(res) {
        var rows = (res && res.content) || [];
        var pg = pagedInfo(res, pn);
        var items = rows.map(function(q) {
          var id = q.quoteStrId || q.quoteId || q.id;
          var status = q.quoteStatus || q.status || '';
          var valid = q.quoteValidTill || q.validTill || '';
          return {
            value: id,
            label: id,
            sub: [q.clientName || q.quoteClientName, status, valid ? 'valid till ' + valid : ''].filter(Boolean).join(' · '),
            raw: q
          };
        }).filter(function(it) {
          return matchesQuery(query, [it.label, it.sub]);
        });
        return { items: items, hasNext: pg.hasNext, next: pg.next };
      });
    }

    // GET /api/v1/proformas/proforma-list?pageNumber=&pageSize=  -> PagedResponseDto<ProformaSummaryResponseDto>
    function fetchProformas(query, page) {
      var pn = page == null ? 1 : page;
      return apiGet(LOOKUP_API.proformas, {
        pageNumber: pn,
        pageSize: LOOKUP_PAGE_SIZE
      }).then(function(res) {
        var rows = (res && res.content) || [];
        var pg = pagedInfo(res, pn);
        var items = rows.map(function(p) {
          var id = p.proformaStrId || p.proformaId || p.id;
          var status = p.proformaStatus || p.status || '';
          var valid = p.proformaValidUntil || p.validUntil || '';
          return {
            value: id,
            label: id,
            sub: [p.customerName || p.proformaCustomerName, status, valid ? 'valid until ' + valid : ''].filter(Boolean).join(' · '),
            raw: p
          };
        }).filter(function(it) {
          return matchesQuery(query, [it.label, it.sub]);
        });
        return { items: items, hasNext: pg.hasNext, next: pg.next };
      });
    }

    // GET /api/projects/v1/get-all-projects -> { data: { projects, pagination: { page(1-based), hasNext } } }
    function fetchProjects(query, page) {
      var pn = page == null ? 1 : page;
      return apiGet(LOOKUP_API.projects, {
        status: 'all',
        search: query,
        page: pn,
        size: LOOKUP_PAGE_SIZE
      }).then(function(res) {
        var data = (res && res.data) || {};
        var rows = data.projects || [];
        var pg = data.pagination || {};
        return {
          items: rows.map(function(p) {
            return {
              value: p.id,
              label: p.name || p.id,
              sub: [p.code || p.id, p.customer].filter(Boolean).join(' · '),
              raw: p
            };
          }),
          hasNext: !!pg.hasNext,
          next: (pg.page || pn) + 1
        };
      });
    }

    // =============================================================
    // SEARCHABLE DROPDOWN
    //   - the first page loads when the dropdown opens
    //   - typing SEARCH_MIN_CHARS+ characters searches the server (debounced)
    //   - scrolling to the bottom of the list loads the next page automatically
    // =============================================================
    var ssCounter = 0;
    var ssRegistry = {};
    var ssOpenInst = null;

    function createSearchSelect(cfg) {
      var inst = {
        id: 'ss' + (++ssCounter),
        cfg: cfg,
        group: cfg.group || 'modal',
        host: cfg.host,
        selected: cfg.selected || null,
        items: [],
        next: null,
        hasNext: false,
        loading: false,
        loaded: false,
        error: null,
        query: '',
        seq: 0,
        timer: null,
        activeIdx: -1,
        panel: null,
        listEl: null,
        inputEl: null,
        hintEl: null,
        triggerEl: null
      };
      ssRegistry[inst.id] = inst;
      ssRenderTrigger(inst);
      return inst;
    }

    function ssRenderTrigger(inst) {
      var sel = inst.selected;
      var label = sel
        ? '<span class="ss-label">' + esc(sel.label) + '</span>'
        : '<span class="ss-label ss-placeholder">' + esc(inst.cfg.placeholder || 'Select…') + '</span>';
      var clear = (sel && inst.cfg.allowClear) ? '<span class="ss-clear" data-ss-clear="1" title="Clear">&times;</span>' : '';
      inst.host.innerHTML =
        '<button type="button" class="ss-trigger' + (inst.cfg.small ? ' ss-sm' : '') + '">' +
          label + clear + '<span class="ss-caret">' + iconChevronDown() + '</span>' +
        '</button>';
      inst.triggerEl = inst.host.firstChild;
      inst.triggerEl.addEventListener('click', function(ev) {
        if (ev.target && ev.target.getAttribute && ev.target.getAttribute('data-ss-clear')) {
          ev.stopPropagation();
          ssChoose(inst, null);
          return;
        }
        if (ssOpenInst === inst) ssClose(); else ssOpen(inst);
      });
    }

    function ssOpen(inst) {
      ssClose();
      ssOpenInst = inst;
      inst.triggerEl.classList.add('ss-open');

      var panel = document.createElement('div');
      panel.className = 'ss-panel';
      panel.innerHTML =
        '<div class="ss-search"><input type="text" autocomplete="off" placeholder="' + esc(inst.cfg.searchPlaceholder || 'Search…') + '"></div>' +
        '<div class="ss-hint" style="display:none;"></div>' +
        '<div class="ss-list"></div>';
      document.body.appendChild(panel);

      inst.panel = panel;
      inst.inputEl = panel.querySelector('input');
      inst.hintEl = panel.querySelector('.ss-hint');
      inst.listEl = panel.querySelector('.ss-list');
      inst.activeIdx = -1;
      ssPosition(inst);

      inst.inputEl.addEventListener('input', function() {
        var raw = inst.inputEl.value.trim();
        var effective = raw.length >= SEARCH_MIN_CHARS ? raw : '';
        if (raw.length > 0 && raw.length < SEARCH_MIN_CHARS) {
          inst.hintEl.textContent = 'Type at least ' + SEARCH_MIN_CHARS + ' characters to search';
          inst.hintEl.style.display = 'block';
        } else {
          inst.hintEl.style.display = 'none';
        }
        clearTimeout(inst.timer);
        inst.timer = setTimeout(function() {
          if (!inst.panel || effective === inst.query) return;
          inst.query = effective;
          inst.activeIdx = -1;
          ssReload(inst);
        }, SEARCH_DEBOUNCE_MS);
      });

      inst.inputEl.addEventListener('keydown', function(ev) {
        if (ev.key === 'Escape') { ev.preventDefault(); ssClose(); return; }
        if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
          ev.preventDefault();
          if (!inst.items.length) return;
          var step = ev.key === 'ArrowDown' ? 1 : -1;
          inst.activeIdx = Math.min(inst.items.length - 1, Math.max(0, inst.activeIdx + step));
          ssRenderList(inst);
          var act = inst.listEl.querySelector('.ss-active');
          if (act && act.scrollIntoView) act.scrollIntoView({ block: 'nearest' });
          return;
        }
        if (ev.key === 'Enter') {
          ev.preventDefault();
          if (inst.activeIdx >= 0 && inst.items[inst.activeIdx]) ssChoose(inst, inst.items[inst.activeIdx]);
        }
      });

      inst.listEl.addEventListener('click', function(ev) {
        if (ev.target && ev.target.getAttribute && ev.target.getAttribute('data-ss-retry')) {
          ssLoad(inst, inst.items.length === 0);
          return;
        }
        var row = ev.target.closest ? ev.target.closest('.ss-item') : null;
        if (!row) return;
        var idx = parseInt(row.getAttribute('data-idx'), 10);
        if (idx === -1) ssChoose(inst, null);
        else if (inst.items[idx]) ssChoose(inst, inst.items[idx]);
      });

      inst.listEl.addEventListener('scroll', function() {
        if (inst.listEl.scrollTop + inst.listEl.clientHeight >= inst.listEl.scrollHeight - 30) ssLoadMore(inst);
      });

      inst.query = '';
      ssReload(inst);          // always start from a fresh first page
      inst.inputEl.focus();
    }

    function ssClose() {
      var inst = ssOpenInst;
      if (!inst) return;
      clearTimeout(inst.timer);
      if (inst.panel && inst.panel.parentNode) inst.panel.parentNode.removeChild(inst.panel);
      inst.panel = null;
      inst.listEl = null;
      if (inst.triggerEl) inst.triggerEl.classList.remove('ss-open');
      ssOpenInst = null;
    }

    function ssChoose(inst, item) {
      inst.selected = item ? { value: item.value, label: item.label } : null;
      ssClose();
      ssRenderTrigger(inst);
      if (inst.cfg.onChange) inst.cfg.onChange(inst.selected, item ? item.raw : null);
    }

    function ssSetSelected(inst, sel) {
      inst.selected = sel;
      ssRenderTrigger(inst);
    }

    function ssPosition(inst) {
      if (!inst.panel || !inst.triggerEl) return;
      var rect = inst.triggerEl.getBoundingClientRect();
      var width = Math.max(rect.width, 240);
      var left = Math.max(8, Math.min(rect.left, window.innerWidth - width - 8));
      var spaceBelow = window.innerHeight - rect.bottom;
      var panel = inst.panel;
      panel.style.width = width + 'px';
      panel.style.left = left + 'px';
      if (spaceBelow < 290 && rect.top > spaceBelow) {
        panel.style.top = 'auto';
        panel.style.bottom = (window.innerHeight - rect.top + 4) + 'px';
        inst.listEl.style.maxHeight = Math.max(120, Math.min(220, rect.top - 70)) + 'px';
      } else {
        panel.style.bottom = 'auto';
        panel.style.top = (rect.bottom + 4) + 'px';
        inst.listEl.style.maxHeight = Math.max(120, Math.min(220, spaceBelow - 80)) + 'px';
      }
    }

    function ssReload(inst) {
      inst.seq++;
      inst.items = [];
      inst.next = null;
      inst.hasNext = false;
      inst.loading = false;
      inst.loaded = false;
      inst.error = null;
      ssLoad(inst, true);
    }

    function ssLoadMore(inst) {
      if (inst.loading || !inst.hasNext || inst.error) return;
      ssLoad(inst, false);
    }

    async function ssLoad(inst, first) {
      if (inst.loading) return;
      inst.loading = true;
      inst.error = null;
      var my = inst.seq;
      ssRenderList(inst);
      try {
        var res = await inst.cfg.fetchPage(inst.query, first ? null : inst.next);
        if (my !== inst.seq) return;                       // a newer search superseded this response
        inst.items = inst.items.concat(res.items || []);
        inst.hasNext = !!res.hasNext;
        inst.next = (res.next === undefined) ? null : res.next;
        inst.loaded = true;
      } catch (err) {
        if (my !== inst.seq) return;
        inst.error = (err && err.message) ? err.message : 'Could not load the list';
      }
      inst.loading = false;
      ssRenderList(inst);
      // a short first page leaves nothing to scroll, so keep pulling pages until the list fills up
      if (inst.panel && inst.hasNext && !inst.error && inst.listEl.scrollHeight <= inst.listEl.clientHeight + 4) {
        ssLoad(inst, false);
      }
    }

    function ssRenderList(inst) {
      if (!inst.panel || !inst.listEl) return;
      var st = inst.listEl.scrollTop;
      var html = '';
      if (inst.cfg.allowClear && !inst.query) {
        html += '<div class="ss-item" data-idx="-1"><div class="ss-main" style="color:#9ca3af;">' + esc(inst.cfg.clearLabel || '— None —') + '</div></div>';
      }
      inst.items.forEach(function(it, i) {
        var isSel = inst.selected && inst.selected.value === it.value;
        html += '<div class="ss-item' + (isSel ? ' ss-selected' : '') + (i === inst.activeIdx ? ' ss-active' : '') + '" data-idx="' + i + '">' +
                  '<div class="ss-main">' + esc(it.label) + '</div>' +
                  (it.sub ? '<div class="ss-sub">' + esc(it.sub) + '</div>' : '') +
                '</div>';
      });
      if (inst.loading) {
        html += '<div class="ss-state">Loading…</div>';
      } else if (inst.error) {
        html += '<div class="ss-state">' + esc(inst.error) + '<br><button type="button" data-ss-retry="1">Retry</button></div>';
      } else if (inst.items.length === 0) {
        html += '<div class="ss-state">' + (inst.query ? 'No results for "' + esc(inst.query) + '"' : 'No records found') + '</div>';
      }
      inst.listEl.innerHTML = html;
      inst.listEl.scrollTop = st;
    }

    function ssDestroy(inst) {
      if (!inst) return;
      if (ssOpenInst === inst) ssClose();
      clearTimeout(inst.timer);
      delete ssRegistry[inst.id];
    }

    function ssDestroyGroup(group) {
      Object.keys(ssRegistry).forEach(function(k) {
        if (ssRegistry[k].group === group) ssDestroy(ssRegistry[k]);
      });
    }

    document.addEventListener('mousedown', function(ev) {
      if (!ssOpenInst) return;
      var t = ev.target;
      if (ssOpenInst.panel && ssOpenInst.panel.contains(t)) return;
      if (ssOpenInst.triggerEl && ssOpenInst.triggerEl.contains(t)) return;
      ssClose();
    });
    window.addEventListener('resize', function() { if (ssOpenInst) ssPosition(ssOpenInst); });
    window.addEventListener('scroll', function(ev) {
      if (!ssOpenInst) return;
      if (ssOpenInst.panel && ssOpenInst.panel.contains(ev.target)) return;
      if (!ssOpenInst.triggerEl || !document.body.contains(ssOpenInst.triggerEl)) { ssClose(); return; }
      ssPosition(ssOpenInst);
    }, true);
    // =============================================================
    // SVG ICONS
    // =============================================================
    function iconPlus() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>`;
    }
    function iconEdit() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>`;
    }
    function iconTrash() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>`;
    }
    function iconEye() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    }
    function iconX() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg>`;
    }
    function iconFilter() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M7 12h10M11 18h2"/></svg>`;
    }
    function iconSave() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>`;
    }
    function iconInfo() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 3"/></svg>`;
    }
    function iconDocument() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z"/><path d="M14 2v6h6"/></svg>`;
    }
    function iconSearch() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>`;
    }
    function iconChevronDown() {
      return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>`;
    }
    function iconConvert() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>`;
    }
    function iconApprove() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>`;
    }
    function iconReject() {
      return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>`;
    }
    function iconPrint() {

    // =============================================================

    // Every amount in the app (list, stats, preview, PDF) uses the same Indian format: ₹1,23,456.00
    function money(n) {
      return '₹' + (Number(n) || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function qtyFmt(n) { return (Number(n) || 0).toLocaleString('en-IN', { maximumFractionDigits: 3 }); }
    function dash(v) { return (v === null || v === undefined || String(v).trim() === '') ? '—' : v; }

    function amountInWords(n) {
      var a = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
      var b = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
      function two(x) { return x < 20 ? a[x] : b[Math.floor(x / 10)] + (x % 10 ? ' ' + a[x % 10] : ''); }
      function three(x) {
        var h = Math.floor(x / 100), r = x % 100;
        return (h ? a[h] + ' Hundred' + (r ? ' ' : '') : '') + (r ? two(r) : '');
      }
      n = Number(n) || 0;
      var rup = Math.floor(n), pai = Math.round((n - rup) * 100);
      if (pai === 100) { rup++; pai = 0; }
      var parts = [];
      var cr = Math.floor(rup / 10000000), lk = Math.floor(rup / 100000) % 100,
          th = Math.floor(rup / 1000) % 100, rest = rup % 1000;
      if (cr) parts.push(three(cr) + ' Crore');
      if (lk) parts.push(two(lk) + ' Lakh');
      if (th) parts.push(two(th) + ' Thousand');
      if (rest) parts.push(three(rest));
      return 'Rupees ' + (parts.join(' ') || 'Zero') + (pai ? ' and ' + two(pai) + ' Paise' : '') + ' Only';
    }

    function map_has(s) { return ['pending', 'approved', 'rejected', 'partial', 'fulfilled'].indexOf(s) !== -1; }

    function statusBadge(status) {
      status = map_has(status) ? status : 'pending';
      var map = {
        pending: 'badge-amber',
        approved: 'badge-blue',
        rejected: 'badge-red',
        partial: 'badge-purple',
        fulfilled: 'badge-green'

      var dot = {
        pending: 'badge-dot-amber',
        approved: 'badge-dot-blue',
        rejected: 'badge-dot-red',
        partial: 'badge-dot-purple',
        fulfilled: 'badge-dot-green'

      var label = status.charAt(0).toUpperCase() + status.slice(1);
      if (status === 'partial') label = 'Partial';
      return '<span class="badge ' + map[status] + '"><span class="badge-dot ' + dot[status] + '"></span>' + label + '</span>';
    }

    function paginationHtml(totalItems, page, pageSize) {

    // Filter bar rendered directly above the table: status + client

    function mountFilterClient() {

    // =============================================================
    // DATA  (everything is loaded from the backend - no local sample data)
    // =============================================================
    var salesOrders = [];
    var currentPage = 1;
    var filterClient = null;                 // { value, label } picked in the filter bar
    var modalState = {};                     // selections made inside the open Add / Edit modal
    var company = { name: '', address: '', gstin: '', phone: '' };
    var productMetaCache = {};
    var clientInfoCache = {};
    var projectLabelCache = {};

    // Make sure whatever the backend returns has every field the UI expects
    // (and computes the total if the backend did not send one).
    function normalizeSO(so) {
      so = so || {};
      var soItems = (so.items || []).map(function(it) {
        return {
          itemId: it.itemId,
          name: it.name || '',
          qty: Number(it.qty) || 0,
          rate: Number(it.rate) || 0,
          unit: it.unit || ''
        };
      });
      var discount = Number(so.discount) || 0;
      var tax = so.tax != null ? Number(so.tax) : 18;

      // same formula as the document + the form: item-wise amount -> discount -> tax, rounded to paise at each step
      var subtotal = round2(soItems.reduce(function(sum, it) { return sum + round2(it.qty * it.rate); }, 0));
      var taxable = round2(subtotal - round2(subtotal * (discount / 100)));
      var computedTotal = round2(taxable + round2(taxable * (tax / 100)));
      var total = (so.total != null && Number(so.total) > 0) ? Number(so.total) : computedTotal;

      return Object.assign({}, so, {
        id: String(so.id != null ? so.id : (so.salesOrderId != null ? so.salesOrderId : (so._id != null ? so._id : ''))),
        number: so.number || '',
        date: so.date || '',
        clientId: so.clientId || '',
        clientName: so.clientName || so.clientId || '',
        deliveryLocation: so.deliveryLocation || '',
        expectedDelivery: so.expectedDelivery || '',
        paymentTerms: so.paymentTerms || '',
        status: String(so.status || 'pending').toLowerCase(),
        fulfillmentStatus: String(so.fulfillmentStatus || 'pending').toLowerCase(),
        items: soItems,
        discount: discount,
        tax: tax,
        total: total,
        notes: so.notes || '',
        quotationReference: so.quotationReference || null,
        piReference: so.piReference || null,
        projectReference: so.projectReference || null
      });
    }

    async function loadSalesOrders() {
      try {
        var data = await apiRequest(API.getAll, 'GET');
        salesOrders = (Array.isArray(data) ? data : []).map(normalizeSO);
        currentPage = 1;
        renderSalesOrders();
      } catch (err) {
        console.error('Failed to load sales orders:', err);
        showToast('Could not load sales orders from server', 'error');
        renderSalesOrders();
      }
    }

    // Number without the rupee sign, for table cells: 1,23,456.00
    function num(n) {
      return (Number(n) || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // Reads the first non-empty primitive field whose key matches one of the patterns (in priority order).
    // Backend field names differ between modules, so this keeps the document filled in either way.
    function findField(obj, patterns) {
      if (!obj || typeof obj !== 'object') return '';
      var keys = Object.keys(obj);
      for (var p = 0; p < patterns.length; p++) {
        for (var i = 0; i < keys.length; i++) {
          var v = obj[keys[i]];
          if (patterns[p].test(keys[i]) && v !== null && v !== undefined && typeof v !== 'object' && String(v).trim() !== '') {
            return String(v).trim();
          }
        }
      }
      return '';
    }

    // Company details for the sales order document come from the Organization module
    async function loadCompany() {
      try {
        var orgs = await httpJson(API_ORIGIN + LOOKUP_API.organization, 'GET');
        var org = Array.isArray(orgs) ? orgs[0] : orgs;
        if (org && org.data && typeof org.data === 'object') org = Array.isArray(org.data) ? org.data[0] : org.data;
        if (!org) return;
        var state = findField(org, [/^state$/i, /state/i]);
        company = {
          name: findField(org, [/^company.?name$/i, /^legal.?name$/i, /^organi[sz]ation.?name$/i, /^name$/i, /^(?!bank|account|contact|owner)\w*name$/i]),
          address: [
            findField(org, [/^address$/i, /address.?line.?1/i, /^address/i, /street/i]),
            findField(org, [/^city$/i, /city/i]),
            state,
            findField(org, [/pin.?code/i, /zip/i, /postal/i])
          ].filter(Boolean).join(', '),
          gstin: findField(org, [/^gst.?number$/i, /gstin/i, /gst/i]),
          pan: findField(org, [/^pan/i]),
          phone: findField(org, [/^phone/i, /phone/i, /mobile/i]),
          email: findField(org, [/^email/i, /e.?mail/i]),
          state: state,
          bank: {
            holder: findField(org, [/account.?holder/i, /account.?name/i]),
            name: findField(org, [/^bank.?name$/i, /bank.?name/i]),
            account: findField(org, [/account.?(no|number)/i]),
            ifsc: findField(org, [/ifsc/i]),
            branch: findField(org, [/branch/i])
          }
        };
      } catch (err) {
        console.error('Could not load company details:', err);
      }
    }

    // Product record for an item id (cached). Sales order rows only carry the item id,
    // so the product API is the source of truth for name / unit / HSN.
    async function getProductMeta(itemId) {
      if (!itemId) return null;
      if (productMetaCache[itemId] !== undefined) return productMetaCache[itemId];
      try {
        var res = await apiGet(LOOKUP_API.productGet + encodeURIComponent(itemId));
        var p = (res && res.data && typeof res.data === 'object') ? res.data : (res && typeof res === 'object' ? res : null);
        productMetaCache[itemId] = p;
      } catch (err) {
        console.error('Could not load product ' + itemId + ':', err);
        return null;                          // not cached, will be retried next time
      }
      return productMetaCache[itemId];
    }

    async function enrichSOItems(so) {
      await Promise.all((so.items || []).map(async function(it) {
        var p = await getProductMeta(it.itemId);
        if (!p) return;
        if (!it.name) it.name = findField(p, [/^productName$/i, /product.?name/i, /^name$/i]);
        if (!it.unit) it.unit = findField(p, [/^productUnit$/i, /unit$/i, /unit/i]);
        if (!it.hsn) it.hsn = findField(p, [/hsn/i, /sac/i]);
      }));
    }

    async function getClientInfo(clientId) {
      if (!clientId) return null;
      if (clientInfoCache[clientId] !== undefined) return clientInfoCache[clientId];
      try {
        var res = await apiGet(LOOKUP_API.clientGet + encodeURIComponent(clientId));
        clientInfoCache[clientId] = (res && res.data && typeof res.data === 'object') ? res.data : (res && typeof res === 'object' ? res : null);
      } catch (err) {
        console.error('Could not load client ' + clientId + ':', err);
        return null;
      }
      return clientInfoCache[clientId];
    }

    // Normalised client block for the document (works with whatever field names the client module returns)
    function readClient(ci, so) {
      ci = ci || {};
      return {
        name: findField(ci, [/^clientName$/i, /client.?name$/i, /^name$/i]) || so.clientName || so.clientId || '',
        company: findField(ci, [/company.?name/i, /^company$/i, /organi[sz]ation/i]),
        billing: findField(ci, [/bill.*address/i, /^address$/i, /client.?address/i]),
        shipping: findField(ci, [/ship.*address/i, /deliver.*address/i]),
        gstin: findField(ci, [/gst/i, /tax.?id/i]),
        phone: findField(ci, [/phone/i, /mobile/i, /contact.?(no|number)/i]),
        email: findField(ci, [/e.?mail/i]),
        state: findField(ci, [/bill.*state/i, /^(client)?state$/i, /state/i])
      };
    }

    // Project reference is stored as the project id; the name is looked up for display
    async function getProjectLabel(projectId) {
      if (!projectId) return '';
      if (projectLabelCache[projectId] !== undefined) return projectLabelCache[projectId];
      try {
        var res = await apiGet(LOOKUP_API.projectGet + encodeURIComponent(projectId));
        var p = res && res.data;
        projectLabelCache[projectId] = p && p.name ? p.name : projectId;
      } catch (err) {
        console.error('Could not load project ' + projectId + ':', err);
        return projectId;
      }
      return projectLabelCache[projectId];
    }

    // =============================================================
    // FUNCTIONS
    // =============================================================
    function renderStats() {
      var total = salesOrders.length;
      var pending = salesOrders.filter(function(so) { return so.status === 'pending'; }).length;
      var approved = salesOrders.filter(function(so) { return so.status === 'approved'; }).length;
      var fulfilled = salesOrders.filter(function(so) { return so.fulfillmentStatus === 'fulfilled'; }).length;
      var totalVal = round2(salesOrders.reduce(function(sum, so) { return sum + so.total; }, 0));

      document.getElementById('totalOrders').textContent = total;
      document.getElementById('pendingOrders').textContent = pending;
      document.getElementById('approvedOrders').textContent = approved;
      document.getElementById('fulfilledOrders').textContent = fulfilled;
      document.getElementById('totalValue').textContent = money(totalVal);
    }

    function getFilteredSalesOrders() {
      var searchInput = document.getElementById('searchInput');
      var q = searchInput ? searchInput.value.toLowerCase() : '';
      var statusEl = document.getElementById('filterStatus');
      var status = statusEl ? statusEl.value : 'all';
      var clientId = filterClient ? filterClient.value : 'all';

      return salesOrders.filter(function(so) {
        var matchSearch = so.number.toLowerCase().indexOf(q) !== -1 ||
          so.clientName.toLowerCase().indexOf(q) !== -1 ||
          so.id.toLowerCase().indexOf(q) !== -1;
        var matchStatus = status === 'all' ||
          ((status === 'partial' || status === 'fulfilled') ? so.fulfillmentStatus === status : so.status === status);
        var matchClient = clientId === 'all' || so.clientId === clientId;
        return matchSearch && matchStatus && matchClient;
      });
    }

    function renderSalesOrders() {
      var filtered = getFilteredSalesOrders();

      var pageSizeSelect = document.getElementById('pageSizeSelect');
      var pageSize = pageSizeSelect ? parseInt(pageSizeSelect.value, 10) : 25;
      var totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      var pageItems = filtered.slice((currentPage - 1) * pageSize, currentPage * pageSize);

      var rowsHtml = '';

    async function viewSO(id) {
      var so = salesOrders.find(function(x) { return x.id === id; });

      // Fetch the freshest copy from the backend; fall back to the local copy
      try {
        var fresh = await apiRequest(API.getById + encodeURIComponent(id), 'GET');
        if (fresh) {
          so = normalizeSO(fresh);
          var idx = salesOrders.findIndex(function(x) { return x.id === id; });
          if (idx !== -1) salesOrders[idx] = so;
        }
      } catch (err) {
        console.error('Failed to fetch sales order by id:', err);
        if (!so) {
          showToast('Could not load sales order: ' + err.message, 'error');
          return;
        }
      }
      if (!so) return;

      if (!company.name) await loadCompany();          // retry once if the first load failed or was still running

      // Product names / units / HSN, client details and project name are looked up from their own modules
      var results = await Promise.all([
        enrichSOItems(so),
        getClientInfo(so.clientId),
        getProjectLabel(so.projectReference)
      ]);
      var c = readClient(results[1], so);
      var projectLabel = results[2] || '';
      var shipTo = so.deliveryLocation || c.shipping || '';

      // ---------- figures (single source of truth, every step rounded to paise) ----------
      var subtotal    = round2(so.items.reduce(function(s, it) { return s + round2(it.qty * it.rate); }, 0));
      var discountAmt = round2(subtotal * (so.discount / 100));
      var taxable     = round2(subtotal - discountAmt);
      var taxAmt      = round2(taxable * (so.tax / 100));
      var computed    = round2(taxable + taxAmt);

      // Use the backend total only when it is within Rs.1 of the calculated one (backend rounding),
      // otherwise trust the calculation so the document always adds up.
      var grand = computed;
      if (so.total > 0 && Math.abs(so.total - computed) < 1) grand = round2(so.total);
      var roundOff = round2(grand - computed);

      // CGST + SGST when both states are known and equal, IGST when they differ, plain GST when unknown
      var cs = String(company.state || '').toLowerCase().trim();
      var ks = String(c.state || '').toLowerCase().trim();
      var gstMode = (cs && ks) ? (cs === ks ? 'intra' : 'inter') : 'plain';
      var cg = round2(taxAmt / 2);
      var sg = round2(taxAmt - cg);       // CGST + SGST always equals the total tax
      var taxRows = '', taxHead = '', taxCells = '';
      if (gstMode === 'intra') {
        taxRows = '<tr><td>CGST (' + so.tax / 2 + '%)</td><td>' + money(cg) + '</td></tr>' +
                  '<tr><td>SGST (' + so.tax / 2 + '%)</td><td>' + money(sg) + '</td></tr>';
        taxHead = '<th>CGST</th><th>SGST</th>';
        taxCells = '<td>' + num(cg) + '</td><td>' + num(sg) + '</td>';
      } else if (gstMode === 'inter') {
        taxRows = '<tr><td>IGST (' + so.tax + '%)</td><td>' + money(taxAmt) + '</td></tr>';
        taxHead = '<th>IGST</th>';
        taxCells = '<td>' + num(taxAmt) + '</td>';
      } else {
        taxRows = '<tr><td>GST (' + so.tax + '%)</td><td>' + money(taxAmt) + '</td></tr>';
        taxHead = '<th>GST</th>';
        taxCells = '<td>' + num(taxAmt) + '</td>';

      // ---------- item rows (padded to 8 rows so short orders still look like a proper form) ----------
      var hasHsn = so.items.some(function(it) { return it.hsn; });

                ${coContact.length ? '<div class="sd-co-line">' + coContact.join(' &nbsp;|&nbsp; ') + '</div>' : ''}

              </td>
              <td>
                <table class="sd-kv"><tbody>
                  <tr><td>SO No.</td><td>${esc(dash(so.number))}</td></tr>
                  <tr><td>Date</td><td>${esc(dash(so.date))}</td></tr>
                  <tr><td>Expected Delivery</td><td>${esc(dash(so.expectedDelivery))}</td></tr>
                  <tr><td>Status</td><td>${statusBadge(so.status)}</td></tr>

                </tbody></table>

              </tr>
            </tbody></table>

              <tr><th>Bill To</th><th>Ship To / Delivery Location</th></tr>
              <tr>
                <td>
                  <div class="sd-pname">${esc(dash(c.name))}</div>
                  ${c.company && c.company !== c.name ? '<div class="sd-pline">' + esc(c.company) + '</div>' : ''}
                  <div class="sd-pline">${esc(dash(c.billing))}</div>

    // Prints a clean copy of the document outside the modal, so nothing is clipped by the scroll area.
    // The wrapper table repeats a top / bottom gap on every page (the page margin itself is 0).
    function printSO() {
      var src = document.querySelector('#printArea .so-preview');
      if (!src) return;
      var old = document.getElementById('printRoot');
      if (old) old.remove();

      var root = document.createElement('div');
      root.id = 'printRoot';
      root.innerHTML =
        '<table class="pg"><thead><tr><td class="pg-gap"></td></tr></thead>' +
        '<tfoot><tr><td class="pg-gap"></td></tr></tfoot>' +
        '<tbody><tr><td class="pg-body"></td></tr></tbody></table>';
      root.querySelector('.pg-body').appendChild(src.cloneNode(true));
      document.body.appendChild(root);

      var prevTitle = document.title;
      document.title = window._printName || 'Sales Order';   // becomes the PDF filename

      function cleanup() {
        root.remove();
        document.title = prevTitle;
        window.removeEventListener('afterprint', cleanup);
      }
      window.addEventListener('afterprint', cleanup);
      window.print();
    }

      openModal(modalContent, { width: 'max-w-4xl' });
      mountModalDropdowns(e);

      if (e.items && e.items.length > 0) {
        e.items.forEach(function(item) { addLineItem(item); });
      } else {
        showEmptyLineItems();
      }
      calcSOTotal();
    }

    // Client / Quotation / PI / Project dropdowns of the Add / Edit modal
    function mountModalDropdowns(e) {
      modalState.client = e.clientId ? { value: e.clientId, label: e.clientName || e.clientId } : null;

      createSearchSelect({
        host: document.getElementById('f_client_host'),
        placeholder: 'Search & select client…',
        searchPlaceholder: 'Search clients…',
        selected: modalState.client,
        fetchPage: fetchClients,
        onChange: function(sel, raw) {
          modalState.client = sel;
          if (raw) autofillDeliveryLocation(raw);
        }
      });

      modalState.quotation = e.quotationReference ? { value: e.quotationReference, label: e.quotationReference } : null;
      createSearchSelect({
        host: document.getElementById('f_quotation_host'),
        allowClear: true,
        clearLabel: '— None —',
        placeholder: '— None —',
        searchPlaceholder: 'Search quotations…',
        selected: modalState.quotation,
        fetchPage: fetchQuotes,
        onChange: function(sel) { modalState.quotation = sel; }
      });

      modalState.pi = e.piReference ? { value: e.piReference, label: e.piReference } : null;
      createSearchSelect({
        host: document.getElementById('f_pi_host'),
        allowClear: true,
        clearLabel: '— None —',
        placeholder: '— None —',
        searchPlaceholder: 'Search proforma invoices…',
        selected: modalState.pi,
        fetchPage: fetchProformas,
        onChange: function(sel) { modalState.pi = sel; }
      });

      modalState.project = e.projectReference ? { value: e.projectReference, label: e.projectReference } : null;
      var projectSS = createSearchSelect({
        host: document.getElementById('f_project_host'),
        allowClear: true,
        clearLabel: '— None —',
        placeholder: '— None —',
        searchPlaceholder: 'Search projects…',
        selected: modalState.project,
        fetchPage: fetchProjects,
        onChange: function(sel) { modalState.project = sel; }
      });
      if (e.projectReference) {
        // show the project name instead of the raw id when editing
        getProjectLabel(e.projectReference).then(function(label) {
          if (modalState.project && modalState.project.value === e.projectReference && ssRegistry[projectSS.id]) {
            modalState.project = { value: e.projectReference, label: label };
            ssSetSelected(projectSS, modalState.project);
          }
        });
      }
    }

    // Default the delivery location to the client's shipping address, but never overwrite what the user typed
    function autofillDeliveryLocation(rawClient) {
      var addr = rawClient.clientShippingAddress || '';
      var el = document.getElementById('f_deliveryLocation');
      if (!addr || !el) return;
      if (!el.value || el.value === modalState.autoDelivery) {
        el.value = addr;
        modalState.autoDelivery = addr;
      }
    }

    // =============================================================
    // LINE ITEM FUNCTIONS
    // =============================================================

    function showEmptyLineItems() {
      var tbody = document.getElementById('lineItemsBody');
      if (tbody) tbody.innerHTML = '<tr><td colspan="4" class="text-center py-3 text-gray-400 text-xs">No items added. Click "Add Item" to add products.</td></tr>';
    }

    // Adds one line. `prefill` ({ itemId, name, qty, rate }) is used when editing an existing order.
    function addLineItem(prefill) {
      var tbody = document.getElementById('lineItemsBody');
      if (!tbody) return;
      // called from the "Add Item" button the click event is passed in, so only accept a real item object
      if (!prefill || typeof prefill !== 'object' || prefill.itemId === undefined) prefill = null;

      var emptyRow = tbody.querySelector('tr td[colspan]');
      if (emptyRow) tbody.innerHTML = '';

      var row = document.createElement('tr');
      row.className = 'border-b border-gray-100 line-item-row';
      row.dataset.itemId = prefill ? (prefill.itemId || '') : '';
      row.innerHTML = `
        <td class="px-2 py-1" style="min-width:240px;">
          <div class="item-host"></div>
        </td>
        <td class="px-2 py-1">
          <input type="number" min="0" step="1" class="form-input text-[10px] item-qty" value="${prefill ? prefill.qty : 1}" placeholder="Qty" onchange="calcSOTotal()">
        </td>
        <td class="px-2 py-1">
          <input type="number" min="0" step="0.01" class="form-input text-[10px] item-rate" value="${prefill ? prefill.rate : 0}" placeholder="Rate" onchange="calcSOTotal()">
        </td>
        <td class="px-2 py-1 text-center">
          <button onclick="removeLineItem(this)" class="text-red-500 hover:text-red-700 transition">${iconX()}</button>
        </td>
      `;
      tbody.appendChild(row);

      row._ss = createSearchSelect({
        host: row.querySelector('.item-host'),
        small: true,
        placeholder: 'Search & select product…',
        searchPlaceholder: 'Search products…',
        selected: prefill && prefill.itemId ? { value: prefill.itemId, label: prefill.name || prefill.itemId } : null,
        fetchPage: fetchProducts,
        onChange: function(sel, raw) {
          row.dataset.itemId = sel ? sel.value : '';
          if (raw) {
            // picking a product fills the rate with its selling price (same as before)
            var price = Number(raw.productSellingPrice);
            row.querySelector('.item-rate').value = isNaN(price) ? 0 : price;
            productMetaCache[raw.productStrId] = raw;
          }
          calcSOTotal();
        }
      });
    }

    function removeLineItem(btn) {
      var row = btn.closest('tr');
      if (row) {
        if (row._ss) ssDestroy(row._ss);
        row.remove();
      }
      var tbody = document.getElementById('lineItemsBody');
      if (tbody && tbody.children.length === 0) showEmptyLineItems();
      calcSOTotal();
    }

    // Same formula as the document: item amount -> discount -> tax, each rounded to paise.
    // Qty is a whole number here, exactly like at save time, so the form total always matches what gets saved.
    function calcSOTotal() {
      var rows = document.querySelectorAll('#lineItemsBody .line-item-row');
      var subtotal = 0;
      rows.forEach(function(row) {
        var qtyInput = row.querySelector('.item-qty');
        var rateInput = row.querySelector('.item-rate');
        var qty = Math.max(0, Math.floor(parseFloat(qtyInput.value) || 0));
        var rate = Math.max(0, parseFloat(rateInput.value) || 0);
        qtyInput.value = qty;
        rateInput.value = rate;
        subtotal += round2(qty * rate);
      });
      subtotal = round2(subtotal);

      var discountInput = document.getElementById('f_discount');
      var discount = Math.min(100, Math.max(0, parseFloat(discountInput.value) || 0));
      discountInput.value = discount;
      var tax = parseFloat(document.getElementById('f_tax').value) || 0;

      var taxable = round2(subtotal - round2(subtotal * (discount / 100)));
      var total = round2(taxable + round2(taxable * (tax / 100)));

      document.getElementById('f_total').value = money(total);
      return total;
    }

    // =============================================================
    // SAVE / DELETE SALES ORDER  (backend integrated)
    // =============================================================

    async function saveSO(existingId) {
      var date = document.getElementById('f_date').value;
      var clientId = modalState.client ? modalState.client.value : '';
      var deliveryLocation = document.getElementById('f_deliveryLocation').value || '';
      var expectedDelivery = document.getElementById('f_delivery').value;
      var paymentTerms = document.getElementById('f_paymentTerms').value;
      var discount = Math.min(100, Math.max(0, parseFloat(document.getElementById('f_discount').value) || 0));
      var tax = parseFloat(document.getElementById('f_tax').value) || 0;
      var notes = document.getElementById('f_notes').value || '';
      var quotationReference = modalState.quotation ? modalState.quotation.value : null;
      var piReference = modalState.pi ? modalState.pi.value : null;
      var projectReference = modalState.project ? modalState.project.value : null;

      if (!date || !clientId || !expectedDelivery) {
        showToast('Please fill all required fields (Date, Client, Expected Delivery)', 'error');
        return;
      }

      var itemsData = [];
      var seenItemIds = {};
      var hasDuplicate = false;
      var missingProduct = false;
      var rows = document.querySelectorAll('#lineItemsBody .line-item-row');
      rows.forEach(function(row) {
        var itemId = row.dataset.itemId || '';
        var qty = Math.max(0, Math.floor(parseFloat(row.querySelector('.item-qty').value) || 0));
        var rate = Math.max(0, parseFloat(row.querySelector('.item-rate').value) || 0);
        if (qty > 0) {
          if (!itemId) {
            missingProduct = true;
            return;
          }
          if (seenItemIds[itemId]) {
            hasDuplicate = true;
            return;
          }
          seenItemIds[itemId] = true;
          itemsData.push({ itemId: itemId, qty: qty, rate: round2(rate) });
        }
      });

      if (missingProduct) {
        showToast('Select a product for every line item', 'error');
        return;
      }

      if (hasDuplicate) {
        showToast('Each item can only appear once — merge duplicate line items', 'error');
        return;
      }

      if (itemsData.length === 0) {
        showToast('Please add at least one item to the sales order', 'error');
        return;
      }

      if (expectedDelivery < date) {
        showToast('Expected delivery cannot be before the order date', 'error');
        return;
      }

      // Only what the user controls. Number, status, fulfilment, subtotal and total are set by the server.
      var payload = {
        date: date,
        clientId: clientId,
        deliveryLocation: deliveryLocation,
        expectedDelivery: expectedDelivery,
        paymentTerms: paymentTerms,
        items: itemsData,
        discount: discount,
        tax: tax,
        notes: notes,
        quotationReference: quotationReference,
        piReference: piReference,
        projectReference: projectReference
      };

      try {
        if (existingId) {
          var updated = await apiRequest(API.update + encodeURIComponent(existingId), 'PUT', payload);
          var saved = normalizeSO(Object.assign({}, updated, { id: existingId }));
          var idx = salesOrders.findIndex(function(x) { return x.id === existingId; });
          if (idx !== -1) salesOrders[idx] = saved;
          else salesOrders.unshift(saved);
          showToast('Sales Order updated successfully', 'success');
        } else {
          var created = await apiRequest(API.create, 'POST', payload);
          salesOrders.unshift(normalizeSO(created));
          currentPage = 1;
          showToast('Sales Order created successfully', 'success');
        }
      } catch (err) {
        console.error('Save sales order failed:', err);
        showToast('Save failed: ' + err.message, 'error');
        return;
      }

      closeModal();
      renderSalesOrders();
    }

    function delSO(id) {
      var so = salesOrders.find(function(x) { return x.id === id; });
      if (!so) return;

      var modalContent = `
        ${modalHeader('Delete Sales Order', esc(so.number))}
        <div class="px-5 py-4 text-sm text-gray-600">
          <p>Are you sure you want to permanently delete <b class="text-gray-800">${esc(so.number)}</b>?</p>
          <p class="text-gray-400 text-[11px] mt-1">This action cannot be undone. Orders with deliveries against them cannot be deleted.</p>
          <p class="text-amber-600 text-[11px] mt-2">Total Value: ${money(so.total)}</p>
        </div>
        ${modalFooter('Delete', 'onclick="confirmDeleteSO(\'' + id + '\')"', '')}
      `;
      openModal(modalContent, { width: 'max-w-md' });
    }

    async function confirmDeleteSO(id) {
      try {
          var delRes = await apiRequest(API.remove + encodeURIComponent(id), 'DELETE');
          if (delRes && delRes.approvalRequired) { closeModal(); showToast('Delete request sent for approval', 'info'); return; }
      } catch (err) {
        console.error('Delete sales order failed:', err);
        showToast('Delete failed: ' + err.message, 'error');
        return;
      }
      salesOrders = salesOrders.filter(function(x) { return x.id !== id; });
      closeModal();
      renderSalesOrders();
      showToast('Sales Order deleted successfully', 'warning');
    }

    // =============================================================
    // ACTIONS  (approve / reject - both ask for confirmation first)
    // =============================================================

    function approveSO(id) {
      var so = salesOrders.find(function(x) { return x.id === id; });
      if (!so) return;

      var modalContent = `
        ${modalHeader('Approve Sales Order', esc(so.number))}
        <div class="px-5 py-4 text-sm text-gray-600">
          <p>Are you sure you want to approve <b class="text-gray-800">${esc(so.number)}</b> for <b class="text-gray-800">${esc(so.clientName)}</b>?</p>
          <p class="text-gray-400 text-[11px] mt-1">Once approved, this order can be used for delivery and can no longer be rejected.</p>
          <p class="text-primary-dark text-[11px] mt-2 font-semibold">Total Value: ${money(so.total)}</p>
        </div>
        <div class="flex items-center justify-end gap-2 px-5 py-3 border-t border-gray-100 bg-gray-50 rounded-b-xl">
          <button onclick="closeModal()" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-600 border border-gray-200 hover:bg-white transition">Cancel</button>
          <button onclick="confirmApproveSO('${esc(id)}')" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-white bg-primary hover:bg-primary-dark transition shadow-sm">Approve Order</button>
        </div>
      `;
      openModal(modalContent, { width: 'max-w-md' });
    }

    async function confirmApproveSO(id) {
      var so = salesOrders.find(function(x) { return x.id === id; });
      if (!so) return;
      try {
        var res = await apiRequest(API.patch + encodeURIComponent(id), 'PATCH', { status: 'approved' });
        if (res && res.id) {
          var idx = salesOrders.findIndex(function(x) { return x.id === id; });
          if (idx !== -1) salesOrders[idx] = normalizeSO(res);
        } else {
          so.status = 'approved';
        }
      } catch (err) {
        console.error('Approve failed:', err);
        showToast('Approve failed: ' + err.message, 'error');
        return;
      }
      closeModal();
      renderSalesOrders();
      showToast('Sales Order ' + so.number + ' approved!', 'success');
    }

    function rejectSO(id) {
      var so = salesOrders.find(function(x) { return x.id === id; });
      if (!so) return;

      var modalContent = `
        ${modalHeader('Reject Sales Order', esc(so.number))}
        <div class="px-5 py-4 text-sm text-gray-600">
          <p>Are you sure you want to reject <b class="text-gray-800">${esc(so.number)}</b> for <b class="text-gray-800">${esc(so.clientName)}</b>?</p>
          <p class="text-gray-400 text-[11px] mt-1">A rejected order is closed and cannot be edited or approved later.</p>
        </div>
        <div class="flex items-center justify-end gap-2 px-5 py-3 border-t border-gray-100 bg-gray-50 rounded-b-xl">
          <button onclick="closeModal()" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-600 border border-gray-200 hover:bg-white transition">Cancel</button>
          <button onclick="confirmRejectSO('${esc(id)}')" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-white bg-red-600 hover:bg-red-700 transition shadow-sm">Reject Order</button>
        </div>
      `;
      openModal(modalContent, { width: 'max-w-md' });
    }

    async function confirmRejectSO(id) {
      var so = salesOrders.find(function(x) { return x.id === id; });
      if (!so) return;
      try {
        var res = await apiRequest(API.patch + encodeURIComponent(id), 'PATCH', { status: 'rejected' });
        if (res && res.id) {
          var idx = salesOrders.findIndex(function(x) { return x.id === id; });
          if (idx !== -1) salesOrders[idx] = normalizeSO(res);
        } else {
          so.status = 'rejected';
        }
      } catch (err) {
        console.error('Reject failed:', err);
        showToast('Reject failed: ' + err.message, 'error');
        return;
      }
      closeModal();
      renderSalesOrders();
      showToast('Sales Order ' + so.number + ' rejected', 'warning');
    }

    // =============================================================
    // SEARCH
    // =============================================================

    (function addSearchToTopbar() {
      var searchContainer = document.querySelector('.app-main header');
      if (searchContainer) {
        var searchHtml = `
          <div class="hidden sm:flex flex-1 max-w-[420px] relative ml-4">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">${iconSearch()}</span>
            <input type="text" id="searchInput" placeholder="Search sales orders by number, client…"
              onkeyup="filterSalesOrders()"
              class="w-full border border-gray-200 bg-gray-50 focus:bg-white rounded-lg pl-9 pr-3 py-1.5 text-xs outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition placeholder:text-gray-400">
          </div>
        `;
        var headerContent = searchContainer.innerHTML;
        var hamburgerIndex = headerContent.indexOf('lg:hidden');
        if (hamburgerIndex !== -1) {
          var firstDivEnd = headerContent.indexOf('</div>', hamburgerIndex) + 6;
          var before = headerContent.substring(0, firstDivEnd);
          var after = headerContent.substring(firstDivEnd);
          searchContainer.innerHTML = before + searchHtml + after;
        }
      }
    })();

    // =============================================================
    // INIT
    // =============================================================

    renderSalesOrders();
    loadCompany();
    loadSalesOrders();

    console.log('📄 Sales Orders Module Loaded Successfully');
    console.log('🌐 API Base:', API_BASE);

  </script>
