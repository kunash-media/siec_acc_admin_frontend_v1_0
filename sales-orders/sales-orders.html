    // =============================================================
    // TOAST
    // =============================================================
    function showToast(message, kind) {
      kind = kind || 'success';
      var wrap = document.getElementById('toastWrap');
      var colors = {
        success: 'bg-green-600',
        info: 'bg-primary',
        warning: 'bg-amber-600',
        error: 'bg-red-600'
      };
      var el = document.createElement('div');
      el.className = 'toast ' + colors[kind] + ' text-white font-semibold px-3 py-2 rounded-lg shadow-lg flex items-center gap-2 max-w-xs';
      el.innerHTML = '<span>' + message + '</span>';
      wrap.appendChild(el);
      setTimeout(function() {
        el.style.transition = 'opacity .3s';
        el.style.opacity = '0';
        setTimeout(function() { el.remove(); }, 300);
      }, 2600);
    }

    // =============================================================
    // MODAL
    // =============================================================
    function openModal(innerHtml, opts) {
      opts = opts || {};
      var root = document.getElementById('modalRoot');
      root.innerHTML = `
        <div class="fixed inset-0 z-[100] flex items-center justify-center p-3" id="modalOverlay">
          <div class="absolute inset-0 bg-black/40 backdrop-blur-[1px]" id="modalBackdrop"></div>
          <div class="relative bg-white rounded-xl shadow-2xl w-full ${opts.width || 'max-w-4xl'} max-h-[92vh] overflow-hidden animate-modal">
            ${innerHtml}
          </div>
        </div>`;
      document.getElementById('modalBackdrop').addEventListener('click', closeModal);
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      var root = document.getElementById('modalRoot');
      root.innerHTML = '';
      document.body.style.overflow = '';
    }

    function fld(label, inputHtml, hint) {

    function money(n) { return '₹' + Number(n).toLocaleString('en-IN'); }

    function statusBadge(status) {
      var map = {
        pending: 'badge-amber',
        approved: 'badge-blue',
        rejected: 'badge-red',
        partial: 'badge-purple',
        fulfilled: 'badge-green'
      };
      var dot = {
        pending: 'badge-dot-amber',
        approved: 'badge-dot-blue',
        rejected: 'badge-dot-red',
        partial: 'badge-dot-purple',
        fulfilled: 'badge-dot-green'
      };
      var label = status.charAt(0).toUpperCase() + status.slice(1);
      if (status === 'partial') label = 'Partial';
      return '<span class="badge ' + map[status] + '"><span class="badge-dot ' + dot[status] + '"></span>' + label + '</span>';
    }

    function rowActionsHtml(editFn, delFn, viewFn, approveFn, rejectFn) {
      var html = '<div class="flex gap-1">';
      if (viewFn) {
        html += '<button onclick="' + viewFn + '" class="btn-icon-action" title="View">' + iconEye() + '</button>';
      }
      if (approveFn) {
        html += '<button onclick="' + approveFn + '" class="btn-icon-action primary" title="Approve">' + iconApprove() + '</button>';
      }
      if (rejectFn) {
        html += '<button onclick="' + rejectFn + '" class="btn-icon-action reject" title="Reject">' + iconReject() + '</button>';
      }
      html += '<button onclick="' + editFn + '" class="btn-icon-action" title="Edit">' + iconEdit() + '</button>';
      html += '<button onclick="' + delFn + '" class="btn-icon-action danger" title="Delete">' + iconTrash() + '</button>';
      html += '</div>';
      return html;
    }

    function panelWrap(titleHtml, bodyHtml, extraHead) {
      return `

    function tableHtml(cols, rowsHtml) {
      var colHeaders = cols.map(function(c) {
        return '<th class="text-left font-semibold whitespace-nowrap">' + c + '</th>';
      }).join('');
      return `
        <div class="overflow-x-auto">

            <thead>
              <tr class="bg-gray-50 border-b border-gray-200">${colHeaders}</tr>
            </thead>

    function paginationHtml(totalItems, page, pageSize) {
      var totalPages = Math.max(1, Math.ceil(totalItems / pageSize));
      if (page > totalPages) page = totalPages;
      var start = totalItems === 0 ? 0 : (page - 1) * pageSize + 1;
      var end = Math.min(totalItems, page * pageSize);

      var pageBtns = '';
      var maxButtons = 5;
      var startPage = Math.max(1, page - Math.floor(maxButtons / 2));
      var endPage = Math.min(totalPages, startPage + maxButtons - 1);
      startPage = Math.max(1, endPage - maxButtons + 1);

      for (var p = startPage; p <= endPage; p++) {
        pageBtns += '<button class="page-btn ' + (p === page ? 'active' : '') + '" onclick="goToPage(' + p + ')">' + p + '</button>';
      }

      var pageSizeHtml = `
        <div class="flex items-center gap-1.5">
          <span class="text-[10px] text-gray-400">Show:</span>
          <select id="pageSizeSelect" onchange="currentPage=1;renderSalesOrders()" class="text-[10px] border border-gray-200 rounded-lg px-2 py-1 bg-white outline-none">
            <option value="10" ${pageSize === 10 ? 'selected' : ''}>10</option>
            <option value="25" ${pageSize === 25 ? 'selected' : ''}>25</option>
            <option value="50" ${pageSize === 50 ? 'selected' : ''}>50</option>
            <option value="100" ${pageSize === 100 ? 'selected' : ''}>100</option>
          </select>
        </div>`;

      return `
        <div class="flex items-center justify-between gap-3 px-4 py-2.5 border-t border-gray-100 flex-wrap">
          <div class="flex items-center gap-3 flex-wrap">
            ${pageSizeHtml}
            <div class="text-[10.5px] text-gray-500">Showing ${start}-${end} of ${totalItems}</div>
          </div>
          <div class="flex items-center gap-1">
            <button class="page-btn" ${page <= 1 ? 'disabled' : ''} onclick="goToPage(${page - 1})">Prev</button>
            ${pageBtns}
            <button class="page-btn" ${page >= totalPages ? 'disabled' : ''} onclick="goToPage(${page + 1})">Next</button>

        </div>`;

    // =============================================================
    // LINE ITEM FUNCTIONS
    // =============================================================

    // Attaches the "auto-fill rate from item price" listener to every
    // item-select currently in the line items table. Needed both for
    // freshly-added rows and for rows that were pre-rendered when
    // editing an existing sales order.
    function wireLineItemSelects() {
      document.querySelectorAll('#lineItemsBody .item-select').forEach(function(select) {
        if (select.dataset.wired === 'true') return;
        select.dataset.wired = 'true';
        select.addEventListener('change', function() {
          var selectedItem = items.find(function(it) { return it.id === this.value; });
          var rateInput = this.closest('tr').querySelector('.item-rate');
          if (selectedItem && rateInput) {
            rateInput.value = selectedItem.price;
            calcSOTotal();
          }
        });
      });
    }

    function addLineItem() {
      var tbody = document.getElementById('lineItemsBody');
      if (!tbody) return;
      var emptyRow = tbody.querySelector('tr td[colspan]');
      if (emptyRow) tbody.innerHTML = '';

      var idx = tbody.children.length;
      var row = document.createElement('tr');
      row.className = 'border-b border-gray-100 line-item-row';
      row.innerHTML = `
        <td class="px-2 py-1">
          <select class="form-input text-[10px] item-select" data-idx="${idx}">
            ${items.map(function(it) { return '<option value="' + it.id + '">' + it.name + '</option>'; }).join('')}
          </select>
        </td>
        <td class="px-2 py-1">
          <input type="number" min="0" step="1" class="form-input text-[10px] item-qty" value="1" data-idx="${idx}" placeholder="Qty" onchange="calcSOTotal()">
        </td>
        <td class="px-2 py-1">
          <input type="number" min="0" step="0.01" class="form-input text-[10px] item-rate" value="0" data-idx="${idx}" placeholder="Rate" onchange="calcSOTotal()">
        </td>
        <td class="px-2 py-1 text-center">
          <button onclick="removeLineItem(this)" class="text-red-500 hover:text-red-700 transition">${iconX()}</button>
        </td>
      `;
      tbody.appendChild(row);

      wireLineItemSelects();
      row.querySelector('.item-select').dispatchEvent(new Event('change'));
    }

    function removeLineItem(btn) {
      var row = btn.closest('tr');
      if (row) row.remove();
      var tbody = document.getElementById('lineItemsBody');
      if (tbody && tbody.children.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center py-3 text-gray-400 text-xs">No items added. Click "Add Item" to add products/services.</td></tr>';
      }
      calcSOTotal();
    }

    function updateCustomerAddress() {
      var customerId = document.getElementById('f_customer').value;
      var customer = customers.find(function(c) { return c.id === customerId; });
      if (customer && customer.address) {
        document.getElementById('f_deliveryLocation').value = customer.address;
      }
    }

    function calcSOTotal() {
      var rows = document.querySelectorAll('#lineItemsBody .line-item-row');
      var subtotal = 0;
      rows.forEach(function(row) {
        var qtyInput = row.querySelector('.item-qty');
        var rateInput = row.querySelector('.item-rate');
        var qty = Math.max(0, parseFloat(qtyInput.value) || 0);
        var rate = Math.max(0, parseFloat(rateInput.value) || 0);
        qtyInput.value = qty;
        rateInput.value = rate;
        subtotal += qty * rate;
      });

      var discountInput = document.getElementById('f_discount');
      var discount = Math.min(100, Math.max(0, parseFloat(discountInput.value) || 0));
      discountInput.value = discount;
      var tax = parseFloat(document.getElementById('f_tax').value) || 0;

      var discountAmt = subtotal * (discount / 100);
      var afterDiscount = subtotal - discountAmt;
      var taxAmt = afterDiscount * (tax / 100);
      var total = afterDiscount + taxAmt;

      document.getElementById('f_total').value = money(total);
      return total;
    }

    // =============================================================
    // SAVE / DELETE SALES ORDER
    // =============================================================

    function saveSO(existingId) {
      var number = document.getElementById('f_number').value;
      var date = document.getElementById('f_date').value;
      var customerId = document.getElementById('f_customer').value;
      var deliveryLocation = document.getElementById('f_deliveryLocation').value || '';
      var expectedDelivery = document.getElementById('f_delivery').value;
      var paymentTerms = document.getElementById('f_paymentTerms').value;
      var status = document.getElementById('f_status').value;
      var fulfillment = document.getElementById('f_fulfillment').value;
      var discount = Math.min(100, Math.max(0, parseFloat(document.getElementById('f_discount').value) || 0));
      var tax = parseFloat(document.getElementById('f_tax').value) || 0;
      var notes = document.getElementById('f_notes').value || '';
      var quotationReference = document.getElementById('f_quotationReference').value || null;
      var piReference = document.getElementById('f_piReference').value || null;

      if (!date || !customerId || !expectedDelivery) {
        showToast('Please fill all required fields (Date, Customer, Expected Delivery)', 'error');
        return;
      }

      var itemsData = [];
      var seenItemIds = {};
      var hasDuplicate = false;
      var rows = document.querySelectorAll('#lineItemsBody .line-item-row');
      rows.forEach(function(row) {
        var itemId = row.querySelector('.item-select').value;
        var qty = Math.max(0, parseFloat(row.querySelector('.item-qty').value) || 0);
        var rate = Math.max(0, parseFloat(row.querySelector('.item-rate').value) || 0);
        if (qty > 0 && rate > 0) {
          if (seenItemIds[itemId]) {
            hasDuplicate = true;
            return;
          }
          seenItemIds[itemId] = true;
          var item = items.find(function(it) { return it.id === itemId; });
          itemsData.push({
            itemId: itemId,
            name: item ? item.name : '',
            qty: qty,
            rate: rate,
            gst: item ? item.gst : 18,
            unit: item ? item.unit : 'Pcs'
          });
        }
      });

      if (hasDuplicate) {
        showToast('Each item can only appear once — merge duplicate line items', 'error');
        return;
      }

      if (itemsData.length === 0) {
        showToast('Please add at least one item to the sales order', 'error');
        return;
      }

      var subtotal = itemsData.reduce(function(sum, item) { return sum + (item.qty * item.rate); }, 0);
      var discountAmt = subtotal * (discount / 100);
      var afterDiscount = subtotal - discountAmt;
      var taxAmt = afterDiscount * (tax / 100);
      var total = afterDiscount + taxAmt;

      var customer = customers.find(function(c) { return c.id === customerId; });
      var customerName = customer ? customer.name : '';

      if (existingId) {
        var so = salesOrders.find(function(x) { return x.id === existingId; });
        if (so) {
          so.number = number;
          so.date = date;
          so.customerId = customerId;
          so.customerName = customerName;
          so.customerAddress = customer ? customer.address : '';
          so.deliveryLocation = deliveryLocation || (customer ? customer.address : '');
          so.expectedDelivery = expectedDelivery;
          so.paymentTerms = paymentTerms;
          so.status = status;
          so.items = itemsData;
          so.discount = discount;
          so.tax = tax;
          so.total = total;
          so.fulfillmentStatus = fulfillment;
          so.notes = notes;
          so.quotationReference = quotationReference;
          so.piReference = piReference;
          showToast('Sales Order updated successfully', 'success');
        }
      } else {
        var newSO = {
          id: 'SO-' + String(nextSONo++).padStart(3, '0'),
          number: number || 'SO/25-26/' + String(salesOrders.length + 1).padStart(3, '0'),
          date: date,
          customerId: customerId,
          customerName: customerName,
          customerAddress: customer ? customer.address : '',
          deliveryLocation: deliveryLocation || (customer ? customer.address : ''),
          expectedDelivery: expectedDelivery,
          paymentTerms: paymentTerms,
          status: status,
          items: itemsData,
          discount: discount,
          tax: tax,
          total: total,
          fulfillmentStatus: fulfillment,
          notes: notes,
          createdAt: date,
          quotationReference: quotationReference,
          piReference: piReference,
          projectReference: null
        };
        salesOrders.unshift(newSO);
        currentPage = 1;
        showToast('Sales Order created successfully', 'success');
      }

      closeModal();
      renderSalesOrders();
    }

    function delSO(id) {
      var so = salesOrders.find(function(x) { return x.id === id; });
      if (!so) return;

      var modalContent = `
        ${modalHeader('Delete Sales Order', so.number)}
        <div class="px-5 py-4 text-sm text-gray-600">
          <p>Are you sure you want to permanently delete <b class="text-gray-800">${so.number}</b>?</p>
          <p class="text-gray-400 text-[11px] mt-1">This action cannot be undone. All associated data will be removed.</p>
          <p class="text-amber-600 text-[11px] mt-2">Total Value: ${money(so.total)}</p>
        </div>
        ${modalFooter('Delete', 'onclick="confirmDeleteSO(\'' + id + '\')"', '')}
      `;
      openModal(modalContent, { width: 'max-w-md' });
    }

    function confirmDeleteSO(id) {
      salesOrders = salesOrders.filter(function(x) { return x.id !== id; });
      closeModal();
      renderSalesOrders();
      showToast('Sales Order deleted successfully', 'warning');
    }

      `;
      openModal(modalContent, { width: 'max-w-md' });

    function confirmRejectSO(id) {
