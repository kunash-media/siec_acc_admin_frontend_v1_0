<style>
  body{font-size:12px;background:#f3f4f6}
  .form-input{width:100%;border:1px solid #e5e7eb;border-radius:6px;padding:5px 10px;font-size:11px;outline:none;background:#fafafa;color:#1a1a2e;transition:border-color .2s,box-shadow .2s}
  .form-input:focus{border-color:#6da84c;box-shadow:0 0 0 3px rgba(109,168,76,.12);background:#fff}
  .form-input:disabled{background:#f3f4f6;cursor:not-allowed}
  .form-label{font-size:10px;font-weight:600;color:#374151;display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:2px 8px;border-radius:12px}
  .badge-green{background:#dcfce7;color:#166534}.badge-amber{background:#fef3c7;color:#92400e}.badge-red{background:#fee2e2;color:#991b1b}
  .badge-gray{background:#f1f5f9;color:#475569}.badge-blue{background:#dbeafe;color:#1e40af}.badge-purple{background:#ede9fe;color:#5b21b6}
  .stat-card{padding:10px 14px;transition:transform .15s,box-shadow .15s}.stat-card:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,.06)}
  .stat-label{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#6b7280}
  .stat-value{font-size:17px;font-weight:700;color:#1a1a2e;margin-top:2px}
  .btn-icon-action{width:28px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#94a3b8;background:transparent;border:none;cursor:pointer;transition:all .15s}
  .btn-icon-action:hover{background:#f1f5f9;color:#6da84c}.btn-icon-action.danger:hover{background:#fee2e2;color:#ef4444}
  .page-title{font-size:20px;font-weight:700;letter-spacing:-.02em}.page-subtitle{font-size:12px;color:#6b7280}
  .page-breadcrumb{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:#6da84c}
  table th{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#6b7280;padding:8px 12px;text-align:left;white-space:nowrap}
  table td{font-size:12px;padding:8px 12px}
  .tab-btn{padding:8px 14px;font-size:11px;font-weight:500;border-bottom:2px solid transparent;color:#6b7280;cursor:pointer;background:transparent;white-space:nowrap}
  .tab-btn.active{color:#6da84c;border-bottom-color:#6da84c;font-weight:600}.tab-btn:hover:not(.active){color:#1f2937}
  .tab-panel{display:none}.tab-panel.active{display:block}
  .avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0}
  .role-card{border:1px solid #e5e7eb;border-radius:10px;padding:14px 16px;background:#fff;transition:border-color .2s,box-shadow .2s}
  .role-card:hover{border-color:#6da84c;box-shadow:0 4px 16px rgba(0,0,0,.06)}
  .perm-table td,.perm-table th{padding:6px 10px;border-bottom:1px solid #f1f5f9;text-align:center}
  .perm-table th{background:#f8fafc;border-bottom:2px solid #e5e7eb}.perm-table td:first-child,.perm-table th:first-child{text-align:left}
  .perm-cb{width:15px;height:15px;cursor:pointer;accent-color:#6da84c}
  .audit-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #f1f5f9}.audit-item:last-child{border-bottom:none}
  .audit-icon{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#eef5e8;color:#6da84c;flex-shrink:0;font-size:11px}
  .toast{animation:fadeIn .2s ease;font-size:12px}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  @keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}
  .animate-modal{animation:modalIn .18s ease}
  .modal-scroll{max-height:62vh;overflow-y:auto}
</style>

<body class="bg-gray-50 text-gray-800 antialiased text-sm">
<div class="flex min-h-screen">
  <div id="sidebar-root"></div>
  <div class="app-main flex-1 flex flex-col min-w-0">
    <div id="topbar-root"></div>
    <main class="p-3 sm:p-4 lg:p-5">
      <div id="toastWrap" class="fixed bottom-5 right-5 z-[200] flex flex-col gap-2 items-end"></div>
      <div id="modalRoot"></div>
      <div class="max-w-7xl mx-auto">

        <div class="flex flex-wrap items-start justify-between gap-3 mb-4">
          <div>
            <div class="page-breadcrumb">System</div>
            <h1 class="page-title text-gray-900">Users &amp; Roles</h1>
            <p class="page-subtitle mt-0.5">Manage team members, role permissions, approvals and the audit trail.</p>
          </div>
          <div class="flex gap-2 flex-wrap" id="headBtns">
            <button onclick="openUser()" class="inline-flex items-center gap-1.5 bg-primary hover:bg-primary-dark text-white text-[11px] font-semibold px-3 py-2 rounded-lg transition shadow-sm"><i class="fa-solid fa-plus"></i> Add User</button>
            <button onclick="openRole()" class="inline-flex items-center gap-1.5 bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 text-[11px] font-semibold px-3 py-2 rounded-lg transition"><i class="fa-solid fa-plus"></i> Add Role</button>
          </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-5 gap-2.5 mb-4">
          <div class="bg-white border border-gray-200 rounded-xl shadow-sm stat-card"><div class="stat-label">Total Users</div><div class="stat-value" id="sUsers">—</div></div>
          <div class="bg-white border border-gray-200 rounded-xl shadow-sm stat-card"><div class="stat-label">Active</div><div class="stat-value text-green-600" id="sActive">—</div></div>
          <div class="bg-white border border-gray-200 rounded-xl shadow-sm stat-card"><div class="stat-label">Roles</div><div class="stat-value text-blue-600" id="sRoles">—</div></div>
          <div class="bg-white border border-gray-200 rounded-xl shadow-sm stat-card"><div class="stat-label">Pending Approvals</div><div class="stat-value text-amber-600" id="sPending">—</div></div>
          <div class="bg-white border border-gray-200 rounded-xl shadow-sm stat-card"><div class="stat-label">Audit Events</div><div class="stat-value text-gray-700" id="sAudit">—</div></div>
        </div>

        <div class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
          <div class="flex overflow-x-auto border-b border-gray-200 px-4 pt-2 gap-1" id="tabs">
            <button class="tab-btn active" data-tab="tUsers" data-super="1"><i class="fa-solid fa-users mr-1.5"></i>Users</button>
            <button class="tab-btn" data-tab="tRoles" data-super="1"><i class="fa-solid fa-shield-halved mr-1.5"></i>Roles &amp; Permissions</button>
            <button class="tab-btn" data-tab="tAppr"><i class="fa-solid fa-circle-check mr-1.5"></i>Approvals</button>
            <button class="tab-btn" data-tab="tAudit" data-super="1"><i class="fa-solid fa-clock-rotate-left mr-1.5"></i>Audit Trail</button>
          </div>
          <div class="p-5">
            <div id="tUsers" class="tab-panel active"></div>
            <div id="tRoles" class="tab-panel"></div>
            <div id="tAppr" class="tab-panel"></div>

<script src="/assets/js/nav-sidebar.js"></script>
<script>
var API = 'http://localhost:9093';
NavSidebar.init({ basePath: "", activePage: "users", pageTitle: "Users & Roles" });

var me = {}; try { me = JSON.parse(localStorage.getItem('adminAuth') || '{}'); } catch (e) {}
var isSuper = me.role === 'SUPER_ADMIN';   // UX only: every API call is checked on the server
var users = [], roles = [], mods = [];
var ap = { page: 1, status: 'PENDING', pages: 1 }, au = { page: 1, pages: 1 };
var ACTIONS = ['view', 'create', 'edit', 'delete', 'approve'];
var AUDIT_ACTIONS = ['CREATE', 'UPDATE', 'DELETE', 'APPROVE', 'REJECT', 'CONVERT', 'APPROVAL_REQUESTED', 'APPROVAL_CANCELLED', 'LOGIN', 'LOGIN_FAILED', 'DENIED', 'WOULD_DENY'];

// ---------- helpers ----------
function $(id) { return document.getElementById(id); }
function v(id) { var e = $(id); return e ? e.value.trim() : ''; }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function J(method, body) { return { method: method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) }; }
function fdt(s) { return s ? String(s).replace('T', ' ').substring(0, 16) : '—'; }
function toast(m, k) {
  var c = { success: 'bg-green-600', info: 'bg-primary', warning: 'bg-amber-600', error: 'bg-red-600' }[k || 'success'];
  var el = document.createElement('div'); el.className = 'toast ' + c + ' text-white font-semibold px-3 py-2 rounded-lg shadow-lg max-w-xs'; el.textContent = m;
  $('toastWrap').appendChild(el);
  setTimeout(function () { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(function () { el.remove(); }, 300); }, 2800);
}
async function api(path, o) {
  o = o || {}; o.credentials = 'include';
  var r; try { r = await fetch(API + path, o); } catch (e) { throw new Error('Cannot reach the server. Check your connection.'); }
  var b = null, json = (r.headers.get('content-type') || '').indexOf('json') > -1;
  try { b = json ? await r.json() : await r.text(); } catch (e) {}
  if (!r.ok) throw new Error((b && b.message) || (b && b.error) || (typeof b === 'string' && b) || 'Request failed (HTTP ' + r.status + ')');
  return b;
}
function modal(title, sub, body, foot, w) {
  $('modalRoot').innerHTML = '<div class="fixed inset-0 z-[100] flex items-center justify-center p-3"><div class="absolute inset-0 bg-black/40" onclick="closeModal()"></div>' +
    '<div class="relative bg-white rounded-xl shadow-2xl w-full ' + (w || 'max-w-lg') + ' max-h-[92vh] overflow-hidden animate-modal">' +
    '<div class="flex items-start justify-between px-5 py-3.5 border-b border-gray-100"><div><h3 class="text-base font-bold text-gray-900">' + title + '</h3>' + (sub ? '<p class="text-[11px] text-gray-500 mt-0.5">' + sub + '</p>' : '') + '</div>' +
    '<button onclick="closeModal()" class="w-7 h-7 rounded-lg hover:bg-gray-100 text-gray-400"><i class="fa-solid fa-xmark"></i></button></div>' +
    '<div class="px-5 py-4 modal-scroll">' + body + '</div>' +
    '<div class="flex justify-end gap-2 px-5 py-3 border-t border-gray-100 bg-gray-50"><button onclick="closeModal()" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-600 border border-gray-200 hover:bg-white">Cancel</button>' + (foot || '') + '</div></div></div>';
  document.body.style.overflow = 'hidden';
}
function closeModal() { $('modalRoot').innerHTML = ''; document.body.style.overflow = ''; }
function saveBtn(label, fn, cls) { return '<button id="mBtn" onclick="' + fn + '" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-white ' + (cls || 'bg-primary hover:bg-primary-dark') + ' shadow-sm">' + label + '</button>'; }
function busy(on) { var b = $('mBtn'); if (b) { b.disabled = on; b.style.opacity = on ? .6 : 1; } }
function fld(l, h) { return '<div class="mb-2"><label class="form-label">' + l + '</label>' + h + '</div>'; }
function color(name) { var cs = ['#6da84c', '#1985bf', '#d97706', '#7c3aed', '#dc2626', '#0891b2', '#4f46e5'], h = 0; for (var i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h); return cs[Math.abs(h) % cs.length]; }
function initials(n) { var p = String(n || 'U').trim().split(/\s+/); return (p.length > 1 ? p[0][0] + p[p.length - 1][0] : String(n || 'U').substring(0, 2)).toUpperCase(); }
function roleName(k) { var r = roles.find(function (x) { return x.roleKey === String(k || '').toUpperCase(); }); return r ? r.roleName : (k || '—'); }
function pager(prefix, page, pages) {
  return '<div class="flex items-center justify-end gap-2 mt-3 text-[10px] text-gray-500"><button ' + (page <= 1 ? 'disabled' : '') + ' onclick="' + prefix + 'Go(' + (page - 1) + ')" class="px-2 py-1 border border-gray-200 rounded disabled:opacity-40">Prev</button>Page ' + page + ' of ' + pages +
    '<button ' + (page >= pages ? 'disabled' : '') + ' onclick="' + prefix + 'Go(' + (page + 1) + ')" class="px-2 py-1 border border-gray-200 rounded disabled:opacity-40">Next</button></div>';
}
function empty(msg) { return '<div class="text-center py-10 text-gray-400 text-sm">' + msg + '</div>'; }
function card(head, body) { return '<div class="border border-gray-200 rounded-xl overflow-hidden"><div class="px-4 py-2.5 border-b border-gray-100 font-semibold text-sm text-gray-800 flex items-center justify-between gap-2 flex-wrap">' + head + '</div>' + body + '</div>'; }

// ---------- tabs ----------
document.querySelectorAll('#tabs .tab-btn').forEach(function (b) {
  if (!isSuper && b.dataset.super) { b.style.display = 'none'; return; }
  b.addEventListener('click', function () { showTab(b.dataset.tab); });
});
function showTab(id) {
  document.querySelectorAll('#tabs .tab-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === id); });
  document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.toggle('active', p.id === id); });
}

// ---------- stats ----------
async function refreshStats() {
  $('sUsers').textContent = isSuper ? users.length : '—';
  $('sActive').textContent = isSuper ? users.filter(function (u) { return u.adminIsActive !== false; }).length : '—';
  $('sRoles').textContent = isSuper ? roles.length : '—';
  try { var p = await api('/api/admin/approvals?status=PENDING&pageNumber=1&pageSize=1'); $('sPending').textContent = p.totalElements; } catch (e) { $('sPending').textContent = '—'; }
}

// ---------- users ----------
async function loadUsers() {
  try { var d = await api('/api/admin/get-all-admin'); users = Array.isArray(d) ? d : []; } catch (e) { users = []; toast(e.message, 'error'); }
  renderUsers(); refreshStats();
}
function renderUsers() {
  var rows = users.map(function (u) {
    var name = ((u.adminFirstName || '') + ' ' + (u.adminLastName || '')).trim() || u.adminId, self = u.adminId === me.adminId;
    var st = u.adminIsLocked ? '<span class="badge badge-red">Locked</span>' : (u.adminIsActive === false ? '<span class="badge badge-gray">Inactive</span>' : '<span class="badge badge-green">Active</span>');
    return '<tr class="border-b border-gray-100 hover:bg-gray-50"><td><div class="flex items-center gap-3"><div class="avatar" style="background:' + color(name) + '">' + esc(initials(name)) + '</div><div><div class="font-semibold text-gray-800">' + esc(name) + (self ? ' <span class="text-[9px] text-primary">(you)</span>' : '') + '</div><div class="text-[10px] text-gray-400 font-mono">' + esc(u.adminId) + '</div></div></div></td>' +
      '<td class="text-gray-600">' + esc(u.adminEmail || '—') + '</td><td class="text-gray-600">' + esc(u.adminMobileNumber || '—') + '</td>' +
      '<td><span class="badge badge-blue">' + esc(roleName(u.adminRole)) + '</span></td><td>' + st + '</td><td class="text-[10px] text-gray-500">' + fdt(u.adminLastLoginAt) + '</td>' +
      '<td class="whitespace-nowrap"><button class="btn-icon-action" title="Edit" onclick="openUser(\'' + esc(u.adminId) + '\')"><i class="fa-solid fa-pen"></i></button>' +
      (self ? '' : '<button class="btn-icon-action" title="' + (u.adminIsActive === false ? 'Activate' : 'Deactivate') + '" onclick="toggleUser(\'' + esc(u.adminId) + '\')"><i class="fa-solid fa-power-off"></i></button><button class="btn-icon-action danger" title="Delete" onclick="askDeleteUser(\'' + esc(u.adminId) + '\')"><i class="fa-solid fa-trash"></i></button>') + '</td></tr>';
  }).join('');
  $('tUsers').innerHTML = card('All Users <span class="text-[10px] font-bold bg-primary-soft text-primary-dark px-2 py-0.5 rounded-full">' + users.length + '</span>',
    users.length ? '<div class="overflow-x-auto"><table class="w-full"><thead><tr class="bg-gray-50 border-b border-gray-200"><th>User</th><th>Email</th><th>Mobile</th><th>Role</th><th>Status</th><th>Last login</th><th>Actions</th></tr></thead><tbody>' + rows + '</tbody></table></div>' : empty('No users yet. Add the first user.'));
}
function openUser(id) {
  var u = id ? users.find(function (x) { return x.adminId === id; }) : null; u = u || {};
  var opts = roles.map(function (r) { return '<option value="' + esc(r.roleKey) + '"' + (r.roleKey === String(u.adminRole || '').toUpperCase() ? ' selected' : '') + '>' + esc(r.roleName) + '</option>'; }).join('');
  var i = function (idn, val, ph, t) { return '<input type="' + (t || 'text') + '" class="form-input" id="' + idn + '" value="' + esc(val || '') + '" placeholder="' + (ph || '') + '">'; };
  modal(id ? 'Edit User' : 'Add User', id ? esc(id) : 'Create a team member account',
    '<div class="grid grid-cols-2 gap-3">' + fld('First name *', i('u_first', u.adminFirstName)) + fld('Last name', i('u_last', u.adminLastName)) +
    fld('Mobile *', i('u_mobile', u.adminMobileNumber, '10-digit number')) + fld('Email', i('u_email', u.adminEmail, '', 'email')) +
    fld('Role *', '<select class="form-input" id="u_role">' + opts + '</select>') + fld('Department', i('u_dept', u.adminDepartment)) + '</div>' +
    fld('Address', i('u_addr', u.adminAddress)) + fld(id ? 'New password (leave blank to keep)' : 'Password *', i('u_pass', '', id ? 'Unchanged' : 'Minimum 6 characters', 'password')) +
    (id ? '<label class="flex items-center gap-2 text-xs text-gray-600 mt-1"><input type="checkbox" class="perm-cb" id="u_active"' + (u.adminIsActive === false ? '' : ' checked') + '> Account is active</label>' : ''),
    saveBtn(id ? 'Update user' : 'Create user', "saveUser('" + (id || '') + "')"));
}
async function saveUser(id) {
  var b = { adminFirstName: v('u_first'), adminLastName: v('u_last'), adminMobileNumber: v('u_mobile'), adminEmail: v('u_email'), adminDepartment: v('u_dept'), adminAddress: v('u_addr'), adminRole: v('u_role') };
  if (!b.adminFirstName || !b.adminMobileNumber || !b.adminRole) return toast('First name, mobile and role are required', 'error');
  if (!id && v('u_pass').length < 6) return toast('Password must be at least 6 characters', 'error');
  if (v('u_pass')) b.adminPassword = $('u_pass').value;
  busy(true);
  try {
    if (id) { b.adminIsActive = $('u_active').checked; await api('/api/admin/patch-admin-by-adminId/' + encodeURIComponent(id), J('PATCH', b)); }
    else await api('/api/admin/create-admin', J('POST', b));
    closeModal(); toast(id ? 'User updated' : 'User created'); loadUsers(); loadRoles();
  } catch (e) { toast(e.message, 'error'); busy(false); }
}
async function toggleUser(id) {
  var u = users.find(function (x) { return x.adminId === id; }); if (!u) return;
  try { await api('/api/admin/patch-admin-by-adminId/' + encodeURIComponent(id), J('PATCH', { adminIsActive: u.adminIsActive === false })); toast(u.adminIsActive === false ? 'User activated' : 'User deactivated', 'info'); loadUsers(); }
  catch (e) { toast(e.message, 'error'); }
}
function askDeleteUser(id) {
  modal('Delete user', esc(id), '<p class="text-sm text-gray-600">Permanently delete <b>' + esc(id) + '</b>? Their past activity stays in the audit trail. To keep the account but block access, deactivate it instead.</p>', saveBtn('Delete', "doDeleteUser('" + esc(id) + "')", 'bg-red-600 hover:bg-red-700'));
}
async function doDeleteUser(id) {
  busy(true);
  try { await api('/api/admin/delete-admin-by-adminId/' + encodeURIComponent(id), { method: 'DELETE' }); closeModal(); toast('User deleted', 'warning'); loadUsers(); loadRoles(); }
  catch (e) { toast(e.message, 'error'); busy(false); }
}

// ---------- roles ----------
async function loadRoles() {
  try { roles = await api('/api/admin/roles'); if (!mods.length) mods = await api('/api/admin/roles/modules'); } catch (e) { toast(e.message, 'error'); }
  renderRoles(); renderUsers(); refreshStats();
}
function renderRoles() {
  $('tRoles').innerHTML = '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">' + roles.map(function (r) {
    return '<div class="role-card"><div class="flex items-start justify-between"><div><div class="font-bold text-sm text-gray-900">' + esc(r.roleName) + (r.system ? ' <span class="badge badge-purple">System</span>' : '') + '</div>' +
      '<div class="text-[10.5px] text-gray-500 mt-0.5">' + esc(r.roleDescription || '—') + '</div><div class="text-[11px] font-semibold text-primary mt-1">' + r.userCount + ' user' + (r.userCount === 1 ? '' : 's') + '</div></div>' +
      '<span class="w-3 h-3 rounded-full" style="background:' + esc(r.roleColor || '#6da84c') + '"></span></div>' +
      '<div class="flex gap-3 mt-3 text-[10.5px] font-semibold"><button class="text-primary hover:underline" onclick="openRole(\'' + esc(r.roleKey) + '\')">' + (r.system ? 'View permissions' : 'Edit &amp; permissions') + '</button>' +
      (r.system ? '' : '<button class="text-red-500 hover:underline" onclick="askDeleteRole(\'' + esc(r.roleKey) + '\')">Delete</button>') + '</div></div>';
  }).join('') + '</div><div class="mt-4 p-3 bg-primary-soft rounded-lg border border-primary/20 text-xs text-gray-600">Each role sets View / Create / Edit / Delete / Approve per module. Changes apply on the next request, without users logging in again. <b>Approve</b> also controls who can approve delete requests.</div>';
}
async function openRole(key) {
  var r = { roleName: '', roleDescription: '', roleColor: '#6da84c', system: false, permissions: [] };
  if (key) { try { r = await api('/api/admin/roles/' + encodeURIComponent(key)); } catch (e) { return toast(e.message, 'error'); } }
  var pm = {}; (r.permissions || []).forEach(function (p) { pm[p.moduleKey] = p; });
  var ro = r.system ? ' disabled' : '';
  var rows = mods.map(function (m) {
    var p = pm[m.key] || {};
    return '<tr><td class="font-semibold text-gray-700">' + esc(m.label) + '</td>' + ACTIONS.map(function (a) {
      return '<td><input type="checkbox" class="perm-cb pcb" data-m="' + esc(m.key) + '" data-a="' + a + '"' + (p[a] ? ' checked' : '') + ro + '></td>';
    }).join('') + '<td>' + (r.system ? '' : '<button class="text-[10px] text-primary hover:underline" onclick="rowAll(this)">all</button>') + '</td></tr>';
  }).join('');
  modal(key ? (r.system ? 'Role permissions' : 'Edit Role') : 'Add Role', key ? esc(key) : 'Create a role and choose what it can do',
    '<div class="grid grid-cols-3 gap-3">' + '<div class="col-span-2">' + fld('Role name *', '<input class="form-input" id="r_name" value="' + esc(r.roleName) + '"' + ro + '>') + '</div>' +
    fld('Colour', '<input type="color" class="form-input" id="r_color" style="height:30px" value="' + esc(r.roleColor || '#6da84c') + '"' + ro + '>') + '</div>' +
    fld('Description', '<input class="form-input" id="r_desc" value="' + esc(r.roleDescription || '') + '"' + ro + '>') +
    '<div class="border border-gray-200 rounded-lg overflow-x-auto mt-2"><table class="w-full perm-table"><thead><tr><th>Module</th><th>View</th><th>Create</th><th>Edit</th><th>Delete</th><th>Approve</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    (r.system ? '<p class="text-[10.5px] text-gray-500 mt-2">System roles cannot be changed. Super Admin always has full access.</p>' : ''),
    r.system ? '' : saveBtn(key ? 'Update role' : 'Create role', "saveRole('" + (key || '') + "')"), 'max-w-3xl');
}
function rowAll(btn) { var cbs = btn.closest('tr').querySelectorAll('.pcb'), all = [].every.call(cbs, function (c) { return c.checked; }); cbs.forEach(function (c) { c.checked = !all; }); }
async function saveRole(key) {
  if (!v('r_name')) return toast('Role name is required', 'error');
  var map = {};
  document.querySelectorAll('.pcb').forEach(function (c) { var m = c.dataset.m; map[m] = map[m] || { moduleKey: m }; map[m][c.dataset.a] = c.checked; });
  var body = { roleName: v('r_name'), roleDescription: v('r_desc'), roleColor: v('r_color'), permissions: Object.keys(map).map(function (k) { return map[k]; }) };
  busy(true);
  try { await api(key ? '/api/admin/roles/' + encodeURIComponent(key) : '/api/admin/roles', J(key ? 'PUT' : 'POST', body)); closeModal(); toast(key ? 'Role updated' : 'Role created'); loadRoles(); }
  catch (e) { toast(e.message, 'error'); busy(false); }
}
function askDeleteRole(key) { modal('Delete role', esc(key), '<p class="text-sm text-gray-600">Delete role <b>' + esc(roleName(key)) + '</b>? This is blocked while users are assigned to it.</p>', saveBtn('Delete', "doDeleteRole('" + esc(key) + "')", 'bg-red-600 hover:bg-red-700')); }
async function doDeleteRole(key) {
  busy(true);
  try { await api('/api/admin/roles/' + encodeURIComponent(key), { method: 'DELETE' }); closeModal(); toast('Role deleted', 'warning'); loadRoles(); }
  catch (e) { toast(e.message, 'error'); busy(false); }
}

// ---------- approvals ----------
var STB = { PENDING: 'badge-amber', APPROVED: 'badge-green', REJECTED: 'badge-red', CANCELLED: 'badge-gray' };
async function loadApprovals() {
  var d;
  try { d = await api('/api/admin/approvals?status=' + ap.status + '&pageNumber=' + ap.page + '&pageSize=10'); } catch (e) { $('tAppr').innerHTML = empty(esc(e.message)); return; }
  ap.pages = d.totalPages || 1;
  var rows = (d.content || []).map(function (a) {
    var mine = a.requestedByAdminId === me.adminId, act = '';
    if (a.canDecide) act += '<button class="btn-icon-action" title="Approve" onclick="decide(' + a.id + ',\'approve\')"><i class="fa-solid fa-check"></i></button><button class="btn-icon-action danger" title="Reject" onclick="decide(' + a.id + ',\'reject\')"><i class="fa-solid fa-xmark"></i></button>';
    if (mine && a.status === 'PENDING') act += '<button class="text-[10px] text-gray-500 hover:underline ml-1" onclick="cancelReq(' + a.id + ')">Cancel</button>';
    return '<tr class="border-b border-gray-100"><td><div class="font-semibold text-gray-800">' + esc(a.description || a.entityType) + '</div><div class="text-[10px] text-gray-400">' + esc(a.requestType === 'REVIEW' ? 'Review (already saved)' : 'Delete request') + ' · ' + esc(a.moduleKey) + '</div></td>' +
      '<td class="font-mono text-xs">' + (a.amount != null ? '₹' + Number(a.amount).toLocaleString('en-IN') : '—') + '</td><td>' + esc(a.requestedByName || a.requestedByAdminId) + '</td><td class="text-[10px] text-gray-500">' + fdt(a.requestedAt) + '</td>' +
      '<td><span class="badge ' + (STB[a.status] || 'badge-gray') + '">' + esc(a.status.toLowerCase()) + '</span>' + (a.decisionNote ? '<div class="text-[10px] text-gray-400 mt-0.5">' + esc(a.decidedByName || '') + ': ' + esc(a.decisionNote) + '</div>' : '') + '</td><td class="whitespace-nowrap">' + (act || '<span class="text-gray-300">—</span>') + '</td></tr>';
  }).join('');
  var sel = ['PENDING', 'APPROVED', 'REJECTED', 'CANCELLED', 'ALL'].map(function (s) { return '<option value="' + s + '"' + (ap.status === s ? ' selected' : '') + '>' + s.charAt(0) + s.slice(1).toLowerCase() + '</option>'; }).join('');
  $('tAppr').innerHTML = card('Approvals <select class="form-input" style="width:auto" onchange="ap.status=this.value;ap.page=1;loadApprovals()">' + sel + '</select>',
    (d.content || []).length ? '<div class="overflow-x-auto"><table class="w-full"><thead><tr class="bg-gray-50 border-b border-gray-200"><th>Request</th><th>Amount</th><th>Requested by</th><th>When</th><th>Status</th><th>Actions</th></tr></thead><tbody>' + rows + '</tbody></table></div>' : empty('Nothing here.')) + pager('ap', ap.page, ap.pages) + '<div id="rulesBox" class="mt-5"></div>';
  if (isSuper) loadRules();
}
function apGo(p) { ap.page = p; loadApprovals(); }
function decide(id, kind) {
  var rej = kind === 'reject';
  modal(rej ? 'Reject request' : 'Approve request', '#' + id, '<p class="text-xs text-gray-500 mb-2">' + (rej ? 'Tell the requester why.' : 'Approving a delete request deletes the record immediately.') + '</p>' + fld(rej ? 'Reason *' : 'Note (optional)', '<textarea rows="2" class="form-input" id="d_note"></textarea>'),
    saveBtn(rej ? 'Reject' : 'Approve', "doDecide(" + id + ",'" + kind + "')", rej ? 'bg-red-600 hover:bg-red-700' : ''));
}
async function doDecide(id, kind) {
  if (kind === 'reject' && !v('d_note')) return toast('Please give a reason', 'error');
  busy(true);
  try { await api('/api/admin/approvals/' + id + '/' + kind, J('POST', { note: v('d_note') })); closeModal(); toast(kind === 'approve' ? 'Approved' : 'Rejected', kind === 'approve' ? 'success' : 'warning'); loadApprovals(); refreshStats(); if (isSuper) loadAudit(); }
  catch (e) { toast(e.message, 'error'); busy(false); }
}
async function cancelReq(id) { try { await api('/api/admin/approvals/' + id + '/cancel', J('POST')); toast('Request cancelled', 'info'); loadApprovals(); refreshStats(); } catch (e) { toast(e.message, 'error'); } }
async function loadRules() {
  var box = $('rulesBox'); if (!box) return;
  try {
    var rs = await api('/api/admin/approval-rules');
    box.innerHTML = card('Approval rules <span class="text-[10px] font-normal text-gray-500">Gate = blocked until approved · Review = saved, then flagged for review</span>',
      '<table class="w-full"><thead><tr class="bg-gray-50 border-b border-gray-200"><th>Applies to</th><th>Action</th><th>Mode</th><th>From amount (₹)</th><th>On</th><th></th></tr></thead><tbody>' + rs.map(function (r) {
        return '<tr class="border-b border-gray-100"><td class="font-semibold">' + esc(r.entityType.toLowerCase().replace(/_/g, ' ')) + '</td><td>' + esc(r.action.toLowerCase()) + '</td><td>' + esc(r.mode.toLowerCase()) + '</td>' +
          '<td>' + (r.mode === 'REVIEW' ? '<input type="number" min="0" class="form-input" style="width:110px" id="ra' + r.id + '" value="' + (r.minAmount == null ? '' : r.minAmount) + '">' : '<span class="text-gray-300">any</span>') + '</td>' +
          '<td><input type="checkbox" class="perm-cb" id="rc' + r.id + '"' + (r.active ? ' checked' : '') + '></td><td><button class="text-[10px] text-primary font-semibold hover:underline" onclick="saveRule(' + r.id + ',' + (r.mode === 'REVIEW') + ')">Save</button></td></tr>';
      }).join('') + '</tbody></table>');
  } catch (e) { box.innerHTML = ''; }
}
async function saveRule(id, review) {
  var b = { active: $('rc' + id).checked }; if (review && v('ra' + id) !== '') b.minAmount = Number(v('ra' + id));
  try { await api('/api/admin/approval-rules/' + id, J('PUT', b)); toast('Rule saved'); loadRules(); } catch (e) { toast(e.message, 'error'); }
}

// ---------- audit trail ----------
var ACLR = { DELETE: 'badge-red', DENIED: 'badge-red', LOGIN_FAILED: 'badge-red', WOULD_DENY: 'badge-amber', APPROVAL_REQUESTED: 'badge-amber', APPROVE: 'badge-green', CREATE: 'badge-green', LOGIN: 'badge-blue', REJECT: 'badge-red' };
function auditShell() {
  $('tAudit').innerHTML = '<div class="flex flex-wrap gap-2 mb-3"><input class="form-input" style="width:180px" id="a_q" placeholder="Search summary / number / person" onkeyup="if(event.key===\'Enter\')auditGo(1)">' +
    '<select class="form-input" style="width:150px" id="a_mod" onchange="auditGo(1)"><option value="">All modules</option>' + mods.map(function (m) { return '<option value="' + esc(m.key) + '">' + esc(m.label) + '</option>'; }).join('') + '</select>' +
    '<select class="form-input" style="width:170px" id="a_act" onchange="auditGo(1)"><option value="">All actions</option>' + AUDIT_ACTIONS.map(function (a) { return '<option>' + a + '</option>'; }).join('') + '</select>' +
    '<input type="date" class="form-input" style="width:130px" id="a_from" onchange="auditGo(1)"><input type="date" class="form-input" style="width:130px" id="a_to" onchange="auditGo(1)">' +
    '<button class="text-[11px] text-primary font-semibold hover:underline" onclick="auditGo(1)">Search</button></div><div id="auditList"></div><div id="auditPager"></div>';
}
async function loadAudit() {
  if (!$('auditList')) auditShell();
  var p = new URLSearchParams({ pageNumber: au.page, pageSize: 20 });
  [['search', 'a_q'], ['module', 'a_mod'], ['action', 'a_act'], ['from', 'a_from'], ['to', 'a_to']].forEach(function (x) { if (v(x[1])) p.set(x[0], v(x[1])); });
  try {
    var d = await api('/api/admin/audit?' + p.toString()); au.pages = d.totalPages || 1; $('sAudit').textContent = d.totalElements;
    $('auditList').innerHTML = (d.content || []).length ? (d.content || []).map(function (e) {
      return '<div class="audit-item"><div class="audit-icon"><i class="fa-solid fa-bolt"></i></div><div class="min-w-0 flex-1"><div class="font-semibold text-gray-900 text-xs"><span class="badge ' + (ACLR[e.action] || 'badge-gray') + ' mr-1.5">' + esc(e.action) + '</span>' + esc(e.entityType || '') + ' ' + esc(e.entityRef || (e.entityId ? '#' + e.entityId : '')) + '</div>' +
        '<div class="text-[10.5px] text-gray-500 mt-0.5">' + esc(e.adminName || e.adminId || 'Unknown') + (e.role ? ' (' + esc(e.role) + ')' : '') + ' · ' + esc(e.moduleKey || '') + ' · ' + fdt(e.createdAt) + (e.ipAddress ? ' · ' + esc(e.ipAddress) : '') + '</div>' +
        '<div class="text-[11px] text-gray-700 mt-0.5">' + esc(e.summary || '') + '</div></div></div>';
    }).join('') : empty('No activity found for these filters.');
    $('auditPager').innerHTML = pager('au', au.page, au.pages);
  } catch (e) { $('auditList').innerHTML = empty(esc(e.message)); }
}
function auditGo(p) { au.page = p; loadAudit(); }
function auGo(p) { auditGo(p); }

// ---------- init ----------
(async function init() {
  if (!isSuper) { $('headBtns').style.display = 'none'; showTab('tAppr'); loadApprovals(); refreshStats(); return; }
  await loadRoles();
  await Promise.all([loadUsers(), loadApprovals(), loadAudit()]);
})();
document.addEventListener('siec:perms', function () { refreshStats(); });
</script>
</body>
</html>
