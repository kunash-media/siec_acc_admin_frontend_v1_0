  <!-- Page-specific styles (same look as Vendors page) -->
  <style>
    /* Form styles */
    .form-input {
      width: 100%;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #fafafa;
      color: #1a1a2e;
    }

    .form-input:focus {
      border-color: #6da84c;
      box-shadow: 0 0 0 3px rgba(109, 168, 76, 0.15);
      background: #ffffff;
    }

    .form-input:disabled {
      background: #f3f4f6;
      cursor: not-allowed;
    }

    .form-label {
      font-size: 11.5px;
      font-weight: 600;
      color: #374151;
      display: block;
      margin-bottom: 4px;
    }

    .form-label .required {
      color: #ef4444;
      margin-left: 2px;
    }

    .form-hint {
      font-size: 10.5px;
      color: #9ca3af;
      margin-top: 3px;
    }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
    }

    .badge-green { background: #dcfce7; color: #166534; }
    .badge-amber { background: #fef3c7; color: #92400e; }
    .badge-red { background: #fee2e2; color: #991b1b; }
    .badge-gray { background: #f1f5f9; color: #475569; }
    .badge-blue { background: #dbeafe; color: #1e40af; }
    .badge-purple { background: #ede9fe; color: #5b21b6; }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
    }

    .badge-dot-green { background: #22c55e; }
    .badge-dot-amber { background: #f59e0b; }
    .badge-dot-red { background: #ef4444; }
    .badge-dot-gray { background: #94a3b8; }
    .badge-dot-blue { background: #3b82f6; }
    .badge-dot-purple { background: #8b5cf6; }

    /* Stats card */
    .stat-card {
      border: 1px solid #7dc057;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      height: 70px;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }

    .stat-icon-wrap {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid #6da84c;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    /* Table row hover */
    .table-row-hover:hover {
      background: #f8fafc;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.96) translateY(6px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .animate-modal {
      animation: modalIn 0.18s ease;
    }

    /* Action buttons */
    .btn-icon-action {
      transition: all 0.15s ease;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      background: transparent;
      border: 1px solid gray;
      cursor: pointer;
    }

    .btn-icon-action:hover {
      background: #f1f5f9;
      color: #6da84c;
    }

    .btn-icon-action.danger:hover {
      background: #fee2e2;
      color: #ef4444;
    }

    /* Toast */
    .toast {
      animation: fadeIn 0.2s ease;
    }

    /* Scrollbar for modal */
    .modal-scroll {
      max-height: 60vh;
      overflow-y: auto;
    }

    .modal-scroll::-webkit-scrollbar {
      width: 4px;
    }

    .modal-scroll::-webkit-scrollbar-thumb {
      background: #d1d5db;
      border-radius: 4px;
    }

    /* Empty state */
    .empty-icon-svg {
      opacity: 0.2;
      width: 48px;
      height: 48px;
      color: #94a3b8;
    }

    /* Receipt preview */
    .receipt-preview {
      background: #ffffff;
      border: 1px solid #6da84c;
      border-radius: 12px;
      padding: 24px 28px;
      max-width: 720px;
      margin: 0 auto;
    }

    .receipt-preview .receipt-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 2px solid #6da84c;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    .receipt-preview .receipt-title {
      font-size: 20px;
      font-weight: 700;
      color: #6da84c;
      letter-spacing: 0.04em;
    }

    .receipt-preview .receipt-company-name {
      font-size: 16px;
      font-weight: 700;
      color: #1a1a2e;
    }

    .receipt-preview .receipt-company-details {
      font-size: 11.5px;
      color: #6b7280;
      line-height: 1.5;
      margin-top: 2px;
    }

    .receipt-preview .receipt-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
      font-size: 13px;
    }

    .receipt-preview .meta-label {
      font-weight: 700;
      color: #6b7280;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .receipt-preview .meta-value {
      font-weight: 600;
      color: #1a1a2e;
    }

    .receipt-preview .receipt-table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0;
      font-size: 13px;
    }

    .receipt-preview .receipt-table th {
      background: #f8fafc;
      text-align: left;
      padding: 8px 10px;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      color: #6b7280;
      border-bottom: 2px solid #e5e7eb;
    }

    .receipt-preview .receipt-table td {
      padding: 8px 10px;
      border-bottom: 1px solid #f1f5f9;
    }

    .receipt-preview .receipt-total {
      margin-top: 10px;
      border-top: 2px solid #6da84c;
      padding-top: 10px;
      text-align: right;
      font-size: 15px;
      font-weight: 700;
      color: #6da84c;
    }

    .receipt-preview .receipt-footer {
      margin-top: 16px;
      font-size: 11px;
      color: #6b7280;
      border-top: 1px solid #e5e7eb;
      padding-top: 10px;
      text-align: center;
    }
  
    /* Print: only the receipt */
    @media print {
      body * { visibility: hidden !important; }
      .receipt-preview, .receipt-preview * { visibility: visible !important; }
      .receipt-preview { position: absolute; left: 0; top: 0; width: 100%; border: none; max-width: none; }
    }
  </style>
</head>

  <!-- ========================================================== -->
  <!-- SCRIPTS -->
  <!-- ========================================================== -->

  <script src="/assets/js/nav-sidebar.js"></script>
  <script>
    // =============================================================
    // NAV-SIDEBAR INIT
    // =============================================================
    NavSidebar.init({
      basePath: "",
      activePage: "vendor-payments",
      pageTitle: "Vendor Payments",
      user: {
        name: "Admin",
        role: "Super Admin",
        avatarUrl: "",
      },
    });

    // =============================================================
    // API CONFIG  (backend: Spring Boot, port 9093)
    // Set window.API_HOST once (e.g. in a shared js file) to change it everywhere.
    // =============================================================
    var API_HOST = window.API_HOST || "http://localhost:9093";
    var VP_API = API_HOST + "/api/vendor-payments/v1";
    var VENDOR_API = API_HOST + "/api/vendor";

    // Backend wraps every response as { status, message, data } -> we return `data`.
    async function apiRequest(method, url, body) {
      var opts = { method: method, headers: { "Content-Type": "application/json" } };
      if (body !== undefined) opts.body = JSON.stringify(body);
      var res, json = null;
      try { res = await fetch(url, opts); }
      catch (e) { throw new Error("Could not reach the server. Is it running on port 9093?"); }
      try { json = await res.json(); } catch (e) { /* empty body */ }
      if (!res.ok) throw new Error((json && (json.message || json.error)) || ("Request failed with status " + res.status));
      return json && typeof json === "object" && !Array.isArray(json) && "data" in json ? json.data : json;
    }

    // =============================================================
    // ICONS (Font Awesome — same as Vendors page)
    // =============================================================
    function iconPlus() { return `<i class="fa-solid fa-plus"></i>`; }
    function iconEdit() { return `<i class="fa-solid fa-pen"></i>`; }
    function iconTrash() { return `<i class="fa-solid fa-trash"></i>`; }
    function iconEye() { return `<i class="fa-solid fa-eye"></i>`; }
    function iconX() { return `<i class="fa-solid fa-xmark"></i>`; }
    function iconSearch() { return `<i class="fa-solid fa-magnifying-glass"></i>`; }
    function iconSave() { return `<i class="fa-solid fa-floppy-disk"></i>`; }
    function iconPrint() { return `<i class="fa-solid fa-print"></i>`; }
    function iconMoney() { return `<i class="fa-solid fa-money-check-dollar"></i>`; }

    // =============================================================
    // HELPERS
    // =============================================================
    function E(s) {
      if (s === null || s === undefined) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function money(n) { return '₹' + Number(n || 0).toLocaleString('en-IN'); }
    function round2(n) { return Math.round((Number(n) || 0) * 100) / 100; }

    // LocalDate may arrive as "2026-01-25" (default) or [2026,1,25] — handle both.
    function normDate(d) {
      if (Array.isArray(d)) return d[0] + '-' + String(d[1]).padStart(2, '0') + '-' + String(d[2]).padStart(2, '0');
      return d || '';
    }

    // Local (not UTC) today as yyyy-mm-dd — toISOString() would give yesterday early morning in IST.
    function todayStr() {
      var d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function showToast(message, kind) {
      kind = kind || 'success';
      var wrap = document.getElementById('toastWrap');
      var colors = { success: 'bg-green-600', info: 'bg-primary', warning: 'bg-amber-600', error: 'bg-red-600' };
      var el = document.createElement('div');
      el.className = 'toast ' + colors[kind] + ' text-white text-sm font-semibold px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 max-w-xs';
      el.innerHTML = '<span>' + E(message) + '</span>';
      wrap.appendChild(el);
      setTimeout(function () {
        el.style.transition = 'opacity .3s';
        el.style.opacity = '0';
        setTimeout(function () { el.remove(); }, 300);
      }, kind === 'error' ? 4500 : 2600);
    }

    // ---------- Modal ----------
    function openModal(innerHtml, opts) {
      opts = opts || {};
      var root = document.getElementById('modalRoot');
      root.innerHTML = `
        <div class="fixed inset-0 z-[100] flex items-center justify-center p-4" id="modalOverlay">
          <div class="absolute inset-0 bg-black/40 backdrop-blur-[2px]" id="modalBackdrop"></div>
          <div class="relative bg-white rounded-2xl shadow-2xl w-full ${opts.width || 'max-w-3xl'} max-h-[92vh] overflow-hidden animate-modal">
            ${innerHtml}
          </div>
        </div>`;
      document.getElementById('modalBackdrop').addEventListener('click', closeModal);
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      var root = document.getElementById('modalRoot');
      root.innerHTML = '';
      document.body.style.overflow = '';
      formBills = [];
      editingVpId = '';
    }

    function modalHeader(title, subtitle) {
      return `
        <div class="flex items-start justify-between px-6 py-5 border-b border-gray-100 sticky top-0 bg-white z-10">
          <div>
            <h3 class="text-lg font-bold text-gray-900">${E(title)}</h3>
            ${subtitle ? '<p class="text-xs text-gray-500 mt-0.5">' + E(subtitle) + '</p>' : ''}
          </div>
          <button onclick="closeModal()" class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-gray-700 transition">${iconX()}</button>
        </div>`;
    }

    function modalFooter(saveLabel, onSaveAttr, extraBtns, danger) {
      var saveBtnCls = danger ? 'bg-red-600 hover:bg-red-700' : 'bg-primary hover:bg-primary-dark';
      var saveBtnIcon = danger ? iconTrash() : iconSave();
      return `
        <div class="flex items-center justify-between gap-2 px-6 py-2 border-t border-gray-100 bg-gray-50 rounded-b-2xl sticky bottom-0">
          <div>${extraBtns || ''}</div>
          <div class="flex gap-2">
            <button onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm font-semibold text-gray-600 border border-gray-200 hover:bg-white transition">Cancel</button>
            <button ${onSaveAttr} class="px-4 py-2 rounded-lg text-sm font-semibold text-white ${saveBtnCls} transition shadow-sm flex items-center gap-1.5 disabled:opacity-60 disabled:cursor-not-allowed">
              ${saveBtnIcon} ${saveLabel}
            </button>
          </div>
        </div>`;
    }

    function fld(label, inputHtml, hint) {
      return `
        <div class="mb-3">
          <label class="form-label">${label}</label>
          ${inputHtml}
          ${hint ? '<div class="form-hint">' + hint + '</div>' : ''}
        </div>`;
    }

    // ---------- Dropdown ----------
    document.addEventListener('click', function (e) {
      if (!e.target.closest('[data-dd-trigger]')) {
        document.querySelectorAll('[data-dd-menu]').forEach(function (m) { m.classList.add('hidden'); });
      }
    });

    function toggleFilterDD() {
      var menu = document.getElementById('filterDD');
      var isHidden = menu.classList.contains('hidden');
      document.querySelectorAll('[data-dd-menu]').forEach(function (m) { m.classList.add('hidden'); });
      if (isHidden) menu.classList.remove('hidden');
    }

    // ---------- Badges ----------
    function statusBadge(status) {
      var map = { paid: 'badge-green', pending: 'badge-amber', bounced: 'badge-red', cleared: 'badge-blue' };
      var dot = { paid: 'badge-dot-green', pending: 'badge-dot-amber', bounced: 'badge-dot-red', cleared: 'badge-dot-blue' };
      var s = String(status || '').toLowerCase();
      var label = s.charAt(0).toUpperCase() + s.slice(1);
      return '<span class="badge ' + (map[s] || 'badge-gray') + '"><span class="badge-dot ' + (dot[s] || 'badge-dot-gray') + '"></span>' + E(label) + '</span>';
    }

    function modeBadge(mode) {
      var colors = {
        'Bank Transfer': 'badge-blue', 'NEFT': 'badge-blue', 'RTGS': 'badge-blue',
        'UPI': 'badge-purple', 'Cheque': 'badge-amber', 'Cash': 'badge-green'
      };
      return '<span class="badge ' + (colors[mode] || 'badge-gray') + '">' + E(mode) + '</span>';
    }

    function rowActionsHtml(editFn, delFn, viewFn, printFn) {
      var html = '<div class="flex gap-1">';
      if (viewFn) html += '<button onclick="' + viewFn + '" class="btn-icon-action" title="View">' + iconEye() + '</button>';
      if (printFn) html += '<button onclick="' + printFn + '" class="btn-icon-action" title="Print">' + iconPrint() + '</button>';
      html += '<button onclick="' + editFn + '" class="btn-icon-action" title="Edit">' + iconEdit() + '</button>';
      html += '<button onclick="' + delFn + '" class="btn-icon-action danger" title="Delete">' + iconTrash() + '</button>';
      html += '</div>';
      return html;
    }

    function panelWrap(titleHtml, bodyHtml, extraHead) {
      return `
        <div class="bg-white border border-[#6da84c] rounded-xl shadow-sm overflow-hidden">
          <div class="flex items-center justify-between gap-3 flex-wrap px-5 py-4 border-b border-gray-100">
            <div class="font-bold text-[14.5px] text-gray-800 flex items-center gap-2">${titleHtml}</div>
            ${extraHead || ''}
          </div>
          <div>${bodyHtml}</div>
        </div>`;
    }

    function tableHtml(cols, rowsHtml) {
      var colHeaders = cols.map(function (c) {
        return '<th class="text-left text-[11px] font-bold uppercase tracking-wide text-gray-500 px-4 py-3 whitespace-nowrap">' + c + '</th>';
      }).join('');
      return `
        <div class="overflow-auto h-[370px]">
          <table class="w-full text-[13px]">
            <thead class="sticky top-0">
              <tr class="bg-gray-200 border border-[#6da84c]">${colHeaders}</tr>
            </thead>
            <tbody id="tbody-anchor">${rowsHtml}</tbody>
          </table>
        </div>`;
    }

    // =============================================================
    // STATE
    // =============================================================
    var vendors = [];      // [{ id: vendorStrId, name, company }]
    var payments = [];     // from GET /get-all-vendor-payments
    var loadState = 'loading'; // loading | ready | error
    var loadError = '';
    var formBills = [];    // open bills of the vendor selected in the modal
    var editingVpId = '';  // vpStrId of the payment being edited ('' when recording a new one)

    var BANK_ACCOUNTS = ['HDFC Bank — Current', 'ICICI Bank — Current', 'Petty Cash'];
    var PAY_MODES = ['Bank Transfer', 'NEFT', 'RTGS', 'UPI', 'Cheque', 'Cash'];

    // =============================================================
    // LOADING DATA
    // =============================================================
    async function loadVendors() {
      var list = await apiRequest('GET', VENDOR_API + '/vendor-list');
      if (!Array.isArray(list)) list = [];
      vendors = list.map(function (v) {
        return { id: v.vendorStrId, name: v.vendorName, company: v.companyName };
      });
      populateVendorFilter();
    }

    function populateVendorFilter() {
      var sel = document.getElementById('filterVendor');
      var cur = sel.value || 'all';
      sel.innerHTML = '<option value="all">All Vendors</option>' + vendors.map(function (v) {
        return '<option value="' + E(v.id) + '">' + E(v.name) + '</option>';
      }).join('');
      sel.value = cur;
      if (sel.value !== cur) sel.value = 'all';
    }

    var loadSeq = 0; // ignore stale responses when the user types / filters quickly
    async function loadPayments() {
      var seq = ++loadSeq;
      var q = [];
      var mode = document.getElementById('filterMode').value;
      var vendor = document.getElementById('filterVendor').value;
      var searchEl = document.getElementById('searchInput');
      var search = searchEl ? searchEl.value.trim() : '';
      if (mode && mode !== 'all') q.push('mode=' + encodeURIComponent(mode));
      if (vendor && vendor !== 'all') q.push('vendorId=' + encodeURIComponent(vendor));
      if (search) q.push('search=' + encodeURIComponent(search));

      try {
        var data = await apiRequest('GET', VP_API + '/get-all-vendor-payments' + (q.length ? '?' + q.join('&') : ''));
        if (seq !== loadSeq) return;
        payments = (Array.isArray(data) ? data : []).map(normalizePayment);
        loadState = 'ready';
      } catch (err) {
        if (seq !== loadSeq) return;
        payments = [];
        loadState = 'error';
        loadError = err.message;
      }
      renderPayments();
    }

    function normalizePayment(p) {
      p.date = normDate(p.date);
      p.allocations = p.allocations || [];
      return p;
    }

    async function loadStats() {
      try {
        var s = await apiRequest('GET', VP_API + '/stats');
        document.getElementById('totalPayments').textContent = s.totalPayments;
        document.getElementById('totalPaid').textContent = money(s.totalPaid);
        document.getElementById('thisMonth').textContent = money(s.thisMonth);
        document.getElementById('pendingAmount').textContent = money(s.pendingAmount);
      } catch (err) {
        console.error('Stats failed', err);
      }
    }

    async function refreshAll() {
      await Promise.all([loadPayments(), loadStats()]);
    }

    // =============================================================
    // TABLE + PAGINATION
    // =============================================================
    var currentPayPage = 1;
    var currentPayPageSize = 25;

    function setPayPageSize(value) {
      var size = parseInt(value, 10);
      currentPayPageSize = [10, 25, 50, 100].indexOf(size) !== -1 ? size : 25;
      currentPayPage = 1;
      renderPayments();
    }

    function changePayPage(page) {
      var totalPages = Math.max(1, Math.ceil(payments.length / currentPayPageSize));
      currentPayPage = Math.min(Math.max(1, page), totalPages);
      renderPayments();
    }

    function payPaginationHtml(totalItems) {
      var totalPages = Math.max(1, Math.ceil(totalItems / currentPayPageSize));
      if (currentPayPage > totalPages) currentPayPage = totalPages;

      var start = totalItems === 0 ? 0 : ((currentPayPage - 1) * currentPayPageSize) + 1;
      var end = Math.min(currentPayPage * currentPayPageSize, totalItems);

      var html = '<div class="flex items-center justify-between gap-3 flex-wrap px-5 py-3 border-t border-gray-200">';
      html += '<div class="text-[11px] text-gray-500">Showing ' + start + '–' + end + ' of ' + totalItems + '</div>';
      html += '<div class="flex items-center gap-1">';
      html += '<button type="button" onclick="changePayPage(' + (currentPayPage - 1) + ')" ' + (currentPayPage === 1 ? 'disabled' : '') + ' class="px-2.5 py-1 text-[11px] border rounded-lg ' + (currentPayPage === 1 ? 'text-gray-300 cursor-not-allowed' : 'text-gray-600 hover:bg-gray-50') + '">Previous</button>';

      var from = Math.max(1, currentPayPage - 2);
      var to = Math.min(totalPages, from + 4);
      from = Math.max(1, to - 4);
      for (var i = from; i <= to; i++) {
        html += '<button type="button" onclick="changePayPage(' + i + ')" class="px-2.5 py-1 text-[11px] border rounded-lg ' + (i === currentPayPage ? 'bg-primary text-white border-primary' : 'text-gray-600 hover:bg-gray-50') + '">' + i + '</button>';
      }

      html += '<button type="button" onclick="changePayPage(' + (currentPayPage + 1) + ')" ' + (currentPayPage === totalPages ? 'disabled' : '') + ' class="px-2.5 py-1 text-[11px] border rounded-lg ' + (currentPayPage === totalPages ? 'text-gray-300 cursor-not-allowed' : 'text-gray-600 hover:bg-gray-50') + '">Next</button>';
      html += '</div></div>';
      return html;
    }

    function renderPayments() {
      var totalPages = Math.max(1, Math.ceil(payments.length / currentPayPageSize));
      if (currentPayPage > totalPages) currentPayPage = totalPages;
      var pageStart = (currentPayPage - 1) * currentPayPageSize;
      var paged = payments.slice(pageStart, pageStart + currentPayPageSize);

      var rowsHtml = '';
      if (loadState === 'loading') {
        rowsHtml = '<tr><td colspan="8" class="text-center py-10 text-gray-400 text-sm">Loading vendor payments…</td></tr>';
      } else if (loadState === 'error') {
        rowsHtml = `
          <tr>
            <td colspan="8" class="text-center py-10 text-red-500 text-sm">
              ${E(loadError)}<br>
              <button onclick="refreshAll()" class="mt-2 text-primary font-semibold hover:underline">Retry</button>
            </td>
          </tr>`;
      } else if (payments.length === 0) {
        rowsHtml = `
          <tr>
            <td colspan="8" class="text-center py-10 text-gray-400 text-sm">
              <div class="flex justify-center mb-2 empty-icon-svg">${iconMoney()}</div>
              No vendor payments found. Click "Record Payment" to add one.
            </td>
          </tr>`;
      } else {
        rowsHtml = paged.map(function (p) {
          var id = E(p.vpStrId);
          var bills = p.allocations.map(function (a) { return E(a.billNumber || a.billStrId); }).join(', ') || '—';
          return `
            <tr class="border-b border-gray-400 table-row-hover">
              <td class="px-4 py-3">
                <div class="font-semibold text-gray-800">${E(p.vpNumber)}</div>
                <div class="text-[11.5px] text-gray-400 font-mono">${E(p.date)}</div>
              </td>
              <td class="px-4 py-3 text-gray-600">${E(p.vendorName)}</td>
              <td class="px-4 py-3 font-mono font-semibold text-primary">${money(p.amount)}</td>
              <td class="px-4 py-3">${modeBadge(p.mode)}</td>
              <td class="px-4 py-3 font-mono text-[12px] text-gray-500">${E(p.reference) || '—'}</td>
              <td class="px-4 py-3 text-[12px] text-gray-500">${bills}</td>
              <td class="px-4 py-3">${statusBadge(p.status)}</td>
              <td class="px-4 py-3">${rowActionsHtml(
            "editPayment('" + id + "')",
            "delPayment('" + id + "')",
            "viewReceipt('" + id + "')",
            "printReceipt('" + id + "')"
          )}</td>
            </tr>`;
        }).join('');
      }

      var panelHtml = panelWrap(
        'All Vendor Payments <span class="text-[11px] font-bold bg-primary-soft text-primary-dark px-2 py-0.5 rounded-full ml-1">' + payments.length + '</span>',
        tableHtml(['Payment #', 'Vendor', 'Amount', 'Mode', 'Reference', 'Bills', 'Status', 'Actions'], rowsHtml) + payPaginationHtml(payments.length),
        '<div class="flex items-center gap-2"><span class="text-[11px] text-gray-400">Show:</span><select id="pageSizeSelect" onchange="setPayPageSize(this.value)" class="text-[12px] border border-[#6da84c] rounded-lg px-2 py-1 bg-white outline-none"><option value="10" ' + (currentPayPageSize === 10 ? 'selected' : '') + '>10</option><option value="25" ' + (currentPayPageSize === 25 ? 'selected' : '') + '>25</option><option value="50" ' + (currentPayPageSize === 50 ? 'selected' : '') + '>50</option><option value="100" ' + (currentPayPageSize === 100 ? 'selected' : '') + '>100</option></select></div>'
      );

      document.getElementById('paymentsPanel').innerHTML = panelHtml;
    }

    // =============================================================
    // FILTERS (server-side: mode, vendorId, search)
    // =============================================================
    var filterTimer = null;
    function filterPayments() {
      currentPayPage = 1;
      updateFilterBadge();
      clearTimeout(filterTimer);
      filterTimer = setTimeout(loadPayments, 300);
    }

    function updateFilterBadge() {
      var n = 0;
      if (document.getElementById('filterMode').value !== 'all') n++;
      if (document.getElementById('filterVendor').value !== 'all') n++;
      var b = document.getElementById('filterBadge');
      b.textContent = n;
      b.classList.toggle('hidden', n === 0);
    }

    function clearFilters() {
      document.getElementById('filterMode').value = 'all';
      document.getElementById('filterVendor').value = 'all';
      var searchInput = document.getElementById('searchInput');
      if (searchInput) searchInput.value = '';
      currentPayPage = 1;
      updateFilterBadge();
      loadPayments();
      toggleFilterDD();
    }

    function findPayment(id) {
      return payments.find(function (x) { return x.vpStrId === id; });
    }

    // =============================================================
    // VIEW RECEIPT
    // =============================================================
    function viewReceipt(id) {
      var p = findPayment(id);
      if (!p) return;

      var allocHtml = p.allocations.map(function (a) {
        return `
          <tr>
            <td class="px-2 py-1.5 text-[13px]">${E(a.billNumber || a.billStrId)}</td>
            <td class="px-2 py-1.5 text-[13px] font-mono text-right">${money(a.amount)}</td>
          </tr>`;
      }).join('') || '<tr><td colspan="2" class="text-center py-3 text-gray-400 text-[12px]">No bill allocation.</td></tr>';

      var modalContent = `
        ${modalHeader('Vendor Payment Receipt — ' + p.vpNumber, p.vendorName)}
        <div class="px-6 py-4 modal-scroll">

          <div class="receipt-preview">
            <div class="receipt-header">
              <div>
                <div class="receipt-company-name">Kunash Media Pvt. Ltd.</div>
                <div class="receipt-company-details">
                  401, Creative Hub, BKC, Mumbai - 400051<br>
                  GSTIN: 27AABCU1234D1ZP | Phone: +91-9876543210
                </div>
              </div>
              <div style="text-align:right;">
                <div class="receipt-title">PAYMENT RECEIPT</div>
              </div>
            </div>

            <div class="receipt-meta">
              <div>
                <div class="meta-label">Paid To</div>
                <div class="meta-value">${E(p.vendorName)}</div>
              </div>
              <div style="text-align:right;">
                <div><span class="meta-label">Payment #</span> <span class="meta-value">${E(p.vpNumber)}</span></div>
                <div><span class="meta-label">Date</span> <span class="meta-value">${E(p.date)}</span></div>
                <div><span class="meta-label">Mode</span> <span class="meta-value">${E(p.mode)}</span></div>
              </div>
            </div>

            <table class="receipt-table">
              <thead>
                <tr>
                  <th>Bill #</th>
                  <th style="text-align:right;">Amount Paid</th>
                </tr>
              </thead>
              <tbody>${allocHtml}</tbody>
            </table>

            <div class="receipt-total">
              Total Paid: ${money(p.amount)}
            </div>

            <div class="mt-3 grid grid-cols-2 gap-3 text-[13px]">
              <div><span class="text-gray-500">Reference:</span> <b>${E(p.reference) || '—'}</b></div>
              <div><span class="text-gray-500">Paid From:</span> <b>${E(p.bankAccountName) || '—'}</b></div>
            </div>

            ${p.notes ? '<div class="mt-2 p-2 bg-gray-50 rounded text-[12px] text-gray-600"><b>Notes:</b> ' + E(p.notes) + '</div>' : ''}

            <div class="receipt-footer">
              <p>This is a system generated payment receipt. | ${p.status === 'paid' ? 'Payment processed successfully.' : (p.status === 'bounced' ? 'Payment bounced.' : 'Payment pending clearance.')}</p>
            </div>
          </div>

        </div>
        ${modalFooter('Close', 'onclick="closeModal()"', `
          <button onclick="window.print()" class="text-[12px] font-semibold text-gray-600 flex items-center gap-1.5 px-3 py-2 rounded-lg border border-gray-200 hover:bg-white transition">
            ${iconPrint()} Print
          </button>
        `)}
      `;

      openModal(modalContent, { width: 'max-w-2xl' });
    }

    // Print opens the receipt first so only the receipt is printed (see @media print).
    function printReceipt(id) {
      if (!document.querySelector('.receipt-preview')) viewReceipt(id);
      setTimeout(function () { window.print(); }, 300);
    }

    // =============================================================
    // ADD / EDIT PAYMENT
    // =============================================================

    function openAddPayment() { openPaymentModal(null); }

    function editPayment(id) {
      var p = findPayment(id);
      if (p) openPaymentModal(p);
    }

    function billLabel(b) {
      return (b.pbNumber || b.pbStrId) + ' (Bal: ' + money(b.balance) + ')';
    }

    // Options of the open bills of the selected vendor. If an existing allocation points to a bill that is not in the
    // list any more, it is kept as an extra option so editing never silently drops it.
    function billOptionsHtml(selectedId, fallbackNumber) {
      var html = formBills.map(function (b) {
        return '<option value="' + E(b.pbStrId) + '" ' + (b.pbStrId === selectedId ? 'selected' : '') + '>' + E(billLabel(b)) + '</option>';
      }).join('');
      if (selectedId && !formBills.some(function (b) { return b.pbStrId === selectedId; })) {
        html = '<option value="' + E(selectedId) + '" selected>' + E(fallbackNumber || selectedId) + '</option>' + html;
      }
      return html;
    }

    function allocRowHtml(billId, amount, fallbackNumber) {
      return `
        <tr class="border-b border-gray-100 line-item-row">
          <td class="px-3 py-2">
            <select class="form-input bill-select" onchange="onBillChange(this)">${billOptionsHtml(billId, fallbackNumber)}</select>
          </td>
          <td class="px-3 py-2">
            <input type="number" class="form-input bill-amount" value="${amount}" step="0.01" min="0" oninput="calcAllocTotal()">
          </td>
          <td class="px-3 py-2 text-center">
            <button type="button" onclick="removeAllocation(this)" class="btn-icon-action danger" title="Remove">${iconX()}</button>
          </td>
        </tr>`;
    }

    var EMPTY_ALLOC_ROW = '<tr><td colspan="3" class="text-center py-4 text-gray-400 text-[12px]">No allocation. Click "Add Bill" to allocate this payment.</td></tr>';

    function openPaymentModal(existing) {
      if (!vendors.length) {
        showToast('No vendors found. Add a vendor first.', 'warning');
        return;
      }
      var e = existing || {
        vpStrId: '',
        vpNumber: '',
        date: todayStr(),
        vendorId: '',
        amount: '',
        mode: 'Bank Transfer',
        reference: '',
        bankAccountName: BANK_ACCOUNTS[0],
        allocations: [],
        notes: '',
        status: 'paid'
      };
      var isEdit = !!existing;
      formBills = [];
      editingVpId = isEdit ? e.vpStrId : '';

      var vendorOptions = '<option value="">— Select vendor —</option>' + vendors.map(function (v) {
        return '<option ' + (v.id === e.vendorId ? 'selected' : '') + ' value="' + E(v.id) + '">' + E(v.name) + '</option>';
      }).join('');

      var modeOptions = PAY_MODES.map(function (m) {
        return '<option ' + (e.mode === m ? 'selected' : '') + '>' + E(m) + '</option>';
      }).join('');

      var banks = BANK_ACCOUNTS.slice();
      if (e.bankAccountName && banks.indexOf(e.bankAccountName) === -1) banks.unshift(e.bankAccountName);
      var bankOptions = banks.map(function (b) {
        return '<option ' + (e.bankAccountName === b ? 'selected' : '') + '>' + E(b) + '</option>';
      }).join('');

      var modalContent = `
        ${modalHeader(isEdit ? 'Edit Vendor Payment' : 'Record Vendor Payment', isEdit ? e.vpNumber : 'Record a new payment to vendor')}
        <div class="px-6 py-4 modal-scroll">

          <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            ${fld('Payment #', '<input type="text" class="form-input" value="' + E(isEdit ? e.vpNumber : 'Auto-generated') + '" disabled>')}
            ${fld('Date *', '<input type="date" class="form-input" id="p_date" value="' + E(e.date) + '">')}
            ${fld('Vendor *', '<select class="form-input" id="p_vendor" onchange="onVendorChange()">' + vendorOptions + '</select>')}
            ${fld('Amount (₹) *', '<input type="number" class="form-input" id="p_amount" value="' + E(e.amount) + '" step="0.01" min="0" placeholder="0.00">')}
          </div>

          <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            ${fld('Mode *', '<select class="form-input" id="p_mode">' + modeOptions + '</select>')}
            ${fld('Reference', '<input type="text" class="form-input" id="p_reference" maxlength="100" value="' + E(e.reference) + '" placeholder="Txn/Cheque number">')}
            ${fld('Paid From', '<select class="form-input" id="p_bankAccount">' + bankOptions + '</select>')}
            ${fld('Status', '<select class="form-input" id="p_status"><option ' + (e.status === 'paid' ? 'selected' : '') + ' value="paid">Paid</option><option ' + (e.status === 'pending' ? 'selected' : '') + ' value="pending">Pending</option><option ' + (e.status === 'bounced' ? 'selected' : '') + ' value="bounced">Bounced</option></select>')}
          </div>

          <!-- Bill Allocations -->
          <div class="mt-2 pt-3 border-t border-gray-100">
            <div class="flex items-center justify-between mb-2">
              <h4 class="text-[12.5px] font-semibold text-gray-800">Allocate to Bills</h4>
              <button type="button" onclick="addAllocation()" class="text-[12px] font-semibold text-primary hover:underline flex items-center gap-1">
                ${iconPlus()} Add Bill
              </button>
            </div>
            <div class="border border-gray-200 rounded-xl overflow-hidden">
              <table class="w-full text-[13px]" id="allocTable">
                <thead class="bg-gray-200">
                  <tr>
                    <th class="px-3 py-2 text-left text-[11px] font-bold uppercase tracking-wide text-gray-500">Bill</th>
                    <th class="px-3 py-2 text-left text-[11px] font-bold uppercase tracking-wide text-gray-500">Amount Paid</th>
                    <th class="px-3 py-2 text-center text-[11px] font-bold uppercase tracking-wide text-gray-500" style="width:60px;">Action</th>
                  </tr>
                </thead>
                <tbody id="allocBody">${EMPTY_ALLOC_ROW}</tbody>
              </table>
            </div>
            <div class="mt-2 flex justify-between items-center text-[12px]">
              <span class="text-gray-500">Total Allocated: <b id="allocTotal" class="text-primary">₹0</b></span>
              <span class="text-gray-500">Unallocated: <b id="unallocTotal" class="text-amber-600">₹0</b></span>
            </div>
            <div class="form-hint">Bill balances are reduced only when the status is Paid. Pending / Bounced payments do not change any bill.</div>
          </div>

          <div class="mt-3">
            ${fld('Notes', '<textarea rows="2" maxlength="1000" class="form-input" id="p_notes" placeholder="Additional notes">' + E(e.notes) + '</textarea>')}
          </div>
        </div>
        ${modalFooter(isEdit ? 'Update Payment' : 'Record Payment', 'onclick="savePayment(\'' + E(isEdit ? e.vpStrId : '') + '\', this)"')}
      `;

      openModal(modalContent, { width: 'max-w-3xl' });
      document.getElementById('p_amount').addEventListener('input', calcAllocTotal);

      if (isEdit) {
        // load this vendor's open bills (excluding what THIS payment already applied), then draw saved allocations
        loadFormBills(e.vendorId, e.vpStrId).then(function () {
          var body = document.getElementById('allocBody');
          if (!body) return;
          if (e.allocations.length) {
            body.innerHTML = e.allocations.map(function (a) { return allocRowHtml(a.billStrId, a.amount, a.billNumber); }).join('');
          }
          calcAllocTotal();
        });
      }
    }

    async function loadFormBills(vendorId, excludeVpStrId) {
      formBills = [];
      if (!vendorId) return;
      try {
        var url = VP_API + '/vendor-bills/' + encodeURIComponent(vendorId) + (excludeVpStrId ? '?excludeVpStrId=' + encodeURIComponent(excludeVpStrId) : '');
        var data = await apiRequest('GET', url);
        // ignore the response if the user already switched to another vendor
        var cur = document.getElementById('p_vendor');
        if (cur && cur.value !== vendorId) return;
        formBills = Array.isArray(data) ? data : [];
      } catch (err) {
        formBills = [];
        showToast(err.message, 'error');
      }
    }

    // Vendor changed: allocations of the previous vendor are invalid, so the list is reset.
    async function onVendorChange() {
      var vendorId = document.getElementById('p_vendor').value;
      document.getElementById('allocBody').innerHTML = EMPTY_ALLOC_ROW;
      calcAllocTotal();
      await loadFormBills(vendorId, editingVpId);
      if (vendorId && !formBills.length) showToast('This vendor has no bills with a pending balance.', 'info');
    }

    function allocatedExcept(row) {
      var total = 0;
      document.querySelectorAll('#allocBody .line-item-row').forEach(function (r) {
        if (r === row) return;
        total += parseFloat(r.querySelector('.bill-amount').value) || 0;
      });
      return total;
    }

    function suggestAmount(billId, row) {
      var bill = formBills.find(function (b) { return b.pbStrId === billId; });
      if (!bill) return 0;
      var payAmt = parseFloat(document.getElementById('p_amount').value) || 0;
      var remaining = payAmt > 0 ? Math.max(payAmt - allocatedExcept(row), 0) : bill.balance;
      return round2(Math.min(bill.balance, remaining));
    }

    function addAllocation() {
      var vendorId = document.getElementById('p_vendor').value;
      if (!vendorId) { showToast('Select a vendor first', 'warning'); return; }
      if (!formBills.length) { showToast('This vendor has no bills with a pending balance.', 'info'); return; }

      var used = [];
      document.querySelectorAll('#allocBody .bill-select').forEach(function (s) { used.push(s.value); });
      var next = formBills.find(function (b) { return used.indexOf(b.pbStrId) === -1; });
      if (!next) { showToast('All open bills are already added.', 'info'); return; }

      var tbody = document.getElementById('allocBody');
      if (tbody.querySelector('tr td[colspan]')) tbody.innerHTML = '';
      tbody.insertAdjacentHTML('beforeend', allocRowHtml(next.pbStrId, suggestAmount(next.pbStrId, null)));
      calcAllocTotal();
    }

    function onBillChange(sel) {
      var row = sel.closest('tr');
      row.querySelector('.bill-amount').value = suggestAmount(sel.value, row);
      calcAllocTotal();
    }

    function removeAllocation(btn) {
      var row = btn.closest('tr');
      if (row) row.remove();
      var tbody = document.getElementById('allocBody');
      if (tbody && !tbody.querySelector('.line-item-row')) tbody.innerHTML = EMPTY_ALLOC_ROW;
      calcAllocTotal();
    }

    function calcAllocTotal() {
      var total = 0;
      document.querySelectorAll('#allocBody .bill-amount').forEach(function (inp) {
        total += parseFloat(inp.value) || 0;
      });
      var allocEl = document.getElementById('allocTotal');
      var unallocEl = document.getElementById('unallocTotal');
      if (allocEl) allocEl.textContent = money(round2(total));

      var amtEl = document.getElementById('p_amount');
      var payAmt = amtEl ? (parseFloat(amtEl.value) || 0) : 0;
      if (unallocEl) unallocEl.textContent = money(round2(Math.max(payAmt - total, 0)));
    }

    // =============================================================
    // SAVE (POST create / PUT update)
    // =============================================================
    async function savePayment(existingId, btn) {
      var date = document.getElementById('p_date').value;
      var vendorId = document.getElementById('p_vendor').value;
      var amount = parseFloat(document.getElementById('p_amount').value) || 0;
      var mode = document.getElementById('p_mode').value;
      var reference = document.getElementById('p_reference').value.trim();
      var bankAccount = document.getElementById('p_bankAccount').value;
      var status = document.getElementById('p_status').value;
      var notes = document.getElementById('p_notes').value.trim();

      if (!date || !vendorId || amount <= 0) {
        showToast('Please fill required fields (Date, Vendor, Amount)', 'error');
        return;
      }

      var allocations = [];
      var seen = {};
      var allocTotal = 0;
      var problem = '';
      document.querySelectorAll('#allocBody .line-item-row').forEach(function (row) {
        var billId = row.querySelector('.bill-select').value;
        var amt = round2(parseFloat(row.querySelector('.bill-amount').value) || 0);
        if (!billId) return;
        if (amt <= 0) { problem = 'Every allocated bill needs an amount greater than 0.'; return; }
        if (seen[billId]) { problem = 'The same bill is allocated more than once.'; return; }
        seen[billId] = true;
        var bill = formBills.find(function (b) { return b.pbStrId === billId; });
        if (status === 'paid' && bill && amt > bill.balance + 0.005) {
          problem = 'Allocation for ' + (bill.pbNumber || billId) + ' exceeds its balance of ' + money(bill.balance) + '.';
          return;
        }
        allocTotal += amt;
        allocations.push({ billStrId: billId, amount: amt });
      });
      if (!problem && round2(allocTotal) > round2(amount) + 0.005) {
        problem = 'Total allocated (' + money(round2(allocTotal)) + ') exceeds the payment amount (' + money(amount) + ').';
      }
      if (problem) { showToast(problem, 'error'); return; }

      var payload = {
        vendorId: vendorId,
        date: date,
        amount: round2(amount),
        mode: mode,
        reference: reference,
        bankAccountName: bankAccount,
        status: status,
        notes: notes,
        allocations: allocations
      };

      if (btn) btn.disabled = true;
      try {
        if (existingId) {
          await apiRequest('PUT', VP_API + '/update-vendor-payment/' + encodeURIComponent(existingId), payload);
          showToast('Payment updated successfully', 'success');
        } else {
          await apiRequest('POST', VP_API + '/create-vendor-payment', payload);
          showToast('Payment recorded successfully', 'success');
        }
        closeModal();
        await refreshAll();
      } catch (err) {
        showToast(err.message, 'error');
        if (btn) btn.disabled = false;
      }
    }

    // =============================================================
    // DELETE PAYMENT
    // =============================================================
    function delPayment(id) {
      var p = findPayment(id);
      if (!p) return;

      var modalContent = `
        ${modalHeader('Delete Vendor Payment', p.vpNumber)}
        <div class="px-6 py-4 text-sm text-gray-600">
          <p>Are you sure you want to permanently delete <b class="text-gray-800">${E(p.vpNumber)}</b>?</p>
          <p class="text-gray-400 text-[12px] mt-1">This action cannot be undone. Bill balances will be restored.</p>
          <p class="text-amber-600 text-[12px] mt-2">Amount: ${money(p.amount)}</p>
        </div>
        ${modalFooter('Delete', 'onclick="confirmDeletePayment(\'' + E(id) + '\', this)"', '', true)}
      `;
      openModal(modalContent, { width: 'max-w-md' });
    }

    async function confirmDeletePayment(id, btn) {
      if (btn) btn.disabled = true;
      try {
        await apiRequest('DELETE', VP_API + '/delete-vendor-payment/' + encodeURIComponent(id));
        closeModal();
        showToast('Vendor payment deleted successfully', 'warning');
        await refreshAll();
      } catch (err) {
        showToast(err.message, 'error');
        if (btn) btn.disabled = false;
      }
    }

    // =============================================================
    // SEARCH (injected in the top bar)
    // =============================================================
    (function addSearchToTopbar() {
      var searchContainer = document.querySelector('.app-main header');
      if (searchContainer) {
        var searchHtml = `
          <div class="hidden sm:flex flex-1 max-w-[420px] relative ml-4">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">${iconSearch()}</span>
            <input type="text" id="searchInput" placeholder="Search payments by number, vendor, reference…"
              onkeyup="filterPayments()"
              class="w-full border border-gray-200 bg-gray-50 focus:bg-white rounded-lg pl-9 pr-3 py-2 text-[13px] outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition placeholder:text-gray-400">
          </div>
        `;
        var headerContent = searchContainer.innerHTML;
        var hamburgerIndex = headerContent.indexOf('lg:hidden');
        if (hamburgerIndex !== -1) {
          var firstDivEnd = headerContent.indexOf('</div>', hamburgerIndex) + 6;
          var before = headerContent.substring(0, firstDivEnd);
          var after = headerContent.substring(firstDivEnd);
          searchContainer.innerHTML = before + searchHtml + after;
        }
      }
    })();

    // =============================================================
    // INIT
    // =============================================================
    (async function init() {
      renderPayments(); // shows "Loading…"
      try { await loadVendors(); }
      catch (err) { showToast('Could not load vendors: ' + err.message, 'error'); }
      await refreshAll();
    })();

  </script>

</body>
