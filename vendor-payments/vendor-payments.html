<style>
  body { font-size: 12px; background: #f3f4f6; }

  .form-input {
    width: 100%; border: 1px solid #e5e7eb; border-radius: 6px;
    padding: 5px 10px; font-size: 11px; outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    background: #fafafa; color: #1a1a2e;
  }
  .form-input:focus {
    border-color: #6da84c;
    box-shadow: 0 0 0 3px rgba(109, 168, 76, 0.12);
    background: #ffffff;
  }
  .form-input:disabled { background: #f3f4f6; cursor: not-allowed; }

  .form-label {
    font-size: 10px; font-weight: 600; color: #374151;
    display: block; margin-bottom: 3px;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .form-label .required { color: #ef4444; margin-left: 2px; }
  .form-hint { font-size: 9.5px; color: #9ca3af; margin-top: 2px; }

  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; font-weight: 600;
    padding: 2px 8px; border-radius: 12px;
  }
  .badge-green { background: #dcfce7; color: #166534; }
  .badge-amber { background: #fef3c7; color: #92400e; }
  .badge-red { background: #fee2e2; color: #991b1b; }
  .badge-gray { background: #f1f5f9; color: #475569; }
  .badge-blue { background: #dbeafe; color: #1e40af; }
  .badge-purple { background: #ede9fe; color: #5b21b6; }
  .badge-dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }
  .badge-dot-green { background: #22c55e; }
  .badge-dot-amber { background: #f59e0b; }
  .badge-dot-red { background: #ef4444; }
  .badge-dot-gray { background: #94a3b8; }
  .badge-dot-blue { background: #3b82f6; }
  .badge-dot-purple { background: #8b5cf6; }

  .stat-card {
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    padding: 10px 14px !important;
  }
  .stat-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
  }
  .stat-card .stat-label {
    font-size: 9px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; color: #6b7280;
  }
  .stat-card .stat-value {
    font-size: 17px; font-weight: 700;
    color: #1a1a2e; margin-top: 2px;
  }

  .table-row-hover:hover { background: #f8fafc; }

  .btn-icon-action {
    transition: all 0.15s ease; width: 28px; height: 28px;
    border-radius: 6px; display: inline-flex; align-items: center;
    justify-content: center; color: #94a3b8;
    background: transparent; border: none; cursor: pointer;
  }
  .btn-icon-action:hover { background: #f1f5f9; color: #6da84c; }
  .btn-icon-action.danger:hover { background: #fee2e2; color: #ef4444; }
  .btn-icon-action.primary:hover { background: #eef5e8; color: #6da84c; }

  .toast { animation: fadeIn 0.2s ease; font-size: 12px; }
  .toast-success { background: #16a34a; }
  .toast-error { background: #dc2626; }
  .toast-warning { background: #f59e0b; }
  .toast-info { background: #6da84c; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.96) translateY(6px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .animate-modal { animation: modalIn 0.18s ease; }

  .modal-scroll { max-height: 55vh; overflow-y: auto; }
  .modal-scroll::-webkit-scrollbar { width: 4px; }
  .modal-scroll::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

  .empty-icon-svg { opacity: 0.2; width: 40px; height: 40px; color: #94a3b8; }

  .page-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .page-subtitle { font-size: 12px; color: #6b7280; }
  .page-breadcrumb {
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: #6da84c;
  }

  table th {
    font-size: 9.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; color: #6b7280; padding: 8px 12px;
  }
  table td { font-size: 12px; padding: 8px 12px; }
  table td .font-mono { font-size: 11px; }

  .modal-title { font-size: 16px; font-weight: 700; }
  .modal-subtitle { font-size: 11px; color: #6b7280; }

  .filter-btn { font-size: 11px; padding: 5px 12px; }
  .filter-btn svg { width: 14px; height: 14px; }

  /* Receipt preview */
  .receipt-preview {
    background: #ffffff; border: 1px solid #e5e7eb;
    border-radius: 12px; padding: 24px 28px;
    max-width: 720px; margin: 0 auto;
  }
  .receipt-preview .receipt-header {
    display: flex; justify-content: space-between;
    align-items: flex-start; border-bottom: 2px solid #6da84c;
    padding-bottom: 12px; margin-bottom: 14px;
  }
  .receipt-preview .receipt-title {
    font-size: 20px; font-weight: 700; color: #6da84c;
    letter-spacing: 0.04em;
  }
  .receipt-preview .receipt-company-name {
    font-size: 16px; font-weight: 700; color: #1a1a2e;
  }
  .receipt-preview .receipt-company-details {
    font-size: 10.5px; color: #6b7280;
    line-height: 1.5; margin-top: 2px;
  }
  .receipt-preview .receipt-meta {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; margin-bottom: 14px; font-size: 12px;
  }
  .receipt-preview .meta-label {
    font-weight: 600; color: #6b7280; font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .receipt-preview .meta-value { font-weight: 600; color: #1a1a2e; }
  .receipt-preview .receipt-table {
    width: 100%; border-collapse: collapse;
    margin: 10px 0; font-size: 12px;
  }
  .receipt-preview .receipt-table th {
    background: #f8fafc; text-align: left;
    padding: 8px 10px; font-size: 10px; font-weight: 600;
    text-transform: uppercase; color: #6b7280;
    border-bottom: 2px solid #e5e7eb;
  }
  .receipt-preview .receipt-table td {
    padding: 8px 10px; border-bottom: 1px solid #f1f5f9;
  }
  .receipt-preview .receipt-total {
    margin-top: 10px; border-top: 2px solid #6da84c;
    padding-top: 10px; text-align: right;
    font-size: 14px; font-weight: 700; color: #6da84c;
  }
  .receipt-preview .receipt-footer {
    margin-top: 16px; font-size: 10.5px; color: #6b7280;
    border-top: 1px solid #e5e7eb; padding-top: 10px;
    text-align: center;
  }

  /* Email Automation card */
  .email-auto-card {
    background: linear-gradient(135deg, #eef5e8, #dcfce7);
    border: 1px solid #6da84c;
    border-radius: 8px; padding: 10px 14px;
    display: flex; align-items: flex-start; gap: 10px;
    margin-top: 12px;
  }
  .email-auto-card .icon-wrap {
    width: 32px; height: 32px; border-radius: 8px;
    background: #6da84c; color: #fff;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .email-auto-card .title {
    font-size: 11.5px; font-weight: 700; color: #166534;
  }
  .email-auto-card .desc {
    font-size: 10.5px; color: #374151; margin-top: 2px;
  }
</style>
</head>

<body class="bg-gray-50 text-gray-800 antialiased text-sm">

  <div class="flex min-h-screen">
    <div id="sidebar-root"></div>

    <div class="app-main flex-1 flex flex-col min-w-0">
      <div id="topbar-root"></div>

      <main class="p-3 sm:p-4 lg:p-5">

        <div id="toastWrap" class="fixed bottom-5 right-5 z-[200] flex flex-col gap-2 items-end"></div>
        <div id="modalRoot"></div>

        <div class="max-w-7xl mx-auto">

          <!-- ===== PAGE HEADER ===== -->
          <div class="flex flex-wrap items-start justify-between gap-3 mb-4">
            <div>
              <div class="page-breadcrumb">Purchase</div>
              <h1 class="page-title text-gray-900">Vendor Payments</h1>
              <p class="page-subtitle mt-0.5">Record vendor payments, allocate against bills, and send automatic payment confirmations.</p>
            </div>
            <div class="flex gap-2 flex-wrap">
              <div class="relative inline-block" data-dd-trigger>
                <button onclick="toggleFilterDD()" class="filter-btn inline-flex items-center gap-1.5 bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 font-semibold rounded-lg transition">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 6h18M7 12h10M11 18h2"/>
                  </svg>
                  Filter
                  <span id="filterBadge" class="hidden text-[9px] bg-primary text-white px-1.5 py-0.5 rounded-full">0</span>
                </button>
                <div id="filterDD" data-dd-menu class="hidden absolute top-full left-0 mt-2 w-56 bg-white border border-gray-200 rounded-xl shadow-lg p-3 z-50">
                  <div class="mb-2">
                    <label class="text-[9px] font-semibold text-gray-500 uppercase tracking-wide">Payment Mode</label>
                    <select id="filterMode" onchange="filterPayments()" class="form-input text-[10px]">
                      <option value="all">All Modes</option>
                      <option value="Bank Transfer">Bank Transfer</option>
                      <option value="NEFT">NEFT</option>
                      <option value="RTGS">RTGS</option>
                      <option value="UPI">UPI</option>
                      <option value="Cheque">Cheque</option>

                  <div class="mb-2">
                    <label class="text-[9px] font-semibold text-gray-500 uppercase tracking-wide">Vendor</label>

                      <option value="all">All Vendors</option>

                  </div>
                  <button onclick="clearFilters()" class="text-[10px] text-primary font-semibold hover:underline">Clear Filters</button>
                </div>
              </div>

              <button onclick="openAddPayment()" class="inline-flex items-center gap-1.5 bg-primary hover:bg-primary-dark text-white text-[11px] font-semibold px-3 py-2 rounded-lg transition shadow-sm">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <path d="M12 5v14M5 12h14"/>
                </svg>
                Record Payment
              </button>
            </div>
          </div>

          <!-- ===== STATS CARDS ===== -->
          <div class="grid grid-cols-2 md:grid-cols-5 gap-2.5 mb-4">
            <div class="bg-white border border-gray-200 rounded-xl shadow-sm stat-card">
              <div class="stat-label">Total Payments</div>
              <div class="stat-value" id="totalPayments">0</div>

            <div class="bg-white border border-gray-200 rounded-xl shadow-sm stat-card">
              <div class="stat-label">Total Paid</div>
              <div class="stat-value text-primary" id="totalPaid">₹0</div>
            </div>
            <div class="bg-white border border-gray-200 rounded-xl shadow-sm stat-card">
              <div class="stat-label">This Month</div>
              <div class="stat-value text-green-600" id="thisMonth">₹0</div>
            </div>
            <div class="bg-white border border-gray-200 rounded-xl shadow-sm stat-card">
              <div class="stat-label">Pending</div>
              <div class="stat-value text-amber-600" id="pendingAmount">₹0</div>
            </div>
            <div class="bg-white border border-gray-200 rounded-xl shadow-sm stat-card">
              <div class="stat-label">Emails Sent</div>
              <div class="stat-value text-blue-600" id="emailsSent">0</div>

          <!-- ===== PAYMENTS TABLE ===== -->
          <div id="paymentsPanel"></div>

        </div>
      </main>
    </div>
  </div>

  <!-- ========================================================== -->
  <!-- SCRIPTS -->
  <!-- ========================================================== -->

  <script src="/assets/js/nav-sidebar.js"></script>
  <script>
    // =============================================================
    // NAV-SIDEBAR INIT
    // =============================================================
    NavSidebar.init({
      basePath: "",
      activePage: "vendor-payments",
      pageTitle: "Vendor Payments",
      user: {
        name: "Admin",
        role: "Super Admin",
        avatarUrl: "",
      },
    });

    // =============================================================
    // SVG ICONS
    // =============================================================
    function iconPlus() { return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>`; }
    function iconEdit() { return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>`; }
    function iconTrash() { return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>`; }
    function iconEye() { return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`; }
    function iconX() { return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg>`; }
    function iconSearch() { return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>`; }
    function iconSave() { return `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>`; }
    function iconPrint() { return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><path d="M6 14h12v8H6z"/></svg>`; }
    function iconMail() { return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="M22 6l-10 7L2 6"/></svg>`; }
    function iconSend() { return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>`; }
    function iconMoney() { return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18"/><path d="M5 21V10M10 21V10M14 21V10M19 21V10"/><path d="M2 10l10-6 10 6"/></svg>`; }
    function iconInfo() { return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 3"/></svg>`; }
    function iconCheck() { return `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>`; }

    // =============================================================
    // TOAST
    // =============================================================
    function showToast(message, kind) {
      kind = kind || 'success';
      var wrap = document.getElementById('toastWrap');
      var colors = { success: 'bg-green-600', info: 'bg-primary', warning: 'bg-amber-600', error: 'bg-red-600' };
      var el = document.createElement('div');
      el.className = 'toast ' + colors[kind] + ' text-white font-semibold px-3 py-2 rounded-lg shadow-lg flex items-center gap-2 max-w-xs';
      el.innerHTML = '<span>' + message + '</span>';
      wrap.appendChild(el);
      setTimeout(function() {
        el.style.transition = 'opacity .3s';
        el.style.opacity = '0';
        setTimeout(function() { el.remove(); }, 300);
      }, 2600);
    }

    // =============================================================
    // MODAL
    // =============================================================
    function openModal(innerHtml, opts) {
      opts = opts || {};
      var root = document.getElementById('modalRoot');
      root.innerHTML = `
        <div class="fixed inset-0 z-[100] flex items-center justify-center p-3" id="modalOverlay">
          <div class="absolute inset-0 bg-black/40 backdrop-blur-[1px]" id="modalBackdrop"></div>
          <div class="relative bg-white rounded-xl shadow-2xl w-full ${opts.width || 'max-w-4xl'} max-h-[92vh] overflow-hidden animate-modal">
            ${innerHtml}
          </div>
        </div>`;
      document.getElementById('modalBackdrop').addEventListener('click', closeModal);
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      var root = document.getElementById('modalRoot');
      root.innerHTML = '';
      document.body.style.overflow = '';
    }

    function modalHeader(title, subtitle) {
      return `
        <div class="flex items-start justify-between px-5 py-3.5 border-b border-gray-100 sticky top-0 bg-white z-10">
          <div>
            <h3 class="modal-title text-gray-900">${title}</h3>
            ${subtitle ? '<p class="modal-subtitle mt-0.5">' + subtitle + '</p>' : ''}
          </div>
          <button onclick="closeModal()" class="w-7 h-7 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-gray-700 transition">${iconX()}</button>
        </div>`;
    }

    function modalFooter(saveLabel, onSaveAttr, extraBtns) {
      return `
        <div class="flex items-center justify-between gap-2 px-5 py-3 border-t border-gray-100 bg-gray-50 rounded-b-xl sticky bottom-0">
          <div>${extraBtns || ''}</div>
          <div class="flex gap-2">
            <button onclick="closeModal()" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-600 border border-gray-200 hover:bg-white transition">Cancel</button>
            <button ${onSaveAttr} class="px-3 py-1.5 rounded-lg text-xs font-semibold text-white bg-primary hover:bg-primary-dark transition shadow-sm flex items-center gap-1.5">
              ${iconSave()} ${saveLabel}
            </button>
          </div>
        </div>`;
    }

    function fld(label, inputHtml, hint) {
      return `<div class="mb-2"><label class="form-label">${label}</label>${inputHtml}${hint ? '<div class="form-hint">' + hint + '</div>' : ''}</div>`;
    }

    function inputBase() { return "form-input"; }

    // =============================================================
    // DROPDOWN
    // =============================================================
    document.addEventListener('click', function(e) {
      if (!e.target.closest('[data-dd-trigger]')) {
        document.querySelectorAll('[data-dd-menu]').forEach(function(m) { m.classList.add('hidden'); });
      }
    });

    function toggleFilterDD() {
      var menu = document.getElementById('filterDD');
      var isHidden = menu.classList.contains('hidden');
      document.querySelectorAll('[data-dd-menu]').forEach(function(m) { m.classList.add('hidden'); });
      if (isHidden) menu.classList.remove('hidden');
    }

    // =============================================================
    // HELPERS
    // =============================================================
    function money(n) { return '₹' + Number(n).toLocaleString('en-IN'); }

    function statusBadge(status) {
      var map = { paid: 'badge-green', pending: 'badge-amber', bounced: 'badge-red', cleared: 'badge-blue' };
      var dot = { paid: 'badge-dot-green', pending: 'badge-dot-amber', bounced: 'badge-dot-red', cleared: 'badge-dot-blue' };
      var label = status.charAt(0).toUpperCase() + status.slice(1);
      return '<span class="badge ' + map[status] + '"><span class="badge-dot ' + dot[status] + '"></span>' + label + '</span>';
    }

    function modeBadge(mode) {
      var colors = {
        'Bank Transfer': 'badge-blue',
        'NEFT': 'badge-blue',
        'RTGS': 'badge-blue',
        'UPI': 'badge-purple',
        'Cheque': 'badge-amber',
        'Cash': 'badge-green',
        'Credit Card': 'badge-gray'
      };
      return '<span class="badge ' + (colors[mode] || 'badge-gray') + '">' + mode + '</span>';
    }

    function emailBadge(sent) {
      return sent
        ? '<span class="badge badge-green"><span class="badge-dot badge-dot-green"></span>' + iconCheck() + ' Sent</span>'
        : '<span class="badge badge-gray"><span class="badge-dot badge-dot-gray"></span>Pending</span>';
    }

    function rowActionsHtml(editFn, delFn, viewFn, printFn, emailFn) {
      var html = '<div class="flex gap-1">';
      if (viewFn) html += '<button onclick="' + viewFn + '" class="btn-icon-action" title="View">' + iconEye() + '</button>';

    function removeAllocation(btn) {

    function calcAllocTotal() {
      var total = 0;
      document.querySelectorAll('#allocBody .bill-amount').forEach(function(inp) {
        total += parseFloat(inp.value) || 0;
      });
      var allocEl = document.getElementById('allocTotal');
      var unallocEl = document.getElementById('unallocTotal');
      if (allocEl) allocEl.textContent = money(total);

      var payAmt = parseFloat(document.getElementById('p_amount').value) || 0;
      if (unallocEl) unallocEl.textContent = money(Math.max(payAmt - total, 0));
    }

    document.addEventListener('input', function(e) {
      if (e.target.id === 'p_amount') calcAllocTotal();
    });

    function savePayment(existingId) {
      var date = document.getElementById('p_date').value;
      var vendorId = document.getElementById('p_vendor').value;
      var amount = parseFloat(document.getElementById('p_amount').value) || 0;
      var mode = document.getElementById('p_mode').value;
      var reference = document.getElementById('p_reference').value.trim();
      var bankAccount = document.getElementById('p_bankAccount').value;
      var status = document.getElementById('p_status').value;
      var notes = document.getElementById('p_notes').value.trim();

      if (!date || !vendorId || amount <= 0) {
        showToast('Please fill required fields (Date, Vendor, Amount)', 'error');
        return;
      }

      var allocations = [];
      document.querySelectorAll('#allocBody .line-item-row').forEach(function(row) {
        var bill = row.querySelector('.bill-select').value;
        var amt = parseFloat(row.querySelector('.bill-amount').value) || 0;
        if (bill && amt > 0) {
          allocations.push({ billNumber: bill, amount: amt });
        }
      });

      var vend = vendors.find(function(v) { return v.id === vendorId; });

      if (existingId) {
        var p = payments.find(function(x) { return x.id === existingId; });
        if (p) {
          p.date = date;
          p.vendorId = vendorId;
          p.vendorName = vend ? vend.name : '';
          p.vendorEmail = vend ? vend.email : '';
          p.amount = amount;
          p.mode = mode;
          p.reference = reference;
          p.bankAccount = bankAccount;
          p.status = status;
          p.notes = notes;
          p.billAllocations = allocations;
          showToast('Payment updated successfully', 'success');
        }
      } else {
        var newPay = {
          id: 'VP-' + String(nextPayNo++).padStart(3, '0'),
          number: 'VPAY/25-26/' + String(payments.length + 1).padStart(3, '0'),
          date: date,
          vendorId: vendorId,
          vendorName: vend ? vend.name : '',
          vendorEmail: vend ? vend.email : '',
          amount: amount,
          mode: mode,
          reference: reference,
          bankAccount: bankAccount,
          billAllocations: allocations,
          notes: notes,
          status: status,
          emailSent: false,
          emailSentAt: '',
          createdAt: date
        };
        payments.unshift(newPay);

        // =============================================================
        // ENHANCEMENT #1 — PAYMENT EMAIL AUTOMATION
        // Auto-send email to vendor on payment save
        // =============================================================
        if (newPay.vendorEmail) {
          newPay.emailSent = true;
          newPay.emailSentAt = new Date().toLocaleString('en-IN', { dateStyle: 'short', timeStyle: 'short' });

          showToast('📧 Payment email automatically sent to ' + newPay.vendorEmail, 'success');

          // Log the email content
          console.log('========================================');
          console.log('📧 PAYMENT EMAIL AUTOMATION (Enhancement #1)');
          console.log('========================================');
          console.log('To: ' + newPay.vendorEmail);
          console.log('Subject: Payment Confirmation - ' + newPay.number);
          console.log('Payment Details:');
          console.log('- Amount: ' + money(amount));
          console.log('- Date: ' + date);
          console.log('- Reference: ' + reference);
          console.log('- Mode: ' + mode);
          console.log('========================================');
        } else {
          showToast('Payment recorded. ⚠️ No email address for vendor.', 'warning');
        }
      }

      closeModal();
      renderPayments();
    }

    function sendPaymentEmail(id) {
      var p = payments.find(function(x) { return x.id === id; });
      if (!p) return;

      if (!p.vendorEmail) {
        showToast('No email address for vendor. Add one in Vendor master.', 'warning');
        return;
      }

      showToast('📧 Sending payment confirmation to ' + p.vendorEmail + '...', 'info');

      setTimeout(function() {
        p.emailSent = true;
        p.emailSentAt = new Date().toLocaleString('en-IN', { dateStyle: 'short', timeStyle: 'short' });
        renderPayments();
        showToast('✅ Payment email sent to ' + p.vendorEmail, 'success');
      }, 1000);
    }

    function delPayment(id) {
      var p = payments.find(function(x) { return x.id === id; });
      if (!p) return;

      var modalContent = `
        ${modalHeader('Delete Vendor Payment', p.number)}
        <div class="px-5 py-4 text-sm text-gray-600">
          <p>Delete <b>${p.number}</b>?</p>
          <p class="text-gray-400 text-[11px] mt-1">This action cannot be undone. Bill balances will be recalculated.</p>
          <p class="text-amber-600 text-[11px] mt-2">Amount: ${money(p.amount)}</p>
        </div>
        ${modalFooter('Delete', 'onclick="confirmDeletePayment(\'' + id + '\')"', '')}
      `;
      openModal(modalContent, { width: 'max-w-md' });
    }

    function confirmDeletePayment(id) {
      payments = payments.filter(function(x) { return x.id !== id; });
      closeModal();
      renderPayments();
      showToast('Vendor payment deleted successfully', 'warning');
    }

    // =============================================================
    // SEARCH
    // =============================================================

    (function addSearchToTopbar() {
      var searchContainer = document.querySelector('.app-main header');
      if (searchContainer) {
        var searchHtml = `
          <div class="hidden sm:flex flex-1 max-w-[420px] relative ml-4">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">${iconSearch()}</span>
            <input type="text" id="searchInput" placeholder="Search payments by number, vendor, reference…"
              onkeyup="filterPayments()"
              class="w-full border border-gray-200 bg-gray-50 focus:bg-white rounded-lg pl-9 pr-3 py-1.5 text-xs outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition placeholder:text-gray-400">
          </div>
        `;
        var headerContent = searchContainer.innerHTML;
        var hamburgerIndex = headerContent.indexOf('lg:hidden');
        if (hamburgerIndex !== -1) {
          var firstDivEnd = headerContent.indexOf('</div>', hamburgerIndex) + 6;
          var before = headerContent.substring(0, firstDivEnd);
          var after = headerContent.substring(firstDivEnd);
          searchContainer.innerHTML = before + searchHtml + after;
        }
      }
    })();

    // =============================================================
    // INIT
    // =============================================================

    renderPayments();

    console.log('💰 Vendor Payments Module Loaded Successfully');
    console.log('📊 Total Payments:', payments.length);
    console.log('📧 Enhancement #1 — Payment Email Automation enabled');

  </script>

</body>
</html>
