<!-- Page-specific styles -->
<style>
  /* Form styles */
  .form-input {
    width: 100%;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    background: #fafafa;
    color: #1a1a2e;
  }
  .form-input:focus {
    border-color: #6da84c;
    box-shadow: 0 0 0 3px rgba(109, 168, 76, 0.15);
    background: #ffffff;
  }
  .form-input:disabled {
    background: #f3f4f6;
    cursor: not-allowed;
  }
  .form-label {
    font-size: 11.5px;
    font-weight: 600;
    color: #374151;
    display: block;
    margin-bottom: 4px;
  }
  .form-label .required { color: #ef4444; margin-left: 2px; }
  .form-hint { font-size: 10.5px; color: #9ca3af; margin-top: 3px; }

  /* Badge */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
  }
  .badge-green { background: #dcfce7; color: #166534; }
  .badge-amber { background: #fef3c7; color: #92400e; }
  .badge-red { background: #fee2e2; color: #991b1b; }
  .badge-gray { background: #f1f5f9; color: #475569; }
  .badge-blue { background: #dbeafe; color: #1e40af; }
  .badge-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    display: inline-block;
  }
  .badge-dot-green { background: #22c55e; }
  .badge-dot-amber { background: #f59e0b; }
  .badge-dot-red { background: #ef4444; }
  .badge-dot-gray { background: #94a3b8; }
  .badge-dot-blue { background: #3b82f6; }

  /* Stats card */
  .stat-card {
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .stat-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
  }

  /* Table row hover */
  .table-row-hover:hover {
    background: #f8fafc;
  }

  /* Modal tabs */
  .modal-tab-btn {
    transition: all 0.2s ease;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 500;
    border-bottom: 2px solid transparent;
    color: #6b7280;
    cursor: pointer;
    background: transparent;
  }
  .modal-tab-btn.active {
    color: #6da84c;
    border-bottom-color: #6da84c;
  }
  .modal-tab-btn:hover:not(.active) {
    color: #1f2937;
    border-bottom-color: #d1d5db;
  }
  .modal-tab-panel { display: none; }
  .modal-tab-panel.active { display: block; animation: fadeIn 0.25s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.96) translateY(6px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .animate-modal { animation: modalIn 0.18s ease; }

  /* Action buttons */
  .btn-icon-action {
    transition: all 0.15s ease;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #94a3b8;
    background: transparent;
    border: none;
    cursor: pointer;
  }
  .btn-icon-action:hover {
    background: #f1f5f9;
    color: #6da84c;
  }
  .btn-icon-action.danger:hover {
    background: #fee2e2;
    color: #ef4444;
  }

  /* Toast */
  .toast {
    animation: fadeIn 0.2s ease;
  }
  .toast-success { background: #16a34a; }
  .toast-error { background: #dc2626; }
  .toast-warning { background: #f59e0b; }
  .toast-info { background: #6da84c; }

  /* Scrollbar for modal */
  .modal-scroll {
    max-height: 60vh;
    overflow-y: auto;
  }
  .modal-scroll::-webkit-scrollbar {
    width: 4px;
  }
  .modal-scroll::-webkit-scrollbar-thumb {
    background: #d1d5db;
    border-radius: 4px;
  }

  /* Empty state */
  .empty-icon-svg {
    opacity: 0.2;
    width: 48px;
    height: 48px;
    color: #94a3b8;
  }

  /* Vendor logo placeholder */
  .vendor-avatar {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 14px;
    color: #fff;
    flex-shrink: 0;
  }

  /* ---------------- MANAGE VENDOR CATEGORIES OVERLAY (new) ---------------- */
  .cat-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid #f1f5f9;
    border-radius: 10px;
    margin-bottom: 8px;
    transition: background .15s ease;
  }
  .cat-row:hover { background: #fafbfc; }
  .cat-color-dot {
    width: 14px;
    height: 14px;
    border-radius: 5px;
    flex-shrink: 0;
    border: 1px solid rgba(0,0,0,0.08);
  }
  .cat-swatch {
    width: 24px;
    height: 24px;
    border-radius: 7px;
    cursor: pointer;
    border: 2px solid transparent;
    display: inline-flex;
    transition: all .15s ease;
  }
  .cat-swatch.selected {
    border-color: #1a1a2e;
    transform: scale(1.1);
  }
  .cat-add-form {
    max-height: 0;
    overflow: hidden;
    transition: max-height .25s ease;
  }
  .cat-add-form.open { max-height: 420px; }

  /* ---------------- BREADCRUMB-STYLE STEP TABS (Basic/Tax/Banking/Payment) ---------------- */
  .step-tabs-wrap {
    display: flex;
    align-items: center;
    gap: 0;
    margin-bottom: 16px;
  }
  .step-tab {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 12px;
    border-radius: 8px;
    font-size: 11.5px;
    font-weight: 600;
    color: #9ca3af;
    background: #f8fafc;
    cursor: pointer;
    transition: all .18s ease;
    white-space: nowrap;
  }
  .step-tab .step-num {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #e5e7eb;
    color: #6b7280;
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .step-tab.active {
    background: #eef5e8;
    color: #1a1a2e;
  }
  .step-tab.active .step-num {
    background: #6da84c;
    color: #fff;
  }
  .step-tab.done .step-num {
    background: #6da84c;
    color: #fff;
  }
  .step-tab.done { color: #5c9140; }
  .step-chevron {
    color: #d1d5db;
    margin: 0 2px;
    flex-shrink: 0;
  }

  /* ---------------- SECONDARY CONTACT BLOCK ---------------- */
  .secondary-contact-block {
    border: 1px dashed #e5e7eb;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    background: #fafbfc;
    position: relative;
  }
  .secondary-contact-remove {
    position: absolute;
    top: 8px;
    right: 8px;
  }

  /* ---------------- DOCUMENTS LIST ---------------- */
  .doc-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid #f1f5f9;
    border-radius: 10px;
    margin-bottom: 8px;
  }
  .doc-icon {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: #eef5e8;
    color: #5c9140;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* ---------------- PURCHASE SUMMARY MINI CARDS ---------------- */
  .report-mini-card {
    border: 1px solid #f1f5f9;
    border-radius: 10px;
    padding: 12px 14px;
    background: #fafbfc;
  }
  .report-mini-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: #9ca3af;
  }
  .report-mini-value {
    font-size: 18px;
    font-weight: 700;
    color: #1a1a2e;
    margin-top: 3px;
  }
</style>
</head>

    // ---------- Toast System ----------
    function showToast(message, kind) {
      kind = kind || 'success';
      var wrap = document.getElementById('toastWrap');
      var colors = {
        success: 'bg-green-600',
        info: 'bg-primary',
        warning: 'bg-amber-600',
        error: 'bg-red-600'
      };
      var el = document.createElement('div');
      el.className = 'toast ' + colors[kind] + ' text-white text-sm font-semibold px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 max-w-xs';
      el.innerHTML = '<span>' + message + '</span>';
      wrap.appendChild(el);
      setTimeout(function() {
        el.style.transition = 'opacity .3s';
        el.style.opacity = '0';
        setTimeout(function() { el.remove(); }, 300);
      }, 2600);
    }

    // ---------- Modal System ----------
    function openModal(innerHtml, opts) {
      opts = opts || {};
      var root = document.getElementById('modalRoot');
      root.innerHTML = `
        <div class="fixed inset-0 z-[100] flex items-center justify-center p-4" id="modalOverlay">
          <div class="absolute inset-0 bg-black/40 backdrop-blur-[2px]" id="modalBackdrop"></div>

            ${innerHtml}
          </div>
        </div>`;
      document.getElementById('modalBackdrop').addEventListener('click', closeModal);
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      var root = document.getElementById('modalRoot');
      root.innerHTML = '';
      document.body.style.overflow = '';
    }

    var defaultVendorCategories = [

      { id: 'vt-distributor',  name: 'Distributor',       color: '#1985bf', description: 'Regional distribution partner' },

    function loadVendorCategories() {
      try {
        var raw = localStorage.getItem(VENDOR_CATEGORY_STORAGE_KEY);

        } else {
          vendorCategories = defaultVendorCategories.slice();
          saveVendorCategories();

      } catch (err) {
        vendorCategories = defaultVendorCategories.slice();
      }
    }

    function saveVendorCategories() {
      try {
        localStorage.setItem(VENDOR_CATEGORY_STORAGE_KEY, JSON.stringify(vendorCategories));
      } catch (err) {
        // storage unavailable — categories stay in-memory only for this session
      }
    }

    function renderVendorColorSwatches(selectedColor) {
      var wrap = document.getElementById('vcat_color_swatches');
      if (!wrap) return;
      wrap.innerHTML = vendorCategoryPalette.map(function(c) {

      var form = document.getElementById('addVendorCategoryForm');
      if (!form) return;
      var willOpen = forceClose ? false : !form.classList.contains('open');
      form.classList.toggle('open', willOpen);
      if (willOpen) {
        document.getElementById('vcat_edit_id').value = '';
        document.getElementById('vcat_name').value = '';
        document.getElementById('vcat_description').value = '';
        document.getElementById('vcat_color').value = vendorCategoryPalette[0];

      var cat = getVendorCategoryById(id);
      if (!cat) return;
      var form = document.getElementById('addVendorCategoryForm');
      form.classList.add('open');
      document.getElementById('vcat_edit_id').value = cat.id;
      document.getElementById('vcat_name').value = cat.name;
      document.getElementById('vcat_description').value = cat.description || '';
      document.getElementById('vcat_color').value = cat.color;
      renderVendorColorSwatches(cat.color);
      form.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function saveVendorCategory() {
      var editId = document.getElementById('vcat_edit_id').value;
      var name = document.getElementById('vcat_name').value.trim();
      var color = document.getElementById('vcat_color').value || vendorCategoryPalette[0];
      var description = document.getElementById('vcat_description').value.trim();

      if (!name) {
        showToast('Category name is required', 'error');
        return;
      }

      if (editId) {
        var cat = getVendorCategoryById(editId);
        if (cat) {
          cat.name = name;
          cat.color = color;
          cat.description = description;
          showToast('Vendor category updated', 'success');
        }
      } else {
        vendorCategories.push({
          id: 'vt-' + Date.now(),
          name: name,
          color: color,
          description: description
        });
        showToast('Vendor category added', 'success');
      }

      saveVendorCategories();
      refreshVendorCategoryOverlay();
      populateVendorTypeFilter();
      renderVendors();
    }

    function deleteVendorCategory(id) {
      var count = vendorCategoryCount(id);
      var msg = count > 0

        : 'Delete this vendor category?';
      if (!window.confirm(msg)) return;
      vendorCategories = vendorCategories.filter(function(c) { return c.id !== id; });
      saveVendorCategories();
      refreshVendorCategoryOverlay();
      populateVendorTypeFilter();
      renderVendors();
      showToast('Vendor category deleted', 'warning');
    }

        var matchStatus = status === 'all' || v.status === status;
        var matchGST = gst === 'all' || (gst === 'yes' ? v.gstRegistered : !v.gstRegistered);
        var matchType = vtype === 'all' || v.vendorType === vtype;
        return matchSearch && matchStatus && matchGST && matchType;
      });
    }

                <div class="flex items-center gap-3">
                  <div class="vendor-avatar" style="background:${v.color}">${getInitials(v.name)}</div>

      );

      document.getElementById('vendorsPanel').innerHTML = panelHtml;
      renderStats();

    function filterVendors() { renderVendors(); }

    function clearFilters() {
      document.getElementById('filterStatus').value = 'all';

    function secondaryContactBlockHtml(idx, contact) {
      contact = contact || {};
      return `
        <div class="secondary-contact-block" data-contact-idx="${idx}">
          <button type="button" onclick="removeSecondaryContact(${idx})" class="secondary-contact-remove btn-icon-action danger" title="Remove contact">${iconX()}</button>

            ${fld('Contact Name', '<input class="sc_name ' + inputBase() + '" value="' + (contact.name || '') + '" placeholder="Full name">')}

          </div>
          <div class="grid grid-cols-2 gap-3">
            ${fld('Mobile', '<input class="sc_mobile ' + inputBase() + '" value="' + (contact.mobile || '') + '" placeholder="+91-XXXXXXXXXX">')}

          </div>
        </div>`;

    var secondaryContactCounter = 0;

    function addSecondaryContactBlock(contact) {
      var wrap = document.getElementById('secondaryContactsWrap');
      if (!wrap) return;
      var idx = secondaryContactCounter++;
      var div = document.createElement('div');
      div.innerHTML = secondaryContactBlockHtml(idx, contact);
      wrap.appendChild(div.firstElementChild);
    }

    function removeSecondaryContact(idx) {
      var block = document.querySelector('.secondary-contact-block[data-contact-idx="' + idx + '"]');
      if (block) block.remove();
    }

    function collectSecondaryContacts() {
      var blocks = document.querySelectorAll('.secondary-contact-block');
      var contacts = [];
      blocks.forEach(function(block) {
        var name = block.querySelector('.sc_name').value.trim();
        var designation = block.querySelector('.sc_designation').value.trim();
        var mobile = block.querySelector('.sc_mobile').value.trim();
        var email = block.querySelector('.sc_email').value.trim();
        if (name || designation || mobile || email) {
          contacts.push({ name: name, designation: designation, mobile: mobile, email: email });
        }
      });
      return contacts;
    }

    // ---------- Documents tab (new) ----------
    function documentsTabHtml(v) {
      var docs = vendorDocuments[v.id] || [];
      var rows = docs.length
        ? docs.map(function(d) {
            return `
              <div class="doc-row">
                <div class="doc-icon">${iconDoc()}</div>
                <div class="min-w-0 flex-1">
                  <div class="text-[13px] font-semibold text-gray-800">${d.type}</div>

    function openUploadDocumentOverlay(vendorId) {
      var v = vendors.find(function(x) { return x.id === vendorId; });

      var todayIso = new Date().toISOString().split('T')[0];

      var modalContent = `
        ${modalHeader('Upload Document', v.name + ' · ' + v.id)}
        <div class="px-6 py-4">
          ${fld('Document Type <span class="required">*</span>', '<select id="doc_type" class="' + inputBase() + '">' + documentTypeOptions.map(function(t) { return '<option>' + t + '</option>'; }).join('') + '</select>')}

        </div>
        <div class="flex items-center justify-end gap-2 px-6 py-4 border-t border-gray-100 bg-gray-50 rounded-b-2xl">
          <button onclick="viewVendor('${vendorId}', 'tab-documents')" class="px-4 py-2 rounded-lg text-sm font-semibold text-gray-600 border border-gray-200 hover:bg-white transition">Cancel</button>

        </div>`;

      openModal(modalContent, { width: 'max-w-md' });
    }

    function saveUploadedDocument(vendorId) {
      var type = document.getElementById('doc_type').value;
      var fileInput = document.getElementById('doc_file');
      var fileName = (fileInput && fileInput.files && fileInput.files[0]) ? fileInput.files[0].name : 'untitled_file';
      var uploadDate = document.getElementById('doc_date').value || new Date().toISOString().split('T')[0];

      if (!vendorDocuments[vendorId]) vendorDocuments[vendorId] = [];
      vendorDocuments[vendorId].push({ type: type, fileName: fileName, uploadDate: uploadDate });

      showToast('Document added (UI only — no file actually stored)', 'success');
      viewVendor(vendorId, 'tab-documents');
    }

    // ---------- Purchase Summary tab (new) ----------

      var orders = getVendorPurchaseOrders(v.id);

      var rows = orders.length
        ? orders.map(function(po) {
            return `

              <th class="text-left px-3 py-2 text-[10.5px] font-bold uppercase text-gray-500">Date</th>

    var VENDOR_STEP_TABS = [
      { id: 'tab-basic',   n: 1, label: 'Basic Info' },
      { id: 'tab-tax',     n: 2, label: 'Tax & GST' },
      { id: 'tab-banking', n: 3, label: 'Banking' },
      { id: 'tab-payment', n: 4, label: 'Payment Terms' }

    function vendorStepTabsHtml(activeId) {
      return `
        <div class="step-tabs-wrap" id="vendorStepTabsWrap">
          ${VENDOR_STEP_TABS.map(function(t, idx) {
            var isActive = t.id === activeId;
            var isDone = !!vendorVisitedSteps[t.id] && !isActive;
            var circle = isDone ? iconCheck() : t.n;
            return `
              <div class="step-tab ${isActive ? 'active' : ''} ${isDone ? 'done' : ''}" data-tab="${t.id}" onclick="switchVendorStepTab('${t.id}')">
                <span class="step-num">${circle}</span>
                <span>${t.label}</span>
              </div>
              ${idx < VENDOR_STEP_TABS.length - 1 ? iconChevronRightSmall() : ''}

          }).join('')}

        if (currentActive) vendorVisitedSteps[currentActive.dataset.tab] = true;

      document.querySelectorAll('.modal-tab-panel').forEach(function(p) { p.classList.remove('active'); });

          </div>

          <div id="tab-payment" class="modal-tab-panel">
            ${fld('Payment Terms *', '<select id="f_paymentTerms" class="' + inputBase() + '"><option ' + (e.paymentTerms === 'Net 7 days' ? 'selected' : '') + '>Net 7 days</option><option ' + (e.paymentTerms === 'Net 15 days' ? 'selected' : '') + '>Net 15 days</option><option ' + (e.paymentTerms === 'Net 30 days' ? 'selected' : '') + '>Net 30 days</option><option ' + (e.paymentTerms === 'Net 45 days' ? 'selected' : '') + '>Net 45 days</option><option ' + (e.paymentTerms === 'Net 60 days' ? 'selected' : '') + '>Net 60 days</option><option ' + (e.paymentTerms === 'Advance Payment' ? 'selected' : '') + '>Advance Payment</option><option ' + (e.paymentTerms === 'Cash on Delivery' ? 'selected' : '') + '>Cash on Delivery</option></select>')}
            ${fld('Status', '<div class="flex items-center gap-4 mt-1"><label class="flex items-center gap-2 text-[13px]"><input type="radio" name="vendorStatus" value="active" ' + (e.status === 'active' ? 'checked' : '') + '> <span class="font-medium">Active</span></label><label class="flex items-center gap-2 text-[13px]"><input type="radio" name="vendorStatus" value="inactive" ' + (e.status === 'inactive' ? 'checked' : '') + '> <span class="font-medium">Inactive</span></label></div>')}
          </div>
        </div>
        ${modalFooter(isEdit ? 'Update Vendor' : 'Save Vendor', 'onclick="saveVendor(\'' + (isEdit ? e.id : '') + '\')"')}
      `;

      openModal(modalContent, { width: 'max-w-2xl' });

      // seed existing secondary contacts (edit mode)
      (e.secondaryContacts || []).forEach(function(c) { addSecondaryContactBlock(c); });
    }

    // State code updater
    function updateStateCode() {
      var state = document.getElementById('f_state').value;
      var stateCodeMap = {
        'Maharashtra': '27',
        'Delhi': '07',
        'Karnataka': '29',
        'Tamil Nadu': '33',
        'Gujarat': '24',
        'Uttar Pradesh': '09',
        'Rajasthan': '08',
        'Kerala': '32',
        'Telangana': '36',
        'West Bengal': '19',
        'Andhra Pradesh': '28',
        'Bihar': '10',
        'Chhattisgarh': '22',
        'Goa': '30',
        'Haryana': '06',
        'Himachal Pradesh': '02',
        'Jharkhand': '20',
        'Madhya Pradesh': '23',
        'Odisha': '21',
        'Punjab': '03',
        'Uttarakhand': '05'
      };
      document.getElementById('f_stateCode').value = stateCodeMap[state] || '';
    }

    // =============================================================
    // SAVE / DELETE VENDOR
    // =============================================================

    function saveVendor(existingId) {
      var name = document.getElementById('f_name') ? document.getElementById('f_name').value.trim() : '';
      var companyName = document.getElementById('f_company') ? document.getElementById('f_company').value.trim() : '';
      var vendorType = document.getElementById('f_vendorType') ? document.getElementById('f_vendorType').value : '';
      var email = document.getElementById('f_email') ? document.getElementById('f_email').value.trim() : '';
      var phone = document.getElementById('f_phone') ? document.getElementById('f_phone').value.trim() : '';
      var address = document.getElementById('f_address') ? document.getElementById('f_address').value.trim() : '';
      var city = document.getElementById('f_city') ? document.getElementById('f_city').value.trim() : '';
      var state = document.getElementById('f_state') ? document.getElementById('f_state').value : 'Maharashtra';
      var stateCode = document.getElementById('f_stateCode') ? document.getElementById('f_stateCode').value : '27';
      var pincode = document.getElementById('f_pincode') ? document.getElementById('f_pincode').value.trim() : '';
      var gstin = document.getElementById('f_gstin') ? document.getElementById('f_gstin').value.trim().toUpperCase() : '';
      var pan = document.getElementById('f_pan') ? document.getElementById('f_pan').value.trim().toUpperCase() : '';
      var bankName = document.getElementById('f_bankName') ? document.getElementById('f_bankName').value.trim() : '';
      var bankAccount = document.getElementById('f_bankAccount') ? document.getElementById('f_bankAccount').value.trim() : '';
      var bankIfsc = document.getElementById('f_bankIfsc') ? document.getElementById('f_bankIfsc').value.trim().toUpperCase() : '';
      var paymentTerms = document.getElementById('f_paymentTerms') ? document.getElementById('f_paymentTerms').value : 'Net 15 days';
      var gstRegRadio = document.querySelector('input[name="gstReg"]:checked');
      var gstRegistered = gstRegRadio ? gstRegRadio.value === 'true' : false;
      var statusRadio = document.querySelector('input[name="vendorStatus"]:checked');
      var status = statusRadio ? statusRadio.value : 'active';
      var secondaryContacts = collectSecondaryContacts();

      if (!name || !email || !phone) {
        showToast('Please fill all required fields (Name, Email, Phone)', 'error');
        return;
      }

      var color = vendorColors[Math.floor(Math.random() * vendorColors.length)];

      if (existingId) {
        var v = vendors.find(function(x) { return x.id === existingId; });
        if (v) {
          v.name = name;
          v.companyName = companyName;
          v.vendorType = vendorType;
          v.email = email;
          v.phone = phone;
          v.address = address;
          v.city = city;
          v.state = state;
          v.stateCode = stateCode;
          v.pincode = pincode;
          v.gstin = gstin;
          v.pan = pan;
          v.bankName = bankName;
          v.bankAccount = bankAccount;
          v.bankIfsc = bankIfsc;
          v.paymentTerms = paymentTerms;
          v.gstRegistered = gstRegistered;
          v.status = status;
          v.secondaryContacts = secondaryContacts;
          showToast('Vendor updated successfully', 'success');
        }
      } else {
        var newVendor = {
          id: 'VEN-' + String(nextVendorNo++).padStart(3, '0'),
          name: name,
          companyName: companyName,
          vendorType: vendorType,
          email: email,
          phone: phone,
          address: address,
          city: city,
          state: state,
          stateCode: stateCode,
          pincode: pincode,
          gstin: gstin,
          pan: pan,
          bankName: bankName,
          bankAccount: bankAccount,
          bankIfsc: bankIfsc,
          paymentTerms: paymentTerms,
          gstRegistered: gstRegistered,
          status: status,
          outstanding: 0,
          createdAt: new Date().toISOString().split('T')[0],
          color: color,
          secondaryContacts: secondaryContacts
        };
        vendors.unshift(newVendor);
        showToast('Vendor added successfully', 'success');
      }

      closeModal();
      renderVendors();
    }

    function delVendor(id) {
      var v = vendors.find(function(x) { return x.id === id; });
      if (!v) return;

      var modalContent = `
        ${modalHeader('Delete Vendor', v.name)}
        <div class="px-6 py-4 text-sm text-gray-600">
          <p>Are you sure you want to permanently delete <b class="text-gray-800">${v.name}</b>?</p>
          <p class="text-gray-400 text-[12px] mt-1">This action cannot be undone. All associated transactions will be affected.</p>
          ${v.outstanding > 0 ? '<p class="text-amber-600 text-[12px] mt-2">This vendor has outstanding balance of ' + money(v.outstanding) + '</p>' : ''}
        </div>
        ${modalFooter('Delete', 'onclick="confirmDeleteVendor(\'' + id + '\')"', '')}
      `;
      openModal(modalContent, { width: 'max-w-md' });
    }

    function confirmDeleteVendor(id) {
      vendors = vendors.filter(function(x) { return x.id !== id; });
      closeModal();
      renderVendors();
      showToast('Vendor deleted successfully', 'warning');
    }

    // =============================================================
    // SEARCH
    // =============================================================

    (function addSearchToTopbar() {
      var searchContainer = document.querySelector('.app-main header');
      if (searchContainer) {
        var searchHtml = `
          <div class="hidden sm:flex flex-1 max-w-[420px] relative ml-4">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">${iconSearch()}</span>
            <input type="text" id="searchInput" placeholder="Search vendors by name, company, phone…"
              onkeyup="filterVendors()"
              class="w-full border border-gray-200 bg-gray-50 focus:bg-white rounded-lg pl-9 pr-3 py-2 text-[13px] outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition placeholder:text-gray-400">
          </div>
        `;
        var headerContent = searchContainer.innerHTML;
        var hamburgerIndex = headerContent.indexOf('lg:hidden');
        if (hamburgerIndex !== -1) {
          var firstDivEnd = headerContent.indexOf('</div>', hamburgerIndex) + 6;
          var before = headerContent.substring(0, firstDivEnd);
          var after = headerContent.substring(firstDivEnd);
          searchContainer.innerHTML = before + searchHtml + after;
        }
      }
    })();

    // =============================================================
    // INIT
    // =============================================================

    loadVendorCategories();
    renderVendors();
    populateVendorTypeFilter();

    console.log('🏢 Vendors Module Loaded Successfully');
    console.log('📊 Total Vendors:', vendors.length);
    console.log('✅ Active Vendors:', vendors.filter(function(v) { return v.status === 'active'; }).length);
    console.log('💰 Total Payable:', vendors.reduce(function(sum, v) { return sum + v.outstanding; }, 0));
    console.log('🏷️ Vendor Categories:', vendorCategories.length);

  </script>

</body>
