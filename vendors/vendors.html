  <style>
    /* Form styles */
    .form-input {
      width: 100%;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #fafafa;
      color: #1a1a2e;
    }

    .form-input:focus {
      border-color: #6da84c;
      box-shadow: 0 0 0 3px rgba(109, 168, 76, 0.15);
      background: #ffffff;
    }

    .form-input:disabled {
      background: #f3f4f6;
      cursor: not-allowed;
    }

    .form-label {
      font-size: 11.5px;
      font-weight: 600;
      color: #374151;
      display: block;
      margin-bottom: 4px;
    }

    .form-label .required {
      color: #ef4444;
      margin-left: 2px;
    }

    .form-hint {
      font-size: 10.5px;
      color: #9ca3af;
      margin-top: 3px;
    }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
    }

    .badge-green {
      background: #dcfce7;
      color: #166534;
    }

    .badge-amber {
      background: #fef3c7;
      color: #92400e;
    }

    .badge-red {
      background: #fee2e2;
      color: #991b1b;
    }

    .badge-gray {
      background: #f1f5f9;
      color: #475569;
    }

    .badge-blue {
      background: #dbeafe;
      color: #1e40af;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
    }

    .badge-dot-green {
      background: #22c55e;
    }

    .badge-dot-amber {
      background: #f59e0b;
    }

    .badge-dot-red {
      background: #ef4444;
    }

    .badge-dot-gray {
      background: #94a3b8;
    }

    .badge-dot-blue {
      background: #3b82f6;
    }

    /* Stats card */
    /* Stats card */
    .stat-card {
      border: 1px solid #7dc057;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      height: 70px;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }

    .stat-icon-wrap {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid #6da84c;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    /* Table row hover */
    .table-row-hover:hover {
      background: #f8fafc;
    }

    /* Modal tabs */
    .modal-tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      color: #6b7280;
      cursor: pointer;
      background: transparent;
    }


    .modal-tab-btn.active {
      color: #6da84c;
      border-bottom-color: #6da84c;
    }

    .modal-tab-btn:hover:not(.active) {
      color: #1f2937;
      border-bottom-color: #d1d5db;
    }

    .modal-tab-panel {
      display: none;
    }

    .modal-tab-panel.active {
      display: block;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(6px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .animate-modal {
      animation: modalIn 0.18s ease;
    }

    /* Action buttons */
    .btn-icon-action {
      transition: all 0.15s ease;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      background: transparent;
      border: 1px solid gray;
      cursor: pointer;
    }

    .btn-icon-action:hover {
      background: #f1f5f9;
      color: #6da84c;
    }

    .btn-icon-action.danger:hover {
      background: #fee2e2;
      color: #ef4444;
    }

    /* Toast */
    .toast {
      animation: fadeIn 0.2s ease;
    }

    .toast-success {
      background: #16a34a;
    }

    .toast-error {
      background: #dc2626;
    }

    .toast-warning {
      background: #f59e0b;
    }

    .toast-info {
      background: #6da84c;
    }

      max-height: 60vh;
      overflow-y: auto;
    }

      width: 4px;
    }

      background: #d1d5db;
      border-radius: 4px;

      width: 48px;
      height: 48px;

      height: 14px;
      border-radius: 5px;
      flex-shrink: 0;
      border: 1px solid rgba(0, 0, 0, 0.08);

    .cat-swatch {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      cursor: pointer;
      border: 2px solid transparent;
      display: inline-flex;
      transition: all .15s ease;
    }

    .cat-swatch.selected {
      border-color: #1a1a2e;
      transform: scale(1.1);
    }

      max-height: 0;
      overflow: hidden;
      transition: max-height .25s ease;
    }

    .cat-add-form.open {
      max-height: 420px;
    }

    /* ---------------- BREADCRUMB-STYLE STEP TABS (Basic/Tax/Banking/Payment) ---------------- */
    .step-tabs-wrap {
      display: flex;
      align-items: center;
      gap: 0;
      margin-bottom: 16px;
    }

    .step-tab {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 600;
      color: #9ca3af;
      background: #f8fafc;
      cursor: pointer;
      transition: all .18s ease;
      white-space: nowrap;
    }

    .step-tab .step-num {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #e5e7eb;
      color: #6b7280;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .step-tab.active {
      background: #eef5e8;
      color: #1a1a2e;
    }

    .step-tab.active .step-num {
      background: #6da84c;
      color: #fff;
    }

    .step-tab.done .step-num {
      background: #6da84c;
      color: #fff;
    }

    .step-tab.done {
      color: #5c9140;
    }

    .step-chevron {
      color: #d1d5db;
      margin: 0 2px;
      flex-shrink: 0;

    /* ---------------- SECONDARY CONTACT BLOCK ---------------- */
    .secondary-contact-block {

      margin-bottom: 10px;

    .secondary-contact-remove {

    /* ---------------- DOCUMENTS LIST ---------------- */
    .doc-row {
      display: flex;
      align-items: center;

      border: 1px solid #e5e7eb;

    .doc-icon {

      height: 34px;
      border-radius: 8px;
      background: #eef5e8;
      color: #5c9140;

    /* ---------------- PURCHASE SUMMARY MINI CARDS ---------------- */

    .report-mini-value {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a2e;
      margin-top: 3px;
    }

    // ---------- Toast System ----------
    function showToast(message, kind) {
      kind = kind || 'success';
      var wrap = document.getElementById('toastWrap');
      var colors = {
        success: 'bg-green-600',
        info: 'bg-primary',
        warning: 'bg-amber-600',
        error: 'bg-red-600'
      };
      var el = document.createElement('div');
      el.className = 'toast ' + colors[kind] + ' text-white text-sm font-semibold px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 max-w-xs';
      el.innerHTML = '<span>' + message + '</span>';
      wrap.appendChild(el);
      setTimeout(function () {
        el.style.transition = 'opacity .3s';
        el.style.opacity = '0';
        setTimeout(function () { el.remove(); }, 300);
      }, 2600);
    }

    // ---------- Modal System ----------
    function openModal(innerHtml, opts) {
      opts = opts || {};
      var root = document.getElementById('modalRoot');
      root.innerHTML = `
        <div class="fixed inset-0 z-[100] flex items-center justify-center p-4" id="modalOverlay">
          <div class="absolute inset-0 bg-black/40 backdrop-blur-[2px]" id="modalBackdrop"></div>
          <div class="relative bg-white rounded-2xl shadow-2xl w-full ${opts.width || 'max-w-3xl'} max-h-[92vh] overflow-hidden animate-modal" ${opts.id ? 'id="' + opts.id + '"' : ''}>
            ${innerHtml}
          </div>
        </div>`;
      document.getElementById('modalBackdrop').addEventListener('click', closeModal);
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      var root = document.getElementById('modalRoot');
      root.innerHTML = '';
      document.body.style.overflow = '';
    }

    function modalHeader(title, subtitle) {
      return `
        <div class="flex items-start justify-between px-6 py-5 border-b border-gray-100 sticky top-0 bg-white z-10">
          <div>
            <h3 class="text-lg font-bold text-gray-900">${title}</h3>
            ${subtitle ? '<p class="text-xs text-gray-500 mt-0.5">' + subtitle + '</p>' : ''}
          </div>
          <button onclick="closeModal()" class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-gray-700 transition">${iconX()}</button>
        </div>`;
    }

   function modalFooter(saveLabel, onSaveAttr, extraBtns, danger) {
  var saveBtnCls = danger ? 'bg-red-600 hover:bg-red-700' : 'bg-primary hover:bg-primary-dark';
  var saveBtnIcon = danger ? iconTrash() : iconSave();

    async function readErrorMessage(res, fallback) {

    // Backend caps page size at 100, so a full listing is paged through here
    // and flattened for the client-side search/filter UX the page already has.
    async function fetchAllVendorsFromApi() {
      var all = [];
      var page = 0;
      var isLast = false;
      while (!isLast) {
        var res = await fetch(VENDOR_API_BASE + '/get-all-vendor?page=' + page + '&size=100&sortBy=createdAt&sortDir=desc');
        if (!res.ok) {
          throw new Error(await readErrorMessage(res, 'Failed to load vendors'));
        }
        var data = await res.json();
        if (typeof data === 'string') break; // "No vendors found."
        (data.content || []).forEach(function (dto) { all.push(mapDtoToVendor(dto)); });
        isLast = !!data.last;
        page++;
      }
      return all;
    }

        formData.append('documents', doc.file, doc.file.name);
        formData.append('documentTypes', doc.type || doc.documentType || 'Other');
      });

      return formData;

    // ---------- Documents tab (view-only detail modal) ----------

    // Server-stored documents come back as base64 "data:" URLs. Browsers
    // increasingly block window.open() on a data: URL as a top-level
    // navigation, so this converts it to a blob: URL first, which works
    // reliably for both viewing and downloading. Locally-staged documents
    // (not yet uploaded) already use a blob: URL and pass through untouched.
    function resolveViewableUrl(fileUrl) {
      if (!fileUrl) return fileUrl;

      // Backend stores document URLs as relative paths, e.g.
      // /api/vendor/uploads/vendor/VND-003/pan-2d60d504.pdf
      // Resolve them against the Vendor backend instead of the frontend
      // server (127.0.0.1:5503).
      if (fileUrl.indexOf('data:') !== 0 && fileUrl.indexOf('blob:') !== 0) {
        try {
          return new URL(fileUrl, VENDOR_API_BASE).href;
        } catch (e) {
          console.error('Failed to resolve vendor document URL', e);
          return fileUrl;
        }
      }

      if (fileUrl.indexOf('data:') !== 0) {
        return fileUrl;
      }
      try {
        var commaIdx = fileUrl.indexOf(',');
        var meta = fileUrl.substring(5, commaIdx); // "<mime>;base64"
        var mime = meta.split(';')[0] || 'application/octet-stream';
        var binary = atob(fileUrl.substring(commaIdx + 1));
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        var blob = new Blob([bytes], { type: mime });
        return URL.createObjectURL(blob);
      } catch (e) {
        console.error('Failed to convert data URL to blob URL', e);
        return fileUrl;
      }
    }

    function viewVendorDocument(vendorId, idx) {
      var v = vendors.find(function (x) { return x.id === vendorId; });
      var doc = v && v.documents ? v.documents[idx] : null;
      if (!doc) return;
      if (doc.fileUrl) {
        window.open(resolveViewableUrl(doc.fileUrl), '_blank');
      } else {
        showToast('No stored file to preview for "' + doc.fileName + '"', 'info');
      }
    }

    async function downloadVendorDocument(vendorId, idx) {
      var v = vendors.find(function (x) { return x.id === vendorId; });
      var doc = v && v.documents ? v.documents[idx] : null;
      if (!doc) return;

      if (!doc.fileUrl) {
        showToast('No stored file to download for "' + doc.fileName + '"', 'info');
        return;
      }

      var fileUrl = resolveViewableUrl(doc.fileUrl);

      try {
        // Fetch the file from the Vendor backend and create a local blob URL.
        // This forces a real download even when the source is cross-origin.
        var response = await fetch(fileUrl);

        if (!response.ok) {
          throw new Error('Failed to download document');
        }

        var blob = await response.blob();
        var blobUrl = URL.createObjectURL(blob);

        var a = document.createElement('a');
        a.href = blobUrl;
        a.download = doc.fileName || 'document';
        document.body.appendChild(a);
        a.click();
        a.remove();

        setTimeout(function () {
          URL.revokeObjectURL(blobUrl);
        }, 1000);
      } catch (error) {
        console.error('Document download failed:', error);
        showToast('Failed to download document', 'error');
      }
    }

    function getInitials(name) {
      if (!name) return 'V';
      var parts = name.split(' ');

    function renderStats() {
      document.getElementById('totalVendors').textContent = vendors.length;
      var active = vendors.filter(function (v) { return v.status === 'active'; });
      document.getElementById('activeVendors').textContent = active.length;
      var gst = vendors.filter(function (v) { return v.gstRegistered; });
      document.getElementById('gstVendors').textContent = gst.length;
      var total = vendors.reduce(function (sum, v) { return sum + v.outstanding; }, 0);
      document.getElementById('totalPayable').textContent = money(total);
    }

    function getFilteredVendors() {
      var searchInput = document.getElementById('searchInput');
      var q = searchInput ? searchInput.value.toLowerCase() : '';
      var status = document.getElementById('filterStatus') ? document.getElementById('filterStatus').value : 'all';
      var gst = document.getElementById('filterGST') ? document.getElementById('filterGST').value : 'all';
      var vtype = document.getElementById('filterVendorType') ? document.getElementById('filterVendorType').value : 'all';

      return vendors.filter(function (v) {
        var matchSearch = v.name.toLowerCase().indexOf(q) !== -1 ||
          v.companyName.toLowerCase().indexOf(q) !== -1 ||
          v.id.toLowerCase().indexOf(q) !== -1 ||
          v.phone.indexOf(q) !== -1 ||
          v.email.toLowerCase().indexOf(q) !== -1;
        var matchStatus = status === 'all' || v.status === status;
        var matchGST = gst === 'all' || (gst === 'yes' ? v.gstRegistered : !v.gstRegistered);
        var matchType = vtype === 'all' || v.vendorType === vtype;
        return matchSearch && matchStatus && matchGST && matchType;
      });
    }

    var currentVendorPage = 1;
    var currentVendorPageSize = 25;

    function setVendorPageSize(value) {
      var size = parseInt(value, 10);
      currentVendorPageSize = [10, 25, 50, 100].indexOf(size) !== -1 ? size : 25;
      currentVendorPage = 1;
      renderVendors();
    }

    function changeVendorPage(page) {
      var filtered = getFilteredVendors();
      var totalPages = Math.max(1, Math.ceil(filtered.length / currentVendorPageSize));
      currentVendorPage = Math.min(Math.max(1, page), totalPages);
      renderVendors();
    }

    function vendorPaginationHtml(totalItems) {
      var totalPages = Math.max(1, Math.ceil(totalItems / currentVendorPageSize));
      if (currentVendorPage > totalPages) currentVendorPage = totalPages;

      var start = totalItems === 0 ? 0 : ((currentVendorPage - 1) * currentVendorPageSize) + 1;
      var end = Math.min(currentVendorPage * currentVendorPageSize, totalItems);

      var html = '<div class=\"flex items-center justify-between gap-3 flex-wrap px-5 py-3 border-t border-gray-200\">';
      html += '<div class=\"text-[11px] text-gray-500\">Showing ' + start + '–' + end + ' of ' + totalItems + '</div>';
      html += '<div class=\"flex items-center gap-1\">';
      html += '<button type=\"button\" onclick=\"changeVendorPage(' + (currentVendorPage - 1) + ')\" ' + (currentVendorPage === 1 ? 'disabled' : '') + ' class=\"px-2.5 py-1 text-[11px] border rounded-lg ' + (currentVendorPage === 1 ? 'text-gray-300 cursor-not-allowed' : 'text-gray-600 hover:bg-gray-50') + '\">Previous</button>';

      var from = Math.max(1, currentVendorPage - 2);
      var to = Math.min(totalPages, from + 4);
      from = Math.max(1, to - 4);
      for (var i = from; i <= to; i++) {
        html += '<button type=\"button\" onclick=\"changeVendorPage(' + i + ')\" class=\"px-2.5 py-1 text-[11px] border rounded-lg ' + (i === currentVendorPage ? 'bg-primary text-white border-primary' : 'text-gray-600 hover:bg-gray-50') + '\">' + i + '</button>';
      }

      html += '<button type=\"button\" onclick=\"changeVendorPage(' + (currentVendorPage + 1) + ')\" ' + (currentVendorPage === totalPages ? 'disabled' : '') + ' class=\"px-2.5 py-1 text-[11px] border rounded-lg ' + (currentVendorPage === totalPages ? 'text-gray-300 cursor-not-allowed' : 'text-gray-600 hover:bg-gray-50') + '\">Next</button>';
      html += '</div></div>';
      return html;
    }

    function renderVendors() {
      var filtered = getFilteredVendors();
      var totalPages = Math.max(1, Math.ceil(filtered.length / currentVendorPageSize));
      if (currentVendorPage > totalPages) currentVendorPage = totalPages;
      var pageStart = (currentVendorPage - 1) * currentVendorPageSize;
      var pagedVendors = filtered.slice(pageStart, pageStart + currentVendorPageSize);

      var rowsHtml = '';
      if (filtered.length === 0) {
        rowsHtml = `
          <tr>
            <td colspan="8" class="text-center py-10 text-gray-400 text-sm">
              <div class="flex justify-center mb-2 empty-icon-svg">${iconBuilding()}</div>
              No vendors found. Try adjusting your filters or
              <button onclick="openAddVendor()" class="text-primary font-semibold hover:underline">add a new vendor</button>.
            </td>
          </tr>`;
      } else {
        rowsHtml = pagedVendors.map(function (v) {
          var statusBadge = v.status === 'active' ? badge('Active', 'green') : badge('Inactive', 'gray');
          var gstBadge = v.gstRegistered ? badge('GST Registered', 'blue') : badge('Unregistered', 'amber');
          return `
            <tr class="border-b border-gray-400 table-row-hover">
              <td class="px-4 py-3">
                <div class="flex items-center gap-3">
                  <div class="vendor-avatar" style="background:${v.color}">${getInitials(v.name)}</div>
                  <div>
                    <div class="font-semibold text-gray-800">${v.name}</div>
                    <div class="text-[11.5px] text-gray-400 font-mono">${v.id}</div>
                  </div>
                </div>
              </td>
              <td class="px-4 py-3">${vendorCategoryBadge(v.vendorType)}</td>
              <td class="px-4 py-3 text-gray-600">${v.companyName || '—'}</td>
              <td class="px-4 py-3 font-mono text-[12px] text-gray-500">${v.gstin || '—'}</td>
              <td class="px-4 py-3">${gstBadge}</td>
              <td class="px-4 py-3 font-mono font-semibold text-amber-600">${money(v.outstanding)}</td>
              <td class="px-4 py-3">${statusBadge}</td>
              <td class="px-4 py-3">${rowActionsHtml(
            "editVendor('" + v.id + "')",
            "delVendor('" + v.id + "')",
            "viewVendor('" + v.id + "')"
          )}</td>
            </tr>`;
        }).join('');
      }

      var panelHtml = panelWrap(
        'All Vendors <span class="text-[11px] font-bold bg-primary-soft text-primary-dark px-2 py-0.5 rounded-full ml-1">' + filtered.length + '</span>',
        tableHtml(['Vendor', 'Type', 'Company', 'GSTIN', 'GST Status', 'Outstanding', 'Status', 'Actions'], rowsHtml) + vendorPaginationHtml(filtered.length),
        '<div class="flex items-center gap-2"><span class="text-[11px] text-gray-400">Show:</span><select id="pageSizeSelect" onchange="setVendorPageSize(this.value)" class="text-[12px] border border-[#6da84c] rounded-lg px-2 py-1 bg-white outline-none"><option value="10" ' + (currentVendorPageSize === 10 ? 'selected' : '') + '>10</option><option value="25" ' + (currentVendorPageSize === 25 ? 'selected' : '') + '>25</option><option value="50" ' + (currentVendorPageSize === 50 ? 'selected' : '') + '>50</option><option value="100" ' + (currentVendorPageSize === 100 ? 'selected' : '') + '>100</option></select></div>'
      );

      document.getElementById('vendorsPanel').innerHTML = panelHtml;
      renderStats();
    }

    function filterVendors() {
      currentVendorPage = 1;
      renderVendors();
    }

    function clearFilters() {
      document.getElementById('filterStatus').value = 'all';
      document.getElementById('filterGST').value = 'all';
      if (document.getElementById('filterVendorType')) document.getElementById('filterVendorType').value = 'all';
      var searchInput = document.getElementById('searchInput');
      if (searchInput) searchInput.value = '';
      currentVendorPage = 1;
      renderVendors();
      toggleFilterDD();
    }

    // ADD / EDIT VENDOR
    // =============================================================

    function openAddVendor() { openVendorModal(null); }

    async function editVendor(id) {
      try {
        var v = await getVendorByIdApi(id);
        var localIndex = vendors.findIndex(function (x) { return x.id === id; });
        if (localIndex >= 0) vendors[localIndex] = v;
        openVendorModal(v);
      } catch (err) {
        console.error(err);
        showToast(err.message || 'Failed to load vendor', 'error');

      var blocks = document.querySelectorAll('.secondary-contact-block');

              ${fld('Vendor Type', '<select id="f_vendorType" class="' + inputBase() + '">' + vendorCategoryOptionsHtml(e.vendorType) + '</select>', 'Manage the list via "Manage Vendor Categories" on the vendors page')}
              <div></div>
            </div>
            <div class="grid grid-cols-2 gap-3">
              ${fld('Email *', '<input id="f_email" type="email" value="' + e.email + '" placeholder="vendor@domain.com" class="' + inputBase() + '">')}
              ${fld('Phone *', '<input id="f_phone" value="' + e.phone + '" placeholder="+91-XXXXXXXXXX" class="' + inputBase() + '">')}
            </div>
            <div>
              ${fld('Address', '<textarea id="f_address" rows="2" class="' + inputBase() + '" placeholder="Street address">' + (e.address || '') + '</textarea>')}
            </div>
            <div class="grid grid-cols-3 gap-3">
              ${fld('City', '<input id="f_city" value="' + (e.city || '') + '" placeholder="City" class="' + inputBase() + '">')}
              ${fld('State', '<select id="f_state" class="' + inputBase() + '" onchange="updateStateCode()">' + stateOptions.map(function (s) { return '<option ' + (s === e.state ? 'selected' : '') + '>' + s + '</option>'; }).join('') + '</select>')}
              ${fld('State Code', '<input id="f_stateCode" value="' + (e.stateCode || '27') + '" class="' + inputBase() + '" disabled>')}
            </div>
            ${fld('Pincode', '<input id="f_pincode" value="' + (e.pincode || '') + '" placeholder="6-digit PIN" class="' + inputBase() + '">')}

            <div class="mt-4 pt-3 border-t border-gray-100">
              <div class="flex items-center justify-between mb-2">
                <h4 class="text-[12.5px] font-semibold text-gray-800">Secondary Contact Person</h4>
                <button type="button" onclick="addSecondaryContactBlock()" class="text-[12px] font-semibold text-primary hover:underline flex items-center gap-1">${iconPlus()} Add Another Contact</button>
              </div>
              <div id="secondaryContactsWrap"></div>
            </div>
          </div>

          <div id="tab-tax" class="modal-tab-panel">
            <div class="grid grid-cols-2 gap-3">
              ${fld('GSTIN', '<input id="f_gstin" value="' + (e.gstin || '') + '" placeholder="15-digit GSTIN" class="' + inputBase() + '">', 'Format: 2-digit state code + 10-digit PAN + 3-digit entity code')}
              ${fld('PAN', '<input id="f_pan" value="' + (e.pan || '') + '" placeholder="10-digit PAN" class="' + inputBase() + '">')}
            </div>
            ${fld('GST Registered?', '<div class="flex items-center gap-4 mt-1"><label class="flex items-center gap-2 text-[13px]"><input type="radio" name="gstReg" value="true" ' + (e.gstRegistered ? 'checked' : '') + '> <span class="font-medium">Yes</span></label><label class="flex items-center gap-2 text-[13px]"><input type="radio" name="gstReg" value="false" ' + (!e.gstRegistered ? 'checked' : '') + '> <span class="font-medium">No</span></label></div>')}
          </div>

          <div id="tab-banking" class="modal-tab-panel">
            <div class="grid grid-cols-2 gap-3">
              ${fld('Bank Name', '<input id="f_bankName" value="' + (e.bankName || '') + '" placeholder="e.g. HDFC Bank" class="' + inputBase() + '">')}
              ${fld('Account Number', '<input id="f_bankAccount" value="' + (e.bankAccount || '') + '" placeholder="Account number" class="' + inputBase() + '">')}
            </div>
            ${fld('IFSC Code', '<input id="f_bankIfsc" value="' + (e.bankIfsc || '') + '" placeholder="e.g. HDFC0000123" class="' + inputBase() + '">')}
          </div>

          <div id="tab-payment" class="modal-tab-panel">
            ${fld('Payment Terms *', '<select id="f_paymentTerms" class="' + inputBase() + '"><option ' + (e.paymentTerms === 'Net 7 days' ? 'selected' : '') + '>Net 7 days</option><option ' + (e.paymentTerms === 'Net 15 days' ? 'selected' : '') + '>Net 15 days</option><option ' + (e.paymentTerms === 'Net 30 days' ? 'selected' : '') + '>Net 30 days</option><option ' + (e.paymentTerms === 'Net 45 days' ? 'selected' : '') + '>Net 45 days</option><option ' + (e.paymentTerms === 'Net 60 days' ? 'selected' : '') + '>Net 60 days</option><option ' + (e.paymentTerms === 'Advance Payment' ? 'selected' : '') + '>Advance Payment</option><option ' + (e.paymentTerms === 'Cash on Delivery' ? 'selected' : '') + '>Cash on Delivery</option></select>')}
            ${fld('Status', '<div class="flex items-center gap-4 mt-1"><label class="flex items-center gap-2 text-[13px]"><input type="radio" name="vendorStatus" value="active" ' + (e.status === 'active' ? 'checked' : '') + '> <span class="font-medium">Active</span></label><label class="flex items-center gap-2 text-[13px]"><input type="radio" name="vendorStatus" value="inactive" ' + (e.status === 'inactive' ? 'checked' : '') + '> <span class="font-medium">Inactive</span></label></div>')}
          </div>
          <div id="tab-documents" class="modal-tab-panel">

  <div class="mb-4">
    <div class="text-sm font-bold text-gray-800 mb-1">
      Vendor Documents
    </div>

    <div class="text-[11px] text-gray-500">
      Upload vendor-related documents such as GST Certificate,
      PAN Card, Bank Proof or Agreement.
    </div>
  </div>

  <div class="border border-gray-200 rounded-xl p-4 bg-gray-50">

    ${fld(
        'Document Type',
        '<select id="vendor_document_type" class="' + inputBase() + '">' +
        documentTypeOptions.map(function (t) {
          return '<option value="' + t + '">' + t + '</option>';
        }).join('') +
        '</select>'
      )}

    ${fld(
        'Document File',
        '<input id="vendor_document_file" type="file" class="' +
        inputBase() +
        '">'
      )}

    <div class="flex justify-end mt-3">

      <button
        type="button"
        onclick="addVendorDocumentFromForm()"
        class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-semibold text-white bg-primary hover:bg-primary-dark transition">

        ${iconUpload()}

        Add Document

      </button>

    </div>

  </div>

  <div class="mt-4">

    <div class="text-[12px] font-bold text-gray-700 mb-2">
      Uploaded Documents
    </div>

    <div id="vendorFormDocumentsList"
         class="space-y-2">

      <div class="text-[11px] text-gray-400">
        No documents added yet.
      </div>

    </div>

  </div>

</div>
        </div>
        ${modalFooter(isEdit ? 'Update Vendor' : 'Save Vendor', 'onclick="saveVendor(\'' + (isEdit ? e.id : '') + '\')"')}
      `;

      openModal(modalContent, { width: 'max-w-2xl' });
      // The modal DOM now exists, so render the saved document list here.
      renderVendorFormDocuments();

      // seed existing secondary contacts (edit mode)
      (e.secondaryContacts || []).forEach(function (c) { addSecondaryContactBlock(c); });
    }

    // State code updater
    function updateStateCode() {
      var state = document.getElementById('f_state').value;
      var stateCodeMap = {
        'Maharashtra': '27',
        'Delhi': '07',
        'Karnataka': '29',
        'Tamil Nadu': '33',
        'Gujarat': '24',
        'Uttar Pradesh': '09',
        'Rajasthan': '08',
        'Kerala': '32',
        'Telangana': '36',
        'West Bengal': '19',
        'Andhra Pradesh': '28',
        'Bihar': '10',
        'Chhattisgarh': '22',
        'Goa': '30',
        'Haryana': '06',
        'Himachal Pradesh': '02',
        'Jharkhand': '20',
        'Madhya Pradesh': '23',
        'Odisha': '21',
        'Punjab': '03',
        'Uttarakhand': '05'
      };
      document.getElementById('f_stateCode').value = stateCodeMap[state] || '';
    }
    // AddVendorDocument
    function renderVendorFormDocuments() {
      var container = document.getElementById('vendorFormDocumentsList');
      if (!container) return;

      var docs = window.vendorFormDocuments || [];
      if (!docs.length) {
        container.innerHTML = '<div class="text-[11px] text-gray-400">No documents uploaded yet.</div>';
        return;
      }

      container.innerHTML = docs.map(function (doc, index) {
        var typeLabel = doc.type || doc.documentType || 'Other';
        var fileName = doc.fileName || (typeLabel + ' Document');
        return `
          <div class="flex items-center gap-3 p-3 bg-white border border-gray-200 rounded-lg">
            <div class="doc-icon">${iconDoc()}</div>
            <div class="flex-1 min-w-0">
              <div class="text-[12px] font-semibold text-gray-800">${typeLabel}</div>
              <div class="text-[11px] text-gray-400 truncate">${fileName}</div>
            </div>
            <div class="flex items-center gap-1">
              <button type="button" onclick="viewVendorFormDocument(${index})" class="btn-icon-action" title="View">${iconEye()}</button>
              <button type="button" onclick="removeVendorFormDocument(${index})" class="w-7 h-7 rounded-lg flex items-center justify-center text-gray-400 hover:text-red-600 hover:bg-red-50 transition" title="Remove">${iconX()}</button>
            </div>
          </div>`;
      }).join('');
    }

    function viewVendorFormDocument(index) {
      var docs = window.vendorFormDocuments || [];
      var doc = docs[index];
      if (!doc || !doc.fileUrl) {
        showToast('Document URL is not available', 'info');
        return;
      }
      window.open(resolveViewableUrl(doc.fileUrl), '_blank');
    }

    async function removeVendorFormDocument(index) {
      var docs = window.vendorFormDocuments || [];
      var doc = docs[index];
      if (!doc) return;

      if (doc.persisted && doc.id && window.currentVendorIdForDocs) {
        try {
          await deleteVendorDocumentApi(window.currentVendorIdForDocs, doc.id);
        } catch (err) {
          console.error(err);
          showToast(err.message || 'Failed to remove document', 'error');
          return;
        }
      }

      if (doc.fileUrl && doc.fileUrl.indexOf('blob:') === 0) {
        try { URL.revokeObjectURL(doc.fileUrl); } catch (e) {}
      }
      docs.splice(index, 1);
      window.vendorFormDocuments = docs;
      renderVendorFormDocuments();

      if (window.currentVendorIdForDocs) {
        var refreshed = await getVendorByIdApi(window.currentVendorIdForDocs);
        var idx = vendors.findIndex(function (x) { return x.id === refreshed.id; });
        if (idx >= 0) vendors[idx] = refreshed;
      }
      showToast('Document removed', 'success');
    }

    function addVendorDocumentFromForm() {
      var typeInput = document.getElementById('vendor_document_type');
      var fileInput = document.getElementById('vendor_document_file');
      var type = typeInput ? typeInput.value : '';
      var file = fileInput && fileInput.files ? fileInput.files[0] : null;

      if (!file) {
        showToast('Please choose a file to upload', 'error');
        return;
      }

      var normalized = normalizeDocType(type);
      if (!normalized) {
        showToast('Please choose a valid document type', 'error');
        return;
      }

      window.vendorFormDocuments = window.vendorFormDocuments || [];
      window.vendorFormDocuments.push({
        id: null,
        type: type,
        fileName: file.name,
        fileUrl: URL.createObjectURL(file),
        file: file,
        persisted: false
      });

      if (fileInput) fileInput.value = '';
      renderVendorFormDocuments();
      showToast('Document added. Click Save/Update Vendor to upload it.', 'info');
    }

    // =============================================================
    // SAVE / DELETE VENDOR
    // =============================================================

    async function saveVendor(existingId) {
      var name = document.getElementById('f_name') ? document.getElementById('f_name').value.trim() : '';
      var companyName = document.getElementById('f_company') ? document.getElementById('f_company').value.trim() : '';
      var vendorType = document.getElementById('f_vendorType') ? document.getElementById('f_vendorType').value : '';
      var email = document.getElementById('f_email') ? document.getElementById('f_email').value.trim() : '';
      var phone = document.getElementById('f_phone') ? document.getElementById('f_phone').value.trim() : '';
      var address = document.getElementById('f_address') ? document.getElementById('f_address').value.trim() : '';
      var city = document.getElementById('f_city') ? document.getElementById('f_city').value.trim() : '';
      var state = document.getElementById('f_state') ? document.getElementById('f_state').value : 'Maharashtra';
      var stateCode = document.getElementById('f_stateCode') ? document.getElementById('f_stateCode').value : '27';
      var pincode = document.getElementById('f_pincode') ? document.getElementById('f_pincode').value.trim() : '';
      var gstin = document.getElementById('f_gstin') ? document.getElementById('f_gstin').value.trim().toUpperCase() : '';
      var pan = document.getElementById('f_pan') ? document.getElementById('f_pan').value.trim().toUpperCase() : '';
      var bankName = document.getElementById('f_bankName') ? document.getElementById('f_bankName').value.trim() : '';
      var bankAccount = document.getElementById('f_bankAccount') ? document.getElementById('f_bankAccount').value.trim() : '';
      var bankIfsc = document.getElementById('f_bankIfsc') ? document.getElementById('f_bankIfsc').value.trim().toUpperCase() : '';
      var paymentTerms = document.getElementById('f_paymentTerms') ? document.getElementById('f_paymentTerms').value : 'Net 15 days';
      var gstRegRadio = document.querySelector('input[name="gstReg"]:checked');
      var gstRegistered = gstRegRadio ? gstRegRadio.value === 'true' : false;
      var statusRadio = document.querySelector('input[name="vendorStatus"]:checked');
      var status = statusRadio ? statusRadio.value : 'active';
      var secondaryContacts = collectSecondaryContacts();

      if (!name || !email || !phone) {
        showToast('Please fill all required fields (Name, Email, Phone)', 'error');
        return;
      }

      var payload = {
        vendorName: name,
        companyName: companyName,
        vendorType: vendorType,
        email: email,
        phone: phone,
        address: address,
        city: city,
        state: state,
        stateCode: stateCode,
        pincode: pincode,
        gstin: gstin,
        pan: pan,
        gstRegistered: gstRegistered,
        bankName: bankName,
        bankAccount: bankAccount,
        bankIfsc: bankIfsc,
        paymentTerms: paymentTerms,
        status: status,
        secondaryContacts: secondaryContacts
      };

      try {

        var pending = (window.vendorFormDocuments || []).filter(function (d) { return d && d.file; });
        var savedVendor;
        if (existingId) {
          savedVendor = await updateVendorApi(existingId, payload, pending);
        } else {
          savedVendor = await createVendorApi(payload, pending);
        }

        showToast(existingId ? 'Vendor updated successfully' : 'Vendor added successfully', 'success');
        closeModal();
        await loadVendorsFromApi();
        renderVendors();
      } catch (err) {
        console.error(err);
        showToast(err.message || 'Failed to save vendor', 'error');
      }
    }

    function delVendor(id) {
      var v = vendors.find(function (x) { return x.id === id; });
      if (!v) return;

      var modalContent = `
        ${modalHeader('Delete Vendor', v.name)}
        <div class="px-6 py-4 text-sm text-gray-600">
          <p>Are you sure you want to permanently delete <b class="text-gray-800">${v.name}</b>?</p>
          <p class="text-gray-400 text-[12px] mt-1">This action cannot be undone. All associated transactions will be affected.</p>
          ${v.outstanding > 0 ? '<p class="text-amber-600 text-[12px] mt-2">This vendor has outstanding balance of ' + money(v.outstanding) + '</p>' : ''}
        </div>
        ${modalFooter('Delete', 'onclick="confirmDeleteVendor(\'' + id + '\')"', '', true)}
      `;
      openModal(modalContent, { width: 'max-w-md' });
    }

    async function confirmDeleteVendor(id) {
      try {
        await deleteVendorApi(id);
        closeModal();
        await loadVendorsFromApi();
        renderVendors();
        showToast('Vendor deleted successfully', 'warning');
      } catch (err) {
        console.error(err);
        showToast(err.message || 'Failed to delete vendor', 'error');
      }
    }

    // =============================================================
    // SEARCH
    // =============================================================

    (function addSearchToTopbar() {
      var searchContainer = document.querySelector('.app-main header');
      if (searchContainer) {
        var searchHtml = `
          <div class="hidden sm:flex flex-1 max-w-[420px] relative ml-4">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">${iconSearch()}</span>
            <input type="text" id="searchInput" placeholder="Search vendors by name, company, phone…"
              onkeyup="filterVendors()"
              class="w-full border border-gray-200 bg-gray-50 focus:bg-white rounded-lg pl-9 pr-3 py-2 text-[13px] outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition placeholder:text-gray-400">
          </div>
        `;
        var headerContent = searchContainer.innerHTML;
        var hamburgerIndex = headerContent.indexOf('lg:hidden');
        if (hamburgerIndex !== -1) {
          var firstDivEnd = headerContent.indexOf('</div>', hamburgerIndex) + 6;
          var before = headerContent.substring(0, firstDivEnd);
          var after = headerContent.substring(firstDivEnd);
          searchContainer.innerHTML = before + searchHtml + after;
        }
      }
    })();

    // =============================================================
    // INIT
    // =============================================================

    async function initVendorsPage() {
      loadVendorCategories();
      await loadVendorsFromApi();
      renderVendors();
      populateVendorTypeFilter();

      console.log('🏢 Vendors Module Loaded Successfully');
      console.log('📊 Total Vendors:', vendors.length);
      console.log('✅ Active Vendors:', vendors.filter(function (v) { return v.status === 'active'; }).length);
      console.log('💰 Total Payable:', vendors.reduce(function (sum, v) { return sum + v.outstanding; }, 0));
      console.log('🏷️ Vendor Categories:', vendorCategories.length);
    }

    initVendorsPage();

  </script>
